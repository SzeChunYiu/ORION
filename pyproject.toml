[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-research-os"
version = "0.1.0"
description = "Evidence-governed recursive research operating system"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45",
    # Remote XML is untrusted input: stdlib ElementTree is vulnerable to
    # entity-expansion (billion-laughs) and quadratic-blowup denial of service.
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
