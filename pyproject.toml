[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-research-os"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
version = "0.1.0"
description = "Evidence-governed recursive research operating system"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45",
    # Remote XML is untrusted input: stdlib ElementTree is vulnerable to
    # entity-expansion (billion-laughs) and quadratic-blowup denial of service.
    "defusedxml>=0.7",
]

[project.optional-dependencies]
# pytest-split shards the suite across CI runners; see .github/workflows/ci.yml.
dev = ["pytest>=8", "pytest-split>=0.9", "pytest-xdist>=3.6", "orion-research-os[candidates]", "pytest-timeout>=2.3", "orion-research-os[independent-checks]"]
plots = ["matplotlib>=3.10"]
# The P9/P10 candidate lane re-derives phase 2A live in CI to prove the committed
# result still reproduces. That needs numpy: the lane's framework package re-exports
# competence.py, which imports it. Without this the guard degrades to a skip, and a
# guard that never runs is not a guard.
candidates = ["numpy>=2", "scikit-learn>=1.5", "scipy>=1.11"]
# P8's authority calculus is discharged by an SMT solver rather than asserted on
# an authored enumeration. Without z3 the proofs do not run, and a suite that
# silently skips them reports "no theorem failed" for "no theorem was checked" --
# so the tests importorskip and say why, and this extra is how CI gets them.
proofs = ["z3-solver>=4.13"]

# run_provenance_interop_v1.py and its INDEPENDENT checker both do
# `from prov.model import ProvDocument`, with no ImportError guard. Undeclared,
# the independent P15 provenance check failed with ModuleNotFoundError instead
# of returning a verdict -- which reads as "the checker is broken" when the
# truth is "the environment was never told what it needs".
independent-checks = ["prov>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `packages/orion-research-harness/` is a sibling distribution, not part of the
# `src/` layout that setuptools installs, so `pip install -e .` never puts it on
# sys.path. Three tests import it, and without this line the first one aborts
# COLLECTION -- which takes the whole non-p2 suite down with it rather than
# failing one test. Landed with #1137; see #1134 for the same failure shape.
pythonpath = ["src", "packages/orion-research-harness/src"]
# Unique module names by path. Parallel lanes independently added
# test_schema.py / test_metrics.py; the default prepend import mode
# then fails collection with "import file mismatch" and reds every PR.
addopts = ["--import-mode=importlib"]

[tool.ruff]
# Without this section ruff runs on bare defaults, which flag the re-export
# pattern every package __init__ uses: 295 of 301 findings were `from .x import y`
# in an __init__ with no consumer *in that file*. A linter that cries wolf on its
# first real run gets switched off, so the config exists to make a clean result
# mean something.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Ruff's default set. Deliberately not widening it here: adding style rules to a
# shared repo mid-flight would red-line every parallel lane's files for reasons
# unrelated to correctness. Widen it in its own change, with the sweep included.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Re-exports are the entire purpose of a package __init__.
"__init__.py" = ["F401", "F403"]
