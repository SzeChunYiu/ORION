[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-research-harness"
version = "0.1.0"
description = "Replayable local host-tool harness for running canonical ORION with ChatGPT, Claude Code, and other tool-capable agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
orion-q = ["numpy>=1.26"]

[project.scripts]
orion-harness = "orion_research_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../src"]
addopts = ["--import-mode=importlib"]
