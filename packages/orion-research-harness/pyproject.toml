[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-research-harness"
version = "0.1.0"
description = "Replayable local host-tool harness for running canonical ORION with ChatGPT, Claude Code, and other tool-capable agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["orion-research-os==0.1.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/SzeChunYiu/ORION"
Issues = "https://github.com/SzeChunYiu/ORION/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
orion-q = ["numpy>=1.26"]

[project.scripts]
orion-harness = "orion_research_harness.cli:main"
orion-harness-paper = "orion_research_harness.paper_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../src"]
addopts = ["--import-mode=importlib"]
