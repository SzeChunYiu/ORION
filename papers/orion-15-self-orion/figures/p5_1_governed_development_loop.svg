<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <rect width="100%" height="100%" fill="white"/>
  <text x="500" y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">Self-ORION Governed Development Loop</text>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2196F3"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9800"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F44336"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4CAF50"/>
    </marker>
  </defs>

  <!-- Stage 1: Failure → Issue -->
  <rect x="25" y="55" width="155" height="110" rx="10" ry="10" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
  <text x="102" y="75" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">1. Failure → Issue</text>
  <line x1="35" y1="82" x2="170" y2="82" stroke="#90CAF9" stroke-width="1"/>
  <text x="102" y="97" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">Immutable episode</text>
  <text x="102" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">Recurrence ≠ causation</text>
  <text x="102" y="127" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">Competing cause</text>
  <text x="102" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">hypotheses</text>
  <text x="102" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#888">Negative history retained</text>

  <!-- Arrow 1→2 -->
  <line x1="180" y1="110" x2="210" y2="110" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Stage 2: Attribution → Invention Gate -->
  <rect x="215" y="55" width="155" height="110" rx="10" ry="10" fill="#BBDEFB" stroke="#2196F3" stroke-width="2"/>
  <text x="292" y="75" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">2. Attribution Gate</text>
  <line x1="225" y1="82" x2="360" y2="82" stroke="#90CAF9" stroke-width="1"/>
  <text x="292" y="97" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">Discriminator evidence</text>
  <text x="292" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">Typed responsibility</text>
  <text x="292" y="127" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">Invention readiness:</text>
  <text x="292" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">bounded axes, ordinary</text>
  <text x="292" y="157" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">causes excluded</text>

  <!-- Arrow 2→3 -->
  <line x1="370" y1="110" x2="400" y2="110" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Stage 3: Challenger Execution -->
  <rect x="405" y="55" width="155" height="110" rx="10" ry="10" fill="#90CAF9" stroke="#2196F3" stroke-width="2"/>
  <text x="482" y="75" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">3. Challenger</text>
  <line x1="415" y1="82" x2="550" y2="82" stroke="#90CAF9" stroke-width="1"/>
  <text x="482" y="97" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">Isolated sandbox</text>
  <text x="482" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">Content-addressed patch</text>
  <text x="482" y="127" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">Regression tests</text>
  <text x="482" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">Static checks</text>
  <text x="482" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#888">No main authority</text>

  <!-- Arrow 3→4 -->
  <line x1="560" y1="110" x2="590" y2="110" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Stage 4: Evidence Staging -->
  <rect x="595" y="55" width="170" height="110" rx="10" ry="10" fill="#64B5F6" stroke="#2196F3" stroke-width="2"/>
  <text x="680" y="75" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold">4. Evidence Staging</text>
  <line x1="605" y1="82" x2="755" y2="82" stroke="#90CAF9" stroke-width="1"/>
  <text x="680" y="97" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">Replay (same tasks)</text>
  <text x="680" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">→ Fresh transfer</text>
  <text x="680" y="127" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">→ Protected assurance</text>
  <text x="680" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#555">Non-compensatory order</text>
  <text x="680" y="158" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#888">Evaluator outside custody</text>

  <!-- Arrow 4→Decision -->
  <line x1="765" y1="110" x2="795" y2="110" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Decision diamond -->
  <polygon points="850,110 820,145 850,180 880,145" fill="#FFF9C4" stroke="#FFC107" stroke-width="2"/>
  <text x="850" y="148" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold">All</text>
  <text x="850" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold">gates</text>
  <text x="850" y="171" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#666">pass?</text>

  <!-- Arrow: Yes → RECOMMEND -->
  <line x1="880" y1="145" x2="910" y2="145" stroke="#4CAF50" stroke-width="2"/>
  <text x="895" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#4CAF50">Yes</text>
  <rect x="910" y="125" width="70" height="40" rx="5" ry="5" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="945" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="bold" fill="#2E7D32">RECOMMEND</text>
  <text x="945" y="157" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#666">Host promotion</text>

  <!-- Arrow: No → BLOCK -->
  <line x1="820" y1="180" x2="820" y2="240" stroke="#F44336" stroke-width="2"/>
  <text x="816" y="235" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#F44336">No</text>
  <rect x="785" y="245" width="70" height="40" rx="5" ry="5" fill="#FFEBEE" stroke="#F44336" stroke-width="2"/>
  <text x="820" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#C62828">BLOCK</text>
  <text x="820" y="275" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#666">Harmful / fail /</text>
  <text x="820" y="285" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#666">contamination</text>

  <!-- Arrow: Uncertain → CANNOT_CHECK -->
  <line x1="820" y1="180" x2="820" y2="320" stroke="#FFC107" stroke-width="2"/>
  <text x="816" y="315" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#FFC107">Uncertain</text>
  <rect x="770" y="325" width="100" height="40" rx="5" ry="5" fill="#FFF8E1" stroke="#FFC107" stroke-width="2"/>
  <text x="820" y="340" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="bold" fill="#F57F17">CANNOT_CHECK</text>
  <text x="820" y="355" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#666">Insufficient /</text>
  <text x="820" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#666">unresolved evidence</text>

  <!-- Failure recurrence loop -->
  <path d="M 102 165 Q 102 210 60 210 Q 25 210 25 180" fill="none" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-amber)"/>
  <text x="60" y="208" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#FF9800" font-style="italic">Recurrence</text>

  <!-- Negative history loop -->
  <path d="M 102 165 Q 102 225 292 225 Q 482 225 482 170" fill="none" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-amber)"/>
  <text x="292" y="222" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#FF9800" font-style="italic">Negative history feeds discriminator</text>

  <!-- Fail-closed annotation -->
  <rect x="25" y="390" width="950" height="115" rx="8" ry="8" fill="#FFF8E1" stroke="#FFC107" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="500" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#F57F17">Authority Boundaries</text>
  <text x="500" y="428" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#666">No self-merge primitive. Strongest internal outcome: RECOMMEND_HOST_PROMOTION.</text>
  <text x="500" y="445" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#666">Protected evaluator outside challenger write authority. Fresh set cannot be recycled as development feedback.</text>
  <text x="500" y="462" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#666">Negative/null/harmful evolution history immutable. Self-certification and self-merge structurally absent.</text>
  <text x="500" y="480" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#666">Fail-closed: no authority promotion when any prerequisite is unresolved or harmful.</text>
  <text x="500" y="497" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" font-style="italic" fill="#888">Even a positive fresh-transfer result is evidence for host recommendation, not self-merge authority.</text>
</svg>