name: p9-s3-protected-result

on:
  pull_request:
    paths:
      - 'src/orion/study/p9/s3_access.py'
      - 'src/orion/study/p9/s3_result.py'
      - 'research/extensions/p9-structured-neural/run_s3.py'
      - 'research/extensions/p9-structured-neural/successors/S3_*'
      - '.github/workflows/p9-s3-protected-result.yml'
  workflow_dispatch:

concurrency:
  group: p9-s3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,candidates]'
      - name: Re-run preprotected S3 hostile tests
        run: pytest -q tests/test_p9_s3_access_attribution.py tests/test_p9_d1.py
      - name: Execute frozen S3 protected protocol
        run: >-
          python research/extensions/p9-structured-neural/run_s3.py
          --output "$RUNNER_TEMP/s3-results.json"
      - name: Assert registered S3 terminal family
        env:
          RESULT: ${{ runner.temp }}/s3-results.json
        run: |
          python - <<'PY'
          import json, os
          result = json.load(open(os.environ['RESULT'], encoding='utf-8'))
          assert result['parent_d1_result_digest'] == 'sha256:34003fb8ffcecec6ed01654e40c644ff05b7640be56b398a45efc1e52a30141a'
          assert result['dataset_manifest_digest'] == 'sha256:2775298457b7bdee815b207733507cd27d55719df314ef6352bb601bd709c19c'
          assert result['terminal'] in {
              'EXPLICIT_RELATION_BINDING_SUFFICIENT',
              'LOSSLESS_SERIALIZATION_PLUS_GENERIC_COMPARISON_SUFFICIENT',
              'D1_SERIALIZATION_NOT_RECOVERABLE_BY_GENERIC_BINDING',
              'CANNOT_CHECK',
          }
          assert all(result['hostile_checks'].values())
          print('P9_S3_TERMINAL=' + result['terminal'])
          print('P9_S3_RESULT_DIGEST=' + result['result_digest'])
          print('P9_S3_F1=' + str(result['F1_test']['accuracy']))
          print('P9_S3_F2=' + str(result['F2_test']['accuracy']))
          PY
      - name: Upload S3 result
        uses: actions/upload-artifact@v4
        with:
          name: p9-s3-results-${{ github.sha }}
          path: ${{ runner.temp }}/s3-results.json
          if-no-files-found: error
