name: p8-real-evidence-discharge-v1

on:
  pull_request:
    paths:
      - 'papers/orion-18-epistemic-authority-autonomous-science/top_tier/P8_REAL_EVIDENCE_DISCHARGE_PROTOCOL_V1.md'
      - 'papers/orion-18-epistemic-authority-autonomous-science/top_tier/p8_real_evidence_discharge_cases_v1.json'
      - 'papers/orion-18-epistemic-authority-autonomous-science/top_tier/p8_real_evidence_discharge_gold_v1.json'
      - 'papers/orion-18-epistemic-authority-autonomous-science/top_tier/run_real_evidence_discharge_v1.py'
      - 'papers/orion-18-epistemic-authority-autonomous-science/top_tier/check_real_evidence_discharge_independent_v1.py'
      - '.github/workflows/p8-real-evidence-discharge-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-evidence-discharge-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Execute real evidence scientific-discharge study
        run: python papers/orion-18-epistemic-authority-autonomous-science/top_tier/run_real_evidence_discharge_v1.py | tee p8_real_evidence_discharge_v1.json
      - name: Verify deterministic replay
        run: |
          python papers/orion-18-epistemic-authority-autonomous-science/top_tier/run_real_evidence_discharge_v1.py > p8_real_evidence_discharge_v1_rerun.json
          cmp p8_real_evidence_discharge_v1.json p8_real_evidence_discharge_v1_rerun.json
      - name: Execute independent source/gold authority checker
        run: python papers/orion-18-epistemic-authority-autonomous-science/top_tier/check_real_evidence_discharge_independent_v1.py | tee p8_real_evidence_discharge_independent_v1.json
      - name: Verify candidate against independent authority
        run: |
          python - <<'PY'
          import json
          p=json.load(open('p8_real_evidence_discharge_v1.json'));q=json.load(open('p8_real_evidence_discharge_independent_v1.json'))
          assert p['terminal']=='P8_REAL_EVIDENCE_DISCHARGE_V1_SUPPORTED',p
          assert q['terminal']=='P8_REAL_EVIDENCE_DISCHARGE_SECOND_INDEPENDENT_CHECKER_GREEN',q
          assert p['case_count']==q['case_count']==20
          assert all(r['action_authorization']=='ACTION_PERMITTED' for r in p['rows'])
          assert all(r['correct'] for r in p['rows'])
          assert sum(v['false_promotion'] for v in p['metrics'].values())==0
          assert q['source_token_audit']=='GREEN' and q['independent_gold_complete']
          print('P8_REAL_EVIDENCE_DISCHARGE_TWO_AUTHORITIES_AGREE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p8-real-evidence-discharge-v1
          path: |
            p8_real_evidence_discharge_v1.json
            p8_real_evidence_discharge_independent_v1.json
