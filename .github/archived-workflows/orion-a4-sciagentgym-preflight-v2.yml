name: ORION A4 SciAgentGym preflight v2
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/orion-a4-sciagentgym-preflight-v2.yml"
      - "papers/publication_closure/a4-hidden-cause-preflight-v2-sciagentgym/**"
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hostile self-test
        run: |
          python papers/publication_closure/a4-hidden-cause-preflight-v2-sciagentgym/check_preflight_v2.py \
            --self-test --freeze papers/publication_closure/a4-hidden-cause-preflight-v2-sciagentgym/PREFLIGHT_V2.json
      - name: Live verification against the pinned substrate commit
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/CMarsRover/SciAgentGYM/e9dbbea4369d67694e38bf8be67bedbcaf9e9300'
          curl --fail --location --retry 3 --retry-all-errors -o /tmp/multi.json "$base/dataset/refine_merged_multi_questions.json"
          curl --fail --location --retry 3 --retry-all-errors -o /tmp/single.json "$base/dataset/refine_merged_single_questions.json"
          curl --fail --location --retry 3 --retry-all-errors -o /tmp/LICENSE "$base/LICENSE"
          python papers/publication_closure/a4-hidden-cause-preflight-v2-sciagentgym/check_preflight_v2.py \
            --freeze papers/publication_closure/a4-hidden-cause-preflight-v2-sciagentgym/PREFLIGHT_V2.json \
            --multi /tmp/multi.json --single /tmp/single.json --license /tmp/LICENSE
      - name: Repository cleanliness
        run: |
          git diff --check
          git diff --exit-code
