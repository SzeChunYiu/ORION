name: orion-qg-qg22-hidden-home-state

on:
  pull_request:
    paths:
      - 'development/orion-qg-regime-geometry/QG22_*'
      - 'development/orion-qg-regime-geometry/qg22_*'
      - 'development/orion-qg-regime-geometry/run_qg22_dual_harness.py'
      - 'research/extensions/orion-qg/qg22_*'
      - '.github/workflows/orion-qg-qg22-hidden-home-state.yml'
  workflow_dispatch:

concurrency:
  group: orion-qg-qg22-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qg22-state-quotient:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact QG-22 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert protected QG-7d information parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e "b6384048cbddbbf0dc84c6a310a686cfa0a43131^{commit}"
          test "$(git merge-base HEAD b6384048cbddbbf0dc84c6a310a686cfa0a43131)" = "b6384048cbddbbf0dc84c6a310a686cfa0a43131"
          test -f research/extensions/orion-qg/QG7C_CLASSIFICATION_RESULTS.json
          test -f research/extensions/orion-qg/QG7D_PADDING_ABLATION_RESULTS.json
          test -f research/extensions/orion-qg/qg7d_information_closure.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ORION and research harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,candidates]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Syntax gate
        run: |
          python -m py_compile \
            research/extensions/orion-qg/qg22_hidden_home_state.py \
            development/orion-qg-regime-geometry/qg22_generic_verify.py \
            development/orion-qg-regime-geometry/qg22_native_verify.py \
            development/orion-qg-regime-geometry/run_qg22_dual_harness.py
      - name: Execute QG-22 through generic and native ORION
        run: |
          set -o pipefail
          mkdir -p artifacts
          python development/orion-qg-regime-geometry/run_qg22_dual_harness.py \
            | tee artifacts/orion-qg-qg22-dual-summary.json
      - name: Deterministic analyzer replay
        run: |
          set -euo pipefail
          python research/extensions/orion-qg/qg22_hidden_home_state.py \
            --output artifacts/orion-qg-qg22-hidden-home-state-replay.json \
            > artifacts/orion-qg-qg22-replay.log
          cmp \
            artifacts/orion-qg-qg22-hidden-home-state.json \
            artifacts/orion-qg-qg22-hidden-home-state-replay.json
      - name: Enforce exact state-quotient terminal and authority ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/orion-qg-qg22-hidden-home-state.json').read_text())
          g=json.loads(Path('artifacts/orion-qg-qg22-generic-verification.json').read_text())
          n=json.loads(Path('artifacts/orion-qg-qg22-native-verification.json').read_text())
          d=json.loads(Path('artifacts/orion-qg-qg22-dual-harness.json').read_text())
          pos='QG22_HIDDEN_HOME_J5_DELTA_EXACTLY_DETERMINED_BY_MINIMAL_5_PREDICATE_STATE'
          assert a['terminal']==pos and a['all_gates'] is True
          assert a['minimum_determining_cardinality']==5
          assert ['b0','ab','ac','bm0','a_bm'] in a['minimum_determining_subsets']
          assert len(a['minimum_determining_subsets'])==4
          assert a['selected_cell_counts']=={'1':18,'3':18}
          assert len(a['cardinality4_counterexamples'])==330
          assert all(x['witness'] is not None for x in a['cardinality4_counterexamples'])
          assert a['paired']['raw_states']==4096
          assert a['paired']['signature_cells']==324
          assert a['paired']['mixed_cells']==0
          assert (a['paired']['delta_min'],a['paired']['delta_max'])==(-4,4)
          assert set(map(int,a['paired']['delta_histogram']))==set(range(-4,5))
          assert a['parent']['pp_failures']==32556
          assert g['decision']=='ACCEPT_STATE_QUOTIENT' and g['all_checks'] is True
          assert g['minimum_determining_cardinality']==5
          assert g['minimum_determining_subsets']==a['minimum_determining_subsets']
          assert n['decision']=='ACCEPT_STATE_QUOTIENT' and n['all_checks'] is True
          assert n['responsibility']=='J5_DELTA_DETERMINATION'
          assert d['terminal']==pos and d['both_accept'] is True
          assert d['minimum_determining_cardinality']==5
          assert d['pair_cells']==324
          assert d['delta_range']==[-4,4]
          assert a['all_n_theorem_authority'] is False
          assert g['all_n_theorem_authority'] is False
          assert n['all_n_theorem_authority'] is False
          assert d['all_n_theorem_authority'] is False
          assert a['novelty_authority'] is False and a['r6_authority'] is False
          assert d['novelty_authority'] is False and d['physical_quantum_advantage_claim'] is False
          PY
      - name: Upload QG-22 dual-harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-qg-qg22-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/orion-qg-qg22-hidden-home-state.json
            artifacts/orion-qg-qg22-hidden-home-state-replay.json
            artifacts/orion-qg-qg22-generic-verification.json
            artifacts/orion-qg-qg22-native-verification.json
            artifacts/orion-qg-qg22-dual-harness.json
            artifacts/orion-qg-qg22-dual-summary.json
            artifacts/orion-qg-qg22-replay.log
            .orion-qg-qg22-generic/.orion-harness/**
            .orion-qg-qg22-native/.orion-harness/**
          include-hidden-files: true
          if-no-files-found: warn
