name: orion-q-max-r6g-joint-clifford-tare3

on:
  pull_request:
    paths:
      - 'development/orion-q-max-r0/MAX_R6G_JOINT_CLIFFORD_TARE3_COOPT_PROTOCOL.md'
      - 'research/extensions/orion-q/max_r6g_joint_clifford_tare3_coopt.py'
      - 'research/extensions/orion-q/max_r6f_donor_clifford_preconditioned_tare3.py'
      - 'research/extensions/orion-q/max_r6d_sixterm_partition_representation_coopt.py'
      - 'research/extensions/orion-q/max_r6e_deep_p10_exact_frame_saturation.py'
      - 'research/extensions/orion-q/max_r6e_deep_p10_exact_frame_saturation_fast.py'
      - 'research/extensions/orion-q/max_r6b_tare_transformation_reuse_donor.py'
      - 'research/extensions/orion-q/max_r6_exact_tare3_joint_frame_dp.py'
      - 'research/extensions/orion-q/max_r6_p10_candidate_blind_frame_optimizer.py'
      - '.github/workflows/orion-q-max-r6g-joint-clifford-tare3.yml'
  workflow_dispatch:

concurrency:
  group: orion-q-max-r6g-joint-clifford-tare3-${{ github.sha }}
  cancel-in-progress: false

jobs:
  frozen-r6g-open-development:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Refuse R6G protocol or implementation drift
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'development/orion-q-max-r0/MAX_R6G_JOINT_CLIFFORD_TARE3_COOPT_PROTOCOL.md': 'd85d9d25bc7dd673710e02c93360cb30a64b0d8c',
              'research/extensions/orion-q/max_r6g_joint_clifford_tare3_coopt.py': 'dbe553b8c07284ac814d10d08316ceac5f155c16',
              'research/extensions/orion-q/max_r6f_donor_clifford_preconditioned_tare3.py': '26070b9ae93ece5c265f183385ae0d336b1024af',
              'research/extensions/orion-q/max_r6d_sixterm_partition_representation_coopt.py': '134cc587ffa218512deb4b37407e2ed8dfe570ef',
              'research/extensions/orion-q/max_r6e_deep_p10_exact_frame_saturation.py': 'e6d1a6abb1ba2cc7ca661011d92e850a7f749ecb',
              'research/extensions/orion-q/max_r6e_deep_p10_exact_frame_saturation_fast.py': '99fb3c7f508ca2da3e792cac6a215137b1d32149',
              'research/extensions/orion-q/max_r6b_tare_transformation_reuse_donor.py': '10d5f94743ca3ea6a73822f716acfe7b79b39798',
              'research/extensions/orion-q/max_r6_exact_tare3_joint_frame_dp.py': '9831c55686bd26344c30a43775ca48f0ee63a3da',
              'research/extensions/orion-q/max_r6_p10_candidate_blind_frame_optimizer.py': '145b73cab49423cdd0f353c1619695a7fb0d1bfc',
          }
          for name, want in expected.items():
              raw = Path(name).read_bytes()
              got = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if got != want:
                  raise SystemExit(f'R6G frozen blob drift: {name}: {got} != {want}')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run frozen full joint Clifford / exact-TARE3 co-optimization
        run: |
          cd research/extensions/orion-q
          python max_r6g_joint_clifford_tare3_coopt.py \
            --detail-json /tmp/r6g-detail.json | tee /tmp/r6g.txt
          grep '^ORIONQ_MAX_R6G_JOINT_CLIFFORD_TARE3=' /tmp/r6g.txt
      - name: Verify R6G receipt without coercing scientific sign
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          prefix='ORIONQ_MAX_R6G_JOINT_CLIFFORD_TARE3='
          rows=[line for line in Path('/tmp/r6g.txt').read_text().splitlines() if line.startswith(prefix)]
          if len(rows) != 1:
              raise SystemExit(f'expected exactly one R6G receipt, got {len(rows)}')
          p=json.loads(rows[0][len(prefix):])
          gates=p.get('gates')
          if not isinstance(gates,dict) or not gates or not all(v is True for v in gates.values()):
              raise SystemExit(f'R6G integrity gates failed: {gates}')
          if p.get('reserved_stretched_n2_accessed') is not False:
              raise SystemExit('R6G accessed protected stretched N2')
          if p.get('novelty_credit') is not False or p.get('donor_novelty_credit') is not False:
              raise SystemExit('R6G assigned forbidden novelty credit')
          if p.get('r6_authority') is not False:
              raise SystemExit('R6G self-promoted to R6')
          detail=json.loads(Path('/tmp/r6g-detail.json').read_text())
          canonical=json.dumps(detail,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          if hashlib.sha256(canonical).hexdigest() != p.get('detail_bundle_sha256'):
              raise SystemExit('R6G persisted detail digest mismatch')
          if p.get('detail_persisted_digest_match') is not True:
              raise SystemExit('R6G script did not verify persisted detail')
          allowed={
              'MAX_R6G_JOINT_CLIFFORD_TARE3_COOPT_SUPPORTED__NOT_R6',
              'MAX_R6G_PARTIAL_JOINT_CLIFFORD_REOPEN__NOT_R6',
              'MAX_R6G_JOINT_CLIFFORD_TARE3_COOPT_NEGATIVE__NOT_R6',
          }
          if p.get('authority') not in allowed:
              raise SystemExit(f'unrecognized R6G authority: {p.get("authority")}')
          supported=p.get('development_supported') is True
          if supported:
              if p.get('authority') != 'MAX_R6G_JOINT_CLIFFORD_TARE3_COOPT_SUPPORTED__NOT_R6':
                  raise SystemExit('R6G support/authority disagreement')
              for subject in ('H4','N2'):
                  if p.get('subjects',{}).get(subject,{}).get('strict_budget_matched_improvement_exists') is not True:
                      raise SystemExit(f'R6G positive without strict point on {subject}')
          print('R6G_SCIENTIFIC_SIGN=' + ('POSITIVE' if supported else 'NONPOSITIVE'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orion-q-max-r6g-joint-clifford-tare3-receipt
          path: |
            /tmp/r6g.txt
            /tmp/r6g-detail.json
          if-no-files-found: warn
          retention-days: 30
