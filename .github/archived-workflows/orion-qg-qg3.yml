name: orion-qg-qg3-positive-forecast
on:
  pull_request:
    paths:
      - 'development/orion-qg-regime-geometry/**'
      - 'research/extensions/orion-qg/**'
      - 'packages/orion-research-harness/src/orion_research_harness/domains/orion_qg/**'
      - 'packages/orion-research-harness/tests/test_qg3_positive_forecast.py'
      - '.github/workflows/orion-qg-qg3.yml'
  workflow_dispatch:
concurrency:
  group: orion-qg-qg3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qg3-positive-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      QG3_FROZEN_BASE: 13a0fc6afb1d150a114ec318d72830e3c6722b03
      ORION_HARNESS_MAX_PROCESS_TIMEOUT_SECONDS: 2400
    steps:
      - name: Checkout exact protected head, never synthetic merge ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert frozen lineage before any subject access
        run: |
          echo "checked_out=$(git rev-parse HEAD)"
          echo "event_head=${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e "${QG3_FROZEN_BASE}^{commit}"
          test "$(git merge-base HEAD "${QG3_FROZEN_BASE}")" = "${QG3_FROZEN_BASE}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ORION and both harness layers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,candidates]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Validate QG-3 native campaign control
        run: pytest -q packages/orion-research-harness/tests/test_qg3_positive_forecast.py
      - name: Run stage 1 + dual-harness pre-ground-truth admission
        run: |
          set -o pipefail
          mkdir -p artifacts
          python development/orion-qg-regime-geometry/run_qg3_dual_harness.py | tee artifacts/orion-qg-qg3-dual-summary.json
      - name: Run exact referee twice after dual admission
        run: |
          set -o pipefail
          python research/extensions/orion-qg/qg3_exact_referee.py --output artifacts/orion-qg-qg3-result-run1.json | tee artifacts/orion-qg-qg3-referee-run1.log
          python research/extensions/orion-qg/qg3_exact_referee.py --output artifacts/orion-qg-qg3-result-run2.json | tee artifacts/orion-qg-qg3-referee-run2.log
          cmp artifacts/orion-qg-qg3-result-run1.json artifacts/orion-qg-qg3-result-run2.json
          cp artifacts/orion-qg-qg3-result-run1.json artifacts/orion-qg-qg3-result.json
      - name: Enforce honest terminal and positive gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          stage1=json.loads(Path('artifacts/orion-qg-qg3-stage1.json').read_text());dual=json.loads(Path('artifacts/orion-qg-qg3-dual-admission.json').read_text());result=json.loads(Path('artifacts/orion-qg-qg3-result.json').read_text())
          assert stage1['schema']=='ORION.QG.QG3.Stage1Prediction.v1' and stage1['candidate_cap']==12 and stage1['ground_truth_opened'] is False and stage1['novelty_authority'] is False and stage1['dp_call_count']==0 and stage1['no_dp_calls'] is True and stage1['protected_unread'] is True
          assert dual['schema']=='ORION.QG.QG3.DualAdmission.v1' and dual['stage1_digest']==stage1['stage1_digest'] and dual['ground_truth_opened'] is False and dual['novelty_authority'] is False
          allowed={'QG3_NO_POSITIVE_PREDICTION_IN_FROZEN_SCAN','QG3_DUAL_HARNESS_DISAGREEMENT','QG3_PREDICTION_REFUTED','QG3_ACCESS_OR_PROVENANCE_CANNOT_CHECK','QG3_PROSPECTIVE_POSITIVE_TRADE_FORECAST_CONFIRMED'}
          assert result['terminal'] in allowed and result['novelty_authority'] is False
          if 'physical_quantum_advantage_claim' in result: assert result['physical_quantum_advantage_claim'] is False
          if result['terminal']=='QG3_PROSPECTIVE_POSITIVE_TRADE_FORECAST_CONFIRMED':
              assert stage1['positive_found'] is True and dual['both_open'] is True and all(result['gates'].values()) and result['truth']['strict_donor_gap']>=1 and result['prediction']['predicted_C_DP']<result['prediction']['C_R6L'] and result['truth']['C_DP']==result['prediction']['predicted_C_DP'] and result['truth']['truth_regime']==result['prediction']['predicted_regime']
          elif result['terminal']!='QG3_PREDICTION_REFUTED': assert result['ground_truth_opened'] is False
          PY
      - name: Upload QG-3 receipts
        uses: actions/upload-artifact@v4
        with:
          name: orion-qg-qg3-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/orion-qg-qg3-stage1.json
            artifacts/orion-qg-qg3-dual-admission.json
            artifacts/orion-qg-qg3-dual-summary.json
            artifacts/orion-qg-qg3-result.json
            artifacts/orion-qg-qg3-result-run1.json
            artifacts/orion-qg-qg3-result-run2.json
            artifacts/orion-qg-qg3-referee-run1.log
            artifacts/orion-qg-qg3-referee-run2.log
            .orion-qg-qg3-generic/.orion-harness/**
            .orion-qg-qg3-native/.orion-harness/**
          include-hidden-files: true
          if-no-files-found: error
