name: p1-necessity-primary-v2-readonly

on:
  pull_request:
    branches:
      - shadow/p1-necessity-execution-binding-amendment-20260818
    paths:
      - '.github/workflows/p1-necessity-primary-v2-readonly.yml'
      - 'research/development/p1-necessity-primary-rerun-v2/**'
      - 'research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json'
      - 'research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE_V2.json'
      - 'research/revival/p1/confirmatory/v2.2/EXECUTION_BINDING_AMENDMENT_V1.json'
      - 'research/revival/p1/protocol/P1.epistemic-mutation-necessity.v2.2*.json'
      - 'research/revival/p1/freeze_mutation_necessity_worlds.py'
      - 'research/revival/p1/freeze_mutation_necessity_execution.py'
      - 'research/revival/p1/run_mutation_necessity_campaign.py'
      - 'src/orion/study/p1_causal/absorbed_mechanics.py'
      - 'src/orion/study/p1_causal/necessity_cases.py'
      - 'src/orion/study/p1_causal/necessity_cases_v2.py'
      - 'src/orion/study/p1_causal/necessity_engine.py'
      - 'src/orion/study/p1_causal/necessity_policies.py'
      - 'src/orion/study/p1_causal/necessity_policies_v3.py'
      - 'src/orion/study/p1_causal/necessity_scoring.py'
      - 'src/orion/study/p1_causal/necessity_statistics.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-primary:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install exact repository environment
        run: python -m pip install -e '.[dev]'

      - name: Assert instrumentation-only prerequisite correction
        shell: bash
        run: |
          set -euo pipefail
          test -f research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json
          test -f research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE_V2.json
          test -f research/revival/p1/confirmatory/v2.2/EXECUTION_BINDING_AMENDMENT_V1.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('research/revival/p1/confirmatory/v2.2')
          w=json.loads((root/'PRIMARY_WORLD_FREEZE.json').read_text())
          e=json.loads((root/'PRIMARY_EXECUTION_FREEZE_V2.json').read_text())
          a=json.loads((root/'EXECUTION_BINDING_AMENDMENT_V1.json').read_text())
          assert w['protocol_version']==e['protocol_version']=='P1.epistemic-mutation-necessity.v2.2.4'
          assert w['protocol_chain']['chain_sha256']==e['protocol_chain_sha256']
          assert (w['n'],w['hidden_shift_n'],w['negative_control_n'])==(2882,480,2402)
          assert (e['n'],e['hidden_shift_n'],e['negative_control_n'])==(2882,480,2402)
          assert w['public_sha256']==e['public_sha256']
          assert w['protected_response_matrix_sha256']==e['protected_response_matrix_sha256']
          assert w['arms_executed'] is False and w['outcome_accessed'] is False
          assert e['arms_executed'] is False and e['outcome_accessed'] is False
          assert a['scientific_fields_changed']==[]
          assert a['source_hashes_changed']==[]
          assert a['arms_executed_before_correction'] is False
          assert a['scientific_terminal_observed_before_correction'] is False
          committed_world_sha=hashlib.sha256((root/'PRIMARY_WORLD_FREEZE.json').read_bytes()).hexdigest()
          assert e['world_freeze_sha256']==committed_world_sha
          assert a['new_world_freeze_sha256']==committed_world_sha
          assert a['committed_world_receipt_sha256']==committed_world_sha
          print('P1_V2_EXECUTION_BINDING=PASS', committed_world_sha)
          PY

      - name: Replay exact v2.2.4 worlds without arm execution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p1-v2-worlds /tmp/p1-v2-result
          python research/revival/p1/freeze_mutation_necessity_worlds.py \
            --protocol "$GITHUB_WORKSPACE/research/revival/p1/protocol/P1.epistemic-mutation-necessity.v2.2.4.json" \
            --outdir /tmp/p1-v2-worlds
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          root=Path('research/revival/p1/confirmatory/v2.2')
          frozen=json.loads((root/'PRIMARY_WORLD_FREEZE.json').read_text())
          fresh=json.loads(Path('/tmp/p1-v2-worlds/WORLD_FREEZE.json').read_text())
          for key in [
              'protocol_version','confirmatory_seed','replication_seed','n',
              'hidden_shift_n','negative_control_n','public_sha256',
              'protected_response_matrix_sha256','candidate_view_leak_count',
              'by_family','source_sha256','arms_executed','outcome_accessed',
          ]:
              assert fresh[key]==frozen[key], (key,fresh[key],frozen[key])
          assert fresh['protocol_chain']['chain_sha256']==frozen['protocol_chain']['chain_sha256']
          assert hashlib.sha256(Path('/tmp/p1-v2-worlds/WORLD_PUBLIC.jsonl').read_bytes()).hexdigest()==frozen['public_sha256']
          assert hashlib.sha256(Path('/tmp/p1-v2-worlds/PROTECTED_RESPONSE_MATRIX.jsonl').read_bytes()).hexdigest()==frozen['protected_response_matrix_sha256']
          # subject_git_sha is an execution-envelope coordinate: this PR adds only
          # workflow/development files, so fresh HEAD differs while the generated
          # scientific worlds and every bound source hash remain identical.
          shutil.copyfile(root/'PRIMARY_WORLD_FREEZE.json','/tmp/p1-v2-worlds/WORLD_FREEZE.json')
          print('P1_V2_WORLD_REPLAY=PASS')
          PY

      - name: Reassert corrected V2 receipt against replayed bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          execution=json.loads(Path('research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE_V2.json').read_text())
          world_dir=Path('/tmp/p1-v2-worlds')
          assert hashlib.sha256((world_dir/'WORLD_FREEZE.json').read_bytes()).hexdigest()==execution['world_freeze_sha256']
          assert hashlib.sha256((world_dir/'WORLD_PUBLIC.jsonl').read_bytes()).hexdigest()==execution['public_sha256']
          assert hashlib.sha256((world_dir/'PROTECTED_RESPONSE_MATRIX.jsonl').read_bytes()).hexdigest()==execution['protected_response_matrix_sha256']
          assert len(execution['runnable_arms'])==9
          assert len(execution['ablation_arms'])==5
          assert len(execution['h1_parents'])==3
          print('P1_V2_PRE_OUTCOME_FREEZE=PASS')
          PY

      - name: Execute immutable primary campaign read-only
        shell: bash
        run: |
          set -euo pipefail
          python research/revival/p1/run_mutation_necessity_campaign.py \
            --world-dir /tmp/p1-v2-worlds \
            --execution-freeze research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE_V2.json \
            --outdir /tmp/p1-v2-result

      - name: Validate frozen scientific terminal and immutable identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/p1-v2-result/RESULT.json').read_text())
          execution=json.loads(Path('research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE_V2.json').read_text())
          assert p['terminal'] in {'P1_MUTATION_NECESSITY_SUPPORTED','P1_MUTATION_NECESSITY_NOT_SUPPORTED'}
          assert p['n_worlds']==execution['n']==2882
          assert p['n_runnable_arms']==len(execution['runnable_arms'])==9
          assert p['n_ablation_arms']==len(execution['ablation_arms'])==5
          assert p['analysis']['all_support_gates_pass']==(p['terminal']=='P1_MUTATION_NECESSITY_SUPPORTED')
          print(json.dumps({
              'terminal':p['terminal'],
              'n_worlds':p['n_worlds'],
              'hidden_shift_n':execution['hidden_shift_n'],
              'negative_control_n':execution['negative_control_n'],
              'all_support_gates_pass':p['analysis']['all_support_gates_pass'],
              'gates':p['analysis']['gates'],
              'h1_hidden_shift':p['analysis']['h1_hidden_shift'],
              'h1_holm':p['analysis']['h1_holm'],
              'h2_control_success':p['analysis']['h2_control_success'],
              'h2_unnecessary_reframe_count':p['analysis']['h2_full_unnecessary_reframe_count'],
              'whole_grid_success':p['analysis']['whole_grid_success'],
              'cost':p['analysis']['cost'],
          }, sort_keys=True))
          PY

      - name: Upload complete read-only outcome evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-necessity-v2-2-4-primary-readonly-${{ github.sha }}
          path: |
            /tmp/p1-v2-result/
            research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json
            research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE_V2.json
            research/revival/p1/confirmatory/v2.2/EXECUTION_BINDING_AMENDMENT_V1.json
            research/development/p1-necessity-primary-rerun-v2/README.md
          if-no-files-found: warn
          retention-days: 30
