name: p2-openaire-identity-probe

on:
  pull_request:
    paths:
      - 'papers/orion-12-open-world-scientific-discovery/scripts/probe_autoresearchbench_wide_openaire_identity.py'
      - 'papers/orion-12-open-world-scientific-discovery/protocol/P2_OPENAIRE_IDENTITY_PROBE_FREEZE_V1.json'
      - 'research/development/p2-wide-openaire-identity-v1/**'
      - 'tests/unit/p2/test_p2_openaire_identity_probe.py'
      - '.github/workflows/p2-openaire-identity-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-split:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The gold-bearing preparation process deliberately checks out trusted main,
      # not the candidate PR branch.  The next job receives only the public split.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install trusted host-split dependencies
        run: python -m pip install -e . cryptography

      - name: Materialize pinned AutoResearchBench release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/arb-upstream /tmp/p2-openaire-host
          git clone --filter=blob:none https://github.com/CherYou/AutoResearchBench.git /tmp/arb-upstream
          git -C /tmp/arb-upstream checkout a46c9bfb8968786f73f0a6a5b365b5384cd0f96d
          mkdir -p /tmp/p2-openaire-host
          curl --fail --location --retry 4 --retry-delay 3 \
            --output /tmp/p2-openaire-host/AutoResearchBench.jsonl.obf.json \
            https://huggingface.co/datasets/Lk123/AutoResearchBench/resolve/main/AutoResearchBench.jsonl.obf.json
          python /tmp/arb-upstream/decrypt_benchmark.py \
            --input-file /tmp/p2-openaire-host/AutoResearchBench.jsonl.obf.json \
            --output-file /tmp/p2-openaire-host/AutoResearchBench.jsonl
          echo 'db1839438033a32dd7d76913575d4b76f144d5e442aaac29be4eda32326392c6  /tmp/p2-openaire-host/AutoResearchBench.jsonl' | sha256sum -c -

      - name: Produce candidate-visible public split on trusted main
        shell: bash
        run: |
          set -euo pipefail
          python papers/orion-12-open-world-scientific-discovery/scripts/run_autoresearchbench_wide_compat.py prepare \
            --full /tmp/p2-openaire-host/AutoResearchBench.jsonl \
            --public /tmp/p2-openaire-host/wide_public.jsonl \
            --gt /tmp/p2-openaire-host/wide_gt_DO_NOT_EXPORT.jsonl \
            --manifest /tmp/p2-openaire-host/split_manifest.json
          test -s /tmp/p2-openaire-host/wide_public.jsonl
          test -s /tmp/p2-openaire-host/split_manifest.json
          # Prove the only exported JSONL has exactly the candidate schema.
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/p2-openaire-host/wide_public.jsonl')
          rows = [json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          assert len(rows) == 400
          assert all(set(row) == {'task_id', 'question'} for row in rows)
          assert all('arxiv_id' not in row for row in rows)
          print('PUBLIC_SPLIT_ONLY=PASS')
          PY

      - name: Export public split only
        uses: actions/upload-artifact@v4
        with:
          name: p2-openaire-public-split-${{ github.run_id }}
          path: |
            /tmp/p2-openaire-host/wide_public.jsonl
            /tmp/p2-openaire-host/split_manifest.json
          if-no-files-found: error
          retention-days: 7

  identity-probe:
    needs: host-split
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ORION test environment
        run: python -m pip install -e '.[dev]'

      - name: Hostile-test identity admission before network outcome
        run: pytest -q tests/unit/p2/test_p2_openaire_identity_probe.py

      - name: Download candidate-visible public split
        uses: actions/download-artifact@v4
        with:
          name: p2-openaire-public-split-${{ github.run_id }}
          path: /tmp/p2-openaire-probe/input

      - name: Run frozen structured-PID probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p2-openaire-probe/output
          python papers/orion-12-open-world-scientific-discovery/scripts/probe_autoresearchbench_wide_openaire_identity.py \
            --public /tmp/p2-openaire-probe/input/wide_public.jsonl \
            --freeze papers/orion-12-open-world-scientific-discovery/protocol/P2_OPENAIRE_IDENTITY_PROBE_FREEZE_V1.json \
            --out-dir /tmp/p2-openaire-probe/output
          test -s /tmp/p2-openaire-probe/output/OPENAIRE_IDENTITY_PROBE_RESULT.json

      - name: Print frozen discriminator terminal
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/p2-openaire-probe/output/OPENAIRE_IDENTITY_PROBE_RESULT.json')
          x = json.loads(p.read_text())
          assert x['promotion'] == 'FORBIDDEN_FROM_THIS_PROBE'
          assert x['identity']['raw_regex_identity_extraction'] is False
          assert x['terminal'] in {
              'SCORER_NATIVE_IDENTITY_BRIDGE_OBSERVED',
              'OPENAIRE_IDENTITY_BRIDGE_NOT_OBSERVED',
          }
          print('OPENAIRE_IDENTITY_TERMINAL=' + x['terminal'])
          print(json.dumps(x, sort_keys=True))
          PY

      - name: Upload immutable identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-openaire-identity-${{ github.sha }}
          path: |
            /tmp/p2-openaire-probe/input/split_manifest.json
            /tmp/p2-openaire-probe/output/OPENAIRE_IDENTITY_PROBE_RESULT.json
            /tmp/p2-openaire-probe/output/OPENAIRE_IDENTITY_TRACES.jsonl
            /tmp/p2-openaire-probe/output/responses/*.json
            papers/orion-12-open-world-scientific-discovery/protocol/P2_OPENAIRE_IDENTITY_PROBE_FREEZE_V1.json
            research/development/p2-wide-openaire-identity-v1/README.md
          if-no-files-found: warn
          retention-days: 30
