name: ORION A5 deterministic panel allocation v1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/orion-a5-deterministic-panel-allocation-v1.yml"
      - "papers/orion-14-verified-scientific-discovery/protocol/a5-naturalistic-analysis-freeze-v1/A5_DETERMINISTIC_PANEL_ALLOCATION_V1.json"
      - "papers/orion-14-verified-scientific-discovery/protocol/a5-naturalistic-analysis-freeze-v1/allocate_naturalistic_panel_v1.py"
permissions:
  contents: read
jobs:
  deterministic-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind frozen parent protocol and allocation contract
        run: |
          set -euo pipefail
          test "$(git hash-object papers/orion-14-verified-scientific-discovery/protocol/P4_NATURALISTIC_IDENTIFIABILITY_SUCCESSOR_V2_AMENDMENT.json)" = "c2de4a426f1ea32fba084250390c21304d885507"
          python - <<'PY'
          import json
          p='papers/orion-14-verified-scientific-discovery/protocol/a5-naturalistic-analysis-freeze-v1/A5_DETERMINISTIC_PANEL_ALLOCATION_V1.json'
          d=json.load(open(p))
          assert d['schema']=='ORION.A5.DeterministicPanelAllocation.v1'
          assert d['protected_outcomes_accessed'] is False
          assert d['comparator_outputs_accessed'] is False
          assert d['terminal_gold_accessed'] is False
          assert d['candidate_roles_per_cell']=={'primary':24,'replication':8,'screening_reserve':16}
          assert d['minimum_balanced_candidate_frame']==1536
          PY
      - name: Compile and run hostile self-tests
        run: |
          python -m py_compile papers/orion-14-verified-scientific-discovery/protocol/a5-naturalistic-analysis-freeze-v1/allocate_naturalistic_panel_v1.py
          python papers/orion-14-verified-scientific-discovery/protocol/a5-naturalistic-analysis-freeze-v1/allocate_naturalistic_panel_v1.py --self-test
      - name: Ban host RNG and outcome-dependent allocation key
        run: |
          set -euo pipefail
          f=papers/orion-14-verified-scientific-discovery/protocol/a5-naturalistic-analysis-freeze-v1/allocate_naturalistic_panel_v1.py
          ! grep -Eq '^import (random|numpy)|^from (random|numpy)' "$f"
          python - <<'PY'
          import ast,pathlib
          p=pathlib.Path('papers/orion-14-verified-scientific-discovery/protocol/a5-naturalistic-analysis-freeze-v1/allocate_naturalistic_panel_v1.py')
          mod=ast.parse(p.read_text())
          fn=next(n for n in mod.body if isinstance(n,ast.FunctionDef) and n.name=='alloc_key')
          literals=' '.join(n.value for n in ast.walk(fn) if isinstance(n,ast.Constant) and isinstance(n.value,str)).lower()
          for x in ('gold','outcome','score','success','candidate_output','comparator_output'):
              assert x not in literals,(x,literals)
          PY
      - name: Repository cleanliness
        run: |
          git diff --check
          git diff --exit-code
