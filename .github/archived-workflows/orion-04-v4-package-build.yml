name: ORION-04 V4 package build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/orion-04-v4-package-build.yml"
      - "papers/orion-04-rooted-completion-certificates/submission/final-v4-20260903/**"
      - "papers/orion-04-rooted-completion-certificates/WAVE3_SCOPED_MANUSCRIPT_V4.md"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX toolchain and pandoc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            pandoc \
            lmodern texlive-fonts-recommended \
            latexmk texlive-binaries texlive-base texlive-latex-base \
            texlive-latex-recommended texlive-latex-extra texlive-pictures \
            texlive-publishers
      - name: Build V4 package
        run: |
          cd papers/orion-04-rooted-completion-certificates/submission/final-v4-20260903
          python3 build_package.py
          ls -la manuscript.pdf source.zip SHA256SUMS
          sha256sum manuscript.pdf source.zip
      - name: Sanity-check the built PDF
        run: |
          sudo apt-get install -y -q poppler-utils
          cd papers/orion-04-rooted-completion-certificates/submission/final-v4-20260903
          pdftotext manuscript.pdf - | tr -s ' \n' ' ' > /tmp/v4.txt
          grep -q "Freeze" /tmp/v4.txt
          grep -q "Theorem 4.1" /tmp/v4.txt
          echo "V4_PDF_CARRIES_ATTRIBUTION"
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-04-v4-package
          path: |
            papers/orion-04-rooted-completion-certificates/submission/final-v4-20260903/manuscript.pdf
            papers/orion-04-rooted-completion-certificates/submission/final-v4-20260903/source.zip
            papers/orion-04-rooted-completion-certificates/submission/final-v4-20260903/SHA256SUMS
