name: p11-real-learned-compiler-v1

on:
  pull_request:
    paths:
      - 'papers/orion-21-state-as-computation/top_tier/**'
      - '.github/workflows/p11-real-learned-compiler-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-compiler-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen scientific dependencies
        run: python -m pip install 'numpy==1.26.4' 'scikit-learn==1.5.2'
      - name: Execute prospective learned-compiler study
        run: python papers/orion-21-state-as-computation/top_tier/run_real_learned_compiler_v1.py | tee p11_real_learned_compiler_v1.json
      - name: Execute byte-replay run
        run: |
          python papers/orion-21-state-as-computation/top_tier/run_real_learned_compiler_v1.py > p11_real_learned_compiler_v1_rerun.json
          cmp p11_real_learned_compiler_v1.json p11_real_learned_compiler_v1_rerun.json
          echo P11_REAL_LEARNED_COMPILER_V1_BYTE_REPLAY_GREEN
      - uses: actions/upload-artifact@v4
        with:
          name: p11-real-learned-compiler-v1
          path: p11_real_learned_compiler_v1.json
