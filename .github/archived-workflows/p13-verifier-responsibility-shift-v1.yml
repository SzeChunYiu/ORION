name: p13-verifier-responsibility-shift-v1

on:
  pull_request:
    paths:
      - 'papers/orion-23-responsibility-carrying-state/top_tier/P13_VERIFIER_RESPONSIBILITY_SHIFT_PROTOCOL_V1.md'
      - 'papers/orion-23-responsibility-carrying-state/top_tier/p13_verifier_responsibility_cases_v1.json'
      - 'papers/orion-23-responsibility-carrying-state/top_tier/run_verifier_responsibility_shift_v1.py'
      - 'papers/orion-23-responsibility-carrying-state/top_tier/check_verifier_responsibility_shift_independent_v1.py'
      - '.github/workflows/p13-verifier-responsibility-shift-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier-responsibility-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Execute verifier-backed responsibility shift
        run: python papers/orion-23-responsibility-carrying-state/top_tier/run_verifier_responsibility_shift_v1.py | tee p13_verifier_responsibility_v1.json
      - name: Verify primary byte replay
        run: |
          python papers/orion-23-responsibility-carrying-state/top_tier/run_verifier_responsibility_shift_v1.py > p13_verifier_responsibility_v1_rerun.json
          cmp p13_verifier_responsibility_v1.json p13_verifier_responsibility_v1_rerun.json
      - name: Execute independent checker
        run: python papers/orion-23-responsibility-carrying-state/top_tier/check_verifier_responsibility_shift_independent_v1.py | tee p13_verifier_responsibility_independent_v1.json
      - name: Verify independent replay and agreement
        run: |
          python papers/orion-23-responsibility-carrying-state/top_tier/check_verifier_responsibility_shift_independent_v1.py > p13_verifier_responsibility_independent_v1_rerun.json
          cmp p13_verifier_responsibility_independent_v1.json p13_verifier_responsibility_independent_v1_rerun.json
          python - <<'PY'
          import json, math
          p=json.load(open('p13_verifier_responsibility_v1.json')); q=json.load(open('p13_verifier_responsibility_independent_v1.json'))
          assert p['terminal']=='P13_VERIFIER_RESPONSIBILITY_SHIFT_V1_SUPPORTED'
          assert q['terminal']=='P13_VERIFIER_RESPONSIBILITY_SHIFT_SECOND_INDEPENDENT_CHECKER_GREEN'
          assert p['case_count']==q['case_count']==12
          assert p['correct']==q['expected_correct']
          assert p['stale_reuse']==q['expected_stale_reuse']
          assert p['raw_literal_reads']==q['expected_raw_literal_reads']
          assert math.isclose(p['rcs_raw_read_reduction'],q['expected_rcs_raw_read_reduction'])
          print('P13_VERIFIER_RESPONSIBILITY_SHIFT_TWO_IMPLEMENTATIONS_AGREE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p13-verifier-responsibility-shift-v1
          path: |
            p13_verifier_responsibility_v1.json
            p13_verifier_responsibility_independent_v1.json
