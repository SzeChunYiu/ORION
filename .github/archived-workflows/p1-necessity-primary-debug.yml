name: p1-necessity-primary-debug

on:
  push:
    branches:
      - shadow/p1-necessity-primary-result-20260817
    paths:
      - '.github/workflows/p1-necessity-primary-debug.yml'
  pull_request:
    branches:
      - shadow/p1-necessity-execution-freeze-20260817
    paths:
      - '.github/workflows/p1-necessity-primary-debug.yml'
      - 'research/revival/p1/confirmatory/v2.2/PRIMARY_*_FREEZE.json'
      - 'research/revival/p1/run_mutation_necessity_campaign.py'
      - 'research/revival/p1/freeze_mutation_necessity_worlds.py'
      - 'src/orion/study/p1_causal/absorbed_mechanics.py'
      - 'src/orion/study/p1_causal/necessity_*.py'

permissions:
  contents: read

jobs:
  debug-frozen-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Replay exact worlds and frozen receipt
        run: |
          rm -rf /tmp/p1-worlds /tmp/p1-result /tmp/p1-debug
          mkdir -p /tmp/p1-debug
          python research/revival/p1/freeze_mutation_necessity_worlds.py --outdir /tmp/p1-worlds
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          frozen=json.loads(Path('research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json').read_text())
          fresh=json.loads(Path('/tmp/p1-worlds/WORLD_FREEZE.json').read_text())
          for key in ['protocol_version','confirmatory_seed','replication_seed','n','hidden_shift_n','negative_control_n','public_sha256','protected_response_matrix_sha256','candidate_view_leak_count','by_family','source_sha256']:
              assert fresh[key]==frozen[key], (key,fresh[key],frozen[key])
          assert fresh['protocol_chain']['chain_sha256']==frozen['protocol_chain']['chain_sha256']
          shutil.copyfile('research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json','/tmp/p1-worlds/WORLD_FREEZE.json')
          PY
      - name: Capture frozen runner exception structurally
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          command=[
              'python','research/revival/p1/run_mutation_necessity_campaign.py',
              '--world-dir','/tmp/p1-worlds',
              '--execution-freeze','research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE_V3.json',
              '--outdir','/tmp/p1-result',
          ]
          completed=subprocess.run(command, text=True, capture_output=True)
          receipt={
              'schema_version':'P1.frozen-runner-failure-debug.v1',
              'command':command,
              'returncode':completed.returncode,
              'stdout':completed.stdout,
              'stderr':completed.stderr,
              'result_exists':Path('/tmp/p1-result/RESULT.json').exists(),
              'claim_boundary':'INSTRUMENTATION_DEBUG_ONLY__NO_PROTOCOL_OR_OUTCOME_RULE_CHANGE',
          }
          Path('/tmp/p1-debug/FROZEN_RUNNER_DEBUG.json').write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
          print(json.dumps({
              'returncode':receipt['returncode'],
              'result_exists':receipt['result_exists'],
              'stderr_tail':receipt['stderr'][-4000:],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-v2-2-4-frozen-runner-debug
          path: /tmp/p1-debug/FROZEN_RUNNER_DEBUG.json
          if-no-files-found: error
