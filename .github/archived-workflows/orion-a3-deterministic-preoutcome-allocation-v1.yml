name: ORION A3 deterministic pre-outcome allocation v1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/orion-a3-deterministic-preoutcome-allocation-v1.yml"
      - "papers/publication_closure/a3-external-change-transport-v1/A3_DETERMINISTIC_PREOUTCOME_ALLOCATION_V1.json"
      - "papers/publication_closure/a3-external-change-transport-v1/allocate_change_clusters_v1.py"
permissions:
  contents: read
jobs:
  deterministic-allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen allocation contract
        run: |
          python - <<'PY'
          import json
          p='papers/publication_closure/a3-external-change-transport-v1/A3_DETERMINISTIC_PREOUTCOME_ALLOCATION_V1.json'
          d=json.load(open(p))
          assert d['schema']=='ORION.A3.DeterministicPreOutcomeAllocation.v1'
          assert d['protected_outcomes_accessed'] is False
          assert d['candidate_predictions_accessed'] is False
          assert d['quota_per_stratum']=={'primary':24,'replication':8}
          assert d['shortfall_terminal']=='CANNOT_CHECK_A3_PREOUTCOME_QUOTA_OR_DISJOINTNESS_SHORTFALL'
          PY
      - name: Compile allocator
        run: python -m py_compile papers/publication_closure/a3-external-change-transport-v1/allocate_change_clusters_v1.py
      - name: Run deterministic and hostile self-tests
        run: python papers/publication_closure/a3-external-change-transport-v1/allocate_change_clusters_v1.py --self-test
      - name: Ban host RNG and outcome vocabulary from selection key
        run: |
          set -euo pipefail
          f=papers/publication_closure/a3-external-change-transport-v1/allocate_change_clusters_v1.py
          ! grep -Eq '^import (random|numpy)|^from (random|numpy)' "$f"
          python - <<'PY'
          import ast,pathlib
          p=pathlib.Path('papers/publication_closure/a3-external-change-transport-v1/allocate_change_clusters_v1.py')
          mod=ast.parse(p.read_text())
          fn=next(n for n in mod.body if isinstance(n,ast.FunctionDef) and n.name=='key')
          literals=' '.join(n.value for n in ast.walk(fn) if isinstance(n,ast.Constant) and isinstance(n.value,str)).lower()
          for forbidden in ('gold','outcome','prediction','score','success'):
              assert forbidden not in literals, (forbidden,literals)
          PY
      - name: Repository cleanliness
        run: |
          git diff --check
          git diff --exit-code
