name: orion-q-max-r6d-sixterm-coopt

on:
  pull_request:
    paths:
      - 'development/orion-q-max-r0/MAX_R6D_SIXTERM_PARTITION_REPRESENTATION_COOPT_PROTOCOL.md'
      - 'research/extensions/orion-q/max_r6d_sixterm_partition_representation_coopt.py'
      - 'research/extensions/orion-q/max_r6b_tare_transformation_reuse_donor.py'
      - 'research/extensions/orion-q/max_r6_exact_tare3_joint_frame_dp.py'
      - 'research/extensions/orion-q/max_r6_p10_candidate_blind_frame_optimizer.py'
      - '.github/workflows/orion-q-max-r6d-sixterm-coopt.yml'
  workflow_dispatch:

concurrency:
  group: orion-q-max-r6d-sixterm-coopt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frozen-sixterm-coopt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Hostile short-batch fail-closed regression
        run: |
          cd research/extensions/orion-q
          python - <<'PY'
          import max_r6d_sixterm_partition_representation_coopt as r6d

          out = r6d._evaluate_fixed_batch([], (), 4)
          expected = {
              'all_partitions': [],
              'eligible_partition_count': 0,
              'eligible_points': [],
              'candidate_pareto': [],
              'incumbent_pareto': [],
              'strict_points': [],
              'best_strict_improvement': None,
              'all_witnesses_valid': False,
          }
          if out != expected:
              raise SystemExit(f'R6D short batch did not fail closed with complete schema: {out}')
          print('R6D_SHORT_BATCH_FAIL_CLOSED=PASS')
          PY
      - name: Run frozen six-term partition/representation co-optimization
        run: |
          cd research/extensions/orion-q
          python max_r6d_sixterm_partition_representation_coopt.py | tee /tmp/r6d.txt
          grep '^ORIONQ_MAX_R6D_SIXTERM_COOPT=' /tmp/r6d.txt
      - name: Verify receipt integrity without changing scientific sign
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          prefix='ORIONQ_MAX_R6D_SIXTERM_COOPT='
          rows=[line for line in Path('/tmp/r6d.txt').read_text().splitlines() if line.startswith(prefix)]
          if len(rows)!=1:
              raise SystemExit(f'expected exactly one R6D receipt, got {len(rows)}')
          p=json.loads(rows[0][len(prefix):])
          gates=p.get('gates')
          if not isinstance(gates,dict) or not gates:
              raise SystemExit('R6D missing gate map')
          supported=p.get('development_supported') is True
          if supported != all(value is True for value in gates.values()):
              raise SystemExit('R6D support does not equal frozen gate conjunction')
          if p.get('reserved_stretched_n2_accessed') is not False:
              raise SystemExit('R6D accessed protected stretched N2')
          if p.get('r6_authority') is not False:
              raise SystemExit('R6D self-promoted to R6')
          if p.get('novelty_credit') is not False:
              raise SystemExit('R6D assigned novelty credit before replay/donor closure')
          hostile=p.get('hostile',{})
          if hostile.get('all_pass') is not True:
              raise SystemExit(f'R6D hostile verification failed: {hostile}')
          for subject in ('H4','N2'):
              row=p.get('subjects',{}).get(subject,{})
              if len(row.get('all_partitions',[])) != 10:
                  raise SystemExit(f'{subject}: did not serialize exactly ten partitions')
              if row.get('all_witnesses_valid') is not True:
                  raise SystemExit(f'{subject}: invalid envelope witness')
          print('R6D_SCIENTIFIC_SIGN=' + ('POSITIVE' if supported else 'NEGATIVE'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orion-q-max-r6d-sixterm-coopt-receipt
          path: /tmp/r6d.txt
          if-no-files-found: warn
          retention-days: 30
