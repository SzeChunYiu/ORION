name: orion-qg-qg42-pytket-transfer
on:
  pull_request:
    paths:
      - '.github/workflows/orion-qg-qg42-pytket-transfer.yml'
      - 'development/orion-qg-regime-geometry/QG42_*'
      - 'development/orion-qg-regime-geometry/qg42_*'
      - 'research/extensions/orion-qg/qg42_*'
  workflow_dispatch:
concurrency:
  group: orion-qg-qg42-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  heldout-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned production compiler
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytket==2.18.1'
          python - <<'PY'
          from importlib.metadata import version
          assert version('pytket')=='2.18.1'
          PY
      - name: Compile QG-42 lane
        run: |
          python -m py_compile research/extensions/orion-qg/qg42_build_panel.py
          python -m py_compile research/extensions/orion-qg/qg42_pytket_selection_transfer.py
          python -m py_compile development/orion-qg-regime-geometry/qg42_generic_verify.py
          python -m py_compile development/orion-qg-regime-geometry/qg42_native_verify.py
      - name: Prove panel builder is compiler-blind and freeze panel
        run: |
          set -o pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('research/extensions/orion-qg/qg42_build_panel.py')
          t=ast.parse(p.read_text())
          bad=[]
          for n in ast.walk(t):
            if isinstance(n,ast.Import): bad += [a.name for a in n.names if a.name.startswith('pytket')]
            if isinstance(n,ast.ImportFrom) and (n.module or '').startswith('pytket'): bad.append(n.module)
          assert not bad,bad
          PY
          mkdir -p artifacts
          python research/extensions/orion-qg/qg42_build_panel.py | tee artifacts/orion-qg-qg42-panel.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/orion-qg-qg42-panel.json').read_text())
          assert d['terminal']=='QG42_PANEL_FROZEN_BEFORE_ROUTING'
          assert d['labelled_graphs_enumerated']==6435
          assert len(d['pairs'])==12
          assert d['PYTKET_IMPORTED'] is False
          PY
      - name: Pytket routing API smoke
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pytket import Circuit
          from pytket.architecture import Architecture
          from pytket.mapping import MappingManager,LexiRouteRoutingMethod
          from pytket.placement import place_with_map
          from pytket.unit_id import Node
          p=json.loads(Path('artifacts/orion-qg-qg42-panel.json').read_text())
          e=p['pairs'][0]['graph_A_edges'];c=Circuit(6)
          for a,b in e:c.CX(a,b)
          arc=Architecture([(0,1),(1,2),(2,3),(3,4),(4,5)])
          place_with_map(c,{c.qubits[q]:Node(q) for q in range(6)})
          MappingManager(arc).route_circuit(c,[LexiRouteRoutingMethod(10)])
          assert all(arc.valid_operation(cmd.qubits,True) for cmd in c.get_commands() if len(cmd.qubits)==2)
          assert c.n_2qb_gates()>=7
          PY
      - name: Execute frozen held-out production transfer
        run: |
          set -o pipefail
          python research/extensions/orion-qg/qg42_pytket_selection_transfer.py | tee artifacts/orion-qg-qg42-summary.log
      - name: Run independent full-layout verifier
        run: |
          set -o pipefail
          python development/orion-qg-regime-geometry/qg42_generic_verify.py | tee artifacts/orion-qg-qg42-generic.log
      - name: Run native authority gate
        run: |
          python development/orion-qg-regime-geometry/qg42_native_verify.py | tee artifacts/orion-qg-qg42-native.log
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('artifacts/orion-qg-qg42-pytket.json').read_text())
          g=json.loads(Path('artifacts/orion-qg-qg42-generic-verification.json').read_text())
          n=json.loads(Path('artifacts/orion-qg-qg42-native-verification.json').read_text())
          assert g['all_checks'] is True and n['all_checks'] is True
          assert s['BOUNDED_PYTKET_SELECTION_INFORMATION_AUTHORITY'] is True
          assert n['BOUNDED_PYTKET_SELECTION_INFORMATION_AUTHORITY'] is True
          for k in ('ALL_CIRCUIT_THEOREM','COMPARATIVE_COMPILER_PERFORMANCE','HARDWARE_NOISE_OR_FT_CLAIM','physical_quantum_advantage_claim','novelty_authority'):
            assert s[k] is False
          PY
      - name: Deterministic production replay
        run: |
          cp artifacts/orion-qg-qg42-pytket.json artifacts/qg42-first.json
          python research/extensions/orion-qg/qg42_pytket_selection_transfer.py --output artifacts/qg42-second.json >/dev/null
          cmp artifacts/qg42-first.json artifacts/qg42-second.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orion-qg-qg42-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/orion-qg-qg42-*
          if-no-files-found: warn
