name: orion-qg-qg9-support2
on:
  pull_request:
    paths:
      - 'development/orion-qg-regime-geometry/QG9_SUPPORT2_*'
      - 'development/orion-qg-regime-geometry/qg9_support2_*'
      - 'development/orion-qg-regime-geometry/run_qg9_support2_dual_harness.py'
      - 'research/extensions/orion-qg/qg9_support2_full_acceptance.py'
      - '.github/workflows/orion-qg-qg9-support2.yml'
  workflow_dispatch:
concurrency:
  group: orion-qg-qg9-support2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  support2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QG9V4_FROZEN_PARENT: 4d70700ba23a8276d4610203124fc178f3929a58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact head and frozen parent
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e "${QG9V4_FROZEN_PARENT}^{commit}"
          test "$(git merge-base HEAD "${QG9V4_FROZEN_PARENT}")" = "${QG9V4_FROZEN_PARENT}"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install ORION and harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,candidates]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Compile theorem instruments
        run: |
          python -m py_compile \
            research/extensions/orion-qg/qg9_support2_full_acceptance.py \
            development/orion-qg-regime-geometry/qg9_support2_generic_verify.py \
            development/orion-qg-regime-geometry/qg9_support2_native_verify.py \
            development/orion-qg-regime-geometry/run_qg9_support2_dual_harness.py
      - name: Execute support-2 theorem through both ORION instruments
        run: |
          mkdir -p artifacts
          python development/orion-qg-regime-geometry/run_qg9_support2_dual_harness.py | tee artifacts/orion-qg-qg9-support2-summary.json
      - name: Deterministic theorem replay
        run: |
          python research/extensions/orion-qg/qg9_support2_full_acceptance.py --output artifacts/orion-qg-qg9-support2-replay.json > artifacts/orion-qg-qg9-support2-replay.log
          cmp artifacts/orion-qg-qg9-support2-full-acceptance.json artifacts/orion-qg-qg9-support2-replay.json
      - name: Enforce theorem or honest accepted obstruction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/orion-qg-qg9-support2-full-acceptance.json').read_text())
          g=json.loads(Path('artifacts/orion-qg-qg9-support2-generic-verification.json').read_text())
          n=json.loads(Path('artifacts/orion-qg-qg9-support2-native-verification.json').read_text())
          d=json.loads(Path('artifacts/orion-qg-qg9-support2-dual-harness.json').read_text())
          pos='QG9_RANK2_ALL_N_SUPPORT2_SUFFICIENCY_MACHINE_CHECKED'
          assert d['terminal'] in {pos,'QG9_VALID_SUPPORT3_OBSTRUCTION_FOUND','QG9_GENERIC_NATIVE_DISAGREEMENT'}
          assert a['support1_claim'] is False and a['tightness_claim'] is False
          assert d['support1_authority'] is False and d['tightness_authority'] is False
          if d['terminal']==pos:
              assert all(a['gates'].values()) and all(a['proof_audit'].values())
              assert a['support_bound']==2
              assert a['support3_full_acceptance']['v3_broad_unsafe_type_cases']>0
              assert a['support3_full_acceptance']['full_accepted_unsafe_type_cases']==0
              assert a['support3_full_acceptance']['full_accepted_type_cases']>0
              assert a['support2_boundary_control']['full_accepted_unsafe_type_cases']>0
              assert g['decision']=='ACCEPT' and all(g['checks'].values())
              assert n['decision']=='ACCEPT_SUPPORT2' and all(n['checks'].values())
              assert d['both_accept'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orion-qg-qg9-support2-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/orion-qg-qg9-support2-full-acceptance.json
            artifacts/orion-qg-qg9-support2-generic-verification.json
            artifacts/orion-qg-qg9-support2-native-verification.json
            artifacts/orion-qg-qg9-support2-dual-harness.json
            artifacts/orion-qg-qg9-support2-summary.json
            artifacts/orion-qg-qg9-support2-replay.json
            artifacts/orion-qg-qg9-support2-replay.log
            .orion-qg-qg9-support2-generic/.orion-harness/**
            .orion-qg-qg9-support2-native/.orion-harness/**
          include-hidden-files: true
          if-no-files-found: error
