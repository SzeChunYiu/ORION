name: ORION V1 Receipt V3 Deadline Migration Audit

on:
  pull_request:
    paths:
      - "src/orion/kernel/process_receipt.py"
      - ".github/workflows/orion-v1-receipt-v3-deadline-migration-audit.yml"
      - "research/orion-v1-execution/**"
  push:
    branches: [main]
    paths:
      - "src/orion/kernel/process_receipt.py"
      - ".github/workflows/orion-v1-receipt-v3-deadline-migration-audit.yml"
      - "research/orion-v1-execution/**"

permissions:
  contents: read

jobs:
  archived-deadline-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/ci-fast-replay-constraints.txt
      - name: Install recorded kernel test environment
        run: >-
          python -m pip install -e '.[dev,candidates]'
          --constraint .github/ci-fast-replay-constraints.txt
      - name: Bind archived oracle and current subject
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipt-v3-deadline-audit
          archive_commit=7d9532a3057b8f66ee0862f64bf8630d8c96ff15
          archive_path=tests/unit/kernel/test_process_receipt_v3_deadline_hostile.py
          git cat-file -e "${archive_commit}^{commit}"
          git show "${archive_commit}:${archive_path}" > receipt-v3-deadline-audit/test_process_receipt_v3_deadline_hostile.py
          git rev-parse HEAD > receipt-v3-deadline-audit/current-commit.txt
          git rev-parse 'HEAD^{tree}' > receipt-v3-deadline-audit/current-tree.txt
          git rev-parse "${archive_commit}:${archive_path}" > receipt-v3-deadline-audit/archive-test-blob.txt
          git rev-parse HEAD:src/orion/kernel/process_receipt.py > receipt-v3-deadline-audit/current-module-blob.txt
          git rev-parse "${archive_commit}:src/orion/kernel/process_receipt.py" > receipt-v3-deadline-audit/archive-module-blob.txt
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path("receipt-v3-deadline-audit")
          oracle = root / "test_process_receipt_v3_deadline_hostile.py"
          module = Path("src/orion/kernel/process_receipt.py")
          payload = {
              "schema": "ORION.V1.ReceiptV3DeadlineMigrationFreeze.v1",
              "archive_commit": "7d9532a3057b8f66ee0862f64bf8630d8c96ff15",
              "archive_test_path": "tests/unit/kernel/test_process_receipt_v3_deadline_hostile.py",
              "archive_test_blob": (root / "archive-test-blob.txt").read_text().strip(),
              "archive_module_blob": (root / "archive-module-blob.txt").read_text().strip(),
              "current_commit": (root / "current-commit.txt").read_text().strip(),
              "current_tree": (root / "current-tree.txt").read_text().strip(),
              "current_module_blob": (root / "current-module-blob.txt").read_text().strip(),
              "archive_test_sha256": hashlib.sha256(oracle.read_bytes()).hexdigest(),
              "current_module_sha256": hashlib.sha256(module.read_bytes()).hexdigest(),
              "authority_ceiling": {
                  "diagnostic_only": True,
                  "scientific_authority_delta": "NONE",
                  "orion_v1_freeze": "NOT_GRANTED",
              },
          }
          (root / "FREEZE.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Collect archived denominator
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q \
            receipt-v3-deadline-audit/test_process_receipt_v3_deadline_hostile.py \
            | tee receipt-v3-deadline-audit/collect.txt
          python - <<'PY'
          import json
          from pathlib import Path
          lines = Path("receipt-v3-deadline-audit/collect.txt").read_text().splitlines()
          node_ids = [line.strip() for line in lines if "::test_" in line]
          if not node_ids or len(node_ids) != len(set(node_ids)):
              raise SystemExit("invalid archived deadline denominator")
          Path("receipt-v3-deadline-audit/DENOMINATOR.json").write_text(
              json.dumps({
                  "schema": "ORION.V1.ReceiptV3DeadlineDenominator.v1",
                  "count": len(node_ids),
                  "node_ids": node_ids,
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"ARCHIVED_DEADLINE_DENOMINATOR={len(node_ids)}")
          PY
      - name: Execute archived oracle against current kernel
        id: execute
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --runxfail \
            receipt-v3-deadline-audit/test_process_receipt_v3_deadline_hostile.py \
            --junitxml=receipt-v3-deadline-audit/result.xml \
            -ra \
            2>&1 | tee receipt-v3-deadline-audit/result.log
      - name: Classify migration state without laundering RED
        shell: bash
        env:
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("receipt-v3-deadline-audit")
          denominator = json.loads((root / "DENOMINATOR.json").read_text())
          xml = ET.parse(root / "result.xml").getroot()
          suites = [xml] if xml.tag == "testsuite" else list(xml.findall("testsuite"))
          counts = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for suite in suites:
              for key in counts:
                  counts[key] += int(suite.attrib.get(key, "0"))
          if counts["tests"] != denominator["count"]:
              raise SystemExit(
                  f"deadline denominator drift: {counts['tests']} != {denominator['count']}"
              )
          if counts["failures"] == counts["errors"] == counts["skipped"] == 0:
              terminal = "ARCHIVED_DEADLINE_PROTOCOL_GREEN_ON_CURRENT_KERNEL"
          else:
              terminal = "ARCHIVED_DEADLINE_PROTOCOL_REQUIRES_PROSPECTIVE_MIGRATION"
          result = {
              "schema": "ORION.V1.ReceiptV3DeadlineMigrationResult.v1",
              "terminal": terminal,
              "pytest_outcome": os.environ.get("EXECUTE_OUTCOME"),
              "counts": counts,
              "authority_ceiling": {
                  "archive_oracle_status": terminal,
                  "current_receipt_v3_status": "UNCHANGED_BY_DIAGNOSTIC",
                  "orion_v1_freeze": "NOT_EARNED",
                  "paper_authority_delta": "NONE",
              },
          }
          (root / "PRIMARY_RESULT.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Upload diagnostic packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-v1-receipt-v3-deadline-migration-${{ github.sha }}
          path: receipt-v3-deadline-audit/
          if-no-files-found: error
          retention-days: 30
