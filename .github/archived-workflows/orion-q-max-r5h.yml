name: orion-q-max-r5h

on:
  pull_request:
    paths:
      - 'research/extensions/orion-q/**'
      - 'development/orion-q-max-r0/**'
      - '.github/workflows/orion-q-max-r5h.yml'

jobs:
  mixed-cardinality-subject:
    strategy:
      fail-fast: false
      matrix:
        # N2 runs only as a committed LUNARC receipt: measured 2026-09-03 it
        # exceeds 2h40m single-core (CI rc=124 at 9600s) against this job's
        # 30-minute timeout, while H4 completes in 58.3s. The N2 execution is
        # certified by LUNARC jobs whose receipts are validated by
        # max_r5h_lunarc_receipt_validator.py below: the original single-job
        # leg hit its 8h budget (rc=124, not a receipt); the revival
        # instrument max_r5h_subject_chunked.py re-runs the identical frozen
        # fold window-chunked with per-window JSON checkpoints, proven against
        # the CI H4 receipt field-for-field (parity gate: every
        # checkpoint-derived field bit-identical; the sole divergence is 1 ulp
        # in B0_Pauli_LCU.Lambda from the cross-platform JW-coefficient libm
        # boundary, a value finalize recomputes rather than checkpoints).
        subject: [H4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run frozen R5H exact donor-composed subject
        run: |
          cd research/extensions/orion-q
          python max_r5h_subject_fast.py '${{ matrix.subject }}' | tee /tmp/r5h-subject.txt
          grep '^ORIONQ_MAX_R5H_SUBJECT=' /tmp/r5h-subject.txt
      - name: Validate committed LUNARC subject receipts (N2/DEV)
        run: |
          cd research/extensions/orion-q
          python max_r5h_lunarc_receipt_validator.py | tee /tmp/r5h-receipts.txt
          grep '^ORIONQ_MAX_R5H_RECEIPTS=' /tmp/r5h-receipts.txt
      - name: Receipt validator selftest
        run: |
          cd research/extensions/orion-q
          python test_max_r5h_lunarc_receipt_validator.py | tee /tmp/r5h-selftest.txt
          grep '^ORIONQ_R5H_VALIDATOR_SELFTEST=PASS' /tmp/r5h-selftest.txt
      - name: Streaming combine equality selftest
        run: |
          cd research/extensions/orion-q
          python test_max_r5h_streaming_combine.py | tee /tmp/r5h-stream-selftest.txt
          grep '^ORIONQ_R5H_STREAM_COMBINE_SELFTEST=PASS' /tmp/r5h-stream-selftest.txt
