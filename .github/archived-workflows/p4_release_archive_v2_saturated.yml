name: p4-release-archive-v2-saturated

on:
  push:
    branches: [main]
    paths:
      - 'papers/orion-14-verified-scientific-discovery/submission/ARCHIVE_TRIGGER_V2_SATURATED.txt'

permissions:
  contents: write
  actions: read

env:
  TAG: orion-p4-v2-peer-review-ready-saturated-2026-08-17

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed-green citation-saturated publication source and artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          T='papers/orion-14-verified-scientific-discovery/submission/ARCHIVE_TRIGGER_V2_SATURATED.txt'
          SOURCE=$(awk -F= '$1=="publication_merge"{print $2}' "$T")
          CI_RUN=$(awk -F= '$1=="publication_ci_run"{print $2}' "$T")
          AUDIT_RUN=$(awk -F= '$1=="publication_audit_run"{print $2}' "$T")
          CAMPAIGN_RUN=$(awk -F= '$1=="campaign_run"{print $2}' "$T")
          PDF_ARTIFACT_ID=$(awk -F= '$1=="pdf_artifact_id"{print $2}' "$T")
          PDF_ARTIFACT_DIGEST=$(awk -F= '$1=="pdf_artifact_zip_sha256"{print $2}' "$T")
          SAFE_ARTIFACT_ID=$(awk -F= '$1=="safe_bundle_artifact_id"{print $2}' "$T")
          SAFE_ARTIFACT_DIGEST=$(awk -F= '$1=="safe_bundle_zip_sha256"{print $2}' "$T")
          PDF_SHA=$(awk -F= '$1=="audited_pdf_sha256"{print $2}' "$T")

          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE" > "$RUNNER_TEMP/source.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" > "$RUNNER_TEMP/ci.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AUDIT_RUN" > "$RUNNER_TEMP/audit.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PDF_ARTIFACT_ID" > "$RUNNER_TEMP/pdf-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SAFE_ARTIFACT_ID" > "$RUNNER_TEMP/safe-artifact.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          source=json.loads((root/'source.json').read_text())
          ci=json.loads((root/'ci.json').read_text())
          audit=json.loads((root/'audit.json').read_text())
          pa=json.loads((root/'pdf-artifact.json').read_text())
          sa=json.loads((root/'safe-artifact.json').read_text())
          t={}
          for line in Path('papers/orion-14-verified-scientific-discovery/submission/ARCHIVE_TRIGGER_V2_SATURATED.txt').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1); t[k]=v
          assert t['release_tag']=='orion-p4-v2-peer-review-ready-saturated-2026-08-17'
          assert source['sha']==t['publication_merge']
          assert source['commit']['verification']['verified'] is True
          assert source['commit']['verification']['reason']=='valid'
          assert ci['head_sha']==t['publication_merge'] and ci['conclusion']=='success' and ci['name']=='ci'
          assert audit['head_sha']==t['publication_merge'] and audit['conclusion']=='success' and audit['name']=='p4-tmlr-submission-audit'
          assert str(pa['id'])==t['pdf_artifact_id'] and pa['digest']=='sha256:'+t['pdf_artifact_zip_sha256']
          assert str(sa['id'])==t['safe_bundle_artifact_id'] and sa['digest']=='sha256:'+t['safe_bundle_zip_sha256']
          assert audit['id']==int(t['publication_audit_run'])
          assert int(t['campaign_run'])==31976589735
          PY

          mkdir -p "$RUNNER_TEMP/pdf" "$RUNNER_TEMP/safe"
          gh run download "$AUDIT_RUN" --repo "$GITHUB_REPOSITORY" --name "p4-tmlr-audited-pdf-$AUDIT_RUN" --dir "$RUNNER_TEMP/pdf"
          gh run download "$CAMPAIGN_RUN" --repo "$GITHUB_REPOSITORY" --name "p4-v2-publication-safe-bundle-$CAMPAIGN_RUN" --dir "$RUNNER_TEMP/safe"
          PDF=$(find "$RUNNER_TEMP/pdf" -name main.pdf -print -quit)
          test -n "$PDF"
          test "$(sha256sum "$PDF" | awk '{print $1}')" = "$PDF_SHA"
          cp "$PDF" "$RUNNER_TEMP/ORION_Paper_IV_TMLR_Citation_Saturated_Audited.pdf"
          (cd "$RUNNER_TEMP/safe" && zip -qr "$RUNNER_TEMP/ORION_P4_V2_SafeBundle.zip" .)
          git archive "$SOURCE" papers/orion-14-verified-scientific-discovery | gzip -n > "$RUNNER_TEMP/ORION_P4_V2_Citation_Saturated_SourceSupplement.tar.gz"
          sha256sum "$RUNNER_TEMP/ORION_Paper_IV_TMLR_Citation_Saturated_Audited.pdf" "$RUNNER_TEMP/ORION_P4_V2_SafeBundle.zip" "$RUNNER_TEMP/ORION_P4_V2_Citation_Saturated_SourceSupplement.tar.gz" > "$RUNNER_TEMP/RELEASE_SHA256SUMS.txt"

      - name: Create immutable citation-saturated GitHub release archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SOURCE=$(awk -F= '$1=="publication_merge"{print $2}' papers/orion-14-verified-scientific-discovery/submission/ARCHIVE_TRIGGER_V2_SATURATED.txt)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; preserving existing archive"
            exit 0
          fi
          gh release create "$TAG" \
            "$RUNNER_TEMP/ORION_Paper_IV_TMLR_Citation_Saturated_Audited.pdf" \
            "$RUNNER_TEMP/ORION_P4_V2_SafeBundle.zip" \
            "$RUNNER_TEMP/ORION_P4_V2_Citation_Saturated_SourceSupplement.tar.gz" \
            "$RUNNER_TEMP/RELEASE_SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE" \
            --title 'ORION Paper IV — Protected V2 Citation-Saturated Peer-Review-Ready Archive' \
            --notes-file papers/orion-14-verified-scientific-discovery/submission/RELEASE_NOTES_V2_SATURATED.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,isDraft,isPrerelease,url > "$RUNNER_TEMP/release.json"
          cat "$RUNNER_TEMP/release.json"
