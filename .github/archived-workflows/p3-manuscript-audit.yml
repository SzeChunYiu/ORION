name: p3-manuscript-audit

on:
  pull_request:
    paths:
      - 'papers/orion-13-global-knowledge-portrait/**'
      - 'research/publication/publication_status.json'
      - 'tests/test_publication_status.py'
      - 'tests/test_paper_manuscript_integrity.py'
      - 'scripts/check_p3_current_package.py'
      - 'scripts/check_p3_manuscript_claim_surface.py'
      - 'scripts/write_render_closure_state.py'
      - '.github/workflows/p3-manuscript-audit.yml'
  push:
    branches: [main]
    paths:
      - 'papers/orion-13-global-knowledge-portrait/**'
      - 'research/publication/publication_status.json'
      - 'tests/test_publication_status.py'
      - 'tests/test_paper_manuscript_integrity.py'
      - 'scripts/check_p3_current_package.py'
      - 'scripts/check_p3_manuscript_claim_surface.py'
      - 'scripts/write_render_closure_state.py'
      - '.github/workflows/p3-manuscript-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manuscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: python -m pip install -e '.[dev,candidates]'

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-pictures texlive-fonts-recommended poppler-utils

      - name: Audit scoped structure and bounded claim surface
        run: python scripts/check_p3_manuscript_claim_surface.py

      - name: Verify tracked journal package checksums
        working-directory: papers/orion-13-global-knowledge-portrait
        run: sha256sum -c journal_package/SHA256SUMS

      - name: Compile both current Brief Report routes
        working-directory: papers/orion-13-global-knowledge-portrait/manuscript/brief-report-final
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error arxiv.tex
          for route in main arxiv; do
            test -s "${route}.pdf"
            if grep -E 'LaTeX Warning: (Citation|Reference).*(undefined)|There were undefined references|undefined citations|multiply defined' "${route}.log"; then
              echo "Unresolved or duplicate LaTeX reference/citation in ${route}.tex." >&2
              exit 1
            fi
            test "$(pdfinfo "${route}.pdf" | awk '/^Pages:/ {print $2}')" = 7
            pdftotext "${route}.pdf" "/tmp/p3-${route}.txt"
            test -s "/tmp/p3-${route}.txt"
            pdfinfo "${route}.pdf" > "/tmp/p3-${route}-pdfinfo.txt"
          done

      - name: Verify historical package boundary and current final package
        run: |
          set -euo pipefail
          python scripts/write_render_closure_state.py --check --paper orion-13-global-knowledge-portrait
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("papers/orion-13-global-knowledge-portrait")
          manifest = json.loads((root / "journal_package/MANIFEST.json").read_text())
          render = json.loads((root / "journal_package/RENDER_CLOSURE_STATE.json").read_text())
          assert ("package_status", "SUPERSEDED") in manifest.items()
          assert ("current_submission_authorized", False) in manifest.get("package_authority", {}).items()
          assert ("binding_status", "HISTORICAL_SUPERSEDED") in manifest.get("render_binding", {}).items()
          assert ("current_revision_binding", False) in manifest.get("render_binding", {}).items()
          assert ("state", "SUPERSEDED") in render.items()
          print("P3_HISTORICAL_PACKAGE_SUPERSEDED_CURRENT_BUILD_INSPECTED")
          PY
          python scripts/check_p3_current_package.py

      - name: Verify publication scoreboard
        run: |
          set -euo pipefail
          python research/publication/scoreboard.py --check
          pytest -q tests/test_publication_status.py

      - name: Archive audit and rebuilt PDF
        uses: actions/upload-artifact@v4
        with:
          name: p3-manuscript-audit-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/p3-main-pdfinfo.txt
            /tmp/p3-arxiv-pdfinfo.txt
            papers/orion-13-global-knowledge-portrait/manuscript/brief-report-final/main.pdf
            papers/orion-13-global-knowledge-portrait/manuscript/brief-report-final/main.log
            papers/orion-13-global-knowledge-portrait/manuscript/brief-report-final/arxiv.pdf
            papers/orion-13-global-knowledge-portrait/manuscript/brief-report-final/arxiv.log
