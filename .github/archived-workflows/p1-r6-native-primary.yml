name: p1-r6-native-primary

on:
  pull_request:
    paths:
      - 'research/claim_expansion/p1/gpt_r6_native_adapter.py'
      - 'research/claim_expansion/p1/gpt_r6_native_primary.py'
      - 'research/claim_expansion/p1/gpt_r6_native_primary_schema_fix.py'
      - 'research/claim_expansion/p1/gpt_r6_primary_authority_gate.py'
      - 'packages/orion-research-harness/**'
      - 'src/orion/**'
      - '.github/workflows/p1-r6-native-primary.yml'
  workflow_dispatch:

concurrency:
  group: p1-r6-native-primary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  engineering-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical ORION and merged harness
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Compile frozen R6 adapter and evaluator
        run: |
          python -m py_compile \
            research/claim_expansion/p1/gpt_r6_native_adapter.py \
            research/claim_expansion/p1/gpt_r6_native_primary.py \
            research/claim_expansion/p1/gpt_r6_native_primary_schema_fix.py \
            research/claim_expansion/p1/gpt_r6_primary_authority_gate.py
      - name: Prove digest-schema repair is fail-closed
        run: python research/claim_expansion/p1/gpt_r6_native_primary_schema_fix.py --self-test
      - name: Re-run merged harness conformance suite
        run: pytest -q packages/orion-research-harness/tests
      - name: Recover immutable pre-outcome 2020 source encoding
        run: |
          git fetch origin ab5a1d4937c884a975c90f90fc619964cd740582
          git worktree add --detach /tmp/p1-r5-frozen ab5a1d4937c884a975c90f90fc619964cd740582
          test "$(git -C /tmp/p1-r5-frozen rev-parse HEAD)" = "ab5a1d4937c884a975c90f90fc619964cd740582"
      - name: Execute all 48 native harness episodes and frozen evaluator
        run: |
          python research/claim_expansion/p1/gpt_r6_native_primary_schema_fix.py \
            --builder /tmp/p1-r5-frozen/research/claim_expansion/p1/gpt_r5/build_fixed_corpus.py \
            --fixed /tmp/p1-r5-frozen/research/claim_expansion/p1/gpt_r5/FIXED_SOURCE_SET_V1.json \
            --out /tmp/p1-r6-primary.raw.json
          python research/claim_expansion/p1/gpt_r6_primary_authority_gate.py \
            /tmp/p1-r6-primary.raw.json \
            --out /tmp/p1-r6-primary.json
      - name: Enforce engineering acceptance independently of scientific outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/p1-r6-primary.json').read_text())
          print('P1_R6_DATA=' + json.dumps(result.get('data', {}), sort_keys=True))
          print('P1_R6_NATIVE_INVALID_ROWS=' + str(result.get('native_invalid_rows')))
          print('P1_R6_LEAKAGE_ROWS=' + str(result.get('candidate_metadata_leakage_rows')))
          assert result['data']['complete'], result['data']
          assert result['policy_outcomes_generated'] is True
          assert result['n_episodes'] == 48
          assert result['native_invalid_rows'] == 0
          assert result['candidate_metadata_leakage_rows'] == 0
          rows = [m for p in result['pair_rows'] for m in p['outcomes'].values()]
          rows += [r['outcome'] for r in result['unresolved_rows']]
          assert len(rows) == 48
          assert all(r['native_row_valid'] and r['leakage_free'] for r in rows)
          assert result['authority_gate']['promotion_authorized'] is False
          assert result['authority_gate']['merge_authorized'] is False
          print('P1_R6_HARNESS_ENGINEERING=PASS')
          print('P1_R6_SCIENTIFIC_TERMINAL=' + result['terminal'])
          print('P1_R6_SCIENTIFIC_CHECKS=' + json.dumps(result['checks'], sort_keys=True))
          PY
      - name: Preserve exact acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-r6-native-primary
          path: /tmp/p1-r6-primary.json
          if-no-files-found: warn
