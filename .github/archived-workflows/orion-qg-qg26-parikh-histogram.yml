name: orion-qg-qg26-parikh-histogram
on:
  pull_request:
    paths:
      - 'development/orion-qg-regime-geometry/QG26_*'
      - 'development/orion-qg-regime-geometry/qg26_*'
      - 'development/orion-qg-regime-geometry/run_qg26_dual_harness.py'
      - 'research/extensions/orion-qg/qg26_*'
      - '.github/workflows/orion-qg-qg26-parikh-histogram.yml'
  workflow_dispatch:
concurrency:
  group: orion-qg-qg26-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  histogram-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,candidates]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Execute dual harness
        run: |
          set -o pipefail
          mkdir -p artifacts
          python development/orion-qg-regime-geometry/run_qg26_dual_harness.py | tee artifacts/orion-qg-qg26-summary.json
      - name: Deterministic analyzer replay
        run: |
          python research/extensions/orion-qg/qg26_parikh_histogram.py --output artifacts/orion-qg-qg26-replay.json > artifacts/orion-qg-qg26-replay.log
          cmp artifacts/orion-qg-qg26-parikh-histogram.json artifacts/orion-qg-qg26-replay.json
      - name: Enforce guarded-tropical authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/orion-qg-qg26-parikh-histogram.json').read_text())
          g=json.loads(Path('artifacts/orion-qg-qg26-generic-verification.json').read_text())
          n=json.loads(Path('artifacts/orion-qg-qg26-native-verification.json').read_text())
          d=json.loads(Path('artifacts/orion-qg-qg26-dual-harness.json').read_text())
          pos='QG26_TARE_EXACT_COST_IS_FINITE_GUARDED_TROPICAL_FUNCTION_OF_4096_COLUMN_COUNTS_ALL_N'
          assert a['terminal']==pos
          assert a['column_alphabet']['histogram_dimension']==4096
          assert a['one_active_decomposition_control']['rows']==1572864 and a['one_active_decomposition_control']['all_match'] is True
          assert a['structural_cost_control']['rows']==131072 and a['structural_cost_control']['all_match'] is True
          assert a['placement_realization_controls']['rows']==768 and a['placement_realization_controls']['all_equal'] is True
          assert a['template_finiteness']['active_labeled_choice_base']==67104768 and a['template_finiteness']['finite'] is True
          assert g['decision']=='ACCEPT_PARIKH_GUARDED_TROPICAL_GEOMETRY' and g['all_checks'] is True
          assert n['decision']=='ACCEPT_PARIKH_GUARDED_TROPICAL_GEOMETRY' and n['all_checks'] is True
          assert n['responsibility']=='HISTOGRAM_SUFFICIENT__FINITE_GUARDED_TROPICAL_TEMPLATE_GEOMETRY'
          assert d['terminal']==pos and d['both_accept'] is True
          for x in (a,g,n,d):
            assert x['HISTOGRAM_SUFFICIENT_STATISTIC_ALL_N'] is True
            assert x['FINITE_GUARDED_TROPICAL_TEMPLATE_REPRESENTATION'] is True
            assert x['COUNT_SPACE_REGIME_GEOMETRY_EXISTS'] is True
            assert x['EXPLICIT_TEMPLATE_BASIS_ENUMERATED'] is False
            assert x['PRACTICAL_STATIC_FORECASTER'] is False
            assert x['CLOSED_FORM_BDOUBLEPRIME_COMPLETENESS'] is False
            assert x['CHAIN_ALL_N'] is False
            assert x['GLOBAL_FINITE_INSTANCE_PHASE_BOUNDARY_IN_OBJECTIVE_SPACE'] is False
            assert x['novelty_authority'] is False and x['r6_authority'] is False and x['physical_quantum_advantage_claim'] is False
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-qg-qg26-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/orion-qg-qg26-*.json
            artifacts/orion-qg-qg26-*.log
            .orion-qg-qg26-generic/.orion-harness/**
            .orion-qg-qg26-native/.orion-harness/**
          include-hidden-files: true
          if-no-files-found: warn
