name: orion-qg-qg24-tropical-wfa
on:
  pull_request:
    paths:
      - 'development/orion-qg-regime-geometry/QG24_*'
      - 'development/orion-qg-regime-geometry/qg24_*'
      - 'development/orion-qg-regime-geometry/run_qg24_dual_harness.py'
      - 'research/extensions/orion-qg/qg24_*'
      - '.github/workflows/orion-qg-qg24-tropical-wfa.yml'
  workflow_dispatch:
concurrency:
  group: orion-qg-qg24-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-wfa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,candidates]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Execute dual harness
        run: |
          set -o pipefail
          mkdir -p artifacts
          python development/orion-qg-regime-geometry/run_qg24_dual_harness.py | tee artifacts/orion-qg-qg24-summary.json
      - name: Deterministic analyzer replay
        run: |
          python research/extensions/orion-qg/qg24_tropical_wfa.py --output artifacts/orion-qg-qg24-replay.json > artifacts/orion-qg-qg24-replay.log
          cmp artifacts/orion-qg-qg24-tropical-wfa.json artifacts/orion-qg-qg24-replay.json
      - name: Enforce exact-compiler authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/orion-qg-qg24-tropical-wfa.json').read_text())
          g=json.loads(Path('artifacts/orion-qg-qg24-generic-verification.json').read_text())
          n=json.loads(Path('artifacts/orion-qg-qg24-native-verification.json').read_text())
          d=json.loads(Path('artifacts/orion-qg-qg24-dual-harness.json').read_text())
          pos='QG24_TARE_UNRESTRICTED_EXACT_OPTIMUM_RECOGNIZED_BY_FINITE_TROPICAL_AUTOMATON_ALL_N'
          assert a['terminal']==pos
          assert a['state_contract']['input_alphabet_size']==4096
          assert a['state_contract']['global_control_sectors']==64
          assert a['state_contract']['raw_states_per_sector']==2612736
          assert a['state_contract']['parity_bits_total']==9
          assert a['n1_auxiliary_inventory']['count']==48
          assert a['n1_calibration']['valid_target_words']==729
          assert a['n1_calibration']['all_formula_rows_match'] is True
          assert a['n1_calibration']['all_minima_match'] is True
          assert g['decision']=='ACCEPT_FINITE_TROPICAL_EXACT_COMPILER' and g['all_checks'] is True
          assert n['decision']=='ACCEPT_FINITE_TROPICAL_EXACT_COMPILER' and n['all_checks'] is True
          assert n['responsibility']=='FINITE_STATE_EXACT_COMPILER__UNRESTRICTED_DP_EQUALITY_ALL_N'
          assert d['terminal']==pos and d['both_accept'] is True
          for x in (a,g,n,d):
            assert x['FINITE_STATE_EXACT_COMPILER'] is True
            assert x['UNRESTRICTED_DP_EQUALITY_ALL_N'] is True
            assert x['AUTOMATON_MINIMALITY'] is False
            assert x['CLOSED_FORM_BDOUBLEPRIME_COMPLETENESS'] is False
            assert x['CHAIN_ALL_N'] is False
            assert x['ASYMPTOTIC_PHASE_BOUNDARY'] is False
            assert x['GLOBAL_FINITE_INSTANCE_PHASE_BOUNDARY'] is False
            assert x['novelty_authority'] is False and x['r6_authority'] is False and x['physical_quantum_advantage_claim'] is False
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-qg-qg24-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/orion-qg-qg24-*.json
            artifacts/orion-qg-qg24-*.log
            .orion-qg-qg24-generic/.orion-harness/**
            .orion-qg-qg24-native/.orion-harness/**
          include-hidden-files: true
          if-no-files-found: warn
