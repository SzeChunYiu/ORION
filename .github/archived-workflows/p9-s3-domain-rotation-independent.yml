name: p9-s3-domain-rotation-independent
on:
  pull_request:
    paths:
      - 'research/extensions/p9-structured-neural/verification/verify_s3_domain_rotations_independent.py'
      - '.github/workflows/p9-s3-domain-rotation-independent.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,candidates]'
      - run: python research/extensions/p9-structured-neural/verification/verify_s3_domain_rotations_independent.py
