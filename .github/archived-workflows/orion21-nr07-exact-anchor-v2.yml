name: orion21-nr07-exact-anchor-v2

on:
  pull_request:
    paths:
      - 'papers/orion-21-state-as-computation/experiments/nr07-exact-anchor-v2/**'
      - '.github/workflows/orion21-nr07-exact-anchor-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-anchor-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependency
        run: python -m pip install 'numpy==2.5.2'
      - name: Ensure historical source commit is present
        run: |
          git cat-file -e 86202ab577b6c3efb331fc3a2f9185911911fe98^{commit} ||
            git fetch --no-tags origin 86202ab577b6c3efb331fc3a2f9185911911fe98
      - name: Generate twice and require byte identity
        run: |
          LANE=papers/orion-21-state-as-computation/experiments/nr07-exact-anchor-v2
          python "$LANE/run_exact_anchor_v2.py" --output-dir /tmp/result-a
          python "$LANE/run_exact_anchor_v2.py" --output-dir /tmp/result-b
          diff -ru /tmp/result-a /tmp/result-b
          cmp /tmp/result-a/RESULT.json "$LANE/RESULT.json"
          diff -ru /tmp/result-a/transcript "$LANE/transcript"
      - name: Run structurally independent transcript checker
        run: |
          LANE=papers/orion-21-state-as-computation/experiments/nr07-exact-anchor-v2
          python "$LANE/independent_checker/check_exact_anchor_v2.py" \
            /tmp/result-a/RESULT.json | tee /tmp/independent-check.json
      - name: Upload exact replay artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orion21-nr07-exact-anchor-v2
          path: |
            /tmp/result-a
            /tmp/independent-check.json
