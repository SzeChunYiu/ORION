name: p14e-specification-separated-superiority-v1

on:
  pull_request:
    paths:
      - 'papers/orion-24-orion-rse/P14E_SPECIFICATION_SEPARATED_SUPERIORITY_PROTOCOL_V1.md'
      - 'papers/orion-24-orion-rse/P14E_ADJUDICATION_RULES_V1.json'
      - 'papers/orion-24-orion-rse/run_p14e_specification_separated_superiority_v1.py'
      - '.github/workflows/p14e-specification-separated-superiority-v1.yml'
  push:
    branches: [main]
    paths:
      - 'papers/orion-24-orion-rse/P14E_SPECIFICATION_SEPARATED_SUPERIORITY_PROTOCOL_V1.md'
      - 'papers/orion-24-orion-rse/P14E_ADJUDICATION_RULES_V1.json'
      - 'papers/orion-24-orion-rse/run_p14e_specification_separated_superiority_v1.py'
      - '.github/workflows/p14e-specification-separated-superiority-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Execute specification-separated superiority benchmark (two-subprocess replay)
        run: |
          set -euo pipefail
          python papers/orion-24-orion-rse/run_p14e_specification_separated_superiority_v1.py \
            --out papers/orion-24-orion-rse/p14e_superiority_result_ci.json \
            > p14e_ci_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('papers/orion-24-orion-rse/p14e_superiority_result_ci.json').read_text())
          assert p['terminal'] == 'P14E_SPECIFICATION_SEPARATED_SUPERIORITY_SUPPORTED', p['terminal']
          assert all(p['gates'].values()), {k: v for k, v in p['gates'].items() if not v}
          assert p['core']['design']['total_cases'] == 6720
          assert p['core']['summary']['ORION_RSE_FULL']['false_promotion_rate'] == 0.0
          assert p['core']['summary']['ORION_RSE_FULL']['disposition_accuracy'] == 1.0
          assert p['strongest_non_orion_baseline'] == 'MULTI_REVIEW'
          assert p['core']['generation_audit']['remint_violations'] == 0
          assert p['core']['generation_audit']['gold_leak_checks'] == 6720
          print(json.dumps({'terminal': p['terminal'], 'gates': p['gates']}, sort_keys=True))
          PY
      - name: Upload superiority result receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p14e-specification-separated-superiority-v1
          path: papers/orion-24-orion-rse/p14e_superiority_result_ci.json
