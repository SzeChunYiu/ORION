name: p1-necessity-execution-binding-amendment-validate

on:
  pull_request:
    branches:
      - main
      - shadow/p1-necessity-execution-freeze-20260817
    paths:
      - '.github/workflows/p1-necessity-execution-binding-amendment-validate.yml'
      - '.github/workflows/p1-necessity-execution-binding-amendment.yml'
      - 'research/revival/p1/confirmatory/v2.2/PRIMARY_*_FREEZE*.json'
      - 'research/revival/p1/confirmatory/v2.2/EXECUTION_BINDING_AMENDMENT*.json'
      - 'research/revival/p1/freeze_mutation_necessity_*.py'
      - 'research/revival/p1/validate_mutation_necessity_amendment_chain.py'
      - 'src/orion/study/p1_causal/absorbed_mechanics.py'
      - 'src/orion/study/p1_causal/necessity_*.py'

permissions:
  contents: read

jobs:
  validate-amendment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Validate the complete pre-outcome amendment chain
        run: |
          rm -rf /tmp/p1-worlds /tmp/p1-amendment
          mkdir -p /tmp/p1-amendment
          python research/revival/p1/freeze_mutation_necessity_worlds.py --outdir /tmp/p1-worlds
          python research/revival/p1/validate_mutation_necessity_amendment_chain.py \
            --repo-root . \
            --fresh-world-freeze /tmp/p1-worlds/WORLD_FREEZE.json \
            --out /tmp/p1-amendment/AMENDMENT_CHAIN_VALIDATION.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-v2-2-4-execution-binding-amendment-validated
          path: /tmp/p1-amendment/
          if-no-files-found: error
