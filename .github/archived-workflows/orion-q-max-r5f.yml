name: orion-q-max-r5f

on:
  pull_request:
    paths:
      - 'research/extensions/orion-q/**'
      - 'development/orion-q-max-r0/**'
      - '.github/workflows/orion-q-max-r5f.yml'

jobs:
  h4-controlled-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run frozen fresh H4 controlled-composition confirmation
        run: |
          cd research/extensions/orion-q
          python max_r5f_h4_controlled_confirmation.py | tee /tmp/r5f-h4.txt
          grep '^ORIONQ_MAX_R5F_H4_RESULT=' /tmp/r5f-h4.txt
      - name: Run independent H4 proof and exact-search replay
        run: |
          cd research/extensions/orion-q
          python max_r5g_h4_independent_replay.py | tee /tmp/r5g-h4.txt
          grep '^ORIONQ_MAX_R5G_H4_INDEPENDENT=' /tmp/r5g-h4.txt
      # The mixed-cardinality DEV leg is dropped from CI: measured 2026-09-03
      # it is compute-bound beyond any single job's budget (rc=124 at 9600s
      # against the 30-minute job timeout, then rc=124 again at exactly 28800s
      # on LUNARC job 3569846 with MaxRSS 1.92 GB and a zero-byte log). The
      # revival derives it from the SUBJECT chunked-fold checkpoints via
      # max_r5f_dev_derived.py (only b.global_frontier is swapped for a
      # checkpoint loader; b.main() itself runs untouched), gated by the H4
      # live-vs-derived parity check below. Its execution is certified by a
      # LUNARC job whose receipt is validated by
      # max_r5h_lunarc_receipt_validator.py (also run by
      # orion-q-max-r5h.yml for the N2 subject).
      - name: Derived DEV parity gate (H4 live vs checkpoint-derived)
        run: |
          cd research/extensions/orion-q
          python max_r5f_dev_derived.py parity-h4 /tmp/r5fdev-parity-ckpts | tee /tmp/r5fdev-parity.txt
          grep '^ORIONQ_R5F_DEV_DERIVED_PARITY=PASS' /tmp/r5fdev-parity.txt
      - name: Validate committed LUNARC DEV receipt
        run: |
          cd research/extensions/orion-q
          python max_r5h_lunarc_receipt_validator.py | tee /tmp/r5h-receipts.txt
          grep '^ORIONQ_MAX_R5H_RECEIPTS=' /tmp/r5h-receipts.txt
