name: p1-necessity-design

on:
  push:
    branches:
      - shadow/p1-necessity-certificate-freeze-20260817
    paths:
      - '.github/workflows/p1-necessity-design.yml'
      - 'research/revival/p1/protocol/P1.epistemic-mutation-necessity.v2.2*.json'
      - 'research/revival/p1/freeze_mutation_necessity_worlds.py'
      - 'src/orion/study/p1_causal/necessity_*.py'
      - 'tests/unit/study/p1_causal/test_p1_necessity_*.py'

permissions:
  contents: read

jobs:
  pre-outcome-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Prove confirmatory seed is not a test seed
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = list(Path('tests/unit/study/p1_causal').glob('test_p1_necessity_*.py'))
          text = '\n'.join(path.read_text() for path in paths)
          assert 'generate_necessity_worlds_v2(seed=202608172211' not in text
          assert 'seed=30303' in text
          print('development-only seed guard: PASS')
          PY
      - name: Run P1 necessity design falsifiers
        run: |
          pytest -q \
            tests/unit/study/p1_causal/test_p1_necessity_design.py \
            tests/unit/study/p1_causal/test_p1_necessity_freeze.py
