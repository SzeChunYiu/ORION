name: p1-u-r6-native-runtime

on:
  pull_request:
    paths:
      - 'development/p1-u-gpt-r6-native-runtime/**'
      - 'research/claim_expansion/p1/gpt_r6/**'
      - 'research/claim_expansion/p1/gpt_r5/FIXED_SOURCE_SET_V1.json'
      - 'research/claim_expansion/p1/gpt_r5/build_fixed_corpus.py'
      - 'tests/unit/p1/test_p1_u_r6_native_runtime.py'
      - 'tests/unit/p1/test_p1_u_r6_native_evaluator.py'
      - 'tests/unit/p1/test_p1_u_r6_primary_authority.py'
      - 'tests/unit/p1/test_p1_r6_2019_mechanism_authority_contract.py'
      - '.github/workflows/p1-u-r6-native-runtime.yml'
      - 'src/orion/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-u-r6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-runtime-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ORION and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify native ORION architecture, evaluator gates, and authority boundary
        run: >-
          pytest -q
          tests/unit/p1/test_p1_u_r6_native_runtime.py
          tests/unit/p1/test_p1_u_r6_native_evaluator.py
          tests/unit/p1/test_p1_u_r6_primary_authority.py
          tests/unit/p1/test_p1_r6_2019_mechanism_authority_contract.py

  native-primary-2020:
    needs: native-runtime-architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen evaluator runtime
        run: python -m pip install -e '.[dev]'
      - name: Bind exact protected scientific subject before outcome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p1-r6-primary
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root = Path('research/claim_expansion/p1/gpt_r6')
          protocol = json.loads((root / 'NATIVE_PROTOCOL_V1.json').read_text())
          assert protocol['campaign_issue'] == 723
          assert protocol['decision_rule']['episode_grs_margin'] == 0.10
          assert protocol['decision_rule']['pair_selective_margin'] == 0.10
          assert protocol['decision_rule']['class_macro_pair_margin'] == 0.10
          assert protocol['decision_rule']['bootstrap_replicates'] == 20000
          assert protocol['registry_mutation_before_primary_and_replication_pass'] is False
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          binding = {
              'head_sha': head,
              'protocol_sha256': hashlib.sha256((root / 'NATIVE_PROTOCOL_V1.json').read_bytes()).hexdigest(),
              'evaluator_sha256': hashlib.sha256((root / 'evaluate_native.py').read_bytes()).hexdigest(),
              'native_adapter_sha256': hashlib.sha256((root / 'native_orion.py').read_bytes()).hexdigest(),
              'native_core_sha256': hashlib.sha256((root / 'native_orion_core_v1.py').read_bytes()).hexdigest(),
              'outcome_seen': False,
              'promotion_authorized': False,
          }
          Path('/tmp/p1-r6-primary/PRE_OUTCOME_BINDING.json').write_text(json.dumps(binding, indent=2, sort_keys=True) + '\n')
          print('P1_R6_PRE_OUTCOME_BINDING=' + json.dumps(binding, sort_keys=True))
          PY
      - name: Run frozen native 2020 primary
        shell: bash
        run: |
          set -euo pipefail
          python research/claim_expansion/p1/gpt_r6/evaluate_native.py \
            --out /tmp/p1-r6-primary/RESULT_V1.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/p1-r6-primary/RESULT_V1.json').read_text())
          assert result['schema'] == 'P1U.NativeOrionResult.v1'
          assert result['data']['complete'] is True
          assert result['policy_outcomes_generated'] is True
          assert result['terminal'] in {
              'P1_R6_NATIVE_PRIMARY_PASS_PENDING_2019_REPLICATION',
              'P1_R6_NATIVE_PRIMARY_NOT_SUPPORTED',
          }
          print('P1_R6_NATIVE_PRIMARY_SCIENTIFIC_TERMINAL=' + result['terminal'])
          PY
      - name: Record post-outcome ablation diagnostics without minting authority
        shell: bash
        run: |
          set -euo pipefail
          python research/claim_expansion/p1/gpt_r6/primary_authority.py \
            --result /tmp/p1-r6-primary/RESULT_V1.json \
            --out /tmp/p1-r6-primary/AUTHORITY_V1.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/p1-r6-primary/RESULT_V1.json').read_text())
          authority = json.loads(Path('/tmp/p1-r6-primary/AUTHORITY_V1.json').read_text())
          assert authority['scientific_terminal_preserved'] == result['terminal']
          assert authority['authority_verifier_bound_before_scientific_outcome'] is False
          assert authority['grants_primary_mechanism_identification_authority'] is False
          assert authority['grants_issue_649_closure_authority'] is False
          assert authority['grants_replication_closure_authority'] is False
          assert authority['grants_registry_promotion_authority'] is False
          assert authority['grants_merge_authority'] is False
          if result['terminal'] == 'P1_R6_NATIVE_PRIMARY_PASS_PENDING_2019_REPLICATION':
              assert authority['authority_terminal'] == 'P1_R6_NATIVE_PRIMARY_CANNOT_CHECK_ABLATION_AUTHORITY_UNBOUND'
          else:
              assert authority['authority_terminal'] == 'P1_R6_NATIVE_PRIMARY_NOT_SUPPORTED'
          print('P1_R6_NATIVE_PRIMARY_AUTHORITY_TERMINAL=' + authority['authority_terminal'])
          PY
      - name: Upload protected primary evidence
        uses: actions/upload-artifact@v4
        with:
          name: p1-r6-native-primary-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/p1-r6-primary/**
          if-no-files-found: error
          retention-days: 30
