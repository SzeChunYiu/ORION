name: p5-phase2-live-execution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p5_phase2_live_execution.yml'
      - 'papers/orion-15-self-orion/phase2/LIVE_EXECUTION_TRIGGER.txt'

permissions:
  contents: read

jobs:
  live-phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ORION_PROTECTED_VERIFIER_URL: ${{ secrets.ORION_PROTECTED_VERIFIER_URL }}
      ORION_PROTECTED_VERIFIER_TOKEN: ${{ secrets.ORION_PROTECTED_VERIFIER_TOKEN }}
      ORION_PROTECTED_VERIFIER_ARTIFACT_HASH: ${{ secrets.ORION_PROTECTED_VERIFIER_ARTIFACT_HASH }}
      ORION_PHASE2_EVALUATION_EPOCH_ID: ${{ secrets.ORION_PHASE2_EVALUATION_EPOCH_ID }}
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
      ORION_PHASE2_REASONER_MODEL: ${{ vars.ORION_PHASE2_REASONER_MODEL || 'gpt-5.6' }}
      ORION_PHASE2_RESOURCE_BUDGET_UNITS: ${{ vars.ORION_PHASE2_RESOURCE_BUDGET_UNITS || '32' }}
      ORION_LLAMA_RUNTIME_RELEASE_TAG: b10218
      ORION_LLAMA_RUNTIME_COMMIT: de699957b92f490efebad149665b0dccf127eaff
      ORION_LLAMA_RUNTIME_ASSET_SHA256: 78ec7a1964710918030e85c132a0995b10b07e4f43001bdf54fe0fd48d1eb85b
      ORION_LLAMA_RUNTIME_URL: https://github.com/ggml-org/llama.cpp/releases/download/b10218/llama-b10218-bin-ubuntu-x64.tar.gz
      ORION_OPEN_WEIGHT_REASONER_REPO: bartowski/Qwen2.5-1.5B-Instruct-GGUF
      ORION_OPEN_WEIGHT_REASONER_REVISION: 02938d9fe88f34a3a9960128b5092f20940e7553
      ORION_OPEN_WEIGHT_REASONER_FILENAME: Qwen2.5-1.5B-Instruct-Q4_K_M.gguf
      ORION_OPEN_WEIGHT_REASONER_SHA256: 50961d9b7d3b89e46be230528fc66d38bbdda8ac3748323dd34f129a714124fc
      ORION_OPEN_WEIGHT_REASONER_FAMILY: qwen2.5
      ORION_OPEN_WEIGHT_EVALUATOR_REPO: bartowski/SmolLM2-1.7B-Instruct-GGUF
      ORION_OPEN_WEIGHT_EVALUATOR_REVISION: 0f0ce936387870522d587f83d01d404e9d726b33
      ORION_OPEN_WEIGHT_EVALUATOR_FILENAME: SmolLM2-1.7B-Instruct-Q4_K_M.gguf
      ORION_OPEN_WEIGHT_EVALUATOR_SHA256: 77665ea4815999596525c636fbeb56ba8b080b46ae85efef4f0d986a139834d7
      ORION_OPEN_WEIGHT_EVALUATOR_FAMILY: smollm2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact subject
        run: python -m pip install -e '.[dev]'

      - name: Select one provider lane
        id: provider-lane
        shell: bash
        run: |
          set -euo pipefail
          names=(OPENAI_API_KEY ORION_PROTECTED_VERIFIER_URL ORION_PROTECTED_VERIFIER_TOKEN ORION_PROTECTED_VERIFIER_ARTIFACT_HASH ORION_PHASE2_EVALUATION_EPOCH_ID)
          present=0
          missing=()
          for name in "${names[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              present=$((present + 1))
            else
              missing+=("$name")
            fi
          done
          if (( present == ${#names[@]} )); then
            echo 'provider_lane=private' >> "$GITHUB_OUTPUT"
            echo 'ORION_PHASE2_PROVIDER_LANE=private' >> "$GITHUB_ENV"
            echo 'Provider lane: fully configured private OpenAI + protected HTTPS verifier.'
          elif (( present == 0 )); then
            echo 'provider_lane=open-weight' >> "$GITHUB_OUTPUT"
            echo 'ORION_PHASE2_PROVIDER_LANE=open-weight' >> "$GITHUB_ENV"
            echo 'Provider lane: pinned open-weight llama.cpp reasoner + distinct protected evaluator model.'
          else
            printf 'Partial private provider configuration is forbidden. Missing names: %s\n' "${missing[*]}"
            exit 3
          fi
          echo 'No credential values are printed.'

      - name: Download and freeze open-weight runtime/models
        if: steps.provider-lane.outputs.provider_lane == 'open-weight'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p5-phase2-live"
          runtime="$RUNNER_TEMP/orion-llama-runtime"
          models="$RUNNER_TEMP/orion-open-weight-models"
          mkdir -p "$out" "$runtime" "$models"

          archive="$RUNNER_TEMP/llama-${ORION_LLAMA_RUNTIME_RELEASE_TAG}-ubuntu-x64.tar.gz"
          curl -L --fail --retry 3 --retry-all-errors --retry-delay 2 --silent --show-error \
            "$ORION_LLAMA_RUNTIME_URL" -o "$archive"
          echo "$ORION_LLAMA_RUNTIME_ASSET_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$runtime"
          mapfile -t cli_candidates < <(find "$runtime" -type f -name llama-cli -perm -u+x | sort)
          if (( ${#cli_candidates[@]} != 1 )); then
            printf 'Expected exactly one executable llama-cli, found %s\n' "${#cli_candidates[@]}"
            exit 3
          fi
          llama_cli="${cli_candidates[0]}"
          llama_cli_sha=$(sha256sum "$llama_cli" | awk '{print $1}')

          reasoner="$models/$ORION_OPEN_WEIGHT_REASONER_FILENAME"
          reasoner_url="https://huggingface.co/$ORION_OPEN_WEIGHT_REASONER_REPO/resolve/$ORION_OPEN_WEIGHT_REASONER_REVISION/$ORION_OPEN_WEIGHT_REASONER_FILENAME?download=true"
          curl -L --fail --retry 3 --retry-all-errors --retry-delay 2 --silent --show-error \
            "$reasoner_url" -o "$reasoner"
          echo "$ORION_OPEN_WEIGHT_REASONER_SHA256  $reasoner" | sha256sum -c -

          evaluator="$models/$ORION_OPEN_WEIGHT_EVALUATOR_FILENAME"
          evaluator_url="https://huggingface.co/$ORION_OPEN_WEIGHT_EVALUATOR_REPO/resolve/$ORION_OPEN_WEIGHT_EVALUATOR_REVISION/$ORION_OPEN_WEIGHT_EVALUATOR_FILENAME?download=true"
          curl -L --fail --retry 3 --retry-all-errors --retry-delay 2 --silent --show-error \
            "$evaluator_url" -o "$evaluator"
          echo "$ORION_OPEN_WEIGHT_EVALUATOR_SHA256  $evaluator" | sha256sum -c -

          {
            echo "ORION_LLAMA_CLI_PATH=$llama_cli"
            echo "ORION_LLAMA_CLI_SHA256=$llama_cli_sha"
            echo "ORION_OPEN_WEIGHT_REASONER_PATH=$reasoner"
            echo "ORION_OPEN_WEIGHT_EVALUATOR_PATH=$evaluator"
          } >> "$GITHUB_ENV"

          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          out = Path(os.environ['RUNNER_TEMP']) / 'p5-phase2-live'
          summary = {
              'schema': 'P5OpenWeightRuntimeFreeze.v1',
              'study_data_used': False,
              'runtime': {
                  'release_tag': os.environ['ORION_LLAMA_RUNTIME_RELEASE_TAG'],
                  'commit': os.environ['ORION_LLAMA_RUNTIME_COMMIT'],
                  'asset_sha256': os.environ['ORION_LLAMA_RUNTIME_ASSET_SHA256'],
                  'binary_sha256': os.environ['ORION_LLAMA_CLI_SHA256'],
              },
              'reasoner': {
                  'repo_id': os.environ['ORION_OPEN_WEIGHT_REASONER_REPO'],
                  'revision': os.environ['ORION_OPEN_WEIGHT_REASONER_REVISION'],
                  'filename': os.environ['ORION_OPEN_WEIGHT_REASONER_FILENAME'],
                  'sha256': os.environ['ORION_OPEN_WEIGHT_REASONER_SHA256'],
                  'family': os.environ['ORION_OPEN_WEIGHT_REASONER_FAMILY'],
                  'size_bytes': Path(os.environ['ORION_OPEN_WEIGHT_REASONER_PATH']).stat().st_size,
              },
              'evaluator': {
                  'repo_id': os.environ['ORION_OPEN_WEIGHT_EVALUATOR_REPO'],
                  'revision': os.environ['ORION_OPEN_WEIGHT_EVALUATOR_REVISION'],
                  'filename': os.environ['ORION_OPEN_WEIGHT_EVALUATOR_FILENAME'],
                  'sha256': os.environ['ORION_OPEN_WEIGHT_EVALUATOR_SHA256'],
                  'family': os.environ['ORION_OPEN_WEIGHT_EVALUATOR_FAMILY'],
                  'size_bytes': Path(os.environ['ORION_OPEN_WEIGHT_EVALUATOR_PATH']).stat().st_size,
              },
          }
          encoded = json.dumps(summary, indent=2, sort_keys=True) + '\n'
          (out / 'OPEN_WEIGHT_RUNTIME_SAFE_SUMMARY.json').write_text(encoded, encoding='utf-8')
          digest = hashlib.sha256(
              json.dumps(summary, sort_keys=True, separators=(',', ':')).encode('utf-8')
          ).hexdigest()
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              handle.write(f'ORION_OPEN_WEIGHT_FREEZE_HASH={digest}\n')
          print('P5_OPEN_WEIGHT_FREEZE_SAFE_SUMMARY_BEGIN')
          print(encoded.rstrip())
          print('P5_OPEN_WEIGHT_FREEZE_SAFE_SUMMARY_END')
          PY

      - name: Freeze bindings and execute matched wide/deep trial
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p5-phase2-live"
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          from orion.providers.live_phase2 import (
              build_phase2_live_provider_stack_from_env,
              write_live_phase2_provider_manifest,
          )
          from orion.providers.open_weight_phase2 import build_phase2_open_weight_provider_stack
          from orion.self_orion.baseline import baseline_bundle_to_dict, write_baseline_bundle
          from orion.self_orion.live_campaign_factory import build_live_phase2_trial_harness
          from orion.self_orion.phase2_io import load_phase2_binding, write_phase2_binding
          from orion.self_orion.phase2_preflight import (
              Phase2ClosurePreflight,
              Phase2PreflightStatus,
              assess_phase2_preflight,
              build_frozen_live_trial_packet,
          )
          from orion.self_orion.subject_binding import (
              attest_repository_subject,
              write_repository_subject_attestation,
          )
          from orion.self_orion.trial_io import (
              load_shadow_live_trial_report,
              write_shadow_live_trial_report,
          )

          out = Path(os.environ['RUNNER_TEMP']) / 'p5-phase2-live'
          budget = float(os.environ['ORION_PHASE2_RESOURCE_BUDGET_UNITS'])
          if budget <= 0:
              raise RuntimeError('ORION_PHASE2_RESOURCE_BUDGET_UNITS must be positive')

          subject = attest_repository_subject('.', repository_identity='github.com/SzeChunYiu/ORION')
          write_repository_subject_attestation(subject, out / 'SUBJECT_ATTESTATION.json')

          provider_lane = os.environ['ORION_PHASE2_PROVIDER_LANE']
          if provider_lane == 'private':
              stack = build_phase2_live_provider_stack_from_env(
                  reasoner_model=os.environ['ORION_PHASE2_REASONER_MODEL'].strip()
              )
              provider_mode = 'private-openai-protected-http'
              external_freeze_hash = ''
          elif provider_lane == 'open-weight':
              epoch = (
                  f"github-actions-{os.environ.get('GITHUB_RUN_ID', 'unknown')}"
                  f"-attempt-{os.environ.get('GITHUB_RUN_ATTEMPT', '1')}-open-weight"
              )
              stack = build_phase2_open_weight_provider_stack(
                  llama_cli_path=os.environ['ORION_LLAMA_CLI_PATH'],
                  llama_cli_sha256=os.environ['ORION_LLAMA_CLI_SHA256'],
                  llama_runtime_release_tag=os.environ['ORION_LLAMA_RUNTIME_RELEASE_TAG'],
                  llama_runtime_commit=os.environ['ORION_LLAMA_RUNTIME_COMMIT'],
                  llama_runtime_asset_sha256=os.environ['ORION_LLAMA_RUNTIME_ASSET_SHA256'],
                  reasoner_model_path=os.environ['ORION_OPEN_WEIGHT_REASONER_PATH'],
                  reasoner_model_sha256=os.environ['ORION_OPEN_WEIGHT_REASONER_SHA256'],
                  reasoner_model_repo_id=os.environ['ORION_OPEN_WEIGHT_REASONER_REPO'],
                  reasoner_model_revision=os.environ['ORION_OPEN_WEIGHT_REASONER_REVISION'],
                  reasoner_model_filename=os.environ['ORION_OPEN_WEIGHT_REASONER_FILENAME'],
                  reasoner_model_family=os.environ['ORION_OPEN_WEIGHT_REASONER_FAMILY'],
                  evaluator_model_path=os.environ['ORION_OPEN_WEIGHT_EVALUATOR_PATH'],
                  evaluator_model_sha256=os.environ['ORION_OPEN_WEIGHT_EVALUATOR_SHA256'],
                  evaluator_model_repo_id=os.environ['ORION_OPEN_WEIGHT_EVALUATOR_REPO'],
                  evaluator_model_revision=os.environ['ORION_OPEN_WEIGHT_EVALUATOR_REVISION'],
                  evaluator_model_filename=os.environ['ORION_OPEN_WEIGHT_EVALUATOR_FILENAME'],
                  evaluator_model_family=os.environ['ORION_OPEN_WEIGHT_EVALUATOR_FAMILY'],
                  evaluation_epoch_id=epoch,
                  crossref_mailto=os.environ.get('CROSSREF_MAILTO', ''),
              )
              provider_mode = 'github-hosted-open-weight-llama-cpp'
              external_freeze_hash = os.environ['ORION_OPEN_WEIGHT_FREEZE_HASH']
          else:
              raise RuntimeError(f'unknown provider lane: {provider_lane!r}')

          write_live_phase2_provider_manifest(stack, out / 'PROVIDER_MANIFEST.json')
          reasoner_identity = dict(stack.manifest.reasoner_provider)
          verifier_identity = dict(stack.manifest.verification_provider)

          preflight = Phase2ClosurePreflight(
              protocol_id='phase2-shadow-closure-v1',
              subject_revision_hash=subject.subject_revision_hash,
              provider_manifest_hash=stack.provider_manifest_hash,
              evaluator_artifact_hash=stack.evaluator_artifact_hash,
              evaluation_epoch_id=stack.evaluation_epoch_id,
              baseline_id='simple-llm-retrieval-baseline-v1',
              resource_budget_units=budget,
          )
          binding_path = out / 'PHASE2_CLOSURE_BINDING.json'
          write_phase2_binding(preflight, binding_path)
          loaded_binding = load_phase2_binding(binding_path)
          if loaded_binding != preflight:
              raise RuntimeError('serialized Phase-2 closure binding does not replay to the frozen preflight')

          preflight_report = assess_phase2_preflight(preflight)
          preflight_payload = {
              'status': preflight_report.status.value,
              'blockers': list(preflight_report.blockers),
              'frozen_task_ids': list(preflight_report.frozen_task_ids),
              'attack_ids': list(preflight_report.attack_ids),
              'subject_revision_hash': subject.subject_revision_hash,
              'subject_commit_oid': subject.commit_oid,
              'provider_mode': provider_mode,
              'provider_manifest_hash': stack.provider_manifest_hash,
              'reasoner_identity': reasoner_identity,
              'verifier_identity': verifier_identity,
              'external_freeze_hash': external_freeze_hash,
              'evaluator_artifact_hash': stack.evaluator_artifact_hash,
              'evaluation_epoch_id': stack.evaluation_epoch_id,
              'protocol_id': preflight.protocol_id,
              'baseline_id': preflight.baseline_id,
              'resource_budget_units': budget,
              'outcome_accessed': False,
          }
          (out / 'PREFLIGHT_SAFE_SUMMARY.json').write_text(
              json.dumps(preflight_payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          if preflight_report.status is not Phase2PreflightStatus.READY_TO_EXECUTE_SHADOW_TRIAL:
              raise RuntimeError('Phase-2 preflight did not reach READY_TO_EXECUTE_SHADOW_TRIAL: ' + ','.join(preflight_report.blockers))

          packet = build_frozen_live_trial_packet(preflight)
          (out / 'FROZEN_PACKET_SAFE_SUMMARY.json').write_text(
              json.dumps({
                  'packet_id': packet.packet_id,
                  'packet_fingerprint': packet.fingerprint,
                  'evaluation_epoch_id': packet.evaluation_epoch_id,
                  'task_ids': [task.task_id for task in packet.tasks],
                  'provider_manifest_hash': packet.provider_manifest_hash,
                  'evaluator_artifact_hash': packet.evaluator_artifact_hash,
                  'baseline_id': packet.baseline_id,
                  'resource_budget_units': packet.resource_budget_units,
                  'max_orion_to_baseline_resource_ratio': packet.max_orion_to_baseline_resource_ratio,
              }, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          harness = build_live_phase2_trial_harness(stack)
          if harness.provider_manifest_hash != packet.provider_manifest_hash:
              raise RuntimeError('provider manifest changed between freeze and execution')
          if harness.evaluator_artifact_hash != packet.evaluator_artifact_hash:
              raise RuntimeError('evaluator artifact changed between freeze and execution')
          if harness.evaluation_epoch_id != packet.evaluation_epoch_id:
              raise RuntimeError('evaluation epoch changed between freeze and execution')

          report = harness.runner.run(packet)
          write_shadow_live_trial_report(report, out / 'LIVE_TRIAL_REPORT.json')
          write_baseline_bundle(harness.baseline, out / 'BASELINE_BUNDLE.json')
          loaded = load_shadow_live_trial_report(out / 'LIVE_TRIAL_REPORT.json')
          baseline_payload = baseline_bundle_to_dict(harness.baseline)

          blockers: list[str] = []
          if not loaded.raw_search_trace_retained:
              blockers.append('raw_search_trace_not_retained_for_every_task')
          if not loaded.all_resource_matched:
              blockers.append('live_trial_resources_not_matched')
          if not loaded.all_failures_recordable:
              blockers.append('live_trial_failure_history_incomplete')
          if loaded.wide_task_count < 1 or loaded.deep_task_count < 1:
              blockers.append('wide_and_deep_live_trials_required')
          if loaded.grants_self_promotion:
              blockers.append('live_trial_exposed_self_promotion')
          if len(baseline_payload['artifacts']) != len(packet.tasks):
              blockers.append('matched_baseline_task_coverage_incomplete')

          safe = {
              'issue_8_gate': 'PASS' if not blockers else 'FAIL',
              'blockers': blockers,
              'subject_revision_hash': subject.subject_revision_hash,
              'subject_commit_oid': subject.commit_oid,
              'provider_mode': provider_mode,
              'provider_manifest_hash': stack.provider_manifest_hash,
              'reasoner_identity': reasoner_identity,
              'verifier_identity': verifier_identity,
              'external_freeze_hash': external_freeze_hash,
              'evaluator_artifact_hash': stack.evaluator_artifact_hash,
              'evaluation_epoch_id': stack.evaluation_epoch_id,
              'protocol_id': preflight.protocol_id,
              'baseline_id': preflight.baseline_id,
              'packet_fingerprint': packet.fingerprint,
              'live_trial_evidence_artifact_hash': loaded.evidence_artifact_hash,
              'live_trial_document_hash': loaded.document_hash,
              'baseline_bundle_hash': baseline_payload['bundle_hash'],
              'raw_search_trace_retained': loaded.raw_search_trace_retained,
              'all_resource_matched': loaded.all_resource_matched,
              'all_failures_recordable': loaded.all_failures_recordable,
              'wide_task_count': loaded.wide_task_count,
              'deep_task_count': loaded.deep_task_count,
              'comparison_statuses': [status.value for status in loaded.comparison_statuses],
              'grants_self_promotion': loaded.grants_self_promotion,
          }
          (out / 'LIVE_TRIAL_SAFE_SUMMARY.json').write_text(
              json.dumps(safe, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print('P5_PHASE2_SAFE_SUMMARY_BEGIN')
          print(json.dumps(safe, indent=2, sort_keys=True))
          print('P5_PHASE2_SAFE_SUMMARY_END')
          if blockers:
              raise SystemExit(4)
          PY

      - name: Upload Phase-2 evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-phase2-live-${{ github.run_id }}
          path: ${{ runner.temp }}/p5-phase2-live
          if-no-files-found: warn
          retention-days: 90
