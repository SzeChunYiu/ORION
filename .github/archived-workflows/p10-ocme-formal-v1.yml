name: p10-ocme-formal-v1

on:
  pull_request:
    paths:
      - 'papers/orion-20-structured-problem-solving/top_tier/**'
      - '.github/workflows/p10-ocme-formal-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ocme-formal-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute exact OCME non-vacuity checker
        run: python papers/orion-20-structured-problem-solving/top_tier/check_ocme_formal_nonvacuity_v1.py | tee p10_ocme_formal_v1.json
      - name: Verify deterministic primary replay
        run: |
          python papers/orion-20-structured-problem-solving/top_tier/check_ocme_formal_nonvacuity_v1.py > p10_ocme_formal_v1_rerun.json
          cmp p10_ocme_formal_v1.json p10_ocme_formal_v1_rerun.json
          echo P10_OCME_FORMAL_V1_BYTE_REPLAY_GREEN
      - name: Execute independent ANF/collinearity verifier
        run: python papers/orion-20-structured-problem-solving/top_tier/check_ocme_formal_independent_v1.py | tee p10_ocme_formal_independent_v1.json
      - name: Verify independent replay and implementation agreement
        run: |
          python papers/orion-20-structured-problem-solving/top_tier/check_ocme_formal_independent_v1.py > p10_ocme_formal_independent_v1_rerun.json
          cmp p10_ocme_formal_independent_v1.json p10_ocme_formal_independent_v1_rerun.json
          python - <<'PY'
          import json
          from pathlib import Path

          primary = json.loads(Path('p10_ocme_formal_v1.json').read_text())
          independent = json.loads(Path('p10_ocme_formal_independent_v1.json').read_text())
          for setting in ('boolean_affine', 'integer_affine'):
              p_obstructions = {row['id'] for row in primary[setting]['obstructions']}
              i_obstructions = {row['id'] for row in independent[setting]['obstructions']}
              p_controls = {row['id'] for row in primary[setting]['known_method_controls']}
              i_controls = {row['id'] for row in independent[setting]['known_method_controls']}
              assert p_obstructions == i_obstructions
              assert p_controls == i_controls
              assert primary[setting]['candidate_edit_outside_closure'] is True
              assert independent[setting]['candidate_edit_outside_closure'] is True
              assert primary[setting]['false_expansion_count'] == independent[setting]['false_expansion_count'] == 0
          for key in ('obstruction_certificate_count', 'outside_closure_edit_count', 'held_out_transfer_count'):
              assert primary[key] == independent[key]
          assert independent['terminal'] == 'P10_OCME_FORMAL_SECOND_INDEPENDENT_CHECKER_GREEN'
          print('P10_OCME_FORMAL_INDEPENDENT_V1_BYTE_REPLAY_GREEN')
          print('P10_OCME_FORMAL_TWO_IMPLEMENTATIONS_AGREE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p10-ocme-formal-v1
          path: |
            p10_ocme_formal_v1.json
            p10_ocme_formal_independent_v1.json
