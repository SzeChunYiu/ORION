name: one-shot-publish-five-paper-audits-r20

on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths: ['.github/workflows/one-shot-publish-five-paper-audits-r20.yml']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  publish-audits:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/orion-02-r18-null-current-main-20260827
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch and audit NQ, AB, and D subjects
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          out='research/five-paper-top-tier-r20/results'
          mkdir -p "$out"
          for pr in 1472 1469 1466; do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > "$RUNNER_TEMP/pr-$pr.json"
            base="$(jq -r .base.sha "$RUNNER_TEMP/pr-$pr.json")"
            head="$(jq -r .head.sha "$RUNNER_TEMP/pr-$pr.json")"
            git fetch --no-tags origin "$base" "$head"
            git worktree add --detach "$RUNNER_TEMP/pr-$pr" "$head"
            printf '%s\n' "$base" > "$RUNNER_TEMP/base-$pr.txt"
            printf '%s\n' "$head" > "$RUNNER_TEMP/head-$pr.txt"
          done
          python research/five-paper-top-tier-r20/audit_nq_pr1472.py --repo "$RUNNER_TEMP/pr-1472" --base "$(cat "$RUNNER_TEMP/base-1472.txt")" --head "$(cat "$RUNNER_TEMP/head-1472.txt")" --output "$out/NQ_PR1472_EXACT_SUBJECT_AUDIT.json"
          python research/five-paper-top-tier-r20/audit_ab_pr1469.py --repo "$RUNNER_TEMP/pr-1469" --base "$(cat "$RUNNER_TEMP/base-1469.txt")" --head "$(cat "$RUNNER_TEMP/head-1469.txt")" --output "$out/AB_PR1469_PRODUCTION_REGISTRY_AUDIT.json"
          python research/five-paper-top-tier-r20/audit_d_pr1466.py --repo "$RUNNER_TEMP/pr-1466" --base "$(cat "$RUNNER_TEMP/base-1466.txt")" --head "$(cat "$RUNNER_TEMP/head-1466.txt")" --output "$out/D_PR1466_FIRST_MIXING_AUDIT.json"
          cp "$RUNNER_TEMP/pr-1472.json" "$out/PR1472.json"
          cp "$RUNNER_TEMP/pr-1469.json" "$out/PR1469.json"
          cp "$RUNNER_TEMP/pr-1466.json" "$out/PR1466.json"
          sha256sum "$out"/* > "$out/SHA256SUMS"
      - name: Preserve fail-closed authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research/five-paper-top-tier-r20/results')
          nq=json.loads((root/'NQ_PR1472_EXACT_SUBJECT_AUDIT.json').read_text())
          ab=json.loads((root/'AB_PR1469_PRODUCTION_REGISTRY_AUDIT.json').read_text())
          d=json.loads((root/'D_PR1466_FIRST_MIXING_AUDIT.json').read_text())
          assert nq['authority']['D4_authority'] is False and nq['authority']['journal_authority'] is False
          assert ab['authority']['quantum_compiler_transfer'] is False and ab['authority']['journal_authority'] is False
          assert d['authority']['agentgateway_native_merge_vulnerability'] is False and d['authority']['journal_authority'] is False
          print('FIVE_PAPER_SPECIALIST_AUDITS_FAIL_CLOSED')
          PY
      - name: Commit immutable audit snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-publish-five-paper-audits-r20.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/five-paper-top-tier-r20/results .github/workflows/one-shot-publish-five-paper-audits-r20.yml
          git commit -m 'audit(R20): bind live NQ AB and D blocker subjects'
          git push origin HEAD:refs/heads/chatgpt/orion-02-r18-null-current-main-20260827
