name: ORION 04-06 publication closure

on:
  pull_request:
    paths:
      - 'papers/orion-04-rooted-completion-certificates/**'
      - 'papers/orion-05-tare-expressivity/**'
      - 'papers/orion-06-recursive-recovery/**'
      - 'papers/publication_closure/verify_orion_04_06_publication.py'
      - '.github/workflows/orion_04_06_publication_closure.yml'
  workflow_dispatch:

jobs:
  publication-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-bibtex-extra poppler-utils
      - name: Build ORION-04 package
        run: python papers/orion-04-rooted-completion-certificates/submission/final-20260831/build_package.py
      - name: Build ORION-05 package
        run: python papers/orion-05-tare-expressivity/submission/final-20260831/build_package.py
      - name: Build ORION-06 TMLR package
        run: python papers/orion-06-recursive-recovery/submission_tmlr/build_package.py
      - name: Verify claim boundaries and anonymity
        run: python papers/publication_closure/verify_orion_04_06_publication.py
      - name: PDF preflight and render controls
        run: |
          mkdir -p closure-artifacts/renders
          pdfinfo papers/orion-04-rooted-completion-certificates/submission/final-20260831/manuscript.pdf > closure-artifacts/orion04-pdfinfo.txt
          pdfinfo papers/orion-05-tare-expressivity/submission/final-20260831/manuscript.pdf > closure-artifacts/orion05-pdfinfo.txt
          pdfinfo papers/orion-06-recursive-recovery/submission_tmlr/main.pdf > closure-artifacts/orion06-pdfinfo.txt
          pdftotext papers/orion-06-recursive-recovery/submission_tmlr/main.pdf closure-artifacts/orion06.txt
          ! grep -Eqi 'Sze Chun Yiu|sze-chun\.yiu@|ORION-Q|development/orion|research/extensions' closure-artifacts/orion06.txt
          pdftoppm -f 1 -singlefile -png -r 150 papers/orion-04-rooted-completion-certificates/submission/final-20260831/manuscript.pdf closure-artifacts/renders/orion04-first
          pdftoppm -f 1 -singlefile -png -r 150 papers/orion-05-tare-expressivity/submission/final-20260831/manuscript.pdf closure-artifacts/renders/orion05-first
          pdftoppm -f 1 -singlefile -png -r 150 papers/orion-06-recursive-recovery/submission_tmlr/main.pdf closure-artifacts/renders/orion06-first
      - name: Stage generated packages
        run: |
          mkdir -p closure-artifacts/generated/orion04 closure-artifacts/generated/orion05 closure-artifacts/generated/orion06
          cp papers/orion-04-rooted-completion-certificates/submission/final-20260831/{manuscript.pdf,source.zip,SHA256SUMS} closure-artifacts/generated/orion04/
          cp papers/orion-05-tare-expressivity/submission/final-20260831/{manuscript.pdf,arxiv-source.zip,SHA256SUMS} closure-artifacts/generated/orion05/
          cp papers/orion-06-recursive-recovery/submission_tmlr/{main.pdf,anonymous-source.zip,anonymous-review-supplement.zip,SHA256SUMS} closure-artifacts/generated/orion06/
      - uses: actions/upload-artifact@v4
        with:
          name: orion-04-06-publication-closure
          path: closure-artifacts/
          if-no-files-found: error
