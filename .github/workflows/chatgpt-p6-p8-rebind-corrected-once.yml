name: chatgpt-p6-p8-rebind-corrected-once

on:
  pull_request:

permissions:
  contents: write

jobs:
  rebind-and-test:
    if: github.head_ref == 'chatgpt/p6-p8-replay-contract-boundary-20260823' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted dependencies
        run: python -m pip install -e . pytest
      - name: Rebind V2 manifests to corrected reachable semantics commit
        run: |
          set -euo pipefail
          git cat-file -e c3060ab1b58b39aed6d640150d78065f9d06f2e4^{commit}
          test "$(git rev-parse c3060ab1b58b39aed6d640150d78065f9d06f2e4^{tree})" = "2ab9265746b2fa095995616a452cde3cf9a499a6"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          subject_commit = 'c3060ab1b58b39aed6d640150d78065f9d06f2e4'
          subject_tree = '2ab9265746b2fa095995616a452cde3cf9a499a6'
          manifests = [
              Path('papers/paper-06-formal-epistemic-structures-and-mechanics/CONTENT_MANIFEST_V2.json'),
              Path('papers/paper-07-epistemic-navigation-open-worlds/CONTENT_MANIFEST_V2.json'),
              Path('papers/paper-08-epistemic-authority-autonomous-science/CONTENT_MANIFEST_V2.json'),
          ]
          def sha(path: Path) -> str:
              assert path.is_file(), path
              return hashlib.sha256(path.read_bytes()).hexdigest()
          for path in manifests:
              data = json.loads(path.read_text(encoding='utf-8'))
              assert data['schema_version'] == 'orion.candidate-content-binding.v2'
              data['subject_commit'] = subject_commit
              data['subject_tree'] = subject_tree
              data['subject_commit_status'] = 'BOUND'
              data['subject_commit_blocker'] = None
              data['subject_commit_unbound_paths'] = []
              environment = data['environment_lock']
              environment['sha256'] = sha(root / environment['path'])
              for item in data['bound_files']:
                  item['sha256'] = sha(root / item['path'])
              path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python -m json.tool papers/paper-06-formal-epistemic-structures-and-mechanics/CONTENT_MANIFEST_V2.json >/dev/null
          python -m json.tool papers/paper-07-epistemic-navigation-open-worlds/CONTENT_MANIFEST_V2.json >/dev/null
          python -m json.tool papers/paper-08-epistemic-authority-autonomous-science/CONTENT_MANIFEST_V2.json >/dev/null
      - name: Run corrected replay-boundary tests
        run: |
          set -euo pipefail
          pytest -q \
            tests/unit/candidates/test_candidate_reproducibility_targets_v2.py \
            tests/unit/candidates/test_p6_p8_replay_contract_boundaries.py
      - name: Commit corrected bindings and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chatgpt-p6-p8-rebind-corrected-once.yml
          git add \
            papers/paper-06-formal-epistemic-structures-and-mechanics/CONTENT_MANIFEST_V2.json \
            papers/paper-07-epistemic-navigation-open-worlds/CONTENT_MANIFEST_V2.json \
            papers/paper-08-epistemic-authority-autonomous-science/CONTENT_MANIFEST_V2.json
          git diff --cached --check
          git commit -m 'chore(candidates): rebind P6-P8 V2 manifests to corrected replay semantics'
          git push origin HEAD:${GITHUB_HEAD_REF}
