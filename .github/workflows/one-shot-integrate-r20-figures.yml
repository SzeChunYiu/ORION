name: one-shot-integrate-r20-figures
on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths: ['.github/workflows/one-shot-integrate-r20-figures.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: chatgpt/orion-02-r18-null-current-main-20260827}
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('papers/orion-02-fiberguard-finite-fibre/MANUSCRIPT_R20.tex')
          text=path.read_text()
          if '\\usepackage{tikz}' not in text:
              text=text.replace('\\usepackage{booktabs,tabularx,microtype,hyperref}\n','\\usepackage{booktabs,tabularx,microtype,hyperref}\n\\usepackage{tikz}\n\\usetikzlibrary{arrows.meta,positioning}\n')
          authority='\\input{FIGURE_AUTHORITY_R20.tex}\n\n'
          if authority not in text:
              anchor='\\section{Finite-fibre decision model}'
              if anchor not in text: raise SystemExit('finite-fibre section anchor absent')
              text=text.replace(anchor,authority+anchor,1)
          joint='\\input{FIGURE_JOINT_ROUTE_R20.tex}\n\n'
          if joint not in text:
              anchor='\\subsection{Legal joint profiles}'
              if anchor not in text: raise SystemExit('legal joint profile anchor absent')
              text=text.replace(anchor,joint+anchor,1)
          path.write_text(text)
          PY
          rm .github/workflows/one-shot-integrate-r20-figures.yml
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/orion-02-fiberguard-finite-fibre/MANUSCRIPT_R20.tex .github/workflows/one-shot-integrate-r20-figures.yml
          git commit -m 'manuscript(ORION-02): integrate authority and joint-route figures'
          git push origin HEAD:refs/heads/chatgpt/orion-02-r18-null-current-main-20260827
