name: shadow-davenport-a2-light-c4-live

on:
  push:
    branches:
      - shadow/davenport-c7-frontier-20260903
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-davenport-a2-light-c4-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run primary c4 replay
        run: python research/experiments/davenport-c7-frontier/check_a2_light_support3_four_share_elimination_v1.py
      - name: Compile independent c4 verifier
        run: g++ -O3 -std=c++17 research/experiments/davenport-c7-frontier/verify_a2_light_support3_four_share_independent_v1.cpp -o /tmp/a2-c4
      - name: Run independent c4 verifier
        run: /tmp/a2-c4
      - name: Compile sanitizer verifier
        run: g++ -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -std=c++17 research/experiments/davenport-c7-frontier/verify_a2_light_support3_four_share_independent_v1.cpp -o /tmp/a2-c4-sanitized
      - name: Run sanitizer verifier
        run: ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 /tmp/a2-c4-sanitized
