name: p9-tmlr-pdf

on:
  pull_request:
    paths:
      - 'papers/orion-19-structured-epistemic-learning/**'
      - 'research/extensions/p9-structured-neural/**'
      - 'src/orion/study/p9/**'
      - 'tests/test_p9_*.py'
      - '.github/workflows/p9-tmlr-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python evidence dependencies
        run: python -m pip install -e '.[dev,candidates]'
      - name: Install TeX and PDF inspection dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-bibtex-extra lmodern poppler-utils
      - name: Build fail-closed TMLR PDF
        run: bash papers/orion-19-structured-epistemic-learning/build_tmlr_pdf.sh
      - name: PDF structural and anonymity smoke
        run: |
          PDF=papers/orion-19-structured-epistemic-learning/manuscript/main.pdf
          test -s "$PDF"
          pdfinfo "$PDF" | tee /tmp/p9-pdfinfo.txt
          pdftotext "$PDF" /tmp/p9-paper.txt
          grep -F 'When Structure Is the Model' /tmp/p9-paper.txt
          ! grep -F 'PENDING_OFFICIAL_RECEIPT' /tmp/p9-paper.txt
          # TMLR can suppress the literal author line in anonymous review mode.
          # The source audit already requires \author{Anonymous Authors}; here
          # additionally require that the rendered PDF carries no author metadata.
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/p9-pdfinfo.txt').read_text().splitlines()
          author=[line.split(':',1)[1].strip() for line in lines if line.startswith('Author:')]
          if author != ['']:
              raise SystemExit(f'non-empty PDF Author metadata: {author!r}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p9-tmlr-pdf-${{ github.sha }}
          path: |
            papers/orion-19-structured-epistemic-learning/manuscript/main.pdf
            papers/orion-19-structured-epistemic-learning/manuscript/main.log
            papers/orion-19-structured-epistemic-learning/evidence/OFFICIAL_EVIDENCE_SUMMARY_V1.json
            papers/orion-19-structured-epistemic-learning/evidence/D1_PAIRED_EFFECTS_V1.json
          if-no-files-found: error
