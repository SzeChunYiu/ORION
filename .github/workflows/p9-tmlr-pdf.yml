name: p9-tmlr-pdf

on:
  pull_request:
    paths:
      - 'papers/candidates/paper-09-structured-epistemic-learning/**'
      - 'research/extensions/p9-structured-neural/**'
      - 'src/orion/study/p9/**'
      - 'tests/test_p9_*.py'
      - '.github/workflows/p9-tmlr-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python evidence dependencies
        run: python -m pip install -e '.[dev,candidates]'
      - name: Install TeX and PDF inspection dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-bibtex-extra poppler-utils
      - name: Build fail-closed TMLR PDF
        run: bash papers/candidates/paper-09-structured-epistemic-learning/build_tmlr_pdf.sh
      - name: PDF structural smoke
        run: |
          PDF=papers/candidates/paper-09-structured-epistemic-learning/manuscript/main.pdf
          test -s "$PDF"
          pdfinfo "$PDF" | tee /tmp/p9-pdfinfo.txt
          pdftotext "$PDF" /tmp/p9-paper.txt
          grep -F 'When Structure Is the Model' /tmp/p9-paper.txt
          grep -F 'Anonymous Authors' /tmp/p9-paper.txt
          ! grep -F 'PENDING_OFFICIAL_RECEIPT' /tmp/p9-paper.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p9-tmlr-pdf-${{ github.sha }}
          path: |
            papers/candidates/paper-09-structured-epistemic-learning/manuscript/main.pdf
            papers/candidates/paper-09-structured-epistemic-learning/manuscript/main.log
            papers/candidates/paper-09-structured-epistemic-learning/evidence/OFFICIAL_EVIDENCE_SUMMARY_V1.json
            papers/candidates/paper-09-structured-epistemic-learning/evidence/D1_PAIRED_EFFECTS_V1.json
          if-no-files-found: error
