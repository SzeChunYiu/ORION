name: ORION V1 Receipt V3 Strict Deadline P1

on:
  pull_request:
    paths:
      - "src/orion/kernel/process_receipt.py"
      - "tests/unit/kernel/test_process_receipt_v3*.py"
      - "development/orion-v1-receipt-v3-deadline-p1-2026-08-26/**"
      - "research/orion-v1-execution/results/V1-RECEIPT-V3-DEADLINE-P1-01/**"
      - ".github/workflows/orion-v1-receipt-v3-deadline-p1.yml"
  push:
    branches: [main]
    paths:
      - "src/orion/kernel/process_receipt.py"
      - "tests/unit/kernel/test_process_receipt_v3*.py"
      - ".github/workflows/orion-v1-receipt-v3-deadline-p1.yml"

permissions:
  contents: read

jobs:
  strict-deadline-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/ci-fast-replay-constraints.txt
      - name: Install frozen test environment
        run: >-
          python -m pip install -e '.[dev,candidates]'
          --constraint .github/ci-fast-replay-constraints.txt
      - name: Verify immutable oracle and exact Linux denominator
        shell: bash
        run: |
          set -euo pipefail
          echo "103c3678e34ea33b7657bec911c8d604b97196bdbf56df40df3f4d2ab8cc051d  tests/unit/kernel/test_process_receipt_v3_deadline_hostile.py" | sha256sum -c -
          mkdir -p receipt-v3-deadline-p1
          python -m pytest --collect-only -q \
            tests/unit/kernel/test_process_receipt_v3.py \
            tests/unit/kernel/test_process_receipt_v3_hostile.py \
            tests/unit/kernel/test_process_receipt_v3_wait_hostile.py \
            tests/unit/kernel/test_process_receipt_v3_deadline_hostile.py \
            | tee receipt-v3-deadline-p1/collect.txt
          python - <<'PY'
          from collections import Counter
          from pathlib import Path

          lines = Path("receipt-v3-deadline-p1/collect.txt").read_text().splitlines()
          nodes = [line.strip() for line in lines if "::test_" in line]
          counts = Counter(node.split("::", 1)[0] for node in nodes)
          expected = {
              "tests/unit/kernel/test_process_receipt_v3.py": 73,
              "tests/unit/kernel/test_process_receipt_v3_hostile.py": 17,
              "tests/unit/kernel/test_process_receipt_v3_wait_hostile.py": 23,
              "tests/unit/kernel/test_process_receipt_v3_deadline_hostile.py": 120,
          }
          if len(nodes) != len(set(nodes)) or counts != Counter(expected):
              raise SystemExit(f"frozen denominator drift: {len(nodes)=}, {counts=}")
          if len(nodes) != 233:
              raise SystemExit(f"combined denominator drift: {len(nodes)} != 233")
          PY
      - name: Execute clean process A
        env:
          PYTHONHASHSEED: "0"
        run: >-
          python -m pytest -q --runxfail
          tests/unit/kernel/test_process_receipt_v3.py
          tests/unit/kernel/test_process_receipt_v3_hostile.py
          tests/unit/kernel/test_process_receipt_v3_wait_hostile.py
          tests/unit/kernel/test_process_receipt_v3_deadline_hostile.py
          --junitxml=receipt-v3-deadline-p1/run-a.xml
      - name: Execute clean process B
        env:
          PYTHONHASHSEED: "1"
        run: >-
          python -m pytest -q --runxfail
          tests/unit/kernel/test_process_receipt_v3.py
          tests/unit/kernel/test_process_receipt_v3_hostile.py
          tests/unit/kernel/test_process_receipt_v3_wait_hostile.py
          tests/unit/kernel/test_process_receipt_v3_deadline_hostile.py
          --junitxml=receipt-v3-deadline-p1/run-b.xml
      - name: Compile and diff hygiene
        run: |
          python -m py_compile src/orion/kernel/process_receipt.py tests/unit/kernel/test_process_receipt_v3_deadline_hostile.py
          git diff --check HEAD^
      - name: Upload immutable audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-v1-receipt-v3-deadline-p1-${{ github.sha }}
          path: receipt-v3-deadline-p1/
          if-no-files-found: error
          retention-days: 30
