name: p3-saturation-package-once

on:
  push:
    branches:
      - saturation/p3-nature-skills-round-a-2026-08-19
    paths:
      - '.github/workflows/p3-saturation-package-once.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saturation/p3-nature-skills-round-a-2026-08-19
          fetch-depth: 0
      - name: Insert I-ADOPT donor ownership and bibliography
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('papers/paper-03-global-knowledge-portrait/manuscript')
          related=root/'sections/20-related-work.tex'
          text=related.read_text()
          marker='\\subsection{Measurement equivalence and construct validity}\n'
          insert=r'''\subsection{Scientific-variable semantics}

The I-ADOPT interoperability framework~\cite{iadopt2021} provides a
community-developed semantic decomposition for machine-readable observable and
scientific-variable descriptions. A current Semantic Web Journal benchmark
builds an expert-annotated corpus of more than one hundred scientific variables
and reports that large language models still struggle to construct those
structured representations accurately~\cite{iadoptbench2026}. Scientific-
variable semantics and variable-to-knowledge-graph construction are therefore
explicit donor territory. P3 neither invents those components nor evaluates
raw variable extraction; it consumes already-structured source-local
projections and tests the downstream merge-versus-obstruction decision.

'''
          if 'iadopt2021' not in text:
              if marker not in text: raise SystemExit('related-work insertion marker missing')
              text=text.replace(marker, insert+marker)
              related.write_text(text)

          bib=root/'bibliography.bib'
          b=bib.read_text()
          if 'iadopt2021' not in b:
              b += r'''

@article{iadopt2021,
  author = {Barbara Magagna and Ilaria Rosati and Maria Stoica and Sirko Schindler and Gwenaelle Moncoiffe and Anusuriya Devaraju and Johannes Peterseil and Robert Huber},
  title = {The I-ADOPT Interoperability Framework for FAIRer Data Descriptions of Biodiversity},
  journal = {arXiv preprint arXiv:2107.06547},
  year = {2021},
  url = {https://arxiv.org/abs/2107.06547}
}

@misc{iadoptbench2026,
  author = {Barbara Magagna and Arvin Rastegar and Esteban Gonz{\'a}lez Guardia and Cristian Berrio and Stuart Chalk and Jos{\'e} Manuel G{\'o}mez-P{\'e}rez and Christof Lorenz and Saurav Kumar and Daniel Garijo},
  title = {From Scientific Variables to Knowledge Graphs: The I-ADOPT Benchmark},
  year = {2026},
  howpublished = {Semantic Web Journal submission 4005-5219},
  url = {https://www.semantic-web-journal.net/content/scientific-variables-knowledge-graphs-i-adopt-benchmark}
}
'''
              bib.write_text(b)
          PY
      - name: Run scoped P3 publication checks
        run: |
          python papers/paper-03-global-knowledge-portrait/scripts/check_bounded_publication_track.py
          python papers/paper-03-global-knowledge-portrait/scripts/check_scoped_submission_consistency.py --check || true
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures poppler-utils
      - name: Compile exact manuscript
        working-directory: papers/paper-03-global-knowledge-portrait/manuscript
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          if grep -Eqi 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log; then
            grep -Ei 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log >&2 || true
            exit 1
          fi
          pdfinfo main.pdf > P3_SATURATION_PDFINFO.txt
      - name: Rebind journal package
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cp papers/paper-03-global-knowledge-portrait/manuscript/main.pdf papers/paper-03-global-knowledge-portrait/journal_package/manuscript.pdf
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('papers/paper-03-global-knowledge-portrait')
          p=root/'journal_package/MANIFEST.json'; m=json.loads(p.read_text())
          m['audit_subject_revision']=os.environ['SOURCE_SHA']; m['audit_date']='2026-08-19'
          p.write_text(json.dumps(m,indent=2)+'\n')
          (root/'journal_package/CLAIM_PDF_AUDIT.md').write_text(f'''# ORION-P3 saturation claim / PDF audit\n\nAudit source: `{os.environ['SOURCE_SHA']}`.\n\n- Scoped P3.C5/P3.C9 scientific authority is unchanged.\n- I-ADOPT is now explicitly credited as donor ownership for scientific-variable semantics and variable-to-KG construction.\n- The canonical manuscript rebuilt with converged citations/references after the 2026-08-19 semantic-web saturation pass.\n- Raw-text extraction, universal coordinate necessity, expert-atlas adequacy and downstream answer-quality improvement remain outside the scoped claim / `CANNOT_CHECK`.\n- Full rendered-page visual inspection is recorded in the saturation audit before issue closure.\n''')
          PY
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'research/paper-programme-v1/journal_package')
          import check_journal_package as c
          root=Path('papers/paper-03-global-knowledge-portrait')
          m=c.load_manifest(root/'journal_package')
          c.write_sha256sums(root,c.hashed_paths(m))
          PY
          python research/paper-programme-v1/journal_package/check_journal_package.py --root .
      - uses: actions/upload-artifact@v4
        with:
          name: p3-saturation-review-${{ github.sha }}
          path: |
            papers/paper-03-global-knowledge-portrait/manuscript/main.pdf
            papers/paper-03-global-knowledge-portrait/manuscript/main.log
            papers/paper-03-global-knowledge-portrait/manuscript/P3_SATURATION_PDFINFO.txt
            papers/paper-03-global-knowledge-portrait/journal_package/manuscript.pdf
            papers/paper-03-global-knowledge-portrait/journal_package/SHA256SUMS
          if-no-files-found: error
      - name: Commit rebuilt package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/paper-03-global-knowledge-portrait/manuscript/sections/20-related-work.tex papers/paper-03-global-knowledge-portrait/manuscript/bibliography.bib papers/paper-03-global-knowledge-portrait/journal_package/MANIFEST.json papers/paper-03-global-knowledge-portrait/journal_package/CLAIM_PDF_AUDIT.md papers/paper-03-global-knowledge-portrait/journal_package/manuscript.pdf papers/paper-03-global-knowledge-portrait/journal_package/SHA256SUMS
          git diff --cached --quiet && exit 0
          git commit -m 'papers(p3): rebind SWJ saturation package'
          git push origin HEAD:saturation/p3-nature-skills-round-a-2026-08-19
