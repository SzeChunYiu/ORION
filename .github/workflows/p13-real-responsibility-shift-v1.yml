name: p13-real-responsibility-shift-v1

on:
  pull_request:
    paths:
      - 'papers/paper-13-responsibility-carrying-state/top_tier/**'
      - '.github/workflows/p13-real-responsibility-shift-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsibility-shift-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen scientific dependencies
        run: python -m pip install 'numpy==1.26.4' 'scikit-learn==1.5.2'
      - name: Execute prospective real responsibility-shift study
        run: python papers/paper-13-responsibility-carrying-state/top_tier/run_real_responsibility_shift_v1.py | tee p13_real_responsibility_shift_v1.json
      - name: Execute byte-replay run
        run: |
          python papers/paper-13-responsibility-carrying-state/top_tier/run_real_responsibility_shift_v1.py > p13_real_responsibility_shift_v1_rerun.json
          cmp p13_real_responsibility_shift_v1.json p13_real_responsibility_shift_v1_rerun.json
          echo P13_REAL_RESPONSIBILITY_SHIFT_V1_BYTE_REPLAY_GREEN
      - uses: actions/upload-artifact@v4
        with:
          name: p13-real-responsibility-shift-v1
          path: p13_real_responsibility_shift_v1.json
