name: p1-necessity-world-freeze-validate

on:
  pull_request:
    branches:
      - shadow/p1-necessity-certificate-freeze-20260817
    paths:
      - '.github/workflows/p1-necessity-world-freeze-validate.yml'
      - '.github/workflows/p1-necessity-world-freeze.yml'
      - 'research/revival/p1/protocol/P1.epistemic-mutation-necessity.v2.2*.json'
      - 'research/revival/p1/freeze_mutation_necessity_worlds.py'
      - 'src/orion/study/p1_causal/absorbed_mechanics.py'
      - 'src/orion/study/p1_causal/necessity_*.py'
      - 'tests/unit/study/p1_causal/test_p1_necessity_*.py'

permissions:
  contents: read

jobs:
  validate-world-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Development falsifiers
        run: >-
          pytest -q
          tests/unit/study/p1_causal/test_p1_necessity_design.py
          tests/unit/study/p1_causal/test_p1_necessity_freeze.py
      - name: Construct and validate world identity without committing it
        run: |
          rm -rf /tmp/p1-necessity-worlds
          python research/revival/p1/freeze_mutation_necessity_worlds.py --outdir /tmp/p1-necessity-worlds
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/p1-necessity-worlds/WORLD_FREEZE.json').read_text())
          assert p['protocol_version']=='P1.epistemic-mutation-necessity.v2.2.4'
          assert p['protocol_chain']['ancestor_pins_validated'] is True
          assert p['confirmatory_seed']==202608172211
          assert p['replication_seed']==202608172212
          assert p['n']==2882
          assert p['hidden_shift_n']==480
          assert p['negative_control_n']==2402
          assert p['candidate_view_leak_count']==0
          assert p['arms_executed'] is False
          assert p['outcome_accessed'] is False
          print(json.dumps({
              'protocol_version': p['protocol_version'],
              'protocol_chain_sha256': p['protocol_chain']['chain_sha256'],
              'subject_git_sha': p['subject_git_sha'],
              'public_sha256': p['public_sha256'],
              'protected_response_matrix_sha256': p['protected_response_matrix_sha256'],
              'n': p['n'],
              'hidden_shift_n': p['hidden_shift_n'],
              'negative_control_n': p['negative_control_n'],
          }, sort_keys=True))
          PY
