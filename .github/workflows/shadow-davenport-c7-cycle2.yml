name: shadow-davenport-c7-cycle2

on:
  push:
    branches:
      - shadow/davenport-c7-frontier-20260903
    paths:
      - .github/workflows/shadow-davenport-c7-cycle2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ingest-and-recurse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/orion-research-harness/pyproject.toml
      - name: Install canonical ORION and harness
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Restore exact cycle-1 workspace artifact
        uses: actions/download-artifact@v4
        with:
          name: davenport-c7-harness-workspace
          path: .cycle1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SzeChunYiu/ORION
          run-id: 33758270615
      - name: Verify restored identity and ingest decomposition result
        run: |
          set -euo pipefail
          rm -rf .research .cycle2-logs
          cp -a .cycle1/.research .research
          mkdir -p .cycle2-logs
          cat .research/.orion-harness/session.json | tee .cycle2-logs/session.json
          orion-harness show-request .research hostreq:2310ffa33bc71066d8381cab35f65161d006c0dced7d305c441cede4b4ee9ff2 | tee .cycle2-logs/request.json
          orion-harness ingest .research hostreq:2310ffa33bc71066d8381cab35f65161d006c0dced7d305c441cede4b4ee9ff2 \
            --file research/experiments/davenport-c7-frontier/host-results/cycle1-decomposition.json \
            --executor 'chatgpt:gpt-5.6-sol' | tee .cycle2-logs/ingest.json
      - name: Re-run canonical recursive solver
        shell: bash
        run: |
          set +e
          orion-harness solve .research c7-d3 \
            --max-iterations 2 \
            --max-recursion-depth 5 \
            --max-recursive-nodes 32 \
            --max-children-per-residual 12 \
            --max-children-per-problem 12 | tee .cycle2-logs/solve.json
          rc=${PIPESTATUS[0]}
          echo "$rc" > .cycle2-logs/solve-exit-code.txt
          orion-harness pending .research | tee .cycle2-logs/pending.json
          orion-harness handoff .research | tee .cycle2-logs/handoff.txt
          exit 0
      - name: Upload next immutable workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davenport-c7-harness-cycle2
          include-hidden-files: true
          path: |
            .research
            .cycle2-logs
            research/experiments/davenport-c7-frontier/FRAME_V1.md
            research/experiments/davenport-c7-frontier/host-results/cycle1-decomposition.json
          if-no-files-found: error
          retention-days: 14
