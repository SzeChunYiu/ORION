name: p4-issue154-ci2-patch
on:
  push:
    branches: [shadow/p4-authority-prereqs-20260816]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[issue154-ci2]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shadow/p4-authority-prereqs-20260816
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/_patch_p4_issue154_ci2.py
      - run: |
          git config user.name 'ORION publication closure'
          git config user.email 'actions@users.noreply.github.com'
          git add src/orion/benchmarks/verified_discovery.py src/orion/benchmarks/authority_attacks.py tests/unit/benchmarks/test_authority_attacks.py tests/unit/benchmarks/test_verified_discovery.py
          git diff --cached --check
          git commit -m '[issue154-ci2] Align hostile report with fail-closed authority semantics'
          git push origin HEAD:shadow/p4-authority-prereqs-20260816
