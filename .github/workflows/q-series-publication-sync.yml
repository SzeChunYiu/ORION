name: q-series-publication-sync

on:
  push:
    branches: [main]
    paths:
      - 'papers/Q_SERIES_FINAL_SPEC_V1.json'
      - 'papers/Q_SERIES_CONTENT_BINDING_V1.json'
      - 'papers/Q_SERIES_FINAL_READINESS_2026-08-22.md'
      - 'papers/SYNC_CONTRACT.md'
      - 'papers/FRAMEWORK_SNAPSHOT.json'
      - 'papers/Q-paper-01-tare-expressivity/**'
      - 'papers/Q-paper-02-recursive-recovery/**'
      - 'papers/Q-paper-03-dual-instrument/**'
      - 'papers/Q-paper-04-typed-state/**'
      - 'development/q-paper-recursive-refinement/**'
      - 'src/orion/registry.py'
      - 'src/orion/programme/q_series_sync.py'
      - 'src/orion/programme/q_series_content_binding.py'
      - 'src/orion/programme/content_binding_coverage.py'
      - 'tests/unit/publication/test_framework_snapshot.py'
      - 'tests/unit/publication/test_q_series_final_spec.py'
      - 'tests/unit/publication/test_q_series_content_binding.py'
      - 'tests/unit/publication/test_q1_proof_sanity_binding.py'
      - 'tests/unit/programme/test_content_binding_coverage.py'
      - 'packages/orion-research-harness/src/orion_research_harness/publication_contract.py'
      - 'packages/orion-research-harness/src/orion_research_harness/paper_refinement.py'
      - 'packages/orion-research-harness/src/orion_research_harness/frontier_benchmark.py'
      - 'packages/orion-research-harness/src/orion_research_harness/__init__.py'
      - 'packages/orion-research-harness/src/orion_research_harness/recursive_runner.py'
      - 'packages/orion-research-harness/src/orion_research_harness/workspace.py'
      - 'packages/orion-research-harness/src/orion_research_harness/protocol.py'
      - 'packages/orion-research-harness/src/orion_research_harness/campaign_protocol.py'
      - 'packages/orion-research-harness/src/orion_research_harness/campaign_runner.py'
      - 'packages/orion-research-harness/tests/test_publication_contract.py'
      - 'packages/orion-research-harness/tests/test_invalid_content_recovery.py'
      - 'packages/orion-research-harness/tests/test_paper_refinement.py'
      - 'packages/orion-research-harness/tests/test_frontier_benchmark.py'
      - '.github/workflows/q-series-publication-sync.yml'
  pull_request:
    paths:
      - 'papers/Q_SERIES_FINAL_SPEC_V1.json'
      - 'papers/Q_SERIES_CONTENT_BINDING_V1.json'
      - 'papers/Q_SERIES_FINAL_READINESS_2026-08-22.md'
      - 'papers/SYNC_CONTRACT.md'
      - 'papers/FRAMEWORK_SNAPSHOT.json'
      - 'papers/Q-paper-01-tare-expressivity/**'
      - 'papers/Q-paper-02-recursive-recovery/**'
      - 'papers/Q-paper-03-dual-instrument/**'
      - 'papers/Q-paper-04-typed-state/**'
      - 'development/q-paper-recursive-refinement/**'
      - 'src/orion/registry.py'
      - 'src/orion/programme/q_series_sync.py'
      - 'src/orion/programme/q_series_content_binding.py'
      - 'src/orion/programme/content_binding_coverage.py'
      - 'tests/unit/publication/test_framework_snapshot.py'
      - 'tests/unit/publication/test_q_series_final_spec.py'
      - 'tests/unit/publication/test_q_series_content_binding.py'
      - 'tests/unit/publication/test_q1_proof_sanity_binding.py'
      - 'tests/unit/programme/test_content_binding_coverage.py'
      - 'packages/orion-research-harness/src/orion_research_harness/publication_contract.py'
      - 'packages/orion-research-harness/src/orion_research_harness/paper_refinement.py'
      - 'packages/orion-research-harness/src/orion_research_harness/frontier_benchmark.py'
      - 'packages/orion-research-harness/src/orion_research_harness/__init__.py'
      - 'packages/orion-research-harness/src/orion_research_harness/recursive_runner.py'
      - 'packages/orion-research-harness/src/orion_research_harness/workspace.py'
      - 'packages/orion-research-harness/src/orion_research_harness/protocol.py'
      - 'packages/orion-research-harness/src/orion_research_harness/campaign_protocol.py'
      - 'packages/orion-research-harness/src/orion_research_harness/campaign_runner.py'
      - 'packages/orion-research-harness/tests/test_publication_contract.py'
      - 'packages/orion-research-harness/tests/test_invalid_content_recovery.py'
      - 'packages/orion-research-harness/tests/test_paper_refinement.py'
      - 'packages/orion-research-harness/tests/test_frontier_benchmark.py'
      - '.github/workflows/q-series-publication-sync.yml'
  workflow_dispatch:

concurrency:
  group: q-series-publication-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/orion-research-harness/pyproject.toml
      - name: Install ORION and research harness
        run: |
          python -m pip install -e '.[dev,candidates]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Check framework and canonical Q publication package
        run: |
          python -m pytest -q \
            tests/unit/publication/test_framework_snapshot.py \
            tests/unit/publication/test_q_series_final_spec.py \
            tests/unit/publication/test_q_series_content_binding.py \
            tests/unit/publication/test_q1_proof_sanity_binding.py \
            tests/unit/programme/test_content_binding_coverage.py
      - name: Check Q3/Q-refinement harness contracts
        run: |
          python -m pytest -q \
            packages/orion-research-harness/tests/test_publication_contract.py \
            packages/orion-research-harness/tests/test_invalid_content_recovery.py \
            packages/orion-research-harness/tests/test_paper_refinement.py \
            packages/orion-research-harness/tests/test_frontier_benchmark.py
      - name: Re-run Q1 independent finite-core proof sanity check
        run: |
          python papers/Q-paper-01-tare-expressivity/independent_human_proof_sanity.py > /tmp/q1-sanity.json
          python - <<'PY'
          import json
          from pathlib import Path

          expected = json.loads(Path('papers/Q-paper-01-tare-expressivity/INDEPENDENT_HUMAN_PROOF_SANITY_RESULTS_2026-08-22.json').read_text())
          actual = json.loads(Path('/tmp/q1-sanity.json').read_text())
          core_keys = (
              'schema',
              'orion_quantum_imports',
              'restore_lemma',
              'class_lemma',
              'status',
          )
          expected_core = {key: expected[key] for key in core_keys}
          actual_core = {key: actual[key] for key in core_keys}
          if actual_core != expected_core:
              raise SystemExit('Q1 independent proof sanity scientific core drifted from the bound result')
          if actual.get('status') != 'PASS':
              raise SystemExit('Q1 independent proof sanity check did not PASS')
          if 'not external peer review' not in actual.get('authority', ''):
              raise SystemExit('Q1 reusable sanity script lost its non-authority boundary')
          PY
      - name: Validate Q3 typed reconstruction of historically prospective V0
        run: |
          python papers/Q-paper-03-dual-instrument/build_typed_v0_record.py > /tmp/q3-v0.json
          python - <<'PY'
          import json
          from pathlib import Path
          raw = json.loads(Path('/tmp/q3-v0.json').read_text())
          assert raw['pre_outcome_relation'] == 'AGREE'
          assert len(raw['instrument_decisions']) == 2
          assert {row['alignment'] for row in raw['deferred_scores']} == {'ALIGNED'}
          assert 'RETROFITTED_TYPED_VIEW_OF_HISTORICALLY_PROSPECTIVE_V0' in raw['provenance_status']
          assert 'does not create another prospective item' in raw['authority']
          PY
      - name: Re-run Q4 paired publication analysis
        run: |
          python papers/Q-paper-04-typed-state/publication_analysis.py > /tmp/q4-publication-analysis.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('papers/Q-paper-04-typed-state/PUBLICATION_PAIRED_ANALYSIS_V1.json').read_text())
          actual = json.loads(Path('/tmp/q4-publication-analysis.json').read_text())
          if actual != expected:
              raise SystemExit('Q4 paired publication analysis drifted from the bound result')
          stale = actual['studies']['N4_B']['STALE_MATTERS']['scoped_vs_never_mean_round_utility']['bootstrap_95pct_ci']
          waste = actual['studies']['N4_B']['REOPEN_WASTEFUL']['scoped_vs_never_mean_round_utility']['bootstrap_95pct_ci']
          for interval in (stale, waste):
              if not (interval[0] <= 0.0 <= interval[1]):
                  raise SystemExit('Q4 N4-B scoped-vs-never boundary no longer crosses zero')
          PY
