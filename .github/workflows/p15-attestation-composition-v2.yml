name: p15-attestation-composition-v2

on:
  pull_request:
    paths:
      - 'papers/paper-15-orion-research-harness/top_tier/P15_ATTESTATION_COMPOSITION_PROTOCOL_V2.md'
      - 'papers/paper-15-orion-research-harness/top_tier/run_attestation_composition_v2.py'
      - 'papers/paper-15-orion-research-harness/top_tier/check_attestation_composition_independent_v2.py'
      - '.github/workflows/p15-attestation-composition-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attestation-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install frozen cryptographic dependency
        run: python -m pip install 'cryptography==46.0.3'
      - name: Execute frozen chain-composition study V2
        run: python papers/paper-15-orion-research-harness/top_tier/run_attestation_composition_v2.py | tee p15_attestation_composition_v2.json
      - name: Verify deterministic primary replay
        run: |
          python papers/paper-15-orion-research-harness/top_tier/run_attestation_composition_v2.py > p15_attestation_composition_v2_rerun.json
          cmp p15_attestation_composition_v2.json p15_attestation_composition_v2_rerun.json
      - name: Execute independent chain audit
        run: |
          python papers/paper-15-orion-research-harness/top_tier/check_attestation_composition_independent_v2.py p15_attestation_composition_v2.json | tee p15_attestation_composition_independent_v2.json
          python papers/paper-15-orion-research-harness/top_tier/check_attestation_composition_independent_v2.py p15_attestation_composition_v2.json > p15_attestation_composition_independent_v2_rerun.json
          cmp p15_attestation_composition_independent_v2.json p15_attestation_composition_independent_v2_rerun.json
      - name: Exercise independent replay and consumed-occurrence rules directly
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib
          path=pathlib.Path('papers/paper-15-orion-research-harness/top_tier/check_attestation_composition_independent_v2.py')
          spec=importlib.util.spec_from_file_location('p15_independent_v2', path)
          assert spec and spec.loader
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          primary=json.load(open('p15_attestation_composition_v2.json'))
          rows=primary['rows']
          claimant_occurrence=module.frozen_case(rows[0])[0]['occurrence_id']
          other=rows[1]
          ok,reason=module.vchain_detail(
              other['chain'], other['id'], claimed_occurrence=claimant_occurrence
          )
          assert not ok and reason=='replay-binding',(ok,reason)
          occurrence=module.frozen_case(rows[0])[0]['occurrence_id']
          ok,reason=module.vchain_detail(
              rows[0]['chain'], rows[0]['id'], consumed={occurrence}
          )
          assert not ok and reason=='consumed-occurrence',(ok,reason)
          print('P15_INDEPENDENT_REPLAY_AND_STALE_RULES_EXERCISED')
          PY
      - name: Prove compromise boundary is reconstructed rather than trusted from primary rows
        run: |
          python - <<'PY'
          import json
          p=json.load(open('p15_attestation_composition_v2.json'))
          assert p['compromise_case_rows']
          for row in p['compromise_case_rows']:
              row['signature_layer_detected']=True
              row['chain_as_science']='EXECUTION_INVALID'
              row['chain_plus_sei']='EXECUTION_INVALID'
          with open('p15_attestation_composition_v2_fabricated_compromise_rows.json','w') as f:
              json.dump(p,f,sort_keys=True)
          PY
          python papers/paper-15-orion-research-harness/top_tier/check_attestation_composition_independent_v2.py \
            p15_attestation_composition_v2_fabricated_compromise_rows.json \
            > p15_attestation_composition_independent_v2_fabricated_rows.json
          python - <<'PY'
          import json
          q=json.load(open('p15_attestation_composition_independent_v2_fabricated_rows.json'))
          assert q['terminal']=='P15_ATTESTATION_COMPOSITION_V2_SECOND_CHECKER_GREEN',q
          assert q['full_compromise_boundary_confirmed'] is True
          print('P15_COMPROMISE_BOUNDARY_RECONSTRUCTED_FROM_FROZEN_FIXTURES')
          PY
      - name: Authoritatively execute frozen V1 single-attestation study in the same binding
        run: |
          python papers/paper-15-orion-research-harness/top_tier/run_attestation_composition_v1.py | tee p15_attestation_composition_v1.json
          python papers/paper-15-orion-research-harness/top_tier/check_attestation_composition_independent_v1.py p15_attestation_composition_v1.json | tee p15_attestation_composition_independent_v1.json
      - name: Verify terminals and endpoint agreement
        run: |
          python - <<'PY'
          import json
          p=json.load(open('p15_attestation_composition_v2.json'))
          q=json.load(open('p15_attestation_composition_independent_v2.json'))
          v1=json.load(open('p15_attestation_composition_v1.json'))
          v1q=json.load(open('p15_attestation_composition_independent_v1.json'))
          assert p['terminal']=='P15_ATTESTATION_COMPOSITION_V2_SUPPORTED',p['terminal']
          assert q['terminal']=='P15_ATTESTATION_COMPOSITION_V2_SECOND_CHECKER_GREEN',q['terminal']
          assert v1['terminal']=='P15_ATTESTATION_COMPOSITION_V1_SUPPORTED',v1['terminal']
          assert v1q['terminal']=='P15_ATTESTATION_COMPOSITION_SECOND_CHECKER_GREEN',v1q['terminal']
          assert p['case_count']==q['case_count']==v1['case_count']==22
          assert p['base_chain_verification_rate']==1.0 and p['chain_plus_sei_gold_agreement_count']==22
          for a in ('A-TRUNCATE','A-SUBSTITUTE','A-SPLICE','A-REORDER','A-REPLAY','A-STALE'):
              assert p['arms'][a]['detections']==p['arms'][a]['attempts'],a
          c=p['arms']['A-COMPROMISE-FULL']
          assert c['signature_layer_detections']==0 and c['chain_as_science_false_promotions']>0
          assert c['chain_plus_sei_false_promotions']>0
          assert p['scientific_field_leakage_count']==0
          assert p['chain_crypto_only_false_scientific_success_count']==0
          assert p['chain_layer_false_rejection_count']==0 and p['disposition_false_rejection_count']==0
          assert p['real_false_promotion_count']==0 and p['valid_workload_case_count']==11
          assert all(a==b for a,b in q['endpoint_agreement_table'].values())
          print('P15_ATTESTATION_COMPOSITION_V2_TWO_IMPLEMENTATIONS_AGREE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p15-attestation-composition-v2
          path: |
            p15_attestation_composition_v2.json
            p15_attestation_composition_independent_v2.json
            p15_attestation_composition_v1.json
            p15_attestation_composition_independent_v1.json
