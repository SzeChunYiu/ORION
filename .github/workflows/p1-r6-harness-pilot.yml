name: p1-r6-harness-pilot

on:
  pull_request:
    paths:
      - 'research/claim_expansion/p1/gpt_r6_harness_pilot.py'
      - 'packages/orion-research-harness/**'
      - 'src/orion/**'
      - '.github/workflows/p1-r6-harness-pilot.yml'
  workflow_dispatch:

concurrency:
  group: p1-r6-harness-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ORION and harness
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Run native harness pilot
        run: python research/claim_expansion/p1/gpt_r6_harness_pilot.py
