name: diagnose-rakl-donors

on:
  pull_request:
    paths:
      - 'src/orion/knowledge/**'
      - 'src/orion/self_orion/**'
      - 'tests/unit/knowledge/**'
      - 'tests/unit/self_orion/**'
      - '.github/workflows/diagnose-rakl-donors.yml'

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/knowledge/test_context_compiler.py

  similarity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/knowledge/test_similarity.py

  measurement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/knowledge/test_measurement.py

  generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/knowledge/test_generator_transport.py

  donor-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/self_orion/test_rakl_donor_gate.py tests/unit/self_orion/test_invention_gate.py

  rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q --ignore=tests/unit/knowledge/test_context_compiler.py --ignore=tests/unit/knowledge/test_similarity.py --ignore=tests/unit/knowledge/test_measurement.py --ignore=tests/unit/knowledge/test_generator_transport.py --ignore=tests/unit/self_orion/test_rakl_donor_gate.py --ignore=tests/unit/self_orion/test_invention_gate.py
