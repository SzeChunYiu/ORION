name: rebind-p3-p4-package-checksums-20260831

on:
  push:
    branches:
      - publication/orion-13-14-19-postmerge-package-repair-20260831
    paths:
      - .github/workflows/rebind-p3-p4-package-checksums-20260831.yml

permissions:
  contents: write

jobs:
  rebind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publication/orion-13-14-19-postmerge-package-repair-20260831
          fetch-depth: 0
      - name: Recompute existing package checksum ledgers
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          def rebind(root: Path, manifest: Path) -> None:
              out = []
              for line in manifest.read_text(encoding='utf-8').splitlines():
                  parts = line.split(None, 1)
                  if len(parts) != 2:
                      out.append(line)
                      continue
                  _, rel = parts
                  rel = rel.strip()
                  target = root / rel
                  if not target.is_file():
                      raise SystemExit(f'missing checksum target: {target}')
                  out.append(f'{hashlib.sha256(target.read_bytes()).hexdigest()}  {rel}')
              manifest.write_text('\n'.join(out) + '\n', encoding='utf-8')

          p13 = Path('papers/orion-13-global-knowledge-portrait')
          rebind(p13, p13 / 'journal_package/SHA256SUMS')
          p14 = Path('papers/orion-14-verified-scientific-discovery')
          rebind(p14, p14 / 'journal_package/SHA256SUMS')
      - name: Verify and commit
        run: |
          set -euo pipefail
          (cd papers/orion-13-global-knowledge-portrait && sha256sum -c journal_package/SHA256SUMS)
          (cd papers/orion-14-verified-scientific-discovery && sha256sum -c journal_package/SHA256SUMS)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/orion-13-global-knowledge-portrait/journal_package/SHA256SUMS papers/orion-14-verified-scientific-discovery/journal_package/SHA256SUMS
          git commit -m 'papers: rebind ORION-13/14 package checksums'
          git push origin HEAD:publication/orion-13-14-19-postmerge-package-repair-20260831
