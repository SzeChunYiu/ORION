name: orion-q-max-r5b

on:
  pull_request:
    paths:
      - 'research/extensions/orion-q/**'
      - 'development/orion-q-max-r0/**'
      - '.github/workflows/orion-q-max-r5b.yml'

jobs:
  n2-proof-carrying-outer-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run frozen N2 proof-carrying replay and outer accounting
        run: |
          cd research/extensions/orion-q
          python max_r5b_n2_proof_outer_replay.py | tee /tmp/r5b.txt
          grep '^ORIONQ_MAX_R5B_PROOF_OUTER=' /tmp/r5b.txt
