name: orion-02-r20-finite-verifier

on:
  push:
    branches:
      - chatgpt/orion-02-r18-null-current-main-20260827
    paths:
      - 'papers/orion-02-fiberguard-finite-fibre/verify_r20_story.py'
      - 'papers/orion-02-fiberguard-finite-fibre/extensions/r18/R18_RECOVERY_CUSTODY.json'
      - '.github/workflows/orion-02-r20-finite-verifier.yml'
  pull_request:
    paths:
      - 'papers/orion-02-fiberguard-finite-fibre/verify_r20_story.py'
      - 'papers/orion-02-fiberguard-finite-fibre/extensions/r18/R18_RECOVERY_CUSTODY.json'
      - '.github/workflows/orion-02-r20-finite-verifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-finite-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and replay twice
        shell: bash
        run: |
          set -euo pipefail
          script='papers/orion-02-fiberguard-finite-fibre/verify_r20_story.py'
          python -m py_compile "$script"
          python "$script" --output "$RUNNER_TEMP/a.json" | tee "$RUNNER_TEMP/a.txt"
          python "$script" --output "$RUNNER_TEMP/b.json" | tee "$RUNNER_TEMP/b.txt"
          cmp "$RUNNER_TEMP/a.json" "$RUNNER_TEMP/b.json"
          cmp "$RUNNER_TEMP/a.txt" "$RUNNER_TEMP/b.txt"
      - name: Verify denominators and authority ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'a.json').read_text())
          assert r['schema']=='ORION.ORION02.R20StoryVerifier.v1'
          assert r['terminal']=='ORION02_R20_STORY_FINITE_CORROBORATION_PASS'
          assert r['deterministic_witnesses']['systems']==1000
          assert r['no_free_extension']['extensions']==4200
          assert r['no_free_extension']['maximum_forced_regret']==20
          assert r['joint_nonidentifiability']=={'full_deterministic':'0','diagonal_deterministic':'100','full_randomized':'0','diagonal_randomized':'50'}
          assert r['r18_custody']['candidate_denominator']==99
          assert r['r18_custody']['former_positive_terminal']=='RETRACTED'
          assert r['r18_custody']['current_terminal']=='FIBERGUARD_R18_NO_PAIRED_ROUTE_VALUE'
          assert r['authority']=={'analytic_proofs_carried_by_manuscript':True,'finite_verification':'IMPLEMENTATION_CORROBORATION_ONLY','external_independence':False,'novelty':False,'journal_authority':False}
          print('ORION_02_R20_FINITE_VERIFIER_RESULT_VALID')
          PY
      - run: git diff --check
      - name: Stage result artifact
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/orion-02-r20-finite-verifier";mkdir -p "$out"
          cp "$RUNNER_TEMP/a.json" "$out/R20_FINITE_VERIFIER_RESULT.json"
          cp "$RUNNER_TEMP/a.txt" "$out/TERMINAL.txt"
          sha256sum "$out"/* > "$out/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: orion-02-r20-finite-verifier
          path: ${{ runner.temp }}/orion-02-r20-finite-verifier/
          if-no-files-found: error
          retention-days: 30
