name: p2-wide-openaire-matched-v3

on:
  pull_request:
    paths:
      - '.github/workflows/p2-wide-openaire-matched-v3.yml'
      - 'papers/orion-12-open-world-scientific-discovery/protocol/P2_WIDE_OPENAIRE_MATCHED_FREEZE_V2.json'
      - 'papers/orion-12-open-world-scientific-discovery/protocol/P2_WIDE_OPENAIRE_MATCHED_FREEZE_V3.json'
      - 'papers/orion-12-open-world-scientific-discovery/scripts/run_autoresearchbench_wide_openaire_matched_v2.py'
      - 'papers/orion-12-open-world-scientific-discovery/scripts/analyze_autoresearchbench_wide_openaire_matched_v2.py'
      - 'papers/orion-12-open-world-scientific-discovery/scripts/probe_openaire_v4_doi_filter_transport.py'
      - 'papers/orion-12-open-world-scientific-discovery/scripts/run_autoresearchbench_wide_openaire_matched_v3.py'
      - 'papers/orion-12-open-world-scientific-discovery/scripts/analyze_autoresearchbench_wide_openaire_matched_v3.py'
      - 'tests/unit/p2/test_p2_openaire_v3_v4_transport.py'
      - 'tests/unit/p2/test_p2_openaire_v3_campaign.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-public-split:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install trusted split dependencies
        run: python -m pip install -e . cryptography
      - name: Materialize pinned benchmark on trusted main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/arb-upstream /tmp/p2-wide-v3-host
          git clone --filter=blob:none https://github.com/CherYou/AutoResearchBench.git /tmp/arb-upstream
          git -C /tmp/arb-upstream checkout a46c9bfb8968786f73f0a6a5b365b5384cd0f96d
          mkdir -p /tmp/p2-wide-v3-host
          curl --fail --location --retry 4 --retry-delay 3 \
            --output /tmp/p2-wide-v3-host/AutoResearchBench.jsonl.obf.json \
            https://huggingface.co/datasets/Lk123/AutoResearchBench/resolve/main/AutoResearchBench.jsonl.obf.json
          python /tmp/arb-upstream/decrypt_benchmark.py \
            --input-file /tmp/p2-wide-v3-host/AutoResearchBench.jsonl.obf.json \
            --output-file /tmp/p2-wide-v3-host/AutoResearchBench.jsonl
          echo 'db1839438033a32dd7d76913575d4b76f144d5e442aaac29be4eda32326392c6  /tmp/p2-wide-v3-host/AutoResearchBench.jsonl' | sha256sum -c -
      - name: Produce and audit candidate-visible split
        shell: bash
        run: |
          set -euo pipefail
          python papers/orion-12-open-world-scientific-discovery/scripts/run_autoresearchbench_wide_compat.py prepare \
            --full /tmp/p2-wide-v3-host/AutoResearchBench.jsonl \
            --public /tmp/p2-wide-v3-host/wide_public.jsonl \
            --gt /tmp/p2-wide-v3-host/wide_gt_DO_NOT_EXPORT.jsonl \
            --manifest /tmp/p2-wide-v3-host/split_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(x) for x in Path('/tmp/p2-wide-v3-host/wide_public.jsonl').read_text().splitlines() if x.strip()]
          assert len(rows) == 400
          assert all(set(row) == {'task_id', 'question'} for row in rows)
          assert all('arxiv_id' not in row and 'answer' not in row and 'gold' not in row for row in rows)
          print('P2_WIDE_V3_PUBLIC_CUSTODY=PASS')
          PY
      - name: Export public split only
        uses: actions/upload-artifact@v4
        with:
          name: p2-wide-v3-public-${{ github.run_id }}
          path: |
            /tmp/p2-wide-v3-host/wide_public.jsonl
            /tmp/p2-wide-v3-host/split_manifest.json
          if-no-files-found: error
          retention-days: 7

  acquisition:
    needs: host-public-split
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ORION test environment
        run: python -m pip install -e '.[dev]'
      - name: Prove inherited custody plus V3 transport-only delegation before network outcome
        run: |
          python -m py_compile \
            papers/orion-12-open-world-scientific-discovery/scripts/run_autoresearchbench_wide_openaire_matched_v3.py \
            papers/orion-12-open-world-scientific-discovery/scripts/analyze_autoresearchbench_wide_openaire_matched_v3.py
          pytest -q tests/unit/p2/test_p2_openaire_identity_probe.py
          pytest -q tests/unit/p2/test_p2_openaire_matched.py
          pytest -q tests/unit/p2/test_p2_openaire_matched_v2.py
          pytest -q tests/unit/p2/test_p2_openaire_transport_probe_authority.py
          pytest -q tests/unit/p2/test_p2_openaire_analysis_v2_transport_authority.py
          pytest -q tests/unit/p2/test_p2_openaire_v3_v4_transport.py
          pytest -q tests/unit/p2/test_p2_openaire_v3_campaign.py
      - name: Execute raw-first gold-blind V4 transport prerequisite
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p2-wide-v3
          python papers/orion-12-open-world-scientific-discovery/scripts/probe_openaire_v4_doi_filter_transport.py \
            --freeze papers/orion-12-open-world-scientific-discovery/protocol/P2_WIDE_OPENAIRE_MATCHED_FREEZE_V3.json \
            --out-dir /tmp/p2-wide-v3
      - name: Download public split; no evaluator gold enters acquisition
        uses: actions/download-artifact@v4
        with:
          name: p2-wide-v3-public-${{ github.run_id }}
          path: /tmp/p2-wide-v3/input
      - name: Run frozen 400-row V3 shared acquisition capture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p2-wide-v3/capture
          python papers/orion-12-open-world-scientific-discovery/scripts/run_autoresearchbench_wide_openaire_matched_v3.py \
            --public /tmp/p2-wide-v3/input/wide_public.jsonl \
            --v3-freeze papers/orion-12-open-world-scientific-discovery/protocol/P2_WIDE_OPENAIRE_MATCHED_FREEZE_V3.json \
            --v2-freeze papers/orion-12-open-world-scientific-discovery/protocol/P2_WIDE_OPENAIRE_MATCHED_FREEZE_V2.json \
            --identity-receipt papers/orion-12-open-world-scientific-discovery/evidence/external_results/P2_OPENAIRE_IDENTITY_PROBE_V1.json \
            --transport-probe /tmp/p2-wide-v3/transport_probe.json \
            --transport-probe-response /tmp/p2-wide-v3/transport_probe_response.json \
            --out-dir /tmp/p2-wide-v3/capture
          test -s /tmp/p2-wide-v3/capture/SHARED_ACQUISITION_MANIFEST.json
          test -s /tmp/p2-wide-v3/capture/candidate_wide_dual_backend_balanced.jsonl
          test -s /tmp/p2-wide-v3/capture/candidate_wide_dual_backend_governed.jsonl
      - name: Reassert V3 pre-score candidate contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('/tmp/p2-wide-v3/capture')
          manifest = json.loads((root / 'SHARED_ACQUISITION_MANIFEST.json').read_text())
          assert manifest['campaign_version'] == 3
          assert manifest['transport_encoding'] == 'v4_filter_ids_doi_or_list'
          assert manifest['transport_probe_terminal'] == 'OPENAIRE_V4_DOI_FILTER_TRANSPORT_VALID'
          assert manifest['v3_transport_only_change'] is True
          assert manifest['v3_beta_transport_is_scientific_evidence'] is False
          assert manifest['same_acquisition_capture_for_all_systems'] is True
          assert manifest['candidate_cap'] == 20
          assert manifest['raw_regex_arxiv_identity_extraction'] is False
          for system_id, expected in manifest['candidate_hashes'].items():
              actual = hashlib.sha256((root / f'candidate_{system_id}.jsonl').read_bytes()).hexdigest()
              assert actual == expected, (system_id, actual, expected)
          print('P2_WIDE_V3_PRE_SCORE_CANDIDATE_FREEZE=PASS')
          PY
      - name: Upload frozen V3 acquisition evidence, including raw transport bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-wide-v3-capture-${{ github.sha }}
          path: |
            /tmp/p2-wide-v3/capture/**
            /tmp/p2-wide-v3/transport_probe.json
            /tmp/p2-wide-v3/transport_probe.pending.json
            /tmp/p2-wide-v3/transport_probe_response.json
            /tmp/p2-wide-v3/input/split_manifest.json
            papers/orion-12-open-world-scientific-discovery/protocol/P2_WIDE_OPENAIRE_MATCHED_FREEZE_V2.json
            papers/orion-12-open-world-scientific-discovery/protocol/P2_WIDE_OPENAIRE_MATCHED_FREEZE_V3.json
            papers/orion-12-open-world-scientific-discovery/evidence/external_results/P2_OPENAIRE_IDENTITY_PROBE_V1.json
          if-no-files-found: warn
          retention-days: 30

  evaluate:
    needs: acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned evaluator runtime dependencies
        run: python -m pip install -e '.[dev]' cryptography requests tiktoken openai
      - name: Download already-frozen V3 candidate capture
        uses: actions/download-artifact@v4
        with:
          name: p2-wide-v3-capture-${{ github.sha }}
          path: /tmp/p2-wide-v3-eval/capture
      - name: Hash candidates before evaluator gold exists
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifests = list(Path('/tmp/p2-wide-v3-eval/capture').rglob('SHARED_ACQUISITION_MANIFEST.json'))
          assert len(manifests) == 1, manifests
          root = manifests[0].parent
          manifest = json.loads(manifests[0].read_text())
          assert manifest['campaign_version'] == 3
          binding = {}
          for system_id, expected in manifest['candidate_hashes'].items():
              path = root / f'candidate_{system_id}.jsonl'
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == expected
              binding[system_id] = actual
          Path('/tmp/p2-wide-v3-eval/PRE_GOLD_CANDIDATE_HASHES.json').write_text(json.dumps(binding, sort_keys=True))
          Path('/tmp/p2-wide-v3-eval/CAPTURE_ROOT.txt').write_text(str(root))
          print('P2_WIDE_V3_CANDIDATES_FROZEN_BEFORE_GOLD=PASS')
          PY
      - name: Materialize evaluator-only pinned benchmark after candidate freeze
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/arb-upstream /tmp/p2-wide-v3-eval/gold
          git clone --filter=blob:none https://github.com/CherYou/AutoResearchBench.git /tmp/arb-upstream
          git -C /tmp/arb-upstream checkout a46c9bfb8968786f73f0a6a5b365b5384cd0f96d
          mkdir -p /tmp/p2-wide-v3-eval/gold
          curl --fail --location --retry 4 --retry-delay 3 \
            --output /tmp/p2-wide-v3-eval/gold/AutoResearchBench.jsonl.obf.json \
            https://huggingface.co/datasets/Lk123/AutoResearchBench/resolve/main/AutoResearchBench.jsonl.obf.json
          python /tmp/arb-upstream/decrypt_benchmark.py \
            --input-file /tmp/p2-wide-v3-eval/gold/AutoResearchBench.jsonl.obf.json \
            --output-file /tmp/p2-wide-v3-eval/gold/AutoResearchBench.jsonl
          echo 'db1839438033a32dd7d76913575d4b76f144d5e442aaac29be4eda32326392c6  /tmp/p2-wide-v3-eval/gold/AutoResearchBench.jsonl' | sha256sum -c -
          python papers/orion-12-open-world-scientific-discovery/scripts/run_autoresearchbench_wide_compat.py prepare \
            --full /tmp/p2-wide-v3-eval/gold/AutoResearchBench.jsonl \
            --public /tmp/p2-wide-v3-eval/gold/public_rederived_not_used_by_candidates.jsonl \
            --gt /tmp/p2-wide-v3-eval/gold/wide_gt.jsonl \
            --manifest /tmp/p2-wide-v3-eval/gold/split_manifest.json
      - name: Run pinned official Wide scorer on frozen candidates
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(cat /tmp/p2-wide-v3-eval/CAPTURE_ROOT.txt)
          mkdir -p /tmp/p2-wide-v3-eval/results
          for SYSTEM in wide_dual_backend_balanced wide_dual_backend_governed wide_dual_backend_direct_first; do
            python /tmp/arb-upstream/evaluate/evaluate_wide_search.py \
              --input-file "$ROOT/candidate_${SYSTEM}.jsonl" \
              --gt-file /tmp/p2-wide-v3-eval/gold/wide_gt.jsonl \
              --no-jina \
              --output-file "/tmp/p2-wide-v3-eval/results/eval_${SYSTEM}.json"
          done
      - name: Apply frozen V3 paired analysis and terminal
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(cat /tmp/p2-wide-v3-eval/CAPTURE_ROOT.txt)
          PROBE=$(find /tmp/p2-wide-v3-eval/capture -name transport_probe.json -type f -print -quit)
          RESPONSE=$(find /tmp/p2-wide-v3-eval/capture -name transport_probe_response.json -type f -print -quit)
          test -n "$PROBE" && test -n "$RESPONSE"
          python papers/orion-12-open-world-scientific-discovery/scripts/analyze_autoresearchbench_wide_openaire_matched_v3.py \
            --v3-freeze papers/orion-12-open-world-scientific-discovery/protocol/P2_WIDE_OPENAIRE_MATCHED_FREEZE_V3.json \
            --v2-freeze papers/orion-12-open-world-scientific-discovery/protocol/P2_WIDE_OPENAIRE_MATCHED_FREEZE_V2.json \
            --manifest "$ROOT/SHARED_ACQUISITION_MANIFEST.json" \
            --transport-probe "$PROBE" \
            --transport-probe-response "$RESPONSE" \
            --baseline-eval /tmp/p2-wide-v3-eval/results/eval_wide_dual_backend_balanced.json \
            --orion-eval /tmp/p2-wide-v3-eval/results/eval_wide_dual_backend_governed.json \
            --diagnostic-eval /tmp/p2-wide-v3-eval/results/eval_wide_dual_backend_direct_first.json \
            --baseline-candidate "$ROOT/candidate_wide_dual_backend_balanced.jsonl" \
            --orion-candidate "$ROOT/candidate_wide_dual_backend_governed.jsonl" \
            --diagnostic-candidate "$ROOT/candidate_wide_dual_backend_direct_first.jsonl" \
            --output /tmp/p2-wide-v3-eval/results/P2_WIDE_OPENAIRE_MATCHED_RESULT_V3.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/p2-wide-v3-eval/results/P2_WIDE_OPENAIRE_MATCHED_RESULT_V3.json').read_text())
          print('P2_WIDE_V3_SCIENTIFIC_TERMINAL=' + result['terminal'])
          print('P2_WIDE_V3_VALID=' + str(result['all_validity_conditions']))
          print('P2_WIDE_V3_IOU_DELTA=' + str(result['scientific_rule']['official_avg_iou_delta']))
          print('P2_WIDE_V3_CI95_LOW=' + str(result['scientific_rule']['paired_iou_ci95_low']))
          PY
      - name: Prove evaluator did not mutate candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path(Path('/tmp/p2-wide-v3-eval/CAPTURE_ROOT.txt').read_text())
          before = json.loads(Path('/tmp/p2-wide-v3-eval/PRE_GOLD_CANDIDATE_HASHES.json').read_text())
          for system_id, expected in before.items():
              actual = hashlib.sha256((root / f'candidate_{system_id}.jsonl').read_bytes()).hexdigest()
              assert actual == expected
          print('P2_WIDE_V3_POST_SCORE_CANDIDATE_IMMUTABILITY=PASS')
          PY
      - name: Upload official V3 evaluator and terminal evidence; never upload evaluator GT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-wide-v3-evaluation-${{ github.sha }}
          path: |
            /tmp/p2-wide-v3-eval/results/*.json
            /tmp/p2-wide-v3-eval/PRE_GOLD_CANDIDATE_HASHES.json
            /tmp/p2-wide-v3-eval/gold/split_manifest.json
            papers/orion-12-open-world-scientific-discovery/protocol/P2_WIDE_OPENAIRE_MATCHED_FREEZE_V2.json
            papers/orion-12-open-world-scientific-discovery/protocol/P2_WIDE_OPENAIRE_MATCHED_FREEZE_V3.json
          if-no-files-found: warn
          retention-days: 30
