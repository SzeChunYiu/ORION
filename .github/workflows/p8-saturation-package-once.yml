name: p8-saturation-package-once

on:
  push:
    branches: [saturation/p8-nature-skills-round-a-2026-08-19]
    paths: ['.github/workflows/p8-saturation-package-once.yml']

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saturation/p8-nature-skills-round-a-2026-08-19
          fetch-depth: 0
      - name: Insert closest composition-safe delegation donor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('papers/candidates/paper-08-epistemic-authority-autonomous-science/submission/JAAMAS_MANUSCRIPT.tex')
          s=p.read_text()
          old=r'''ETAS exposes typed requested\slash handled\slash denied\slash committed agent effects and residual obligations \cite{etas2026}. FAVA formalizes evidence-backed permission graphs and deterministic authorization before effects \cite{fava2026}. AgentBound composes multiple authority sources into verifiable behavioral governance \cite{agentbound2026}; authorization-propagation work models transitive delegation and temporal validity across agent workflows \cite{propagation2026}. These systems own typed action governance and authority propagation.'''
          new=r'''ETAS exposes typed requested\slash handled\slash denied\slash committed agent effects and residual obligations \cite{etas2026}. FAVA formalizes evidence-backed permission graphs and deterministic authorization before effects \cite{fava2026}. AgentBound composes multiple authority sources into verifiable behavioral governance \cite{agentbound2026}; authorization-propagation work models transitive delegation and temporal validity across agent workflows \cite{propagation2026}. Most recently, Bounded Agents carries delegated authority through an Agentic Principal Chain, narrows scope and budgets across delegation, checks requests against accumulated session state, and proves composition-safety properties under its stated restriction and serialization assumptions \cite{boundedagents2026}. These systems own typed action governance, authority propagation, narrowing, and composition-safe delegation.'''
          if 'boundedagents2026' not in s:
              if old not in s: raise SystemExit('P8 donor paragraph marker missing')
              s=s.replace(old,new)
              bibmarker=r'''\bibitem{propagation2026} K. Tallam, Authorization propagation in multi-agent AI systems: identity governance as infrastructure, arXiv:2605.05440, 2026.'''
              bibnew=bibmarker+r'''
\bibitem{boundedagents2026} X. Muruaga, Bounded Agents: Delegation Security for Multi-Agent AI Systems, arXiv:2608.15888, 2026.'''
              if bibmarker not in s: raise SystemExit('P8 bibliography marker missing')
              s=s.replace(bibmarker,bibnew)
              p.write_text(s)
          PY
      - name: Commit scientific-source citation first
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/candidates/paper-08-epistemic-authority-autonomous-science/submission/JAAMAS_MANUSCRIPT.tex
          git commit -m 'papers(p8): absorb composition-safe delegation donor'
      - name: Rebind P8 candidate bytes to committed source
        run: |
          python papers/candidates/checkers/check_content_binding_v1.py --root . --write
          git checkout -- papers/candidates/paper-06-formal-epistemic-structures-and-mechanics/CONTENT_MANIFEST_V1.json papers/candidates/paper-06-formal-epistemic-structures-and-mechanics/SHA256SUMS papers/candidates/paper-07-epistemic-navigation-open-worlds/CONTENT_MANIFEST_V1.json papers/candidates/paper-07-epistemic-navigation-open-worlds/SHA256SUMS
          python papers/candidates/checkers/check_content_binding_v1.py --root . --check
      - name: Run P8 formal/candidate checks
        run: |
          pytest -q tests/unit/candidates/test_p8_formal_core_primitives.py tests/unit/candidates/test_p6_p8_theory_closure_v21.py tests/unit/candidates/test_candidate_content_binding.py
      - name: Compile and audit P8 submission PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra poppler-utils
          cd papers/candidates/paper-08-epistemic-authority-autonomous-science/submission
          latexmk -pdf -interaction=nonstopmode -halt-on-error JAAMAS_MANUSCRIPT.tex
          if grep -Eq 'Overfull \\[hv]box' JAAMAS_MANUSCRIPT.log; then grep -E 'Overfull \\[hv]box' JAAMAS_MANUSCRIPT.log >&2; exit 1; fi
          if grep -Eqi 'undefined citations|undefined references|Citation .* undefined|Reference .* undefined' JAAMAS_MANUSCRIPT.log; then exit 1; fi
          pdfinfo JAAMAS_MANUSCRIPT.pdf > P8_SATURATION_PDFINFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p8-saturation-review-${{ github.sha }}
          path: |
            papers/candidates/paper-08-epistemic-authority-autonomous-science/submission/JAAMAS_MANUSCRIPT.pdf
            papers/candidates/paper-08-epistemic-authority-autonomous-science/submission/JAAMAS_MANUSCRIPT.log
            papers/candidates/paper-08-epistemic-authority-autonomous-science/submission/P8_SATURATION_PDFINFO.txt
          if-no-files-found: error
      - name: Commit binding artifacts and push both commits
        run: |
          git add papers/candidates/paper-08-epistemic-authority-autonomous-science/CONTENT_MANIFEST_V1.json papers/candidates/paper-08-epistemic-authority-autonomous-science/SHA256SUMS
          git commit -m 'papers(p8): rebind saturation submission bytes'
          git push origin HEAD:saturation/p8-nature-skills-round-a-2026-08-19
