name: ChatGPT ORION V1 component binder determinism repair once

on:
  push:
    branches:
      - shadow/orion-v1-deadline-migration-freeze-20260826
    paths:
      - ".github/workflows/chatgpt-orion-v1-component-binder-determinism-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shadow/orion-v1-deadline-migration-freeze-20260826
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replace nondeterministic runtime field
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/build_orion_v1_component_binding.py")
          text = path.read_text(encoding="utf-8")
          old = '        "elapsed_seconds": round(time.monotonic() - started, 6),\n'
          new = '        "elapsed_seconds": "NOT_CONTENT_BOUND",\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one elapsed field, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Run hostile focused tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/unit/orion_v1/test_component_binding_builder.py
          python -m py_compile scripts/build_orion_v1_component_binding.py
          git diff --check
      - name: Commit with remote-ref precondition
        env:
          TARGET_BRANCH: shadow/orion-v1-deadline-migration-freeze-20260826
        run: |
          git config user.name "ORION V1 component-binding repair"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/build_orion_v1_component_binding.py
          git commit -m "fix: make V1 component binding packet deterministic"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
