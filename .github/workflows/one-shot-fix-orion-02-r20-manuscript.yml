name: one-shot-fix-orion-02-r20-manuscript

on:
  push:
    branches:
      - chatgpt/orion-02-r18-null-current-main-20260827
    paths:
      - '.github/workflows/one-shot-fix-orion-02-r20-manuscript.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-manuscript-workflow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/orion-02-r18-null-current-main-20260827
      - name: Repair static token and PDF utilities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/orion-02-r20-manuscript.yml')
          text=path.read_text()
          text=text.replace('            latexmk \\n', '            latexmk \\n            poppler-utils \\n')
          text=text.replace("              'conv(P)+\\\\Rplus^F',", "              '\\\\conv(P)+\\\\Rplus^F',")
          path.write_text(text)
          PY
          rm .github/workflows/one-shot-fix-orion-02-r20-manuscript.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/orion-02-r20-manuscript.yml .github/workflows/one-shot-fix-orion-02-r20-manuscript.yml
          git commit -m 'ci(ORION-02): repair R20 manuscript compile audit'
          git push origin HEAD:refs/heads/chatgpt/orion-02-r18-null-current-main-20260827
