name: p13-cert-transport-v1

on:
  pull_request:
    paths:
      - 'papers/paper-13-responsibility-carrying-state/top_tier/P13_CERT_TRANSPORT_PROTOCOL_V1.md'
      - 'papers/paper-13-responsibility-carrying-state/top_tier/p13_cert_transport_cases_v1.json'
      - 'papers/paper-13-responsibility-carrying-state/top_tier/run_cert_transport_v1.py'
      - 'papers/paper-13-responsibility-carrying-state/top_tier/check_cert_transport_independent_v1.py'
      - '.github/workflows/p13-cert-transport-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cert-transport-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Execute drift-bounded certificate transport
        run: python papers/paper-13-responsibility-carrying-state/top_tier/run_cert_transport_v1.py | tee p13_cert_transport_v1.json
      - name: Verify primary byte replay
        run: |
          python papers/paper-13-responsibility-carrying-state/top_tier/run_cert_transport_v1.py > p13_cert_transport_v1_rerun.json
          cmp p13_cert_transport_v1.json p13_cert_transport_v1_rerun.json
      - name: Execute independent checker
        run: python papers/paper-13-responsibility-carrying-state/top_tier/check_cert_transport_independent_v1.py | tee p13_cert_transport_independent_v1.json
      - name: Verify independent replay and agreement
        run: |
          python papers/paper-13-responsibility-carrying-state/top_tier/check_cert_transport_independent_v1.py > p13_cert_transport_independent_v1_rerun.json
          cmp p13_cert_transport_independent_v1.json p13_cert_transport_independent_v1_rerun.json
          python - <<'PY'
          import json
          p=json.load(open('p13_cert_transport_v1.json')); q=json.load(open('p13_cert_transport_independent_v1.json'))
          assert p['terminal']=='P13_CERT_TRANSPORT_V1_SUPPORTED'
          assert q['terminal']=='P13_CERT_TRANSPORT_SECOND_INDEPENDENT_CHECKER_GREEN'
          assert p['case_count']==q['case_count']==60
          assert p['verifier_correct']==q['expected_correct']
          assert p['unsound_transport']==q['expected_unsound_transport']
          assert p['needless_reissue']==q['expected_needless_reissue']
          assert p['solver_calls']==q['expected_solver_calls']
          for a in p['mean_literal_reads']:
              assert abs(p['mean_literal_reads'][a]-q['expected_mean_literal_reads'][a])<1e-12
          for k in p['stratum_mean_literal_reads']:
              assert abs(p['stratum_mean_literal_reads'][k]-q['expected_stratum_mean_literal_reads'][k])<1e-12
          assert q['invariant_failures']==[]
          print('P13_CERT_TRANSPORT_TWO_IMPLEMENTATIONS_AGREE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p13-cert-transport-v1
          path: |
            p13_cert_transport_v1.json
            p13_cert_transport_independent_v1.json
