name: orion-qg-qg13v2-combined-edit

on:
  pull_request:
    paths:
      - 'development/orion-qg-regime-geometry/QG13V2_*'
      - 'development/orion-qg-regime-geometry/qg13_v2_*'
      - 'development/orion-qg-regime-geometry/run_qg13_v2_dual_harness.py'
      - 'research/extensions/orion-qg/qg13_v2_combined_edit.py'
      - 'packages/orion-research-harness/src/orion_research_harness/domains/orion_qg/**'
      - 'packages/orion-research-harness/tests/test_qg13_v2_combined_edit.py'
      - '.github/workflows/orion-qg-qg13v2.yml'
  workflow_dispatch:

concurrency:
  group: orion-qg-qg13v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qg13v2-combined-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QG13V2_FROZEN_BASE: 3202e52371d018b5f6547ed44490f089400d8485
    steps:
      - name: Checkout exact protected head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert frozen lineage
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e "${QG13V2_FROZEN_BASE}^{commit}"
          test "$(git merge-base HEAD "${QG13V2_FROZEN_BASE}")" = "${QG13V2_FROZEN_BASE}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ORION and research harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,candidates]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Validate native controller
        run: pytest -q packages/orion-research-harness/tests/test_qg13_v2_combined_edit.py
      - name: Execute V2 through both ORION instruments
        run: |
          mkdir -p artifacts
          python development/orion-qg-regime-geometry/run_qg13_v2_dual_harness.py \
            | tee artifacts/orion-qg-qg13v2-dual-summary.json
      - name: Deterministic analyzer replay
        run: |
          python research/extensions/orion-qg/qg13_v2_combined_edit.py \
            --output artifacts/orion-qg-qg13v2-combined-edit-replay.json \
            | tee artifacts/orion-qg-qg13v2-replay.log
          cmp artifacts/orion-qg-qg13v2-combined-edit.json artifacts/orion-qg-qg13v2-combined-edit-replay.json
      - name: Enforce bounded scientific terminal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/orion-qg-qg13v2-combined-edit.json').read_text())
          g=json.loads(Path('artifacts/orion-qg-qg13v2-generic-verification.json').read_text())
          d=json.loads(Path('artifacts/orion-qg-qg13v2-dual-harness.json').read_text())
          allowed={'QG13V2_SUPPORT4_CANDIDATE','QG13V2_MINIMAL_COMBINED_EDIT_OBSTRUCTION','QG13V2_RESOURCE_COUNTEREXAMPLE'}
          assert d['terminal'] in allowed
          assert d['both_accept'] is True
          assert g['decision']=='ACCEPT' and all(g['checks'].values())
          assert a['production_signature_binding']['all_exact'] is True
          assert a['parent_receipts_opened_during_synthesis'] is False
          assert a['chemistry_sources_read'] is False and a['protected_subject_read'] is False and a['network_access'] is False
          assert a['new_theorem_authority'] is False and a['novelty_authority'] is False and a['physical_quantum_advantage_claim'] is False
          assert d['new_theorem_authority'] is False and d['novelty_authority'] is False
          if d['terminal']=='QG13V2_SUPPORT4_CANDIDATE':
              assert a['obstruction_census']['support5_irreducible_patterns']>0
              assert a['obstruction_census']['uncovered_support5_patterns']==0
          elif d['terminal']=='QG13V2_MINIMAL_COMBINED_EDIT_OBSTRUCTION':
              assert a['obstruction_census']['uncovered_support5_patterns']>0
              assert a['obstruction_census']['first_obstruction'] is not None
          else:
              assert a['pair_safety']['globally_safe_pair_classes']==0
          PY
      - name: Upload V2 receipts
        uses: actions/upload-artifact@v4
        with:
          name: orion-qg-qg13v2-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/orion-qg-qg13v2-combined-edit.json
            artifacts/orion-qg-qg13v2-combined-edit-replay.json
            artifacts/orion-qg-qg13v2-generic-verification.json
            artifacts/orion-qg-qg13v2-dual-harness.json
            artifacts/orion-qg-qg13v2-dual-summary.json
            artifacts/orion-qg-qg13v2-replay.log
            .orion-qg-qg13v2-generic/.orion-harness/**
            .orion-qg-qg13v2-native/.orion-harness/**
          include-hidden-files: true
          if-no-files-found: error
