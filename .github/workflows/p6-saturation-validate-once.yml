name: p6-saturation-validate-once

on:
  push:
    branches: [saturation/p6-nature-skills-round-a-2026-08-19]
    paths: ['.github/workflows/p6-saturation-validate-once.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saturation/p6-nature-skills-round-a-2026-08-19
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ORION
        run: python -m pip install -e '.[dev,candidates]'
      - name: Verify candidate content bindings
        run: python papers/candidates/checkers/check_content_binding_v1.py --root . --check
      - name: Run P6-P8 theory and hostile-review gates
        run: |
          pytest -q tests/unit/candidates/test_p6_p8_candidate_embedding.py tests/unit/candidates/test_p6_p8_theory_closure_v21.py tests/unit/candidates/test_p6_p8_merged_review_suites.py tests/unit/candidates/test_candidate_content_binding.py
      - name: Run peer-review submission gate
        run: python papers/candidates/submission/check_peer_review_ready.py --root .
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra poppler-utils
      - name: Build and audit all candidate PDFs on exact P6 saturation head
        run: python papers/candidates/submission/build_and_audit_p6_p8_pdfs.py --output-root /tmp/p6p8-saturation --clean
      - uses: actions/upload-artifact@v4
        with:
          name: p6-saturation-validation-${{ github.sha }}
          path: /tmp/p6p8-saturation
          if-no-files-found: error
      - name: Remove one-shot validator after all gates pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p6-saturation-validate-once.yml
          git commit -m 'chore(p6): retire one-shot saturation validator'
          git push origin HEAD:saturation/p6-nature-skills-round-a-2026-08-19
