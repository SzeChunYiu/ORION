name: ORION foundations local derivations

on:
  pull_request:
    paths:
      - "src/orion/foundations/**"
      - "tests/foundations/**"
      - "research/orion-foundations-v2/**"
      - ".github/workflows/orion-foundations.yml"
  push:
    paths:
      - "src/orion/foundations/**"
      - "tests/foundations/**"
      - "research/orion-foundations-v2/**"
      - ".github/workflows/orion-foundations.yml"

jobs:
  local-foundations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard foundations-only changed paths
        shell: bash
        run: |
          git diff --name-only HEAD^1 HEAD > /tmp/foundations-changed-paths.txt
          cat /tmp/foundations-changed-paths.txt
          unexpected="$(grep -Ev '^(\.github/workflows/orion-foundations\.yml|research/orion-foundations-v2/|src/orion/foundations/|tests/foundations/)' /tmp/foundations-changed-paths.txt || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected non-foundations changed paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          if grep -Eq '^development/p1-scienceagentbench-protected-rr1-one-tuple-finalizer-freeze-v1-2026-08-24/' /tmp/foundations-changed-paths.txt; then
            echo "Protected P1 RR1/finalizer path entered foundations diff" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest tests/foundations -q
      - run: >-
          python -m orion.foundations.cli
          --output /tmp/LOCAL_THEOREM_RECEIPT_V1.json
          --assumptions-output /tmp/ASSUMPTION_LEDGER_V1.json
          --countermodels-output /tmp/COUNTERMODEL_ATLAS_V1.json
          --theorem-ledger-output /tmp/THEOREM_LEDGER_V1.json
