name: p4-host-prepare

on:
  push:
    branches: [shadow/p4-issue101-protected-closure]
    paths:
      - 'papers/orion-14-verified-scientific-discovery/host/PREP_TRIGGER_V1.txt'

permissions:
  contents: read

jobs:
  independent-host-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze host-generated hidden case set
        shell: bash
        run: |
          set -euo pipefail
          SUBJECT=46977ea104162c4cf64da8138a4c4759065fe6d4
          git cat-file -e "${SUBJECT}^{commit}"
          git archive --format=tar "$SUBJECT" > "$RUNNER_TEMP/p4-subject.tar"
          SUBJECT_HASH=$(sha256sum "$RUNNER_TEMP/p4-subject.tar" | awk '{print $1}')
          HARNESS_HASH=$(python - <<'PY'
          import hashlib
          from pathlib import Path
          files = [
              'papers/orion-14-verified-scientific-discovery/host/generate_protected_cases.py',
              'papers/orion-14-verified-scientific-discovery/host/run_candidate.py',
              'papers/orion-14-verified-scientific-discovery/host/run_baselines.py',
              'papers/orion-14-verified-scientific-discovery/host/run_ablations.py',
              'papers/orion-14-verified-scientific-discovery/host/evaluate_campaign.py',
              'papers/orion-14-verified-scientific-discovery/host/evaluate_ablations.py',
              'papers/orion-14-verified-scientific-discovery/host/independent_reproduce.py',
              'papers/orion-14-verified-scientific-discovery/host/BASELINE_CONFIGS_V1.json',
          ]
          digest = hashlib.sha256()
          for name in files:
              data = Path(name).read_bytes()
              digest.update(name.encode('utf-8'))
              digest.update(b'\0')
              digest.update(hashlib.sha256(data).digest())
          print(digest.hexdigest())
          PY
          )
          BASELINE_HASH=$(sha256sum papers/orion-14-verified-scientific-discovery/host/BASELINE_CONFIGS_V1.json | awk '{print $1}')
          EPOCH=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          SECRET_SEED=$(openssl rand -hex 32)
          python papers/orion-14-verified-scientific-discovery/host/generate_protected_cases.py \
            --seed "$SECRET_SEED" \
            --output-dir "$RUNNER_TEMP/p4-host-prep" \
            --subject-commit "$SUBJECT" \
            --subject-archive-sha256 "$SUBJECT_HASH" \
            --evaluator-artifact-sha256 "$HARNESS_HASH" \
            --baseline-config-sha256 "$BASELINE_HASH" \
            --host-run-id "$GITHUB_RUN_ID" \
            --evaluation-epoch "$EPOCH"
          unset SECRET_SEED

      - name: Prove candidate handoff contains no protected labels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'p4-host-prep'
          candidate = root / 'candidate_manifest.jsonl'
          rows = [json.loads(line) for line in candidate.read_text().splitlines() if line.strip()]
          assert len(rows) == 420
          assert all(set(row) == {'case_id', 'candidate_visible'} for row in rows)
          blob = candidate.read_text()
          forbidden = ('protected_gold', 'attack_family', 'custody_class', 'expected_authority_terminal')
          assert not any(token in blob for token in forbidden)
          summary = json.loads((root / 'host_prep_summary.json').read_text())
          assert summary['attack_labels_visible_to_candidate'] is False
          assert summary['outcome_accessed'] is False
          assert summary['ambiguous_cases'] == 0
          assert summary['case_count'] == 420
          print('independent host handoff verified: gold-blind, outcome-blind, 420 cases')
          PY

      - name: Stage public handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p4-public-handoff"
          cp "$RUNNER_TEMP/p4-host-prep/candidate_manifest.jsonl" "$RUNNER_TEMP/p4-public-handoff/"
          cp "$RUNNER_TEMP/p4-host-prep/RUN_MANIFEST_V1.json" "$RUNNER_TEMP/p4-public-handoff/"
          cp "$RUNNER_TEMP/p4-host-prep/host_prep_summary.json" "$RUNNER_TEMP/p4-public-handoff/"
          cp papers/orion-14-verified-scientific-discovery/host/BASELINE_CONFIGS_V1.json "$RUNNER_TEMP/p4-public-handoff/"

      - name: Print safe freeze summary
        shell: bash
        run: |
          set -euo pipefail
          echo 'P4_HOST_PREP_SAFE_SUMMARY_BEGIN'
          cat "$RUNNER_TEMP/p4-host-prep/host_prep_summary.json"
          echo 'P4_HOST_PREP_SAFE_SUMMARY_END'

      - name: Upload candidate-visible handoff
        uses: actions/upload-artifact@v4
        with:
          name: p4-host-prep-public-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-public-handoff
          if-no-files-found: error
          retention-days: 90

      - name: Upload protected custody artifact
        uses: actions/upload-artifact@v4
        with:
          name: p4-host-prep-protected-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p4-host-prep/protected_manifest.jsonl
            ${{ runner.temp }}/p4-host-prep/source_snapshots.jsonl
            ${{ runner.temp }}/p4-host-prep/RUN_MANIFEST_V1.json
          if-no-files-found: error
          retention-days: 90
