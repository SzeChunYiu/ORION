name: Five-paper R9 NQ Engine-B neutral corpus v2

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/r9-nq-engine-b-small-group-oracle-20260826
    paths:
      - 'papers/five-paper-top-tier-r8/NQ/export_engine_b_small_group_corpus_r9_v2.py'
      - 'papers/five-paper-top-tier-r8/NQ/ENGINE_B_NEUTRAL_CORPUS_V1_REVOKED_R9.json'
      - 'papers/five-paper-top-tier-r8/NQ/ENGINE_B_SMALL_GROUP_INDEPENDENT_OUTPUT_SCHEMA_R9.json'
      - '.github/workflows/five-paper-r9-nq-engine-b-neutral-corpus-v2.yml'

permissions:
  contents: read

jobs:
  export-authoritative-neutral-corpus-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install schema validator
        run: python -m pip install --upgrade jsonschema
      - name: Export 21,604 cases with per-sequence dual-oracle values
        run: |
          cd papers/five-paper-top-tier-r8/NQ
          python export_engine_b_small_group_corpus_r9_v2.py \
            --output /tmp/ENGINE_B_SMALL_GROUP_NEUTRAL_CORPUS_R9_V2.jsonl \
            --manifest /tmp/ENGINE_B_SMALL_GROUP_NEUTRAL_CORPUS_MANIFEST_R9_V2.json
      - name: Validate authoritative V2 manifest and independent-output schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          manifest = json.loads(Path('/tmp/ENGINE_B_SMALL_GROUP_NEUTRAL_CORPUS_MANIFEST_R9_V2.json').read_text())
          assert manifest['case_count'] == 21604
          assert manifest['supersedes']['authority'] is False
          assert manifest['neutrality']['contains_per_sequence_registered_packing_number'] is True
          assert manifest['neutrality']['registered_value_requires_dual_oracle_agreement'] is True
          assert manifest['neutrality']['contains_zero_sum_position_masks'] is False
          assert manifest['neutrality']['contains_registered_solver_state'] is False
          assert manifest['neutrality']['independent_solver_may_import_oracle_code'] is False
          assert all(row['observed_minimum_packing'] == row['registered_minimum_packing_at_length'] for row in manifest['boundaries'])
          schema_path = Path('papers/five-paper-top-tier-r8/NQ/ENGINE_B_SMALL_GROUP_INDEPENDENT_OUTPUT_SCHEMA_R9.json')
          Draft202012Validator.check_schema(json.loads(schema_path.read_text()))
          PY
      - name: Archive authoritative V2 corpus and manifest
        uses: actions/upload-artifact@v4
        with:
          name: nq-engine-b-small-group-neutral-corpus-r9-v2
          path: |
            /tmp/ENGINE_B_SMALL_GROUP_NEUTRAL_CORPUS_R9_V2.jsonl
            /tmp/ENGINE_B_SMALL_GROUP_NEUTRAL_CORPUS_MANIFEST_R9_V2.json
            papers/five-paper-top-tier-r8/NQ/ENGINE_B_SMALL_GROUP_INDEPENDENT_OUTPUT_SCHEMA_R9.json
            papers/five-paper-top-tier-r8/NQ/ENGINE_B_NEUTRAL_CORPUS_V1_REVOKED_R9.json
          if-no-files-found: error
          retention-days: 30
