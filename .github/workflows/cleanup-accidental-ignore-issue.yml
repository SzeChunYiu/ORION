name: Cleanup accidental IGNORE issue

on:
  push:
    paths:
      - ".github/workflows/cleanup-accidental-ignore-issue.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Close exact accidental issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 200 \
            --json number,title,body \
            --jq '.[] | select(.title == "IGNORE" and .body == "IGNORE") | .number' \
            | while read -r number; do
                test -n "$number" || continue
                gh issue close "$number" \
                  --repo "$GITHUB_REPOSITORY" \
                  --comment 'Closed: accidental connector artifact; no project work was attached.'
              done
      - name: Remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-accidental-ignore-issue.yml
          git commit -m 'chore: remove one-shot issue cleanup [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
