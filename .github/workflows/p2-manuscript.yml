name: p2-manuscript

on:
  pull_request:
    paths:
      - 'papers/orion-12-open-world-scientific-discovery/manuscript/**'
      - 'papers/orion-12-open-world-scientific-discovery/JOURNAL_READINESS.md'
      - 'papers/orion-12-open-world-scientific-discovery/JOURNAL_READINESS_V2.md'
      - 'papers/orion-12-open-world-scientific-discovery/evidence/CLAIM_LEDGER_V2.md'
      - 'papers/orion-12-open-world-scientific-discovery/notes/submission/**'
      - 'papers/orion-12-open-world-scientific-discovery/protocol/P2_*'
      - 'papers/orion-12-open-world-scientific-discovery/scripts/check_claim_ledger.py'
      - 'papers/orion-12-open-world-scientific-discovery/scripts/check_p2_v2.py'
      - 'papers/orion-12-open-world-scientific-discovery/tests/test_p2_v2.py'
      - '.github/workflows/p2-manuscript.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest Paper-2 build for a PR/ref. The widening lane changes
# several tightly coupled artifacts per iteration; validating superseded SHAs
# wastes runner capacity and delays the exact tree that can actually merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable V1 claim bindings
        run: python papers/orion-12-open-world-scientific-discovery/scripts/check_claim_ledger.py --check
      - name: Validate V2 widening contract
        run: python papers/orion-12-open-world-scientific-discovery/scripts/check_p2_v2.py
      - name: Run V2 contract tests
        run: python -m unittest discover -s papers/orion-12-open-world-scientific-discovery/tests -p 'test_p2_v2.py'

  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate-v2
    defaults:
      run:
        working-directory: papers/orion-12-open-world-scientific-discovery/manuscript
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            poppler-utils

      - name: Compile manuscript
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Fail on unresolved references or citations
        run: |
          if grep -Eqi 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log; then
            echo 'Unresolved citation/reference warning found in main.log' >&2
            grep -Ei 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log >&2 || true
            exit 1
          fi

      - name: Record PDF metadata and TeX warnings
        run: |
          pdfinfo main.pdf | tee P2_MANUSCRIPT_PDFINFO.txt
          grep -Ei 'LaTeX Warning|Overfull \\hbox|Underfull \\hbox' main.log > P2_MANUSCRIPT_WARNINGS.txt || true
          test -s main.pdf

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2-manuscript-review-${{ github.sha }}
          path: |
            papers/orion-12-open-world-scientific-discovery/manuscript/main.pdf
            papers/orion-12-open-world-scientific-discovery/manuscript/main.log
            papers/orion-12-open-world-scientific-discovery/manuscript/main.bbl
            papers/orion-12-open-world-scientific-discovery/manuscript/P2_MANUSCRIPT_PDFINFO.txt
            papers/orion-12-open-world-scientific-discovery/manuscript/P2_MANUSCRIPT_WARNINGS.txt
          if-no-files-found: error
          retention-days: 30
