name: p2-manuscript

on:
  pull_request:
    paths:
      - 'papers/paper-02-open-world-scientific-discovery/manuscript/**'
      - 'papers/paper-02-open-world-scientific-discovery/JOURNAL_READINESS.md'
      - 'papers/paper-02-open-world-scientific-discovery/notes/submission/**'
      - 'papers/paper-02-open-world-scientific-discovery/protocol/P2_*'
      - '.github/workflows/p2-manuscript.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: papers/paper-02-open-world-scientific-discovery/manuscript
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            poppler-utils

      - name: Compile manuscript
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Fail on unresolved references or citations
        run: |
          if grep -Eqi 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log; then
            echo 'Unresolved citation/reference warning found in main.log' >&2
            grep -Ei 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log >&2 || true
            exit 1
          fi

      - name: Record PDF metadata and TeX warnings
        run: |
          pdfinfo main.pdf | tee P2_MANUSCRIPT_PDFINFO.txt
          grep -Ei 'LaTeX Warning|Overfull \\hbox|Underfull \\hbox' main.log > P2_MANUSCRIPT_WARNINGS.txt || true
          test -s main.pdf

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2-manuscript-review-${{ github.sha }}
          path: |
            papers/paper-02-open-world-scientific-discovery/manuscript/main.pdf
            papers/paper-02-open-world-scientific-discovery/manuscript/main.log
            papers/paper-02-open-world-scientific-discovery/manuscript/main.bbl
            papers/paper-02-open-world-scientific-discovery/manuscript/P2_MANUSCRIPT_PDFINFO.txt
            papers/paper-02-open-world-scientific-discovery/manuscript/P2_MANUSCRIPT_WARNINGS.txt
          if-no-files-found: error
          retention-days: 30
