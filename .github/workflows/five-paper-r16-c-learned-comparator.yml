name: five-paper-r16-c-learned-comparator

on:
  push:
    branches:
      - chatgpt/r16-c-learned-comparator-20260826
    paths:
      - 'papers/five-paper-top-tier-r8/C/FIBERGUARD_LEARNED_COMPARATOR_R16_PROTOCOL.md'
      - 'papers/five-paper-top-tier-r8/C/fiberguard_learned_comparator_r16.py'
      - '.github/workflows/five-paper-r16-c-learned-comparator.yml'
  pull_request:
    paths:
      - 'papers/five-paper-top-tier-r8/C/FIBERGUARD_LEARNED_COMPARATOR_R16_PROTOCOL.md'
      - 'papers/five-paper-top-tier-r8/C/fiberguard_learned_comparator_r16.py'
      - '.github/workflows/five-paper-r16-c-learned-comparator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  untouched-learned-comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen learned baseline
        run: python -m pip install 'PyYAML==6.0.2' 'scikit-learn==1.5.2'

      - name: Materialize untouched comparator registry
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/aslib_data"
          git init "$root"
          git -C "$root" remote add origin https://github.com/coseal/aslib_data.git
          git -C "$root" config core.sparseCheckout true
          cat > "$root/.git/info/sparse-checkout" <<'EOF'
          /BNSL-2016/
          /MIP-2016/
          /TSP-LION2015/
          EOF
          git -C "$root" fetch --depth 1 origin 551b22beef8df17de59286b4822ef720e0aa4d6f
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = '551b22beef8df17de59286b4822ef720e0aa4d6f'

      - name: Compile and run hostile self-test
        shell: bash
        run: |
          set -euo pipefail
          root='papers/five-paper-top-tier-r8/C'
          python -m py_compile \
            "$root/fiberguard_aslib_sat12_all_r11.py" \
            "$root/fiberguard_aslib_transfer_r14.py" \
            "$root/fiberguard_multidomain_r15.py" \
            "$root/fiberguard_multidomain_r15_schema_repair.py" \
            "$root/fiberguard_learned_comparator_r16.py"
          python "$root/fiberguard_learned_comparator_r16.py" --self-test | tee "$RUNNER_TEMP/self-test.json"
          grep -q '"train_only_matrix_contract":true' "$RUNNER_TEMP/self-test.json"
          grep -q '"dominance_contract":true' "$RUNNER_TEMP/self-test.json"

      - name: Execute frozen learned comparator twice
        shell: bash
        run: |
          set -euo pipefail
          script='papers/five-paper-top-tier-r8/C/fiberguard_learned_comparator_r16.py'
          root="$RUNNER_TEMP/aslib_data"
          python "$script" --aslib-root "$root" --output "$RUNNER_TEMP/result-a.json" | tee "$RUNNER_TEMP/terminal-a.txt"
          python "$script" --aslib-root "$root" --output "$RUNNER_TEMP/result-b.json" | tee "$RUNNER_TEMP/terminal-b.txt"
          cmp "$RUNNER_TEMP/result-a.json" "$RUNNER_TEMP/result-b.json"
          cmp "$RUNNER_TEMP/terminal-a.txt" "$RUNNER_TEMP/terminal-b.txt"
          grep -q '^FIBERGUARD_LEARNED_COMPARATOR_R16_PASS ' "$RUNNER_TEMP/terminal-a.txt"

      - name: Verify comparator, custody and authority ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sklearn

          result = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'result-a.json').read_text()
          )
          assert sklearn.__version__ == '1.5.2'
          assert result['schema'] == 'ORION.FiberGuard.LearnedComparator.R16.v1'
          assert result['source_parent'] == '4aac9b030c7e143b739caf42262718924b9a9005'
          assert result['upstream']['commit'] == '551b22beef8df17de59286b4822ef720e0aa4d6f'
          assert result['upstream']['scenario_registry'] == [
              'BNSL-2016',
              'MIP-2016',
              'TSP-LION2015',
          ]
          assert result['model_contract']['scikit_learn_version'] == '1.5.2'
          assert result['model_contract']['forest_parameters'] == {
              'bootstrap': True,
              'max_depth': 18,
              'max_features': 'sqrt',
              'min_samples_leaf': 2,
              'n_estimators': 96,
              'n_jobs': 1,
          }
          assert all(result['controls'].values())
          expected_arms = {
              'no_features',
              'fiberguard_selected',
              'rf_regression_same_steps',
              'rf_classification_same_steps',
              'rf_regression_all_steps',
              'rf_classification_all_steps',
          }
          assert len(result['scenarios']) == 3
          assert all(len(scenario['splits']) == 2 for scenario in result['scenarios'])
          assert all(
              set(split['arms']) == expected_arms
              for scenario in result['scenarios']
              for split in scenario['splits']
          )
          allowed = {
              'C_FIBERGUARD_DOMINATES_BOTH_SAME_REPRESENTATION_RF',
              'C_BOTH_RF_FORMULATIONS_DOMINATE_FIBERGUARD',
              'C_RF_REGRESSION_DOMINATES_FIBERGUARD',
              'C_RF_CLASSIFICATION_DOMINATES_FIBERGUARD',
              'C_LEARNED_AND_FIBERGUARD_MIXED_NO_DOMINANCE',
          }
          assert set(result['portfolio']['terminal_histogram']) <= allowed
          authority = result['authority']
          assert authority['prospective_untouched_comparator_evidence'] is True
          assert authority['same_owner_implementation'] is True
          assert authority['strongest_configured_or_censor_aware_selector'] is False
          assert authority['external_replay'] is False
          assert authority['grants_journal_authority'] is False
          print('LEARNED_COMPARATOR_R16_RESULT_VERIFIED')
          PY

      - name: Check diff hygiene
        run: git diff --check

      - name: Stage immutable result artifact
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/fiberguard-learned-comparator-r16"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/result-a.json" "$out/FIBERGUARD_LEARNED_COMPARATOR_R16_RESULTS.json"
          cp "$RUNNER_TEMP/terminal-a.txt" "$out/TERMINAL.txt"
          cp "$RUNNER_TEMP/self-test.json" "$out/SELF_TEST.json"
          sha256sum "$out"/* > "$out/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: fiberguard-learned-comparator-r16
          path: ${{ runner.temp }}/fiberguard-learned-comparator-r16/
          if-no-files-found: error
          retention-days: 30
