name: orion-q-max-r6h-partial-tag-sharing

on:
  pull_request:
    paths:
      - 'development/orion-q-max-r0/MAX_R6H_PARTIAL_TAG_SHARING_DONOR_PROTOCOL.md'
      - 'research/extensions/orion-q/max_r6h_partial_tag_sharing_donor.py'
      - 'research/extensions/orion-q/max_r6b_tare_transformation_reuse_donor.py'
      - 'research/extensions/orion-q/max_r6d_sixterm_partition_representation_coopt.py'
      - 'research/extensions/orion-q/max_r6f_donor_clifford_preconditioned_tare3.py'
      - 'research/extensions/orion-q/max_r6_exact_tare3_joint_frame_dp.py'
      - 'research/extensions/orion-q/max_r6_p10_candidate_blind_frame_optimizer.py'
      - '.github/workflows/orion-q-max-r6h-partial-tag-sharing.yml'
  workflow_dispatch:

concurrency:
  group: orion-q-max-r6h-partial-tag-sharing-${{ github.sha }}
  cancel-in-progress: false

jobs:
  frozen-r6h-donor-development:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Refuse R6H frozen blob drift
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              'development/orion-q-max-r0/MAX_R6H_PARTIAL_TAG_SHARING_DONOR_PROTOCOL.md': '5245b90ebb1829d48d5959954957f7ba18fd0e90',
              'research/extensions/orion-q/max_r6h_partial_tag_sharing_donor.py': '5161bcfe4ec963e0d8491840c9781822c6a30d24',
              'research/extensions/orion-q/max_r6b_tare_transformation_reuse_donor.py': '10d5f94743ca3ea6a73822f716acfe7b79b39798',
              'research/extensions/orion-q/max_r6d_sixterm_partition_representation_coopt.py': '134cc587ffa218512deb4b37407e2ed8dfe570ef',
              'research/extensions/orion-q/max_r6f_donor_clifford_preconditioned_tare3.py': '26070b9ae93ece5c265f183385ae0d336b1024af',
              'research/extensions/orion-q/max_r6_exact_tare3_joint_frame_dp.py': '9831c55686bd26344c30a43775ca48f0ee63a3da',
              'research/extensions/orion-q/max_r6_p10_candidate_blind_frame_optimizer.py': '145b73cab49423cdd0f353c1619695a7fb0d1bfc',
          }
          for name, want in expected.items():
              raw=Path(name).read_bytes()
              got=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              if got != want:
                  raise SystemExit(f'R6H frozen blob drift: {name}: {got} != {want}')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run frozen partial Tag-sharing donor search
        run: |
          cd research/extensions/orion-q
          python max_r6h_partial_tag_sharing_donor.py \
            --detail-json /tmp/r6h-detail.json | tee /tmp/r6h.txt
          grep '^ORIONQ_MAX_R6H_PARTIAL_TAG_SHARING=' /tmp/r6h.txt
      - name: Verify receipt without coercing donor sign
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          prefix='ORIONQ_MAX_R6H_PARTIAL_TAG_SHARING='
          rows=[x for x in Path('/tmp/r6h.txt').read_text().splitlines() if x.startswith(prefix)]
          if len(rows)!=1:
              raise SystemExit(f'expected one R6H receipt, got {len(rows)}')
          p=json.loads(rows[0][len(prefix):])
          gates=p.get('gates')
          if not isinstance(gates,dict) or not gates or not all(v is True for v in gates.values()):
              raise SystemExit(f'R6H integrity gates failed: {gates}')
          if p.get('reserved_stretched_n2_accessed') is not False:
              raise SystemExit('R6H accessed protected stretched N2')
          if p.get('donor_novelty_credit') is not False or p.get('novelty_credit') is not False:
              raise SystemExit('R6H gave donor novelty credit')
          if p.get('r6_authority') is not False:
              raise SystemExit('R6H self-promoted')
          detail=json.loads(Path('/tmp/r6h-detail.json').read_text())
          raw=json.dumps(detail,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          if hashlib.sha256(raw).hexdigest()!=p.get('detail_bundle_sha256'):
              raise SystemExit('R6H detail digest mismatch')
          supported=p.get('development_supported') is True
          if supported:
              if p.get('authority')!='MAX_R6H_PARTIAL_TAG_SHARING_DONOR_POSITIVE__ABSORB__NOT_R6':
                  raise SystemExit('R6H support/authority disagreement')
              for name in ('H4','N2'):
                  if p.get('subjects',{}).get(name,{}).get('strict_budget_matched_improvement_exists') is not True:
                      raise SystemExit(f'R6H positive without strict {name} point')
          print('R6H_DONOR_SIGN='+('POSITIVE' if supported else 'NONPOSITIVE'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orion-q-max-r6h-partial-tag-sharing-receipt
          path: |
            /tmp/r6h.txt
            /tmp/r6h-detail.json
          if-no-files-found: warn
          retention-days: 30
