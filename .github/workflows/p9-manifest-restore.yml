name: p9-manifest-restore

on:
  push:
    branches:
      - shadow/papers-p1-p10-binding-sync-20260820

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shadow/papers-p1-p10-binding-sync-20260820
          fetch-depth: 0
      - name: Restore historical P9/P10 manifest used by V2 overlay
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- papers/candidates/orion-learning-machine/PUBLICATION_MANIFEST_SHA256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Historical manifest already restored.'
            exit 0
          fi
          git commit -m 'Restore historical P9-P10 manifest for V2 overlay'
          git push origin HEAD:shadow/papers-p1-p10-binding-sync-20260820
