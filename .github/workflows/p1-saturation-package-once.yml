# retrigger 2026-08-19T11:00+02:00
name: p1-saturation-package-once

on:
  push:
    branches: [saturation/p1-nature-skills-round-a-2026-08-19]
    paths: ['.github/workflows/p1-saturation-package-once.yml']

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saturation/p1-nature-skills-round-a-2026-08-19
          fetch-depth: 0
      - name: Install TeX/render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures poppler-utils
      - name: Compile saturated P1 manuscript
        working-directory: papers/paper-01-recursive-epistemic-reconstruction/manuscript
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          if grep -Eqi 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log; then
            echo 'P1 unresolved citation/reference' >&2; exit 1
          fi
          if grep -Eq 'Overfull \\hbox|Overfull \\vbox' main.log; then
            echo 'P1 overfull box' >&2; grep -E 'Overfull \\hbox|Overfull \\vbox' main.log >&2; exit 1
          fi
          pdfinfo main.pdf > P1_SATURATION_PDFINFO.txt
          test -s main.pdf
      - name: Rebind P1 journal package
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cp papers/paper-01-recursive-epistemic-reconstruction/manuscript/main.pdf papers/paper-01-recursive-epistemic-reconstruction/journal_package/manuscript.pdf
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          root=Path('papers/paper-01-recursive-epistemic-reconstruction')
          mp=root/'journal_package/MANIFEST.json'
          m=json.loads(mp.read_text())
          m['audit_subject_revision']=os.environ['SOURCE_SHA']
          m['audit_date']='2026-08-19'
          mp.write_text(json.dumps(m,indent=2)+'\n')
          (root/'journal_package/CLAIM_PDF_AUDIT.md').write_text(f'''# ORION-P1 saturation claim / PDF audit\n\nAudit source: `{os.environ['SOURCE_SHA']}`.\n\n- Historical broad V1 remains `NOT_SUPPORTED` / underpowered and is retained as negative history.\n- Powered mutation-necessity primary and disjoint replication remain unchanged and supported in the frozen mechanical world family.\n- HarnessFix and dependency-guided rollback are now explicitly donor-credited; the residual is the protected authority rule for high-level epistemic mutation after lower-level alternatives are excluded.\n- Parnas/AGM are presented as precedent/analogy, not as a proved derivation.\n- No model-general or open-ended scientific-agent superiority is asserted.\n- The saturated manuscript rebuilt after the 2026-08-19 reference/ownership edits with no unresolved citations/references or overfull boxes.\n- Figures/tables remain part of the same evidence package; final visual inspection is recorded in `research/saturation/p1/FINAL_SATURATION_AUDIT.md`.\n''')
          sys.path.insert(0,'research/paper-programme-v1/journal_package')
          import check_journal_package as c
          m=c.load_manifest(root/'journal_package')
          c.write_sha256sums(root,c.hashed_paths(m))
          PY
          python research/paper-programme-v1/journal_package/check_journal_package.py --root .
      - uses: actions/upload-artifact@v4
        with:
          name: p1-saturation-review-${{ github.sha }}
          path: |
            papers/paper-01-recursive-epistemic-reconstruction/manuscript/main.pdf
            papers/paper-01-recursive-epistemic-reconstruction/manuscript/main.log
            papers/paper-01-recursive-epistemic-reconstruction/manuscript/P1_SATURATION_PDFINFO.txt
            papers/paper-01-recursive-epistemic-reconstruction/journal_package/manuscript.pdf
          if-no-files-found: error
      - name: Commit saturated package and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p1-saturation-package-once.yml
          git add papers/paper-01-recursive-epistemic-reconstruction/journal_package/MANIFEST.json \
                  papers/paper-01-recursive-epistemic-reconstruction/journal_package/CLAIM_PDF_AUDIT.md \
                  papers/paper-01-recursive-epistemic-reconstruction/journal_package/manuscript.pdf \
                  papers/paper-01-recursive-epistemic-reconstruction/journal_package/SHA256SUMS
          git commit -m 'papers(p1): rebuild and bind saturated review package'
          git push origin HEAD:saturation/p1-nature-skills-round-a-2026-08-19
