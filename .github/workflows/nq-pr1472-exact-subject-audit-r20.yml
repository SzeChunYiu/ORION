name: nq-pr1472-exact-subject-audit-r20

on:
  push:
    branches:
      - chatgpt/orion-02-r18-null-current-main-20260827
    paths:
      - 'research/five-paper-top-tier-r20/audit_nq_pr1472.py'
      - '.github/workflows/nq-pr1472-exact-subject-audit-r20.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  exact-subject-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact PR 1472 subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/1472" > "$RUNNER_TEMP/pr.json"
          base="$(jq -r .base.sha "$RUNNER_TEMP/pr.json")"
          head="$(jq -r .head.sha "$RUNNER_TEMP/pr.json")"
          git fetch --no-tags origin "$base" "$head"
          printf '%s\n' "$base" > "$RUNNER_TEMP/base.txt"
          printf '%s\n' "$head" > "$RUNNER_TEMP/head.txt"
          git worktree add --detach "$RUNNER_TEMP/pr1472" "$head"
      - name: Audit complete denominators, proof checks, and circularity
        shell: bash
        run: |
          set -euo pipefail
          script='research/five-paper-top-tier-r20/audit_nq_pr1472.py'
          python -m py_compile "$script"
          python "$script" \
            --repo "$RUNNER_TEMP/pr1472" \
            --base "$(cat "$RUNNER_TEMP/base.txt")" \
            --head "$(cat "$RUNNER_TEMP/head.txt")" \
            --output "$RUNNER_TEMP/audit-a.json" | tee "$RUNNER_TEMP/terminal-a.txt"
          python "$script" \
            --repo "$RUNNER_TEMP/pr1472" \
            --base "$(cat "$RUNNER_TEMP/base.txt")" \
            --head "$(cat "$RUNNER_TEMP/head.txt")" \
            --output "$RUNNER_TEMP/audit-b.json" | tee "$RUNNER_TEMP/terminal-b.txt"
          cmp "$RUNNER_TEMP/audit-a.json" "$RUNNER_TEMP/audit-b.json"
          cmp "$RUNNER_TEMP/terminal-a.txt" "$RUNNER_TEMP/terminal-b.txt"
      - name: Preserve authority ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'audit-a.json').read_text())
          assert result['schema']=='ORION.NQ.PR1472ExactSubjectAudit.R20.v1'
          assert result['target_pr']==1472
          assert result['authority']['D4_authority'] is False
          assert result['authority']['external_independence'] is False
          assert result['authority']['journal_authority'] is False
          if result['terminal']=='NQ_PR1472_FULL_REPLAY_SUBJECT_PASS':
              assert all(result['gates'].values())
              assert result['authority']['D2_D3_numerical_authority'] is True
          else:
              assert result['terminal']=='NQ_PR1472_NOT_FULL_REPLAY_AUTHORITY'
              assert result['authority']['D2_D3_numerical_authority'] is False
          print('NQ_PR1472_AUTHORITY_CLASSIFIED',result['terminal'])
          PY
      - name: Check diff hygiene
        run: git diff --check
      - name: Stage audit artifact
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nq-pr1472-exact-subject-audit"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/pr.json" "$out/PR1472.json"
          cp "$RUNNER_TEMP/audit-a.json" "$out/NQ_PR1472_EXACT_SUBJECT_AUDIT.json"
          cp "$RUNNER_TEMP/terminal-a.txt" "$out/TERMINAL.txt"
          sha256sum "$out"/* > "$out/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: nq-pr1472-exact-subject-audit
          path: ${{ runner.temp }}/nq-pr1472-exact-subject-audit/
          if-no-files-found: error
          retention-days: 30
