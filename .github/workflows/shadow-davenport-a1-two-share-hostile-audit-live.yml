name: shadow-davenport-a1-two-share-hostile-audit-live

on:
  push:
    branches:
      - shadow/davenport-c7-frontier-20260903
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-davenport-a1-two-share-hostile-audit-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hostile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run repository theorem checker
        run: python research/experiments/davenport-c7-frontier/check_a1_light_support3_two_share_elimination_v1.py
      - name: Compile independent occurrence-DP verifier
        run: g++ -O3 -std=c++17 research/experiments/davenport-c7-frontier/verify_a1_light_support3_two_share_independent_v1.cpp -o /tmp/a1-c2-independent
      - name: Run independent exhaustive replay and mutation control
        run: /tmp/a1-c2-independent
      - name: Compile ASan and UBSan replay
        run: g++ -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -std=c++17 research/experiments/davenport-c7-frontier/verify_a1_light_support3_two_share_independent_v1.cpp -o /tmp/a1-c2-sanitized
      - name: Run sanitizer replay
        run: ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 /tmp/a1-c2-sanitized
