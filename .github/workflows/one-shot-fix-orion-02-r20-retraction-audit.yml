name: one-shot-fix-orion-02-r20-retraction-audit
on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths: ['.github/workflows/one-shot-fix-orion-02-r20-retraction-audit.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: chatgpt/orion-02-r18-null-current-main-20260827}
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('papers/orion-02-fiberguard-finite-fibre/audit_retractions_r20.py')
          text=path.read_text()
          old='''                corrected = corrected_context(text, match.start(), match.end())\n                row = {'''
          new='''                protocol_object = (\n                    "protocol" in path.name.lower()\n                    or path.suffix.lower() in {".yml", ".yaml"}\n                    and any(marker in text.lower() for marker in ("allowed", "terminals", "protocol"))\n                )\n                corrected = protocol_object or corrected_context(text, match.start(), match.end())\n                row = {'''
          if old not in text: raise SystemExit('retraction correction target absent')
          path.write_text(text.replace(old,new))
          PY
          rm .github/workflows/one-shot-fix-orion-02-r20-retraction-audit.yml
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/orion-02-fiberguard-finite-fibre/audit_retractions_r20.py .github/workflows/one-shot-fix-orion-02-r20-retraction-audit.yml
          git commit -m 'fix(ORION-02): exempt frozen protocol terminal enumerations'
          git push origin HEAD:refs/heads/chatgpt/orion-02-r18-null-current-main-20260827
