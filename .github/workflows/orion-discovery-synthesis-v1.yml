name: orion-discovery-synthesis-v1

on:
  pull_request:
    paths:
      - "research/orion-discovery-v1/COMPOSITION_TRANSFER_COMPLETION_CALCULUS_V1.md"
      - "research/orion-discovery-v1/DISCOVERY_EVENT_NORMAL_FORM_V1.md"
      - "research/orion-discovery-v1/FRONTIER_MATH_NAVIGATION_PROTOCOL_V1.md"
      - "research/orion-discovery-v1/DISCOVERY_SYNTHESIS_*.json"
      - "research/orion-discovery-v1/AI_EXECUTOR_PROMPT_SYNTHESIS_V1.md"
      - "src/orion/discovery/synthesis_modes.py"
      - "src/orion/discovery/structural_navigation.py"
      - "tests/unit/discovery/test_synthesis_modes.py"
      - "tests/unit/discovery/test_structural_navigation.py"
      - "scripts/check_orion_discovery_synthesis_v1.py"
      - "development/orion-discovery-three-mode-v1-2026-08-25/**"
      - ".github/workflows/orion-discovery-synthesis-v1.yml"

permissions:
  contents: read

jobs:
  synthesis-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ORION
        run: python -m pip install -e '.[dev]'
      - name: Validate synthesis theory and compute backlog
        run: python scripts/check_orion_discovery_synthesis_v1.py
      - name: Run synthesis and navigation hostile tests
        run: |
          python -m pytest -q \
            tests/unit/discovery/test_synthesis_modes.py \
            tests/unit/discovery/test_structural_navigation.py
      - name: Compile reference modules
        run: |
          python -m compileall -q \
            src/orion/discovery/synthesis_modes.py \
            src/orion/discovery/structural_navigation.py \
            scripts/check_orion_discovery_synthesis_v1.py
