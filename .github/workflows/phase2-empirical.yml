name: phase2-empirical

on:
  push:
    branches:
      - agent/phase2-empirical-execution
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ORION_PROTECTED_VERIFIER_URL: ${{ secrets.ORION_PROTECTED_VERIFIER_URL }}
  ORION_PROTECTED_VERIFIER_TOKEN: ${{ secrets.ORION_PROTECTED_VERIFIER_TOKEN }}
  ORION_PROTECTED_VERIFIER_ARTIFACT_HASH: ${{ secrets.ORION_PROTECTED_VERIFIER_ARTIFACT_HASH }}
  ORION_PHASE2_EVALUATION_EPOCH_ID: ${{ secrets.ORION_PHASE2_EVALUATION_EPOCH_ID }}
  ORION_PROTECTED_SANDBOX_URL: ${{ secrets.ORION_PROTECTED_SANDBOX_URL }}
  ORION_PROTECTED_SANDBOX_TOKEN: ${{ secrets.ORION_PROTECTED_SANDBOX_TOKEN }}
  ORION_PROTECTED_SANDBOX_ARTIFACT_HASH: ${{ secrets.ORION_PROTECTED_SANDBOX_ARTIFACT_HASH }}
  ORION_PROTECTED_DEVELOPMENT_EVALUATOR_URL: ${{ secrets.ORION_PROTECTED_DEVELOPMENT_EVALUATOR_URL }}
  ORION_PROTECTED_DEVELOPMENT_EVALUATOR_TOKEN: ${{ secrets.ORION_PROTECTED_DEVELOPMENT_EVALUATOR_TOKEN }}
  ORION_AUTHORITY_ATTACK_EXECUTOR_URL: ${{ secrets.ORION_AUTHORITY_ATTACK_EXECUTOR_URL }}
  ORION_AUTHORITY_ATTACK_EXECUTOR_TOKEN: ${{ secrets.ORION_AUTHORITY_ATTACK_EXECUTOR_TOKEN }}
  ORION_AUTHORITY_ATTACK_EXECUTOR_ARTIFACT_HASH: ${{ secrets.ORION_AUTHORITY_ATTACK_EXECUTOR_ARTIFACT_HASH }}
  ORION_AUTHORITY_EVALUATOR_URL: ${{ secrets.ORION_AUTHORITY_EVALUATOR_URL }}
  ORION_AUTHORITY_EVALUATOR_TOKEN: ${{ secrets.ORION_AUTHORITY_EVALUATOR_TOKEN }}
  ORION_AUTHORITY_EVALUATOR_PROCESS_LINEAGE_HASH: ${{ secrets.ORION_AUTHORITY_EVALUATOR_PROCESS_LINEAGE_HASH }}

jobs:
  custody-preflight:
    runs-on: ubuntu-24.04
    outputs:
      all_ready: ${{ steps.preflight.outputs.all_ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check protected Phase-2 custody bindings
        id: preflight
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          groups = {
              "live_research": (
                  "OPENAI_API_KEY",
                  "ORION_PROTECTED_VERIFIER_URL",
                  "ORION_PROTECTED_VERIFIER_TOKEN",
                  "ORION_PROTECTED_VERIFIER_ARTIFACT_HASH",
                  "ORION_PHASE2_EVALUATION_EPOCH_ID",
              ),
              "shadow_development": (
                  "ORION_PROTECTED_SANDBOX_URL",
                  "ORION_PROTECTED_SANDBOX_TOKEN",
                  "ORION_PROTECTED_SANDBOX_ARTIFACT_HASH",
                  "ORION_PROTECTED_DEVELOPMENT_EVALUATOR_URL",
                  "ORION_PROTECTED_DEVELOPMENT_EVALUATOR_TOKEN",
              ),
              "hostile_authority": (
                  "ORION_AUTHORITY_ATTACK_EXECUTOR_URL",
                  "ORION_AUTHORITY_ATTACK_EXECUTOR_TOKEN",
                  "ORION_AUTHORITY_ATTACK_EXECUTOR_ARTIFACT_HASH",
                  "ORION_AUTHORITY_EVALUATOR_URL",
                  "ORION_AUTHORITY_EVALUATOR_TOKEN",
                  "ORION_AUTHORITY_EVALUATOR_PROCESS_LINEAGE_HASH",
              ),
          }
          report = {
              "schema": "Phase2CustodyPreflight.v1",
              "subject_commit": os.environ["GITHUB_SHA"],
              "groups": {},
          }
          all_ready = True
          for group, names in groups.items():
              missing = [name for name in names if not os.environ.get(name)]
              ready = not missing
              all_ready &= ready
              report["groups"][group] = {"ready": ready, "missing": missing}
              print(f"{group}: {'READY' if ready else 'BLOCKED'}")
              if missing:
                  print("  missing: " + ", ".join(missing))
          report["all_ready"] = all_ready
          Path("phase2-custody-preflight.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"all_ready={'true' if all_ready else 'false'}\n")
      - name: Install ORION
        run: python -m pip install -e '.[dev]'
      - name: Verify local suite before empirical execution
        run: pytest -q
      - name: Record blocked empirical execution
        if: steps.preflight.outputs.all_ready != 'true'
        run: echo "Phase-2 empirical execution is BLOCKED by the retained custody preflight artifact."
      - name: Protected custody is ready
        if: steps.preflight.outputs.all_ready == 'true'
        run: echo "All protected Phase-2 custody groups are READY; execute the frozen campaign with the retained bindings."
      - name: Upload custody preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-custody-preflight-${{ github.sha }}
          path: phase2-custody-preflight.json
          if-no-files-found: error
          retention-days: 30
