name: Transplant ORION-01 PR1602 evidence

on:
  push:
    paths:
      - ".github/workflows/transplant-orion01-pr1602-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orion01-pr1602-path-transplant
  cancel-in-progress: false

jobs:
  transplant:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: 9e9b870b795b6ae0b3726031ced0b9ebef004897
      PACKAGE: papers/orion-01-certificate-realization/v3-bounded-closeout-2026-08-29
      SUCCESSOR: development/orion-01-production-completeness-v1-2026-08-29
      TRANSPLANT: development/orion-01-pr1602-evidence-transplant-2026-08-29

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and verify immutable source commit
        run: |
          git fetch --no-tags origin "$SOURCE_COMMIT"
          test "$(git cat-file -t "$SOURCE_COMMIT")" = commit
          test "$(git rev-parse "$SOURCE_COMMIT^{tree}")" = 4fd5cbfec985c668a583add78561b4f18e88d0f8

      - name: Select only Round-2 and Round-3 development evidence
        run: |
          git ls-tree -r --name-only "$SOURCE_COMMIT" \
            | grep -E '^development/orion-01-round(2|3)[^/]*/' \
            | LC_ALL=C sort -u > /tmp/orion01-evidence-paths.txt
          test -s /tmp/orion01-evidence-paths.txt
          grep -q '^development/orion-01-round2' /tmp/orion01-evidence-paths.txt
          grep -q '^development/orion-01-round3' /tmp/orion01-evidence-paths.txt
          if grep -Ev '^development/orion-01-round(2|3)[^/]*/' /tmp/orion01-evidence-paths.txt; then
            echo 'Path filter escaped the permitted evidence roots.' >&2
            exit 1
          fi

      - name: Fail on conflicting current-tree paths
        run: |
          while IFS= read -r path; do
            if git cat-file -e "HEAD:$path" 2>/dev/null; then
              current="$(git rev-parse "HEAD:$path")"
              source="$(git rev-parse "$SOURCE_COMMIT:$path")"
              if test "$current" != "$source"; then
                echo "Conflicting existing evidence path: $path" >&2
                exit 1
              fi
            fi
          done < /tmp/orion01-evidence-paths.txt

      - name: Transplant exact Git blobs and build custody manifest
        run: |
          while IFS= read -r path; do
            git checkout "$SOURCE_COMMIT" -- "$path"
          done < /tmp/orion01-evidence-paths.txt
          mkdir -p "$TRANSPLANT"
          cp /tmp/orion01-evidence-paths.txt "$TRANSPLANT/PATHS.txt"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess

          source = os.environ['SOURCE_COMMIT']
          root = Path('.')
          out = root / os.environ['TRANSPLANT']
          paths = [line for line in (out / 'PATHS.txt').read_text(encoding='utf-8').splitlines() if line]
          records = []
          roots = set()
          total = 0
          for relative in paths:
              path = root / relative
              payload = path.read_bytes()
              blob = subprocess.check_output(['git', 'rev-parse', f'{source}:{relative}'], text=True).strip()
              mode_line = subprocess.check_output(['git', 'ls-tree', source, '--', relative], text=True).strip()
              mode = mode_line.split(None, 1)[0]
              records.append({
                  'path': relative,
                  'git_mode': mode,
                  'git_blob': blob,
                  'bytes': len(payload),
                  'sha256': hashlib.sha256(payload).hexdigest(),
              })
              total += len(payload)
              roots.add(relative.split('/', 2)[1])
          manifest = {
              'schema': 'ORION.ORION01.PR1602PathTransplant.v1',
              'date': '2026-08-29',
              'issue': 1701,
              'source_pull_request': 1602,
              'source_commit': source,
              'source_tree': '4fd5cbfec985c668a583add78561b4f18e88d0f8',
              'selection_rule': '^development/orion-01-round(2|3)[^/]*/',
              'wholesale_merge_performed': False,
              'stale_workflow_imported': False,
              'evidence_roots': sorted(roots),
              'file_count': len(records),
              'total_bytes': total,
              'files': records,
              'old_terminal': 'CANNOT_CHECK_MOVE_COMPLETENESS',
              'scientific_authority_delta': 'NONE',
              'terminal': 'PATH_TRANSPLANT_COMPLETE',
          }
          (out / 'TRANSPLANT_MANIFEST.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (out / 'README.md').write_text(
              '# ORION-01 PR #1602 evidence transplant\n\n'
              'This directory records a strict path-by-path transplant from commit '
              f'`{source}`. Only development paths matching '
              '`^development/orion-01-round(2|3)[^/]*/` were selected. '\
              'No stale code or workflow was merged.\n\n'
              'The exact source blob identity, byte length, and SHA-256 of every '
              'transplanted file are recorded in `TRANSPLANT_MANIFEST.json`. '\
              'The scientific terminal remains `CANNOT_CHECK_MOVE_COMPLETENESS`; '
              'the transplant adds custody, not scientific authority.\n',
              encoding='utf-8',
          )
          PY
          test "$(python -c 'import json,os; p=json.load(open(os.environ["TRANSPLANT"]+"/TRANSPLANT_MANIFEST.json")); print(p["terminal"])')" = PATH_TRANSPLANT_COMPLETE
          grep -R -F -q 'CANNOT_CHECK_MOVE_COMPLETENESS' $(cut -d/ -f1-2 /tmp/orion01-evidence-paths.txt | sort -u)

      - name: Update bounded custody statements
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os

          package = Path(os.environ['PACKAGE'])
          successor = Path(os.environ['SUCCESSOR'])
          transplant = Path(os.environ['TRANSPLANT'])
          receipt_path = package / 'PR1602_ADOPTION_RECEIPT.json'
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
          receipt['raw_artifact_custody']['full_path_transplant_into_current_main'] = 'COMPLETE_ON_ISSUE_BRANCH'
          receipt['raw_artifact_custody']['transplant_manifest'] = str(transplant / 'TRANSPLANT_MANIFEST.json')
          receipt['raw_artifact_custody']['selection_rule'] = '^development/orion-01-round(2|3)[^/]*/'
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          availability = package / 'DATA_CODE_AVAILABILITY.md'
          text = availability.read_text(encoding='utf-8')
          text = text.replace(
              'Full raw path-by-path transplant remains a custody task; the immutable source commit and hashes remain authoritative in the meantime.',
              'The exact Round-2/Round-3 development evidence paths have been transplanted from the immutable source commit; `development/orion-01-pr1602-evidence-transplant-2026-08-29/TRANSPLANT_MANIFEST.json` binds every source blob, byte length, and SHA-256.'
          )
          availability.write_text(text, encoding='utf-8')

          status = successor / 'ISSUE_1701_CLOSEOUT_STATUS.md'
          text = status.read_text(encoding='utf-8')
          text = text.replace('**Bound, raw transplant still open**', '**Complete on issue branch**')
          text = text.replace(
              'The stale branch is not wholesale-merged.',
              'The strict path transplant is recorded in `development/orion-01-pr1602-evidence-transplant-2026-08-29/TRANSPLANT_MANIFEST.json`; the stale branch is not wholesale-merged.'
          )
          text = text.replace(
              '1. **Raw path-by-path evidence transplant.** PR #1602\'s immutable commit and content hashes are bound, but the full Round-2/Round-3 directory transplant into current main is not claimed complete.\n2. **Generated package artifacts.**',
              '1. **Generated package artifacts.**'
          )
          text = text.replace('3. **Pinned-source execution.**', '2. **Pinned-source execution.**')
          text = text.replace('4. **External authority.**', '3. **External authority.**')
          status.write_text(text, encoding='utf-8')
          PY

      - name: Validate transplant is additive and evidence-only
        run: |
          git diff --name-only HEAD \
            | grep -Ev '^(development/orion-01-round(2|3)[^/]*/|development/orion-01-pr1602-evidence-transplant-2026-08-29/|papers/orion-01-certificate-realization/v3-bounded-closeout-2026-08-29/(PR1602_ADOPTION_RECEIPT.json|DATA_CODE_AVAILABILITY.md)|development/orion-01-production-completeness-v1-2026-08-29/ISSUE_1701_CLOSEOUT_STATUS.md|.github/workflows/transplant-orion01-pr1602-evidence.yml)$' \
            && { echo 'Unexpected path changed by transplant.' >&2; exit 1; } \
            || true
          test -z "$(git diff --name-only HEAD | grep -E '^(src/|tests/|research/|pyproject.toml|setup.py)' || true)"

      - name: Commit evidence and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/transplant-orion01-pr1602-evidence.yml
          git add \
            development/orion-01-round2* \
            development/orion-01-round3* \
            "$TRANSPLANT" \
            "$PACKAGE/PR1602_ADOPTION_RECEIPT.json" \
            "$PACKAGE/DATA_CODE_AVAILABILITY.md" \
            "$SUCCESSOR/ISSUE_1701_CLOSEOUT_STATUS.md"
          git commit -m 'evidence(orion-01): transplant PR1602 Round-2 and Round-3 custody [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
