name: p1-ard

on:
  pull_request:
    paths:
      - 'research/claim_expansion/p1/gpt_r1/**'
      - 'tests/unit/study/p1_causal/test_p1_u_ard_exact_pilot.py'
      - 'papers/paper-01-recursive-epistemic-reconstruction/successor/P1_U_MANUSCRIPT.tex'
      - '.github/workflows/p1-ard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,candidates]'
      - name: Reproduce frozen P1-U ARD receipt
        run: pytest -q tests/unit/study/p1_causal/test_p1_u_ard_exact_pilot.py
