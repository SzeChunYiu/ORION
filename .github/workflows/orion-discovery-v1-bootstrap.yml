name: Bootstrap ORION discovery V1 payload

on:
  push:
    branches:
      - shadow/orion-discovery-harness-v1-20260825
    paths:
      - development/orion-discovery-harness-v1-2026-08-25/PAYLOAD.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shadow/orion-discovery-harness-v1-20260825
          fetch-depth: 0
      - name: Unpack content-bound discovery payload
        shell: bash
        run: |
          set -euo pipefail
          dir=development/orion-discovery-harness-v1-2026-08-25
          test -f "$dir/PAYLOAD.ready"
          parts=("$dir"/PAYLOAD.b64.part*)
          test ${#parts[@]} -gt 0
          cat "${parts[@]}" | base64 -d | tar -xzf -
          rm -f "$dir"/PAYLOAD.b64.part* "$dir/PAYLOAD.ready" \
            .github/workflows/orion-discovery-v1-bootstrap.yml
          git config user.name "ORION discovery bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add chronology-safe ORION discovery harness V1"
          git push origin HEAD:shadow/orion-discovery-harness-v1-20260825
