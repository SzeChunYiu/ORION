name: q-qg-figures

on:
  pull_request:
    paths:
      - 'papers/Q_QG_FIGURE_SOURCE_V1.json'
      - 'papers/build_q_qg_figures.py'
      - 'papers/Q-paper-02-recursive-recovery/Q2_ELIGIBLE_RECEIPT_INVENTORY_V1.json'
      - 'papers/Q-paper-02-recursive-recovery/Q2_TRANSITION_GRAPH_V2.json'
      - '.github/workflows/q-qg-figures.yml'
  push:
    branches:
      - 'codex/q-qg-nature-skills-publication-closure-20260821'
    paths:
      - 'papers/Q_QG_FIGURE_SOURCE_V1.json'
      - 'papers/build_q_qg_figures.py'
      - 'papers/Q-paper-02-recursive-recovery/Q2_ELIGIBLE_RECEIPT_INVENTORY_V1.json'
      - 'papers/Q-paper-02-recursive-recovery/Q2_TRANSITION_GRAPH_V2.json'
      - '.github/workflows/q-qg-figures.yml'

permissions:
  contents: read

jobs:
  build-figures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting dependencies
        run: python -m pip install --disable-pip-version-check --no-input matplotlib numpy
      - name: Build receipt-verified source data and figures
        run: python papers/build_q_qg_figures.py --out build/q_qg_figures
      - name: Verify expected outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s build/q_qg_figures/source_data.json
          test -s build/q_qg_figures/verification.json
          for stem in \
            Q1_counterexamples_and_support_ceiling \
            Q2_declared_denominator \
            Q4_primary_effects_small_multiples \
            QG1_R6I_support_bound_hierarchy \
            QG1_QG16_certificate_cone_slice \
            QG2_forecast_refutation_and_repair; do
              test -s "build/q_qg_figures/${stem}.svg"
              test -s "build/q_qg_figures/${stem}.png"
          done
      - name: Archive figure bundle
        uses: actions/upload-artifact@v4
        with:
          name: q-qg-publication-figures
          path: build/q_qg_figures
          if-no-files-found: error
          retention-days: 30
