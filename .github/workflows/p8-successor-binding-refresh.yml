name: P8 successor binding refresh

on:
  push:
    branches:
      - chatgpt/top-tier-theorem-wave2-20260829

permissions:
  contents: write

jobs:
  regenerate-binding:
    if: ${{ !contains(github.event.head_commit.message, '[binding-refresh]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/top-tier-theorem-wave2-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository
        run: python -m pip install -e '.[dev]'
      - name: Refresh P8 successor V2 overlay only
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from orion.programme.content_binding_coverage import is_build_artifact

          root = Path('.').resolve()
          paper = root / 'papers/orion-18-epistemic-authority-autonomous-science'
          v2_path = paper / 'CONTENT_MANIFEST_V2.json'
          v2 = json.loads(v2_path.read_text(encoding='utf-8'))
          if v2.get('schema_version') != 'orion.candidate-content-binding.v2':
              raise SystemExit('P8: unexpected V2 schema')
          if v2.get('candidate_id') != 'P8':
              raise SystemExit('P8: V2 candidate id mismatch')

          def sha(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as fh:
                  for block in iter(lambda: fh.read(1 << 20), b''):
                      h.update(block)
              return h.hexdigest()

          def repo_rel(path: Path) -> str:
              return path.relative_to(root).as_posix()

          existing = {
              entry['path']: dict(entry)
              for entry in v2.get('bound_files', [])
              if isinstance(entry, dict) and isinstance(entry.get('path'), str)
          }
          old_v2_paths = set(existing)

          # V2 is the additive current overlay. Append tracked paper files while
          # preserving every prior V2 row. V1 is historical and is never written.
          for path in sorted(paper.rglob('*')):
              if not path.is_file() or is_build_artifact(path):
                  continue
              if path.name == 'SHA256SUMS' or path == v2_path:
                  continue
              rel = repo_rel(path)
              existing.setdefault(rel, {'path': rel})

          refreshed = []
          for rel in sorted(existing):
              path = root / rel
              if not path.is_file():
                  raise SystemExit(f'P8: prior V2 bound path missing: {rel}')
              refreshed.append({'path': rel, 'sha256': sha(path)})

          new_v2_paths = {entry['path'] for entry in refreshed}
          if not old_v2_paths <= new_v2_paths:
              raise SystemExit('P8: successor refresh shrank the prior V2 subject')

          head = os.environ['GITHUB_SHA']
          tree = subprocess.check_output(['git', 'rev-parse', f'{head}^{{tree}}'], text=True).strip()
          v2['bound_files'] = refreshed
          v2['subject_commit'] = head
          v2['subject_commit_status'] = 'BOUND'
          v2['subject_commit_blocker'] = None
          v2['subject_commit_unbound_paths'] = []
          v2['subject_tree'] = tree
          if isinstance(v2.get('environment_lock'), dict):
              env_path = root / v2['environment_lock']['path']
              if not env_path.is_file():
                  raise SystemExit(f'P8: environment lock missing: {env_path}')
              v2['environment_lock']['sha256'] = sha(env_path)

          text = json.dumps(v2, indent=2, sort_keys=True) + '\n'
          v2_path.write_text(text, encoding='utf-8')
          nested = paper / 'content_binding_v2/SHA256SUMS'
          nested.parent.mkdir(parents=True, exist_ok=True)
          nested.write_text(
              f'{hashlib.sha256(text.encode()).hexdigest()}  {repo_rel(v2_path)}\n',
              encoding='utf-8',
          )
          print('P8 V2 rows', len(refreshed), 'new overlay rows', len(new_v2_paths - old_v2_paths))
          PY
      - name: Verify nested V2 digest
        run: sha256sum -c papers/orion-18-epistemic-authority-autonomous-science/content_binding_v2/SHA256SUMS
      - name: Verify candidate exact-source binding
        run: python papers/candidates/checkers/check_content_binding_v1.py --check
      - name: Verify whole-paper coverage and drift guard
        run: python -m pytest tests/unit/programme/test_content_binding_coverage.py -q
      - name: Refuse unexpected generated paths
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'papers/orion-18-epistemic-authority-autonomous-science/CONTENT_MANIFEST_V2.json',
              'papers/orion-18-epistemic-authority-autonomous-science/content_binding_v2/SHA256SUMS',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'unexpected generated paths: {unexpected}')
          required = allowed & changed
          if not required:
              raise SystemExit('binding refresh produced no changes')
          print('generated:', *sorted(changed), sep='\n')
          PY
      - name: Commit verified successor binding refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/orion-18-epistemic-authority-autonomous-science/CONTENT_MANIFEST_V2.json \
                  papers/orion-18-epistemic-authority-autonomous-science/content_binding_v2/SHA256SUMS
          git commit -m 'chore(candidates): refresh P8 successor V2 binding [binding-refresh]'
          git push
