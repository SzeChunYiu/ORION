name: p1-necessity-replication-v1-readonly

on:
  pull_request:
    branches:
      - shadow/chatgpt-p1-necessity-primary-v2-2026-08-18
    paths:
      - '.github/workflows/p1-necessity-replication-v1-readonly.yml'
      - 'research/revival/p1/freeze_mutation_necessity_replication_worlds_v2.py'
      - 'research/revival/p1/freeze_mutation_necessity_execution.py'
      - 'research/revival/p1/run_mutation_necessity_campaign.py'
      - 'research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json'
      - 'research/revival/p1/confirmatory/v2.2/PRIMARY_RESULT_V2_RECEIPT.json'
      - 'research/revival/p1/protocol/P1.epistemic-mutation-necessity.v2.2*.json'
      - 'src/orion/study/p1_causal/absorbed_mechanics.py'
      - 'src/orion/study/p1_causal/necessity_cases.py'
      - 'src/orion/study/p1_causal/necessity_cases_v2.py'
      - 'src/orion/study/p1_causal/necessity_engine.py'
      - 'src/orion/study/p1_causal/necessity_policies.py'
      - 'src/orion/study/p1_causal/necessity_policies_v3.py'
      - 'src/orion/study/p1_causal/necessity_scoring.py'
      - 'src/orion/study/p1_causal/necessity_statistics.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-replication:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install exact repository environment
        run: python -m pip install -e '.[dev]'

      - name: Assert primary artifact-bound authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('research/revival/p1/confirmatory/v2.2/PRIMARY_RESULT_V2_RECEIPT.json').read_text())
          assert r['terminal']=='P1_MUTATION_NECESSITY_SUPPORTED'
          assert r['authority']=='POWERED_PRIMARY_SUPPORTED_REPLICATION_REQUIRED'
          assert r['prospective_bindings']['replication_seed']==202608172212
          assert r['workflow']['raw_results_sha256']=='a198e83d8714535e488ac795eeb6a4490409c3ed909442bf0912660800386a31'
          assert r['independent_artifact_check']['raw_sha_matches_result_binding'] is True
          print('P1_REPLICATION_PRIMARY_GATE=PASS')
          PY

      - name: Freeze pre-bound disjoint replication worlds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p1-replication-freeze
          mkdir -p /tmp/p1-replication-freeze/worlds
          python research/revival/p1/freeze_mutation_necessity_replication_worlds_v2.py \
            --protocol "$GITHUB_WORKSPACE/research/revival/p1/protocol/P1.epistemic-mutation-necessity.v2.2.4.json" \
            --outdir /tmp/p1-replication-freeze/worlds

      - name: Bind replication execution identity before any arm output
        shell: bash
        run: |
          set -euo pipefail
          python research/revival/p1/freeze_mutation_necessity_execution.py \
            --protocol "$GITHUB_WORKSPACE/research/revival/p1/protocol/P1.epistemic-mutation-necessity.v2.2.4.json" \
            --world-dir /tmp/p1-replication-freeze/worlds \
            --out /tmp/p1-replication-freeze/REPLICATION_EXECUTION_FREEZE.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/p1-replication-freeze')
          w=json.loads((root/'worlds/WORLD_FREEZE.json').read_text())
          e=json.loads((root/'REPLICATION_EXECUTION_FREEZE.json').read_text())
          p=json.loads(Path('research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json').read_text())
          assert w['replication_seed']==202608172212
          assert w['primary_confirmatory_seed']==202608172211
          assert (w['n'],w['hidden_shift_n'],w['negative_control_n'])==(2882,480,2402)
          assert w['candidate_view_leak_count']==0
          assert w['public_sha256']!=p['public_sha256']
          assert w['protected_response_matrix_sha256']!=p['protected_response_matrix_sha256']
          assert w['arms_executed'] is False and w['outcome_accessed'] is False
          assert e['arms_executed'] is False and e['outcome_accessed'] is False
          assert e['world_freeze_sha256']==hashlib.sha256((root/'worlds/WORLD_FREEZE.json').read_bytes()).hexdigest()
          assert e['public_sha256']==w['public_sha256']
          assert e['protected_response_matrix_sha256']==w['protected_response_matrix_sha256']
          assert len(e['runnable_arms'])==9 and len(e['ablation_arms'])==5 and len(e['h1_parents'])==3
          print('P1_REPLICATION_FREEZE=PASS')
          print(json.dumps({'world':w,'execution':e},sort_keys=True))
          PY

      - name: Upload immutable replication freeze before outcome job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-necessity-replication-freeze-${{ github.sha }}
          path: /tmp/p1-replication-freeze/
          if-no-files-found: error
          retention-days: 30

  replicate:
    needs: freeze-replication
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install exact repository environment
        run: python -m pip install -e '.[dev]'

      - name: Download already-frozen replication identity
        uses: actions/download-artifact@v4
        with:
          name: p1-necessity-replication-freeze-${{ github.sha }}
          path: /tmp/p1-replication-input

      - name: Recheck freeze before arm execution
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/p1-replication-input/worlds/WORLD_FREEZE.json
          test -s /tmp/p1-replication-input/worlds/WORLD_PUBLIC.jsonl
          test -s /tmp/p1-replication-input/worlds/PROTECTED_RESPONSE_MATRIX.jsonl
          test -s /tmp/p1-replication-input/REPLICATION_EXECUTION_FREEZE.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/p1-replication-input')
          w=json.loads((root/'worlds/WORLD_FREEZE.json').read_text())
          e=json.loads((root/'REPLICATION_EXECUTION_FREEZE.json').read_text())
          assert w['replication_seed']==202608172212
          assert e['world_freeze_sha256']==hashlib.sha256((root/'worlds/WORLD_FREEZE.json').read_bytes()).hexdigest()
          assert e['public_sha256']==hashlib.sha256((root/'worlds/WORLD_PUBLIC.jsonl').read_bytes()).hexdigest()
          assert e['protected_response_matrix_sha256']==hashlib.sha256((root/'worlds/PROTECTED_RESPONSE_MATRIX.jsonl').read_bytes()).hexdigest()
          assert e['arms_executed'] is False and e['outcome_accessed'] is False
          print('P1_REPLICATION_PRE_OUTCOME=PASS')
          PY

      - name: Execute disjoint replication read-only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p1-replication-result
          python research/revival/p1/run_mutation_necessity_campaign.py \
            --world-dir /tmp/p1-replication-input/worlds \
            --execution-freeze /tmp/p1-replication-input/REPLICATION_EXECUTION_FREEZE.json \
            --outdir /tmp/p1-replication-result

      - name: Record replication scientific terminal without tuning
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          result=Path('/tmp/p1-replication-result/RESULT.json')
          raw=Path('/tmp/p1-replication-result/RAW_RESULTS.jsonl')
          r=json.loads(result.read_text())
          assert r['terminal'] in {'P1_MUTATION_NECESSITY_SUPPORTED','P1_MUTATION_NECESSITY_NOT_SUPPORTED'}
          assert r['n_worlds']==2882 and r['n_runnable_arms']==9 and r['n_ablation_arms']==5
          assert hashlib.sha256(raw.read_bytes()).hexdigest()==r['raw_results_sha256']
          print(json.dumps({
              'terminal':r['terminal'],
              'result_sha256':hashlib.sha256(result.read_bytes()).hexdigest(),
              'raw_results_sha256':r['raw_results_sha256'],
              'all_support_gates_pass':r['analysis']['all_support_gates_pass'],
              'gates':r['analysis']['gates'],
              'h1_hidden_shift':r['analysis']['h1_hidden_shift'],
              'h1_holm':r['analysis']['h1_holm'],
              'h2_control_success':r['analysis']['h2_control_success'],
              'h2_unnecessary_reframe_count':r['analysis']['h2_full_unnecessary_reframe_count'],
          },sort_keys=True))
          PY

      - name: Upload full replication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-necessity-replication-result-${{ github.sha }}
          path: |
            /tmp/p1-replication-result/
            /tmp/p1-replication-input/worlds/WORLD_FREEZE.json
            /tmp/p1-replication-input/REPLICATION_EXECUTION_FREEZE.json
            research/revival/p1/confirmatory/v2.2/PRIMARY_RESULT_V2_RECEIPT.json
          if-no-files-found: warn
          retention-days: 30
