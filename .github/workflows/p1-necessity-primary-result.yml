name: p1-necessity-primary-result

on:
  push:
    branches:
      - shadow/p1-necessity-primary-result-20260817
    paths:
      - '.github/workflows/p1-necessity-primary-result.yml'

permissions:
  contents: write

jobs:
  primary-result:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: shadow/p1-necessity-primary-result-20260817
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact repository package
        run: python -m pip install -e '.[dev]'
      - name: Require both no-outcome receipts
        run: |
          test -f research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json
          test -f research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE.json
          python - <<'PY'
          import json
          from pathlib import Path
          w=json.loads(Path('research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json').read_text())
          e=json.loads(Path('research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE.json').read_text())
          assert w['protocol_version']==e['protocol_version']=='P1.epistemic-mutation-necessity.v2.2.4'
          assert w['protocol_chain']['chain_sha256']==e['protocol_chain_sha256']
          assert w['n']==e['n']==2882
          assert w['public_sha256']==e['public_sha256']
          assert w['protected_response_matrix_sha256']==e['protected_response_matrix_sha256']
          assert w['arms_executed'] is False and w['outcome_accessed'] is False
          assert e['arms_executed'] is False and e['outcome_accessed'] is False
          assert e['h1_parents']==[
              'active_voi_repair_parent',
              'darc_r2act_dependency_parent',
              'causalflow_minimal_counterfactual_parent',
          ]
          assert len(e['runnable_arms'])==9 and len(e['ablation_arms'])==5
          PY
      - name: Regenerate exact frozen world rows
        run: |
          rm -rf /tmp/p1-worlds /tmp/p1-result
          python research/revival/p1/freeze_mutation_necessity_worlds.py --outdir /tmp/p1-worlds
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          frozen=json.loads(Path('research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json').read_text())
          fresh=json.loads(Path('/tmp/p1-worlds/WORLD_FREEZE.json').read_text())
          for key in ['protocol_version','confirmatory_seed','replication_seed','n','hidden_shift_n','negative_control_n','public_sha256','protected_response_matrix_sha256','candidate_view_leak_count','by_family','source_sha256']:
              assert fresh[key]==frozen[key], (key,fresh[key],frozen[key])
          assert fresh['protocol_chain']['chain_sha256']==frozen['protocol_chain']['chain_sha256']
          # The runner is bound to the exact original world-freeze receipt; the
          # replay branch HEAD differs only by workflow commits, so restore the
          # immutable receipt after proving row/source equality.
          shutil.copyfile(
              'research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json',
              '/tmp/p1-worlds/WORLD_FREEZE.json',
          )
          print('world rows replay exactly; immutable receipt restored')
          PY
      - name: Execute frozen primary campaign once
        run: |
          python research/revival/p1/run_mutation_necessity_campaign.py \
            --world-dir /tmp/p1-worlds \
            --execution-freeze research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE.json \
            --outdir /tmp/p1-result
      - name: Accept and preserve either frozen scientific terminal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/p1-result/RESULT.json').read_text())
          assert p['terminal'] in {
              'P1_MUTATION_NECESSITY_SUPPORTED',
              'P1_MUTATION_NECESSITY_NOT_SUPPORTED',
          }
          assert p['n_worlds']==2882
          assert p['n_runnable_arms']==9
          assert p['n_ablation_arms']==5
          assert p['analysis']['h1_parents']==[
              'active_voi_repair_parent',
              'darc_r2act_dependency_parent',
              'causalflow_minimal_counterfactual_parent',
          ]
          print(json.dumps({
              'terminal': p['terminal'],
              'all_support_gates_pass': p['analysis']['all_support_gates_pass'],
              'gates': p['analysis']['gates'],
              'h1_hidden_shift': p['analysis']['h1_hidden_shift'],
              'h2_control_success': p['analysis']['h2_control_success'],
              'h2_unnecessary_reframe_count': p['analysis']['h2_full_unnecessary_reframe_count'],
          }, sort_keys=True))
          PY
      - name: Archive immutable primary evidence
        run: |
          mkdir -p research/revival/p1/confirmatory/v2.2/primary
          cp /tmp/p1-result/RESULT.json research/revival/p1/confirmatory/v2.2/primary/PRIMARY_RESULT.json
          gzip -c -9 /tmp/p1-result/RAW_RESULTS.jsonl > research/revival/p1/confirmatory/v2.2/primary/RAW_RESULTS.jsonl.gz
          gzip -c -9 /tmp/p1-worlds/WORLD_PUBLIC.jsonl > research/revival/p1/confirmatory/v2.2/primary/WORLD_PUBLIC.jsonl.gz
          gzip -c -9 /tmp/p1-worlds/PROTECTED_RESPONSE_MATRIX.jsonl > research/revival/p1/confirmatory/v2.2/primary/PROTECTED_RESPONSE_MATRIX.jsonl.gz
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root=Path('research/revival/p1/confirmatory/v2.2')
          primary=root/'primary'
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          provenance={
              'schema_version':'P1.epistemic-mutation-necessity-run-provenance.v1',
              'branch_head_before_result_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'github_run_id': os.environ.get('GITHUB_RUN_ID',''),
              'github_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT',''),
              'world_freeze_sha256': sha(root/'PRIMARY_WORLD_FREEZE.json'),
              'execution_freeze_sha256': sha(root/'PRIMARY_EXECUTION_FREEZE.json'),
              'primary_result_sha256': sha(primary/'PRIMARY_RESULT.json'),
              'raw_results_gz_sha256': sha(primary/'RAW_RESULTS.jsonl.gz'),
              'public_world_gz_sha256': sha(primary/'WORLD_PUBLIC.jsonl.gz'),
              'protected_response_matrix_gz_sha256': sha(primary/'PROTECTED_RESPONSE_MATRIX.jsonl.gz'),
              'protocol_version':'P1.epistemic-mutation-necessity.v2.2.4',
              'confirmatory_seed':202608172211,
              'replication_seed_prebound':202608172212,
              'post_outcome_protocol_edit':False,
          }
          (primary/'PRIMARY_RUN_PROVENANCE.json').write_text(json.dumps(provenance, indent=2, sort_keys=True)+'\n')
          paths=sorted(primary.iterdir())
          (primary/'SHA256SUMS').write_text(''.join(f'{sha(path)}  {path.name}\n' for path in paths if path.name!='SHA256SUMS'))
          PY
      - name: Commit immutable primary result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/revival/p1/confirmatory/v2.2/primary
          if git diff --cached --quiet; then
            echo 'primary evidence already identical'
            exit 0
          fi
          git commit -m 'research(P1): archive frozen v2.2.4 primary result'
          git push origin HEAD:shadow/p1-necessity-primary-result-20260817
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-necessity-v2-2-4-primary-result
          path: |
            /tmp/p1-result/
            research/revival/p1/confirmatory/v2.2/primary/
          if-no-files-found: error
