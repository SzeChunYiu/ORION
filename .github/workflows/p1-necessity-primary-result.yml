name: p1-necessity-primary-result

on:
  push:
    branches:
      - shadow/p1-necessity-primary-result-20260817
    paths:
      - '.github/workflows/p1-necessity-primary-result.yml'

permissions:
  contents: write

jobs:
  execute-primary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: shadow/p1-necessity-primary-result-20260817
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact repository package
        run: python -m pip install -e '.[test]'
      - name: Require both chronological no-outcome receipts
        run: |
          test -f research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json
          test -f research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE.json
          python - <<'PY'
          import json
          from pathlib import Path
          w=json.loads(Path('research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json').read_text())
          e=json.loads(Path('research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE.json').read_text())
          assert w['arms_executed'] is False and w['outcome_accessed'] is False
          assert e['arms_executed'] is False and e['outcome_accessed'] is False
          assert w['n']==e['n']==2882
          assert w['public_sha256']==e['public_sha256']
          assert w['protected_response_matrix_sha256']==e['protected_response_matrix_sha256']
          assert w['protocol_chain']['chain_sha256']==e['protocol_chain_sha256']
          PY
      - name: Regenerate exact frozen worlds
        run: |
          rm -rf /tmp/p1-necessity-worlds
          python research/revival/p1/freeze_mutation_necessity_worlds.py --outdir /tmp/p1-necessity-worlds
          python - <<'PY'
          import json
          from pathlib import Path
          frozen=json.loads(Path('research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json').read_text())
          fresh=json.loads(Path('/tmp/p1-necessity-worlds/WORLD_FREEZE.json').read_text())
          for key in ['protocol_version','confirmatory_seed','replication_seed','n','hidden_shift_n','negative_control_n','public_sha256','protected_response_matrix_sha256','candidate_view_leak_count','by_family','source_sha256']:
              assert fresh[key]==frozen[key], key
          PY
      - name: Execute exact frozen arm/evaluator stack once
        run: |
          rm -rf /tmp/p1-necessity-primary
          python research/revival/p1/run_mutation_necessity_campaign.py \
            --world-dir /tmp/p1-necessity-worlds \
            --execution-freeze research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE.json \
            --outdir /tmp/p1-necessity-primary
      - name: Validate and preserve either scientific terminal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/p1-necessity-primary/RESULT.json').read_text())
          assert p['terminal'] in {'P1_MUTATION_NECESSITY_SUPPORTED','P1_MUTATION_NECESSITY_NOT_SUPPORTED'}
          assert p['n_worlds']==2882
          assert p['n_runnable_arms']==8
          assert p['n_ablation_arms']==5
          assert set(p['analysis']['h1_parents'])=={'active_voi_repair_parent','darc_r2act_dependency_parent'}
          print(json.dumps({'terminal':p['terminal'],'gates':p['analysis']['gates']},sort_keys=True))
          PY
      - name: Archive exact raw/world evidence after outcome
        run: |
          dest=research/revival/p1/confirmatory/v2.2/primary
          mkdir -p "$dest"
          cp /tmp/p1-necessity-primary/RESULT.json "$dest/PRIMARY_RESULT.json"
          gzip -9 -c /tmp/p1-necessity-primary/RAW_RESULTS.jsonl > "$dest/PRIMARY_RAW_RESULTS.jsonl.gz"
          gzip -9 -c /tmp/p1-necessity-worlds/WORLD_PUBLIC.jsonl > "$dest/WORLD_PUBLIC.jsonl.gz"
          gzip -9 -c /tmp/p1-necessity-worlds/PROTECTED_RESPONSE_MATRIX.jsonl > "$dest/PROTECTED_RESPONSE_MATRIX.jsonl.gz"
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          dest=Path('research/revival/p1/confirmatory/v2.2/primary')
          files=['PRIMARY_RESULT.json','PRIMARY_RAW_RESULTS.jsonl.gz','WORLD_PUBLIC.jsonl.gz','PROTECTED_RESPONSE_MATRIX.jsonl.gz']
          hashes={name:hashlib.sha256((dest/name).read_bytes()).hexdigest() for name in files}
          result=json.loads((dest/'PRIMARY_RESULT.json').read_text())
          provenance={
              'schema_version':'P1.epistemic-mutation-necessity-run-provenance.v1',
              'workflow_run_id':os.environ.get('GITHUB_RUN_ID',''),
              'workflow_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT',''),
              'checkout_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'terminal':result['terminal'],
              'artifact_sha256':hashes,
              'claim_boundary':'PRIMARY_CONFIRMATORY_RESULT_PRESERVED_WITHOUT_POST_OUTCOME_TUNING'
          }
          (dest/'PRIMARY_RUN_PROVENANCE.json').write_text(json.dumps(provenance,indent=2,sort_keys=True)+'\n')
          files.append('PRIMARY_RUN_PROVENANCE.json')
          lines=[]
          for name in files:
              digest=hashlib.sha256((dest/name).read_bytes()).hexdigest()
              lines.append(f'{digest}  {name}')
          (dest/'SHA256SUMS').write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit immutable primary evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/revival/p1/confirmatory/v2.2/primary
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'research(P1): execute frozen mutation-necessity primary campaign'
          git push origin HEAD:shadow/p1-necessity-primary-result-20260817
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-necessity-primary-result
          path: |
            /tmp/p1-necessity-primary/
            /tmp/p1-necessity-worlds/WORLD_FREEZE.json
          if-no-files-found: error
