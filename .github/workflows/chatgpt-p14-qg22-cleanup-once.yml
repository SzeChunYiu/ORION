name: chatgpt-p14-qg22-cleanup-once

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.head_ref == 'chatgpt/p14-qg22-mechanical-cleanup-20260823' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted test dependencies
        run: python -m pip install -e '.[dev,candidates]' pytest
      - name: Add missing stdlib imports to extracted QG22 verifier
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('development/orion-qg-regime-geometry/qg22_complexity_separation_verify.py')
          text=path.read_text(encoding='utf-8')
          old='import math\nimport sys\nimport time\n'
          new='import argparse\nimport hashlib\nimport itertools\nimport json\nimport math\nimport sys\nimport time\n'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected import prelude shape: {text.count(old)} matches')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
      - name: Run targeted mechanical regressions
        run: |
          set -euo pipefail
          python -m json.tool papers/paper-14-orion-rse/P14_ACTIVE_CLAIM_AUTHORITY_V1.json >/dev/null
          pytest -q \
            tests/unit/study/p14/test_p14_active_claim_authority.py \
            tests/unit/development/test_qg22_complexity_verifier_runtime.py
      - name: Commit real fixes and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chatgpt-p14-qg22-cleanup-once.yml
          git add \
            development/orion-qg-regime-geometry/qg22_complexity_separation_verify.py \
            papers/paper-14-orion-rse/P14_ACTIVE_CLAIM_AUTHORITY_V1.json \
            tests/unit/study/p14/test_p14_active_claim_authority.py \
            tests/unit/development/test_qg22_complexity_verifier_runtime.py
          git diff --cached --check
          git commit -m 'fix(p14,qg22): close duplicate-key and runtime-import gaps'
          git push origin HEAD:${GITHUB_HEAD_REF}
