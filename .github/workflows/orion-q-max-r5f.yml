name: orion-q-max-r5f

on:
  pull_request:
    paths:
      - 'research/extensions/orion-q/**'
      - 'development/orion-q-max-r0/**'
      - '.github/workflows/orion-q-max-r5f.yml'

jobs:
  h4-controlled-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run frozen fresh H4 controlled-composition confirmation
        run: |
          cd research/extensions/orion-q
          python max_r5f_h4_controlled_confirmation.py | tee /tmp/r5f-h4.txt
          grep '^ORIONQ_MAX_R5F_H4_RESULT=' /tmp/r5f-h4.txt
      - name: Run independent H4 proof and exact-search replay
        run: |
          cd research/extensions/orion-q
          python max_r5g_h4_independent_replay.py | tee /tmp/r5g-h4.txt
          grep '^ORIONQ_MAX_R5G_H4_INDEPENDENT=' /tmp/r5g-h4.txt
      - name: Run mixed-cardinality donor-composed development
        run: |
          cd research/extensions/orion-q
          python max_r5h_mixed_cardinality_development_fast.py | tee /tmp/r5h.txt
          grep '^ORIONQ_MAX_R5H_DEV=' /tmp/r5h.txt
