name: p2-final-render-p2x

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p2-final-render-p2x.yml'
      - 'research/saturation/p2/P2_X_FINAL_RENDER_PLAN.md'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install LaTeX and PDF tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended lmodern poppler-utils
      - name: Render and audit P2 exact head
        run: |
          set -euo pipefail
          cd papers/orion-12-open-world-scientific-discovery/manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          ! grep -Eqi 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log
          ! grep -Eq 'Overfull \\hbox|Overfull \\vbox' main.log
          pdftotext main.pdf /tmp/p2.txt
          grep -q '400/400' /tmp/p2.txt
          grep -q '250/400' /tmp/p2.txt
          grep -q '0.375' /tmp/p2.txt
          grep -q '0.3275' /tmp/p2.txt
          grep -q '0.4225' /tmp/p2.txt
          grep -q 'CANNOT_CHECK' /tmp/p2.txt
          grep -qi 'ideal' /tmp/p2.txt
          mkdir -p ../../../../research/saturation/_p2_final_render
          pdfinfo main.pdf > ../../../../research/saturation/_p2_final_render/pdfinfo.txt
          sha256sum main.pdf > ../../../../research/saturation/_p2_final_render/sha256.txt
          cp main.pdf main.log ../../../../research/saturation/_p2_final_render/
      - name: Archive P2 final render
        uses: actions/upload-artifact@v4
        with:
          name: p2-final-render-${{ github.sha }}
          path: research/saturation/_p2_final_render/
          if-no-files-found: error
          retention-days: 90
