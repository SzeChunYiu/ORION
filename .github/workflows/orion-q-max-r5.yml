name: orion-q-max-r5

on:
  pull_request:
    paths:
      - 'research/extensions/orion-q/**'
      - 'development/orion-q-max-r0/**'
      - '.github/workflows/orion-q-max-r5.yml'

jobs:
  n2-joint-internal-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run frozen N2 MAX-R5 strict confirmation
        run: |
          cd research/extensions/orion-q
          python max_r5_n2_joint_internal_confirmation_strict.py | tee /tmp/r5-n2.txt
          grep '^ORIONQ_MAX_R5_N2_RESULT=' /tmp/r5-n2.txt
          grep '^ORIONQ_MAX_R5_N2_STRICT=' /tmp/r5-n2.txt
