name: FiberGuard R9 seven-vertex atlas

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'papers/five-paper-top-tier-r8/C/artifact/fiberguard_graph_atlas_r9.py'
      - 'papers/five-paper-top-tier-r8/C/artifact/FIBERGUARD_GRAPH_ATLAS_R9_RESULTS.json'
      - 'papers/five-paper-top-tier-r8/C/FIBERGUARD_GRAPH_ATLAS_R9_ADDENDUM.md'
      - 'papers/five-paper-top-tier-r8/C/GRAPH_ATLAS_R9_PROTOCOL.md'
      - '.github/workflows/five-paper-r9-fiberguard-atlas.yml'

permissions:
  contents: read

jobs:
  exact-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependency
        run: python -m pip install 'networkx==3.6.1'
      - name: Replay exact atlas experiment
        run: |
          set -euo pipefail
          cp papers/five-paper-top-tier-r8/C/artifact/FIBERGUARD_GRAPH_ATLAS_R9_RESULTS.json /tmp/expected.json
          python papers/five-paper-top-tier-r8/C/artifact/fiberguard_graph_atlas_r9.py > /tmp/stdout.json
          cmp /tmp/expected.json papers/five-paper-top-tier-r8/C/artifact/FIBERGUARD_GRAPH_ATLAS_R9_RESULTS.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path('/tmp/expected.json').read_text())
          assert obj['terminal'] == 'C_GRAPH_ATLAS_N7_EXACT_REFINEMENT_EXTENSION_PASS'
          assert obj['registered_discriminators']['n6_c4_repair_does_not_transfer_to_n7']
          assert obj['registered_discriminators']['graphlet4_repairs_target_on_complete_n7_atlas']
          assert obj['registered_discriminators']['c4_clique_wl_repairs_target_on_complete_n7_atlas']
          PY
