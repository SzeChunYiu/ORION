name: ORION V1 Freeze Control Plane

on:
  pull_request:
    paths:
      - "research/orion-v1-freeze/**"
      - "development/orion-v1-freeze-control-plane-2026-08-26/**"
      - "scripts/check_orion_v1_freeze.py"
      - "tests/unit/orion_v1/**"
      - ".github/workflows/orion-v1-freeze.yml"
  push:
    branches: [main]
    paths:
      - "research/orion-v1-freeze/**"
      - "development/orion-v1-freeze-control-plane-2026-08-26/**"
      - "scripts/check_orion_v1_freeze.py"
      - "tests/unit/orion_v1/**"
      - ".github/workflows/orion-v1-freeze.yml"

permissions:
  contents: read

jobs:
  fail-closed-freeze-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate content-bound freeze control plane
        run: python scripts/check_orion_v1_freeze.py --json
      - name: Run hostile mutation suite
        run: python -m pytest -q tests/unit/orion_v1/test_orion_v1_freeze.py
