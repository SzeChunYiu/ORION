name: p12-verifier-resource-location-v1

on:
  pull_request:
    paths:
      - 'papers/orion-22-adaptive-state-reasoning/top_tier/**'
      - '.github/workflows/p12-verifier-resource-location-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier-resource-location-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute frozen verifier-backed resource-location study
        run: python papers/orion-22-adaptive-state-reasoning/top_tier/run_verifier_resource_location_v1.py | tee p12_verifier_resource_location_v1.json
      - name: Execute deterministic replay
        run: |
          python papers/orion-22-adaptive-state-reasoning/top_tier/run_verifier_resource_location_v1.py > p12_verifier_resource_location_v1_rerun.json
          cmp p12_verifier_resource_location_v1.json p12_verifier_resource_location_v1_rerun.json
          echo P12_VERIFIER_RESOURCE_LOCATION_V1_BYTE_REPLAY_GREEN
      - uses: actions/upload-artifact@v4
        with:
          name: p12-verifier-resource-location-v1
          path: p12_verifier_resource_location_v1.json
