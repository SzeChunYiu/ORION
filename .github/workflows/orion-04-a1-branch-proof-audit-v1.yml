name: ORION-04 A1 independent branch proof audit v1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/orion-04-a1-branch-proof-audit-v1.yml"
      - "papers/orion-04-rooted-completion-certificates/evidence/a1-independent-branch-audit-v1/**"
      - "papers/orion-04-rooted-completion-certificates/evidence/global-obstruction-v1/FULL_CUBE_COVER.json"
      - "papers/orion-04-rooted-completion-certificates/evidence/global-obstruction-v1/PROJECTIVE_LINE_ATLAS.json"
permissions:
  contents: read
jobs:
  reconstruct-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Reconstruct cover independently and compare
        run: |
          set -euo pipefail
          p=papers/orion-04-rooted-completion-certificates/evidence/a1-independent-branch-audit-v1
          python "$p/reconstruct_branch_cover_v1.py"
          git diff --exit-code -- "$p/BRANCH_RECONSTRUCTION_RESULT_V1.json"
      - name: Repository cleanliness
        run: git diff --check
