name: p4-saturation-rebind-once
on:
  push:
    branches: [saturation/p4-nature-skills-round-a-2026-08-19]
    paths: ['.github/workflows/p4-saturation-rebind-once.yml']
permissions: {contents: write}
jobs:
  rebind:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: saturation/p4-nature-skills-round-a-2026-08-19, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev,candidates]'
      - run: pytest -q tests/unit/p4/test_p4_metric_headroom.py tests/unit/p4/test_p4_publication_v2.py
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra librsvg2-bin poppler-utils
      - name: Regenerate figures and compile final P4 source
        working-directory: papers/paper-04-verified-scientific-discovery
        run: |
          python figures/generate_figures.py
          for stem in p4_2_false_promotion p4_3_coverage_frontier p4_4_detection_heatmap p4_5_attribution_vs_support p4_6_cost_tradeoff; do rsvg-convert -w 1440 figures/${stem}.svg -o figures/${stem}.png; done
          cd manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          ! grep -Eqi 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log
          ! grep -E 'Overfull \\[hv]box' main.log
          pdfinfo main.pdf > P4_SATURATION_PDFINFO.txt
      - name: Rebind tracked journal package
        env: {SOURCE_SHA: '${{ github.sha }}'}
        run: |
          cp papers/paper-04-verified-scientific-discovery/manuscript/main.pdf papers/paper-04-verified-scientific-discovery/journal_package/manuscript.pdf
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          root=Path('papers/paper-04-verified-scientific-discovery')
          p=root/'journal_package/MANIFEST.json'; m=json.loads(p.read_text())
          m['audit_subject_revision']=os.environ['SOURCE_SHA']; m['audit_date']='2026-08-19'
          p.write_text(json.dumps(m,indent=2)+'\n')
          (root/'journal_package/CLAIM_PDF_AUDIT.md').write_text(f'''# ORION-P4 saturation claim / PDF audit\n\nAudit source: `{os.environ['SOURCE_SHA']}`.\n\n- Protected V2 H1 false-promotion result is unchanged.\n- H2 clean coverage is a non-refusal guard with no comparative headroom.\n- H3 remains `NOT_SUPPORTED` / non-discriminating; it is not evidence of equality.\n- The repaired H3 battery remains prospective and unexecuted.\n- Provenance-sensitive authorization is donor-credited; relevance-versus-authorized evidence is not claimed as P4 novelty.\n- Comparator labels remain protocol-matched mechanism reimplementations, not original donor systems.\n- The saturated manuscript and figures rebuild with no unresolved references/citations or overfull boxes.\n''')
          sys.path.insert(0,'research/paper-programme-v1/journal_package')
          import check_journal_package as c
          m=c.load_manifest(root/'journal_package'); c.write_sha256sums(root,c.hashed_paths(m))
          PY
          python research/paper-programme-v1/journal_package/check_journal_package.py --root .
      - uses: actions/upload-artifact@v4
        with:
          name: p4-saturation-final-${{ github.sha }}
          path: |
            papers/paper-04-verified-scientific-discovery/manuscript/main.pdf
            papers/paper-04-verified-scientific-discovery/manuscript/main.log
            papers/paper-04-verified-scientific-discovery/manuscript/P4_SATURATION_PDFINFO.txt
            papers/paper-04-verified-scientific-discovery/journal_package/manuscript.pdf
      - name: Commit package and self-remove
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p4-saturation-rebind-once.yml
          git add papers/paper-04-verified-scientific-discovery/journal_package/MANIFEST.json papers/paper-04-verified-scientific-discovery/journal_package/CLAIM_PDF_AUDIT.md papers/paper-04-verified-scientific-discovery/journal_package/manuscript.pdf papers/paper-04-verified-scientific-discovery/journal_package/SHA256SUMS
          git commit -m 'papers(p4): rebind saturated TMLR review package'
          git push origin HEAD:saturation/p4-nature-skills-round-a-2026-08-19
