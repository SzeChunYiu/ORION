name: ci

on:
  pull_request:
  push:
    branches: [main]

# One run per PR / per main. New pushes cancel the stale queue so parallel lanes
# do not wait behind superseded SHAs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Measured, not guessed. A profiling run (store-durations.yml) recorded all 3077
# tests at 1878s total, and the distribution is extremely lopsided:
#
#   test_p2_offline_systems.py, 14 parametrised cases   ~107s each  ~1500s
#   the rest of tests/unit/p2                                        ~315s
#   everything else (2490 tests)                                      ~63s
#
# The single largest test is 113s, well under any per-shard target, so the split
# is bound by shard count rather than by granularity -- adding shards keeps
# paying. What it is *not* bound by is anything pytest-split can work out on its
# own: with no .test_durations it chunks by count, and those 14 cases are
# adjacent, so they land in one shard together.

jobs:
  fast:
    name: fast (all but p2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,candidates]'
      - run: pytest -q --ignore=tests/unit/p2 --durations=10

  p2-heavy:
    name: p2 heavy ${{ matrix.group }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,candidates]'
      - run: >-
          pytest -q tests/unit/p2/test_p2_offline_systems.py
          --splits 6 --group ${{ matrix.group }} -n auto --durations=10

  p2-rest:
    name: p2 rest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,candidates]'
      - run: >-
          pytest -q tests/unit/p2
          --ignore=tests/unit/p2/test_p2_offline_systems.py
          -n auto --durations=10

  test:
    if: always()
    needs: [fast, p2-heavy, p2-rest]
    runs-on: ubuntu-latest
    steps:
      - name: Report job results
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          HEAVY_RESULT: ${{ needs.p2-heavy.result }}
          REST_RESULT: ${{ needs.p2-rest.result }}
        run: |
          echo "fast:     $FAST_RESULT"
          echo "p2-heavy: $HEAVY_RESULT"
          echo "p2-rest:  $REST_RESULT"
          for result in "$FAST_RESULT" "$HEAVY_RESULT" "$REST_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::at least one test job did not succeed"
              exit 1
            fi
          done

  saturation-package:
    name: temporary saturation package rebind
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.ref == 'saturation/p1-nature-skills-round-a-2026-08-19' ||
       github.event.pull_request.head.ref == 'saturation/p3-nature-skills-round-a-2026-08-19' ||
       github.event.pull_request.head.ref == 'saturation/p4-nature-skills-round-a-2026-08-19' ||
       github.event.pull_request.head.ref == 'saturation/p8-nature-skills-round-a-2026-08-19')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,candidates]'
      - name: Install TeX/render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended librsvg2-bin poppler-utils
      - name: Capture exact source head
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Rebuild and verify the branch paper
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            saturation/p1-*)
              cd papers/paper-01-recursive-epistemic-reconstruction/manuscript
              latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
              ! grep -Eqi 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log
              ! grep -Eq 'Overfull \\hbox|Overfull \\vbox' main.log
              pdfinfo main.pdf > P1_SATURATION_PDFINFO.txt
              cd -
              cp papers/paper-01-recursive-epistemic-reconstruction/manuscript/main.pdf papers/paper-01-recursive-epistemic-reconstruction/journal_package/manuscript.pdf
              python - <<'PY'
          import json, os, sys
          from pathlib import Path
          root=Path('papers/paper-01-recursive-epistemic-reconstruction')
          p=root/'journal_package/MANIFEST.json'; m=json.loads(p.read_text())
          m['audit_subject_revision']=os.environ['SOURCE_SHA']; m['audit_date']='2026-08-19'; p.write_text(json.dumps(m,indent=2)+'\n')
          (root/'journal_package/CLAIM_PDF_AUDIT.md').write_text(f'''# ORION-P1 saturation claim / PDF audit\n\nAudit source: `{os.environ['SOURCE_SHA']}`.\n\n- Historical broad V1 remains `NOT_SUPPORTED` / underpowered.\n- Powered primary and disjoint replication remain unchanged and bounded to the frozen mechanical world family.\n- HarnessFix and dependency-guided rollback are donor-credited; the residual is protected authority for high-level epistemic mutation after lower-level alternatives are excluded.\n- Parnas/AGM are precedent/analogy, not a proved derivation.\n- No model-general/open-ended superiority is claimed.\n- Final saturated source compiles with no unresolved citations/references or overfull boxes.\n''')
          sys.path.insert(0,'research/paper-programme-v1/journal_package'); import check_journal_package as c
          m=c.load_manifest(root/'journal_package'); c.write_sha256sums(root,c.hashed_paths(m))
          PY
              python research/paper-programme-v1/journal_package/check_journal_package.py --root .
              ;;
            saturation/p3-*)
              cd papers/paper-03-global-knowledge-portrait/manuscript
              latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
              ! grep -E 'LaTeX Warning: (Citation|Reference).*(undefined)|There were undefined references|undefined citations|multiply defined' main.log
              ! grep -E 'Overfull \\[hv]box' main.log
              pdfinfo main.pdf > P3_SATURATION_PDFINFO.txt
              cd -
              cp papers/paper-03-global-knowledge-portrait/manuscript/main.pdf papers/paper-03-global-knowledge-portrait/journal_package/manuscript.pdf
              python - <<'PY'
          import json, os, sys
          from pathlib import Path
          root=Path('papers/paper-03-global-knowledge-portrait')
          p=root/'journal_package/MANIFEST.json'; m=json.loads(p.read_text())
          m['audit_subject_revision']=os.environ['SOURCE_SHA']; m['audit_date']='2026-08-19'; p.write_text(json.dumps(m,indent=2)+'\n')
          (root/'journal_package/CLAIM_PDF_AUDIT.md').write_text(f'''# ORION-P3 saturation claim / PDF audit\n\nAudit source: `{os.environ['SOURCE_SHA']}`.\n\n- Scoped P3.C5/P3.C9 confirmatory claim remains unchanged.\n- I-ADOPT scientific-variable semantics are donor-credited.\n- Raw-text superiority, expert-atlas adequacy, universal coordinate necessity and downstream answer-quality remain follow-up/unexecuted.\n- Simulated historical kappa is not treated as real IAA.\n- Final saturated source compiles with no unresolved/duplicate references or overfull boxes.\n''')
          sys.path.insert(0,'research/paper-programme-v1/journal_package'); import check_journal_package as c
          m=c.load_manifest(root/'journal_package'); c.write_sha256sums(root,c.hashed_paths(m))
          PY
              python research/paper-programme-v1/journal_package/check_journal_package.py --root .
              ;;
            saturation/p4-*)
              pytest -q tests/unit/p4/test_p4_metric_headroom.py tests/unit/p4/test_p4_publication_v2.py
              cd papers/paper-04-verified-scientific-discovery
              python figures/generate_figures.py
              for stem in p4_2_false_promotion p4_3_coverage_frontier p4_4_detection_heatmap p4_5_attribution_vs_support p4_6_cost_tradeoff; do rsvg-convert -w 1440 figures/${stem}.svg -o figures/${stem}.png; done
              git diff --exit-code -- figures tables
              cd manuscript
              latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
              ! grep -Eqi 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log
              ! grep -E 'Overfull \\[hv]box' main.log
              pdfinfo main.pdf > P4_SATURATION_PDFINFO.txt
              cd ../../..
              cp papers/paper-04-verified-scientific-discovery/manuscript/main.pdf papers/paper-04-verified-scientific-discovery/journal_package/manuscript.pdf
              python - <<'PY'
          import json, os, sys
          from pathlib import Path
          root=Path('papers/paper-04-verified-scientific-discovery')
          p=root/'journal_package/MANIFEST.json'; m=json.loads(p.read_text())
          m['audit_subject_revision']=os.environ['SOURCE_SHA']; m['audit_date']='2026-08-19'; p.write_text(json.dumps(m,indent=2)+'\n')
          (root/'journal_package/CLAIM_PDF_AUDIT.md').write_text(f'''# ORION-P4 saturation claim / PDF audit\n\nAudit source: `{os.environ['SOURCE_SHA']}`.\n\n- Protected V2 H1 result is unchanged.\n- H2 is a clean-coverage/non-refusal guard with no comparative headroom.\n- H3 remains `NOT_SUPPORTED` / non-discriminating, not evidence of equality.\n- The repaired H3 battery remains prospective/unexecuted.\n- Provenance-sensitive authorization is donor-credited.\n- Comparator labels remain matched mechanism reimplementations, not original donor systems.\n- Final saturated source/figures compile with no unresolved references/citations or overfull boxes.\n''')
          sys.path.insert(0,'research/paper-programme-v1/journal_package'); import check_journal_package as c
          m=c.load_manifest(root/'journal_package'); c.write_sha256sums(root,c.hashed_paths(m))
          PY
              python research/paper-programme-v1/journal_package/check_journal_package.py --root .
              ;;
            saturation/p8-*)
              python - <<'PY'
          from pathlib import Path
          p=Path('papers/candidates/paper-08-epistemic-authority-autonomous-science/submission/JAAMAS_MANUSCRIPT.tex')
          s=p.read_text()
          old='''ETAS exposes typed requested\\slash handled\\slash denied\\slash committed agent effects and residual obligations \\cite{etas2026}. FAVA formalizes evidence-backed permission graphs and deterministic authorization before effects \\cite{fava2026}. AgentBound composes multiple authority sources into verifiable behavioral governance \\cite{agentbound2026}; authorization-propagation work models transitive delegation and temporal validity across agent workflows \\cite{propagation2026}. These systems own typed action governance and authority propagation.'''
          new='''ETAS exposes typed requested\\slash handled\\slash denied\\slash committed agent effects and residual obligations \\cite{etas2026}. FAVA formalizes evidence-backed permission graphs and deterministic authorization before effects \\cite{fava2026}. AgentBound composes multiple authority sources into verifiable behavioral governance \\cite{agentbound2026}; authorization-propagation work models transitive delegation and temporal validity across agent workflows \\cite{propagation2026}. Bounded Agents carries delegated authority through an Agentic Principal Chain, narrows scope and budgets across delegation, checks requests against accumulated session state, and proves composition-safety properties under stated restriction and serialization assumptions \\cite{boundedagents2026}. These systems own typed action governance, authority propagation, narrowing and composition-safe delegation.'''
          if 'boundedagents2026' not in s:
              if old not in s: raise SystemExit('P8 donor paragraph marker missing')
              s=s.replace(old,new)
              mark='''\\bibitem{propagation2026} K. Tallam, Authorization propagation in multi-agent AI systems: identity governance as infrastructure, arXiv:2605.05440, 2026.'''
              if mark not in s: raise SystemExit('P8 bib marker missing')
              s=s.replace(mark,mark+'\n\\bibitem{boundedagents2026} X. Muruaga, Bounded Agents: Delegation Security for Multi-Agent AI Systems, arXiv:2608.15888, 2026.')
              p.write_text(s)
          assert 'boundedagents2026' in p.read_text()
          PY
              python papers/candidates/checkers/check_content_binding_v1.py --root . --write
              git checkout -- papers/candidates/paper-06-formal-epistemic-structures-and-mechanics/CONTENT_MANIFEST_V1.json papers/candidates/paper-06-formal-epistemic-structures-and-mechanics/SHA256SUMS papers/candidates/paper-07-epistemic-navigation-open-worlds/CONTENT_MANIFEST_V1.json papers/candidates/paper-07-epistemic-navigation-open-worlds/SHA256SUMS
              python papers/candidates/checkers/check_content_binding_v1.py --root . --check
              pytest -q tests/unit/candidates/test_p8_formal_core_primitives.py tests/unit/candidates/test_p6_p8_theory_closure_v21.py tests/unit/candidates/test_candidate_content_binding.py tests/unit/candidates/test_p6_p8_merged_review_suites.py
              python papers/candidates/submission/check_peer_review_ready.py --root .
              cd papers/candidates/paper-08-epistemic-authority-autonomous-science/submission
              latexmk -pdf -interaction=nonstopmode -halt-on-error JAAMAS_MANUSCRIPT.tex
              ! grep -E 'Overfull \\[hv]box' JAAMAS_MANUSCRIPT.log
              ! grep -Eqi 'undefined citations|undefined references|Citation .* undefined|Reference .* undefined' JAAMAS_MANUSCRIPT.log
              pdfinfo JAAMAS_MANUSCRIPT.pdf > P8_SATURATION_PDFINFO.txt
              ;;
          esac
      - name: Restore trusted CI and commit generated package bytes
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f .github/workflows/p1-saturation-package-once.yml .github/workflows/p3-saturation-rebind-once.yml .github/workflows/p4-saturation-rebind-once.yml .github/workflows/p8-saturation-citation-once.yml 2>/dev/null || true
          git add -A .github/workflows
          case "$BRANCH" in
            saturation/p1-*) git add papers/paper-01-recursive-epistemic-reconstruction/journal_package ;;
            saturation/p3-*) git add papers/paper-03-global-knowledge-portrait/journal_package ;;
            saturation/p4-*) git add papers/paper-04-verified-scientific-discovery/journal_package ;;
            saturation/p8-*) git add papers/candidates/paper-08-epistemic-authority-autonomous-science/submission/JAAMAS_MANUSCRIPT.tex papers/candidates/paper-08-epistemic-authority-autonomous-science/CONTENT_MANIFEST_V1.json papers/candidates/paper-08-epistemic-authority-autonomous-science/SHA256SUMS ;;
          esac
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then git commit -m "papers: bind final saturation package for ${BRANCH#saturation/}"; fi
          git push origin HEAD:"$BRANCH"
