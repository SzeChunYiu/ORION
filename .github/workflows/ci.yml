name: ci

on:
  pull_request:
  push:
    branches: [main]

# One run per PR / per main. New pushes cancel the stale queue so parallel lanes
# do not wait behind superseded SHAs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Measured, not guessed. A profiling run (store-durations.yml) recorded all 3077
# tests at 1878s total, and the distribution is extremely lopsided:
#
#   test_p2_offline_systems.py, 14 parametrised cases   ~107s each  ~1500s
#   the rest of tests/unit/p2                                        ~315s
#   everything else (2490 tests)                                      ~63s
#
# The single largest test is 113s, well under any per-shard target, so the split
# is bound by shard count rather than by granularity -- adding shards keeps
# paying. What it is *not* bound by is anything pytest-split can work out on its
# own: with no .test_durations it chunks the collected list by count, and the 14
# heavy cases are adjacent, so they land in one shard and that shard alone runs
# 20+ minutes. An earlier attempt split the whole suite six ways by count and
# produced five 43s shards and one 20-minute shard for exactly this reason.
#
# So the heavy file is split on its own axis, which spreads those 14 cases
# deterministically without needing a durations file: at 6 groups they land
# 3/4/4/3/0/0, capping the worst shard at 4 heavy cases.
#
# xdist (-n auto) is applied to the p2 jobs only. Checked file by file: every
# write under tests/unit/p2 is tmp_path-scoped, which xdist isolates per worker,
# and the dominant file writes nothing to disk at all. The fast job stays serial
# because that is where the 58 files that write outside tmp_path live -- 63s of
# tests, no speed to win, a real race surface to avoid. Note these runners are
# 2-core, so -n auto buys ~2x, not the ~3.5x a 4-core laptop shows.

jobs:
  fast:
    name: fast (all but p2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,candidates]'
      - run: pytest -q --ignore=tests/unit/p2 --durations=10

  # The 14 expensive cases, spread across six runners.
  p2-heavy:
    name: p2 heavy ${{ matrix.group }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,candidates]'
      - run: >-
          pytest -q tests/unit/p2/test_p2_offline_systems.py
          --splits 6 --group ${{ matrix.group }} -n auto --durations=10

  # Everything else in p2: the frozen-snapshot regenerations, ~315s together.
  p2-rest:
    name: p2 rest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,candidates]'
      - run: >-
          pytest -q tests/unit/p2
          --ignore=tests/unit/p2/test_p2_offline_systems.py
          -n auto --durations=10

  # One-shot publication repair for PR #584. This job is removed after it has
  # committed the rendered P1/P3/P4 PDFs and regenerated package checksums.
  paper-rebind-584:
    if: github.event_name == 'pull_request' && github.head_ref == 'repair/p2x-claim-literature-integrity-20260819' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository and TeX toolchains
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev,candidates]'
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended lmodern poppler-utils librsvg2-bin
          mkdir -p /tmp/orion-render/{P1,P3,P4}
      - name: Render P1
        run: |
          set -euo pipefail
          cd papers/paper-01-recursive-epistemic-reconstruction/manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          ! grep -Eqi 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log
          ! grep -Eq 'Overfull \\hbox|Overfull \\vbox' main.log
          cp main.pdf ../journal_package/manuscript.pdf
          cp main.pdf main.log /tmp/orion-render/P1/
          pdfinfo main.pdf > /tmp/orion-render/P1/pdfinfo.txt
      - name: Render P3
        run: |
          set -euo pipefail
          cd papers/paper-03-global-knowledge-portrait/manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          ! grep -E 'LaTeX Warning: (Citation|Reference).*(undefined)|There were undefined references|undefined citations|multiply defined' main.log
          ! grep -E 'Overfull \\[hv]box' main.log
          cp main.pdf ../journal_package/manuscript.pdf
          cp main.pdf main.log /tmp/orion-render/P3/
          pdfinfo main.pdf > /tmp/orion-render/P3/pdfinfo.txt
      - name: Render P4 through pinned TMLR style
        run: |
          set -euo pipefail
          pytest -q tests/unit/p4/test_p4_publication_v2.py tests/unit/p4/test_p4_v2_execution_freeze.py
          python papers/paper-04-verified-scientific-discovery/figures/generate_figures.py
          F=papers/paper-04-verified-scientific-discovery/figures
          for stem in p4_2_false_promotion p4_3_coverage_frontier p4_4_detection_by_attack p4_5_attribution_vs_support p4_6_cost_false_promotion; do
            rsvg-convert -w 1440 -o "$F/$stem.png" "$F/$stem.svg"
          done
          git diff --exit-code -- papers/paper-04-verified-scientific-discovery/tables
          BASE=https://raw.githubusercontent.com/JmlrOrg/tmlr-style-file/7bf90efe3a0debbba703c05c43f3ff7e4d4a2992
          curl -fsSL "$BASE/tmlr.sty" -o papers/paper-04-verified-scientific-discovery/manuscript/tmlr.sty
          curl -fsSL "$BASE/tmlr.bst" -o papers/paper-04-verified-scientific-discovery/manuscript/tmlr.bst
          cd papers/paper-04-verified-scientific-discovery/manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          ! grep -Eqi 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log
          ! grep -E 'Overfull \\[hv]box' main.log
          pdftotext main.pdf /tmp/p4.txt
          grep -q 'Under review as submission to TMLR' /tmp/p4.txt
          grep -q '0/360' /tmp/p4.txt
          grep -q '180/360' /tmp/p4.txt
          grep -q '60/60' /tmp/p4.txt
          grep -qi 'not supported' /tmp/p4.txt
          cp main.pdf ../journal_package/manuscript.pdf
          cp main.pdf main.log /tmp/orion-render/P4/
          pdfinfo main.pdf > /tmp/orion-render/P4/pdfinfo.txt
      - name: Regenerate journal package checksums and verify inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path('.').resolve()
          checker_path = root / 'research/paper-programme-v1/journal_package/check_journal_package.py'
          spec = importlib.util.spec_from_file_location('journal_check', checker_path)
          mod = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(mod)
          for paper_id in ('P1','P3','P4'):
              paper_root = root / mod.PAPER_DIRS[paper_id]
              manifest = mod.load_manifest(paper_root / 'journal_package')
              mod.write_sha256sums(paper_root, mod.hashed_paths(manifest))
          reports = mod.check_repository(root)
          failed = [(r.paper_id, r.errors) for r in reports if not r.ok]
          if failed:
              raise SystemExit(f'journal package check failed: {failed}')
          PY
      - name: Archive exact rendered PDFs for visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: repository-paper-rebind-${{ github.sha }}
          path: /tmp/orion-render/
          if-no-files-found: error
          retention-days: 90
      - name: Commit derived PDFs and checksums
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            papers/paper-01-recursive-epistemic-reconstruction/journal_package/manuscript.pdf \
            papers/paper-01-recursive-epistemic-reconstruction/journal_package/SHA256SUMS \
            papers/paper-03-global-knowledge-portrait/journal_package/manuscript.pdf \
            papers/paper-03-global-knowledge-portrait/journal_package/SHA256SUMS \
            papers/paper-04-verified-scientific-discovery/journal_package/manuscript.pdf \
            papers/paper-04-verified-scientific-discovery/journal_package/SHA256SUMS
          if git diff --cached --quiet; then
            echo 'Rendered packages already current.'
            exit 0
          fi
          git commit -m 'chore(papers): render and rebind P1 P3 P4 packages'
          git push origin HEAD:repair/p2x-claim-literature-integrity-20260819

  # Aggregate gate. One stable check name, and it fails on anything that is not
  # success. That distinction is load-bearing here twice over: the concurrency
  # group makes `cancelled` routine, and GitHub also reports a *timeout* as
  # `cancelled` rather than `failure` -- a 20-minute bound on the old unbalanced
  # shard fired exactly that way and would have read as green to a gate that
  # only tested for failure.
  test:
    if: always()
    needs: [fast, p2-heavy, p2-rest]
    runs-on: ubuntu-latest
    steps:
      - name: Report job results
        env:
          FAST_RESULT: ${{ needs.fast.result }}
          HEAVY_RESULT: ${{ needs.p2-heavy.result }}
          REST_RESULT: ${{ needs.p2-rest.result }}
        run: |
          echo "fast:     $FAST_RESULT"
          echo "p2-heavy: $HEAVY_RESULT"
          echo "p2-rest:  $REST_RESULT"
          for result in "$FAST_RESULT" "$HEAVY_RESULT" "$REST_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::at least one test job did not succeed"
              exit 1
            fi
          done
