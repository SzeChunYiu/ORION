name: p1-necessity-execution-freeze-validate

on:
  pull_request:
    branches:
      - shadow/p1-necessity-world-freeze-20260817
    paths:
      - '.github/workflows/p1-necessity-execution-freeze-validate.yml'
      - '.github/workflows/p1-necessity-execution-freeze.yml'
      - 'research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json'
      - 'research/revival/p1/freeze_mutation_necessity_*.py'
      - 'research/revival/p1/run_mutation_necessity_campaign.py'
      - 'src/orion/study/p1_causal/absorbed_mechanics.py'
      - 'src/orion/study/p1_causal/necessity_*.py'

permissions:
  contents: read

jobs:
  validate-execution-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Replay world identity and bind execution without arm output
        run: |
          rm -rf /tmp/p1-necessity-worlds
          python research/revival/p1/freeze_mutation_necessity_worlds.py --outdir /tmp/p1-necessity-worlds
          python research/revival/p1/freeze_mutation_necessity_execution.py \
            --world-dir /tmp/p1-necessity-worlds \
            --out /tmp/P1_NECESSITY_EXECUTION_FREEZE.json
          python - <<'PY'
          import json
          from pathlib import Path
          frozen=json.loads(Path('research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json').read_text())
          fresh=json.loads(Path('/tmp/p1-necessity-worlds/WORLD_FREEZE.json').read_text())
          execution=json.loads(Path('/tmp/P1_NECESSITY_EXECUTION_FREEZE.json').read_text())
          assert fresh['public_sha256']==frozen['public_sha256']
          assert fresh['protected_response_matrix_sha256']==frozen['protected_response_matrix_sha256']
          assert fresh['source_sha256']==frozen['source_sha256']
          assert execution['protocol_version']=='P1.epistemic-mutation-necessity.v2.2.4'
          assert execution['h1_parents']==[
              'active_voi_repair_parent',
              'darc_r2act_dependency_parent',
              'causalflow_minimal_counterfactual_parent',
          ]
          assert len(execution['runnable_arms'])==9
          assert len(execution['ablation_arms'])==5
          assert execution['arms_executed'] is False
          assert execution['outcome_accessed'] is False
          print('P1 v2.2.4 execution-freeze validation: PASS')
          PY
