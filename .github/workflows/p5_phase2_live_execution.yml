name: p5-phase2-live-execution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p5_phase2_live_execution.yml'
      - 'papers/paper-05-self-orion/phase2/LIVE_EXECUTION_TRIGGER.txt'

permissions:
  contents: read

jobs:
  live-phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ORION_PROTECTED_VERIFIER_URL: ${{ secrets.ORION_PROTECTED_VERIFIER_URL }}
      ORION_PROTECTED_VERIFIER_TOKEN: ${{ secrets.ORION_PROTECTED_VERIFIER_TOKEN }}
      ORION_PROTECTED_VERIFIER_ARTIFACT_HASH: ${{ secrets.ORION_PROTECTED_VERIFIER_ARTIFACT_HASH }}
      ORION_PHASE2_EVALUATION_EPOCH_ID: ${{ secrets.ORION_PHASE2_EVALUATION_EPOCH_ID }}
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
      ORION_PHASE2_REASONER_MODEL: ${{ vars.ORION_PHASE2_REASONER_MODEL || 'gpt-5.6' }}
      ORION_PHASE2_RESOURCE_BUDGET_UNITS: ${{ vars.ORION_PHASE2_RESOURCE_BUDGET_UNITS || '32' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact subject
        run: python -m pip install -e '.[dev]'

      - name: Check secret-safe live bindings
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in OPENAI_API_KEY ORION_PROTECTED_VERIFIER_URL ORION_PROTECTED_VERIFIER_TOKEN ORION_PROTECTED_VERIFIER_ARTIFACT_HASH ORION_PHASE2_EVALUATION_EPOCH_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required Phase-2 configuration names: %s\n' "${missing[*]}"
            exit 3
          fi
          echo 'All required Phase-2 configuration names are present; values are not printed.'

      - name: Freeze bindings and execute matched wide/deep trial
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p5-phase2-live"
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          from orion.providers.live_phase2 import (
              build_phase2_live_provider_stack_from_env,
              write_live_phase2_provider_manifest,
          )
          from orion.self_orion.baseline import baseline_bundle_to_dict, write_baseline_bundle
          from orion.self_orion.live_campaign_factory import build_live_phase2_trial_harness
          from orion.self_orion.phase2_io import load_phase2_binding, write_phase2_binding
          from orion.self_orion.phase2_preflight import (
              Phase2ClosurePreflight,
              Phase2PreflightStatus,
              assess_phase2_preflight,
              build_frozen_live_trial_packet,
          )
          from orion.self_orion.subject_binding import (
              attest_repository_subject,
              write_repository_subject_attestation,
          )
          from orion.self_orion.trial_io import (
              load_shadow_live_trial_report,
              write_shadow_live_trial_report,
          )

          out = Path(os.environ['RUNNER_TEMP']) / 'p5-phase2-live'
          model = os.environ['ORION_PHASE2_REASONER_MODEL'].strip()
          budget = float(os.environ['ORION_PHASE2_RESOURCE_BUDGET_UNITS'])
          if not model:
              raise RuntimeError('ORION_PHASE2_REASONER_MODEL must be non-empty')
          if budget <= 0:
              raise RuntimeError('ORION_PHASE2_RESOURCE_BUDGET_UNITS must be positive')

          subject = attest_repository_subject('.', repository_identity='github.com/SzeChunYiu/ORION')
          write_repository_subject_attestation(subject, out / 'SUBJECT_ATTESTATION.json')

          stack = build_phase2_live_provider_stack_from_env(reasoner_model=model)
          write_live_phase2_provider_manifest(stack, out / 'PROVIDER_MANIFEST.json')

          preflight = Phase2ClosurePreflight(
              protocol_id='phase2-shadow-closure-v1',
              subject_revision_hash=subject.subject_revision_hash,
              provider_manifest_hash=stack.provider_manifest_hash,
              evaluator_artifact_hash=stack.evaluator_artifact_hash,
              evaluation_epoch_id=stack.evaluation_epoch_id,
              baseline_id='simple-llm-retrieval-baseline-v1',
              resource_budget_units=budget,
          )
          binding_path = out / 'PHASE2_CLOSURE_BINDING.json'
          write_phase2_binding(preflight, binding_path)
          loaded_binding = load_phase2_binding(binding_path)
          if loaded_binding != preflight:
              raise RuntimeError('serialized Phase-2 closure binding does not replay to the frozen preflight')

          preflight_report = assess_phase2_preflight(preflight)
          preflight_payload = {
              'status': preflight_report.status.value,
              'blockers': list(preflight_report.blockers),
              'frozen_task_ids': list(preflight_report.frozen_task_ids),
              'attack_ids': list(preflight_report.attack_ids),
              'subject_revision_hash': subject.subject_revision_hash,
              'subject_commit_oid': subject.commit_oid,
              'provider_manifest_hash': stack.provider_manifest_hash,
              'evaluator_artifact_hash': stack.evaluator_artifact_hash,
              'evaluation_epoch_id': stack.evaluation_epoch_id,
              'protocol_id': preflight.protocol_id,
              'baseline_id': preflight.baseline_id,
              'reasoner_model': model,
              'resource_budget_units': budget,
              'outcome_accessed': False,
          }
          (out / 'PREFLIGHT_SAFE_SUMMARY.json').write_text(
              json.dumps(preflight_payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          if preflight_report.status is not Phase2PreflightStatus.READY_TO_EXECUTE_SHADOW_TRIAL:
              raise RuntimeError('Phase-2 preflight did not reach READY_TO_EXECUTE_SHADOW_TRIAL: ' + ','.join(preflight_report.blockers))

          packet = build_frozen_live_trial_packet(preflight)
          (out / 'FROZEN_PACKET_SAFE_SUMMARY.json').write_text(
              json.dumps({
                  'packet_id': packet.packet_id,
                  'packet_fingerprint': packet.fingerprint,
                  'evaluation_epoch_id': packet.evaluation_epoch_id,
                  'task_ids': [task.task_id for task in packet.tasks],
                  'provider_manifest_hash': packet.provider_manifest_hash,
                  'evaluator_artifact_hash': packet.evaluator_artifact_hash,
                  'baseline_id': packet.baseline_id,
                  'resource_budget_units': packet.resource_budget_units,
                  'max_orion_to_baseline_resource_ratio': packet.max_orion_to_baseline_resource_ratio,
              }, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          harness = build_live_phase2_trial_harness(stack)
          if harness.provider_manifest_hash != packet.provider_manifest_hash:
              raise RuntimeError('provider manifest changed between freeze and execution')
          if harness.evaluator_artifact_hash != packet.evaluator_artifact_hash:
              raise RuntimeError('evaluator artifact changed between freeze and execution')
          if harness.evaluation_epoch_id != packet.evaluation_epoch_id:
              raise RuntimeError('evaluation epoch changed between freeze and execution')

          report = harness.runner.run(packet)
          write_shadow_live_trial_report(report, out / 'LIVE_TRIAL_REPORT.json')
          write_baseline_bundle(harness.baseline, out / 'BASELINE_BUNDLE.json')
          loaded = load_shadow_live_trial_report(out / 'LIVE_TRIAL_REPORT.json')
          baseline_payload = baseline_bundle_to_dict(harness.baseline)

          blockers: list[str] = []
          if not loaded.raw_search_trace_retained:
              blockers.append('raw_search_trace_not_retained_for_every_task')
          if not loaded.all_resource_matched:
              blockers.append('live_trial_resources_not_matched')
          if not loaded.all_failures_recordable:
              blockers.append('live_trial_failure_history_incomplete')
          if loaded.wide_task_count < 1 or loaded.deep_task_count < 1:
              blockers.append('wide_and_deep_live_trials_required')
          if loaded.grants_self_promotion:
              blockers.append('live_trial_exposed_self_promotion')
          if len(baseline_payload['artifacts']) != len(packet.tasks):
              blockers.append('matched_baseline_task_coverage_incomplete')

          safe = {
              'issue_8_gate': 'PASS' if not blockers else 'FAIL',
              'blockers': blockers,
              'subject_revision_hash': subject.subject_revision_hash,
              'subject_commit_oid': subject.commit_oid,
              'provider_manifest_hash': stack.provider_manifest_hash,
              'evaluator_artifact_hash': stack.evaluator_artifact_hash,
              'evaluation_epoch_id': stack.evaluation_epoch_id,
              'protocol_id': preflight.protocol_id,
              'baseline_id': preflight.baseline_id,
              'reasoner_model': model,
              'packet_fingerprint': packet.fingerprint,
              'live_trial_evidence_artifact_hash': loaded.evidence_artifact_hash,
              'live_trial_document_hash': loaded.document_hash,
              'baseline_bundle_hash': baseline_payload['bundle_hash'],
              'raw_search_trace_retained': loaded.raw_search_trace_retained,
              'all_resource_matched': loaded.all_resource_matched,
              'all_failures_recordable': loaded.all_failures_recordable,
              'wide_task_count': loaded.wide_task_count,
              'deep_task_count': loaded.deep_task_count,
              'comparison_statuses': [status.value for status in loaded.comparison_statuses],
              'grants_self_promotion': loaded.grants_self_promotion,
          }
          (out / 'LIVE_TRIAL_SAFE_SUMMARY.json').write_text(
              json.dumps(safe, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print('P5_PHASE2_SAFE_SUMMARY_BEGIN')
          print(json.dumps(safe, indent=2, sort_keys=True))
          print('P5_PHASE2_SAFE_SUMMARY_END')
          if blockers:
              raise SystemExit(4)
          PY

      - name: Upload Phase-2 evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-phase2-live-${{ github.run_id }}
          path: ${{ runner.temp }}/p5-phase2-live
          if-no-files-found: warn
          retention-days: 90
