name: p6-p8-candidate-ci

on:
  pull_request:
    paths:
      - 'papers/candidates/**'
      - 'tests/unit/candidates/**'
      - 'src/orion/**'
      - '.github/workflows/p6-p8-candidate-ci.yml'
  push:
    branches: [main]
    paths:
      - 'papers/candidates/**'
      - 'tests/unit/candidates/**'
      - 'src/orion/**'
      - '.github/workflows/p6-p8-candidate-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-theory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/candidates/test_p6_p8_candidate_embedding.py
