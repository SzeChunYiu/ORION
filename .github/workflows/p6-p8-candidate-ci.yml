name: p6-p8-candidate-ci

on:
  pull_request:
    paths:
      - 'papers/candidates/**'
      - 'papers/paper-06-formal-epistemic-structures-and-mechanics/**'
      - 'papers/paper-07-epistemic-navigation-open-worlds/**'
      - 'papers/paper-08-epistemic-authority-autonomous-science/**'
      - 'tests/unit/candidates/**'
      - 'src/orion/**'
      - '.github/workflows/p6-p8-candidate-ci.yml'
  push:
    branches: [main]
    paths:
      - 'papers/candidates/**'
      - 'papers/paper-06-formal-epistemic-structures-and-mechanics/**'
      - 'papers/paper-07-epistemic-navigation-open-worlds/**'
      - 'papers/paper-08-epistemic-authority-autonomous-science/**'
      - 'tests/unit/candidates/**'
      - 'src/orion/**'
      - '.github/workflows/p6-p8-candidate-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-theory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Theory and live-embedding gate
        run: >-
          pytest -q
          tests/unit/candidates/test_p6_p8_candidate_embedding.py
          tests/unit/candidates/test_p6_p8_theory_closure_v21.py
          tests/unit/candidates/test_p8_formal_core_primitives.py
          tests/unit/candidates/test_p6_p8_merged_review_suites.py
      - name: Peer-review submission gate
        run: pytest -q tests/unit/candidates/test_p6_p8_peer_review_ready.py
      - name: Install submission PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra
      - name: Build and audit submission PDFs
        run: >-
          python papers/candidates/submission/build_and_audit_p6_p8_pdfs.py
          --clean --output-root "$RUNNER_TEMP/p6-p8-submission-pdfs"
      - name: Archive audited submission PDFs
        uses: actions/upload-artifact@v4
        with:
          name: p6-p8-submission-pdfs-${{ github.sha }}
          path: ${{ runner.temp }}/p6-p8-submission-pdfs
          if-no-files-found: error
