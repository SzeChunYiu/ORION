name: one-shot-post-reconcile-rotate-rust

on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths: ['.github/workflows/one-shot-post-reconcile-rotate-rust.yml']
  workflow_dispatch:

permissions: {contents: write}

jobs:
  rotate-after-final-reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/orion-02-r18-null-current-main-20260827
          fetch-depth: 0
      - run: sleep 480
      - name: Rotate receipts against final source bytes
        shell: bash
        run: |
          set -euo pipefail
          branch='chatgpt/orion-02-r18-null-current-main-20260827'
          git fetch --no-tags origin "$branch";git reset --hard FETCH_HEAD
          rm -f papers/orion-02-fiberguard-finite-fibre/CROSS_LANGUAGE_RUST_R20_RESULT.json
          rm -f papers/orion-02-fiberguard-finite-fibre/CROSS_LANGUAGE_RUST_R20_TERMINAL.txt
          rm -f papers/orion-02-fiberguard-finite-fibre/INTERNAL_RELEASE_RECEIPT_R20.json
          rm -f papers/orion-02-fiberguard-finite-fibre/INTERNAL_WORKFLOW_META_R20.json
          rm -f .github/workflows/one-shot-post-reconcile-rotate-rust.yml
          rustc --edition=2021 -C opt-level=0 papers/orion-02-fiberguard-finite-fibre/verify_r20_cross_language.rs -o "$RUNNER_TEMP/rust-checker"
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'no receipt rotation needed'; else git commit -m 'chore(R20): rotate receipts after final Rust source reconciliation';git push origin HEAD:refs/heads/$branch; fi
