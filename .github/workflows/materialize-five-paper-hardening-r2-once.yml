name: materialize-five-paper-hardening-r2-once

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'shadow/five-paper-hardening-r2-20260825' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Reconstruct and materialize the reviewed R2 package
        run: |
          set -euo pipefail
          cat .integration/five-paper-hardening-r2/payload_*.b64 | base64 -d > /tmp/five-paper-r2.tar.gz
          echo 'd748de9578981af1601d149becb7aa62f34683a616f7f526ab376b841773c54a  /tmp/five-paper-r2.tar.gz' | sha256sum -c -
          tar -xzf /tmp/five-paper-r2.tar.gz
      - name: Verify theorem obligations, boundaries and manifest
        run: |
          set -euo pipefail
          python papers/verify_five_theory_hardening_r2.py > /tmp/observed-five-r2.json
          diff -u papers/FIVE_THEORY_HARDENING_R2_RESULTS.json /tmp/observed-five-r2.json
          pytest -q tests/unit/publication/test_five_theory_hardening_r2.py
          python -m py_compile \
            papers/verify_five_theory_hardening_r2.py \
            tests/unit/publication/test_five_theory_hardening_r2.py
          git diff --check
      - name: Commit the materialized package and remove transport artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-five-paper-hardening-r2-once.yml
          git rm -r .integration/five-paper-hardening-r2
          git add \
            development/five-paper-hardening-r2-2026-08-25 \
            papers/FIVE_PAPER_DATA_CODE_AVAILABILITY_R2_2026-08-25.md \
            papers/FIVE_PAPER_FIGURE_CONTRACTS_R2_2026-08-25.md \
            papers/FIVE_PAPER_PRIMARY_SOURCE_CLOSURE_R2_2026-08-25.md \
            papers/FIVE_PAPER_REVIEW_SYNTHESIS_R2_2026-08-25.md \
            papers/FIVE_PAPER_SKILL_APPLICATION_R2_2026-08-25.md \
            papers/FIVE_THEORY_HARDENING_R2_RESULTS.json \
            papers/nonquantum-c5cubed-davenport/CLAIM_LEDGER_R2.md \
            papers/nonquantum-c5cubed-davenport/MANUSCRIPT_V2.md \
            papers/theory-A-multitag-constraint-rank/CLAIM_LEDGER_R2.md \
            papers/theory-A-multitag-constraint-rank/MANUSCRIPT_V2.md \
            papers/theory-B-certificate-complexity/CLAIM_LEDGER_R2.md \
            papers/theory-B-certificate-complexity/MANUSCRIPT_V2.md \
            papers/theory-C-low-order-information/CLAIM_LEDGER_R2.md \
            papers/theory-C-low-order-information/MANUSCRIPT_V2.md \
            papers/theory-D-falsification-authority/CLAIM_LEDGER_R2.md \
            papers/theory-D-falsification-authority/MANUSCRIPT_V2.md \
            papers/verify_five_theory_hardening_r2.py \
            tests/unit/publication/test_five_theory_hardening_r2.py
          git diff --cached --check
          git commit -m 'docs(theory): harden five-paper publication wave R2'
          git push origin HEAD:${GITHUB_HEAD_REF}
