name: orion-q-max-r6-exact-tare3

on:
  pull_request:
    paths:
      - 'research/extensions/orion-q/max_r6_exact_tare3_joint_frame_dp.py'
      - 'research/extensions/orion-q/max_r6_exact_tare3_end_to_end_verify.py'
      - 'research/extensions/orion-q/max_r6_p10_candidate_blind_frame_optimizer.py'
      - 'research/extensions/orion-q/max_r5h_mixed_cardinality_development.py'
      - 'research/extensions/orion-q/max_r4d_h2o_ducc_confirmation.py'
      - 'development/orion-q-max-r0/MAX_R6_EXACT_TARE3_JOINT_FRAME_DP_PROTOCOL.md'
      - 'development/orion-q-max-r0/MAX_R6_EXACT_TARE3_DP_ERRATUM_1.md'
      - 'development/orion-q-max-r0/MAX_R6_EXACT_TARE3_DP_ERRATUM_2.md'
      - 'development/orion-q-max-r0/MAX_R6_EXACT_TARE3_DP_ERRATUM_3.md'
      - '.github/workflows/orion-q-max-r6-exact-tare3.yml'

jobs:
  exact-tare3-open-subject-development:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run frozen exact joint TARE-3 development through fail-closed verifier
        run: |
          cd research/extensions/orion-q
          python max_r6_exact_tare3_end_to_end_verify.py | tee /tmp/exact-tare3.txt
          grep '^ORIONQ_MAX_R6_EXACT_TARE3=' /tmp/exact-tare3.txt
          grep '^ORIONQ_MAX_R6_EXACT_TARE3_E2E_VERIFY=' /tmp/exact-tare3.txt
          python - <<'PY'
          import json
          from pathlib import Path

          prefix = 'ORIONQ_MAX_R6_EXACT_TARE3_E2E_VERIFY='
          lines = [
              line for line in Path('/tmp/exact-tare3.txt').read_text().splitlines()
              if line.startswith(prefix)
          ]
          if len(lines) != 1:
              raise SystemExit(f'expected exactly one E2E verification receipt, got {len(lines)}')
          payload = json.loads(lines[0][len(prefix):])
          if payload.get('reserved_stretched_n2_accessed') is not False:
              raise SystemExit('protected stretched-N2 access was not proven absent')
          if payload.get('software_integrity_pass') is not True:
              raise SystemExit(f"software integrity failed: {payload.get('errors')}")
          if 'MAX_R6_EXACT_TARE3_DP_ERRATUM_3' not in payload.get('bound_errata', []):
              raise SystemExit('Erratum 3 is not bound by the verifier')
          strict_gates = payload.get('strict_gates', {})
          strict_supported = payload.get('strict_supported') is True
          if strict_supported != (bool(strict_gates) and all(value is True for value in strict_gates.values())):
              raise SystemExit('strict_supported does not equal conjunction of strict frozen gates')
          if payload.get('underlying_supported') is True and payload.get('top_four_panel_complete') is not True:
              raise SystemExit('positive underlying receipt escaped the top-four completeness gate')
          if payload.get('pre_prospective_ready') is True:
              if payload.get('top_four_panel_complete') is not True:
                  raise SystemExit('pre-prospective ready without complete top-four panels')
              if strict_supported is not True:
                  raise SystemExit('pre-prospective ready without strict support')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orion-q-max-r6-exact-tare3-receipt
          path: /tmp/exact-tare3.txt
          if-no-files-found: error
