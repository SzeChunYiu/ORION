name: orion-02-r20-release-fileset-audit

on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths:
      - 'papers/orion-02-fiberguard-finite-fibre/**'
      - '.github/workflows/orion-02-r20-release-fileset-audit.yml'
  pull_request:
    paths:
      - 'papers/orion-02-fiberguard-finite-fibre/**'
      - '.github/workflows/orion-02-r20-release-fileset-audit.yml'
  workflow_dispatch:

permissions: {contents: write}

jobs:
  bind-complete-release-fileset:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Resolve non-self-referential fileset subject
        shell: bash
        run: |
          set -euo pipefail
          root='papers/orion-02-fiberguard-finite-fibre'
          receipt="$root/RELEASE_FILESET_R20_RECEIPT.json"
          if [ -f "$receipt" ]; then subject="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["source_subject"])' "$receipt")"; else subject="$GITHUB_SHA"; fi
          git cat-file -e "$subject^{commit}"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path('papers/orion-02-fiberguard-finite-fibre')
          spec=json.loads((root/'RELEASE_FILESET_R20.json').read_text())
          for name in spec['files']:
            if not (root/name).is_file():raise SystemExit(f'missing release file {name}')
          Path(os.environ['RUNNER_TEMP'],'files.txt').write_text('\n'.join(str(root/name) for name in spec['files'])+'\n')
          PY
          mapfile -t files < "$RUNNER_TEMP/files.txt"
          git diff --exit-code "$subject" HEAD -- "${files[@]}" "$root/RELEASE_FILESET_R20.json"
          printf '%s\n' "$subject" > "$RUNNER_TEMP/source-subject.txt"
      - name: Generate exact Git-blob and SHA-256 receipt twice
        shell: bash
        run: |
          set -euo pipefail
          for suffix in a b; do
            python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('papers/orion-02-fiberguard-finite-fibre')
          subject=(Path(os.environ['RUNNER_TEMP'])/'source-subject.txt').read_text().strip()
          spec=json.loads((root/'RELEASE_FILESET_R20.json').read_text())
          bindings={}
          for name in ['RELEASE_FILESET_R20.json']+spec['files']:
            path=root/name
            blob=subprocess.check_output(['git','rev-parse',f'{subject}:{path.as_posix()}'],text=True).strip()
            bindings[name]={'git_blob':blob,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'bytes':path.stat().st_size}
          result={'schema':'ORION.ORION02.ReleaseFilesetReceipt.R20.v1','source_subject':subject,'fileset_terminal':spec['terminal'],'file_count':len(bindings),'bindings':bindings,'terminal':'ORION02_R20_RELEASE_FILESET_RECEIPT_PASS','authority':{'content_custody':True,'external_independence':False,'novelty':False,'rights_complete':False,'journal_authority':False,'submission_authorized':False}}
          Path(os.environ['RUNNER_TEMP'],f'receipt-{os.environ["suffix"]}.json').write_text(json.dumps(result,sort_keys=True,separators=(',',':'))+'\n')
          PY
          done
        env:
          suffix: a
      - name: Regenerate second receipt and compare
        shell: bash
        run: |
          set -euo pipefail
          suffix=b python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('papers/orion-02-fiberguard-finite-fibre')
          subject=(Path(os.environ['RUNNER_TEMP'])/'source-subject.txt').read_text().strip()
          spec=json.loads((root/'RELEASE_FILESET_R20.json').read_text())
          bindings={}
          for name in ['RELEASE_FILESET_R20.json']+spec['files']:
            path=root/name
            blob=subprocess.check_output(['git','rev-parse',f'{subject}:{path.as_posix()}'],text=True).strip()
            bindings[name]={'git_blob':blob,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'bytes':path.stat().st_size}
          result={'schema':'ORION.ORION02.ReleaseFilesetReceipt.R20.v1','source_subject':subject,'fileset_terminal':spec['terminal'],'file_count':len(bindings),'bindings':bindings,'terminal':'ORION02_R20_RELEASE_FILESET_RECEIPT_PASS','authority':{'content_custody':True,'external_independence':False,'novelty':False,'rights_complete':False,'journal_authority':False,'submission_authorized':False}}
          Path(os.environ['RUNNER_TEMP'],'receipt-b.json').write_text(json.dumps(result,sort_keys=True,separators=(',',':'))+'\n')
          PY
          test -f "$RUNNER_TEMP/receipt-a.json"
          cmp "$RUNNER_TEMP/receipt-a.json" "$RUNNER_TEMP/receipt-b.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'receipt-a.json').read_text())
          assert r['terminal']=='ORION02_R20_RELEASE_FILESET_RECEIPT_PASS'
          assert r['file_count']==26
          assert r['authority']=={'content_custody':True,'external_independence':False,'novelty':False,'rights_complete':False,'journal_authority':False,'submission_authorized':False}
          print('ORION_02_R20_RELEASE_FILESET_AUDIT_PASS')
          PY
      - name: Require durable receipt when present
        shell: bash
        run: |
          set -euo pipefail
          path='papers/orion-02-fiberguard-finite-fibre/RELEASE_FILESET_R20_RECEIPT.json'
          if [ -e "$path" ]; then cmp "$RUNNER_TEMP/receipt-a.json" "$path"; fi
      - run: git diff --check
      - name: Stage fileset artifact
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/orion-02-r20-release-fileset";mkdir -p "$out";cp "$RUNNER_TEMP/receipt-a.json" "$out/RELEASE_FILESET_R20_RECEIPT.json";cp papers/orion-02-fiberguard-finite-fibre/RELEASE_FILESET_R20.json "$out/";sha256sum "$out"/* > "$out/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with: {name: orion-02-r20-release-fileset, path: '${{ runner.temp }}/orion-02-r20-release-fileset/', if-no-files-found: error, retention-days: 30}
      - name: Publish durable fileset receipt once
        if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/orion-02-r18-null-current-main-20260827'
        shell: bash
        run: |
          set -euo pipefail
          path='papers/orion-02-fiberguard-finite-fibre/RELEASE_FILESET_R20_RECEIPT.json'
          if [ ! -e "$path" ]; then cp "$RUNNER_TEMP/receipt-a.json" "$path";git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add "$path";git commit -m 'results(ORION-02): bind complete R20 release fileset';git push origin HEAD:refs/heads/chatgpt/orion-02-r18-null-current-main-20260827; else echo 'release fileset receipt already present'; fi
