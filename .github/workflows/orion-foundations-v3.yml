name: ORION foundations V3 theory audit

on:
  pull_request:
    paths:
      - "research/orion-foundations-v3/**"
      - ".github/workflows/orion-foundations-v3.yml"
  push:
    branches-ignore:
      - "archive/**"
    paths:
      - "research/orion-foundations-v3/**"
      - ".github/workflows/orion-foundations-v3.yml"

jobs:
  theory-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reject execution-lane edits
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            head="$PR_HEAD_SHA"
            git cat-file -e "$head^{commit}" 2>/dev/null || git fetch origin "$head"
            git fetch origin main
            base="$(git merge-base origin/main "$head")"
          else
            base="$PUSH_BEFORE_SHA"
            head="$EVENT_SHA"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
              echo "New-branch push: auditing authored diff vs default branch (merge-base with origin/main)"
              git fetch origin main
              base="$(git merge-base origin/main "$head")"
            fi
            git cat-file -e "$base^{commit}" 2>/dev/null || git fetch origin "$base"
            git cat-file -e "$head^{commit}" 2>/dev/null || git fetch origin "$head"
          fi

          echo "Auditing authored diff: $base..$head"
          git diff --name-only "$base" "$head" | tee /tmp/foundations-v3-paths.txt

          unexpected="$(grep -Ev '^(research/orion-foundations-v3/.*|\.github/workflows/orion-foundations-v3\.yml)$' /tmp/foundations-v3-paths.txt || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected non-theory paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          if grep -Eiq '(^|/)(rr1|finalizer|slurm|lunarc|custody)(/|$)' /tmp/foundations-v3-paths.txt; then
            echo "Execution/finalizer path entered theory PR" >&2
            exit 1
          fi
      - name: Validate programme theory package
        run: python research/orion-foundations-v3/check_foundations_v3.py
      - name: Validate P1-P15 theorem crosswalk
        run: python research/orion-foundations-v3/check_paper_theorem_ledger_v1.py
      - name: Validate completion receipt and formalization coverage
        run: python research/orion-foundations-v3/check_completion_receipt_v1.py
      - name: Parse JSON artifacts
        run: |
          python -m json.tool research/orion-foundations-v3/THEOREM_LEDGER_V1.json >/dev/null
          python -m json.tool research/orion-foundations-v3/PAPER_THEOREM_LEDGER_V1.json >/dev/null
          python -m json.tool research/orion-foundations-v3/ASSUMPTION_LEDGER_V1.json >/dev/null
          python -m json.tool research/orion-foundations-v3/EXECUTION_ONLY_BACKLOG_V1.json >/dev/null
          python -m json.tool research/orion-foundations-v3/FORMALIZATION_COVERAGE_V1.json >/dev/null
          python -m json.tool research/orion-foundations-v3/AUDIT_RECEIPT_V1.json >/dev/null
      - name: Reject incomplete Lean proofs
        run: |
          if grep -R -nE '(^|[^[:alnum:]_])(sorry|admit|axiom)([^[:alnum:]_]|$)' \
            research/orion-foundations-v3/formal/lean/OrionFoundations \
            research/orion-foundations-v3/formal/lean/OrionFoundations.lean; then
            echo "Lean proof contains sorry/admit/axiom" >&2
            exit 1
          fi

  lean-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0
      - name: Generate Lake manifest and compile proofs
        working-directory: research/orion-foundations-v3/formal/lean
        shell: bash
        run: |
          lake update
          lake build
