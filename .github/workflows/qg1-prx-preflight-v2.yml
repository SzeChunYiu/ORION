name: qg1-prx-preflight-v2

on:
  pull_request:
    paths:
      - 'papers/orion-09-compilation-regime-geometry/**'
      - 'papers/Q_QG_CITATION_INSERTION_MAP_V1.json'
      - 'papers/Q_QG_VERIFIED_CORE_REFERENCES_V1.bib'
      - 'papers/build_q_qg_cited_masters.py'
      - '.github/workflows/qg1-prx-preflight-v2.yml'
  push:
    branches:
      - 'codex/q-qg-nature-skills-publication-closure-20260821'
    paths:
      - 'papers/orion-09-compilation-regime-geometry/**'
      - 'papers/Q_QG_CITATION_INSERTION_MAP_V1.json'
      - 'papers/Q_QG_VERIFIED_CORE_REFERENCES_V1.bib'
      - 'papers/build_q_qg_cited_masters.py'
      - '.github/workflows/qg1-prx-preflight-v2.yml'

permissions:
  contents: read

jobs:
  build-qg1-prx-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pandoc texlive-latex-recommended texlive-latex-extra texlive-publishers \
            texlive-fonts-recommended poppler-utils zip
      - name: Re-run Q/QG publication integrity gates
        run: |
          python papers/check_q_qg_publication.py
          python papers/check_q_qg_science_manifests.py
      - name: Generate cited scientific masters
        run: python papers/build_q_qg_cited_masters.py --clean
      - name: Prepare single-column PRX review source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qg1_prx_v2/source build/qg1_prx_v2/rendered
          python papers/orion-09-compilation-regime-geometry/submission_prx/build_prx_source.py \
            --cited-master build/q_qg_cited/QG1/MANUSCRIPT_CITED.md \
            --popular-summary papers/orion-09-compilation-regime-geometry/submission_prx/POPULAR_SUMMARY.md \
            --out build/qg1_prx_v2/prepared.md
          cp build/q_qg_cited/QG1/references.bib build/qg1_prx_v2/source/references.bib
          cp papers/orion-09-compilation-regime-geometry/submission_prx/prx_pandoc_template.tex \
            build/qg1_prx_v2/source/pandoc_template.tex
          cp papers/orion-09-compilation-regime-geometry/submission_prx/POPULAR_SUMMARY.md \
            build/qg1_prx_v2/source/POPULAR_SUMMARY.md
          pandoc build/qg1_prx_v2/prepared.md \
            --from=markdown+citations \
            --to=latex \
            --natbib \
            --template=build/qg1_prx_v2/source/pandoc_template.tex \
            -o build/qg1_prx_v2/source/main.tex
          grep -Fq '\documentclass[aps,prx,preprint,superscriptaddress]{revtex4-2}' \
            build/qg1_prx_v2/source/main.tex
          grep -Fq 'AUTHOR METADATA REQUIRED BEFORE SUBMISSION' build/qg1_prx_v2/source/main.tex
          grep -Eq '\\cite[pt]?\{' build/qg1_prx_v2/source/main.tex
      - name: Build and audit PRX review PDF
        shell: bash
        working-directory: build/qg1_prx_v2/source
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          pdftotext main.pdf ../pdf.txt
          pdfinfo main.pdf > ../pdfinfo.txt
          grep -Fq 'AUTHOR METADATA REQUIRED BEFORE SUBMISSION' ../pdf.txt
          grep -Fq 'References' ../pdf.txt
          if grep -Eq '\[@[A-Za-z0-9_:-]+' ../pdf.txt; then
            echo 'QG1_PRX_V2_UNRESOLVED_CITATION_TOKEN=FAIL'
            exit 1
          fi
          pdftoppm -png -r 144 main.pdf ../rendered/page
          sha256sum main.pdf > ../pdf_sha256.txt
      - name: Archive source and popular summary
        shell: bash
        working-directory: build/qg1_prx_v2
        run: |
          set -euo pipefail
          cp prepared.md source/SCIENTIFIC_MASTER_CITED.md
          zip -qr qg1-prx-preflight-v2-source.zip source
          sha256sum qg1-prx-preflight-v2-source.zip > source_zip_sha256.txt
      - name: Archive QG1 PRX preflight V2 package
        uses: actions/upload-artifact@v4
        with:
          name: qg1-prx-preflight-v2-package
          path: |
            build/qg1_prx_v2/source/main.pdf
            build/qg1_prx_v2/qg1-prx-preflight-v2-source.zip
            build/qg1_prx_v2/source/POPULAR_SUMMARY.md
            build/qg1_prx_v2/pdfinfo.txt
            build/qg1_prx_v2/pdf_sha256.txt
            build/qg1_prx_v2/source_zip_sha256.txt
            build/qg1_prx_v2/rendered
          if-no-files-found: error
          retention-days: 30
