name: ab-pr1469-production-registry-audit-r20

on:
  push:
    branches:
      - chatgpt/orion-02-r18-null-current-main-20260827
    paths:
      - 'research/five-paper-top-tier-r20/audit_ab_pr1469.py'
      - '.github/workflows/ab-pr1469-production-registry-audit-r20.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  production-registry-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact PR 1469 subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/1469" > "$RUNNER_TEMP/pr.json"
          base="$(jq -r .base.sha "$RUNNER_TEMP/pr.json")"
          head="$(jq -r .head.sha "$RUNNER_TEMP/pr.json")"
          git fetch --no-tags origin "$base" "$head"
          git worktree add --detach "$RUNNER_TEMP/pr1469" "$head"
          printf '%s\n' "$base" > "$RUNNER_TEMP/base.txt"
          printf '%s\n' "$head" > "$RUNNER_TEMP/head.txt"
      - name: Audit extensional production registry twice
        shell: bash
        run: |
          set -euo pipefail
          script='research/five-paper-top-tier-r20/audit_ab_pr1469.py'
          python -m py_compile "$script"
          for suffix in a b; do
            python "$script" --repo "$RUNNER_TEMP/pr1469" --base "$(cat "$RUNNER_TEMP/base.txt")" --head "$(cat "$RUNNER_TEMP/head.txt")" --output "$RUNNER_TEMP/audit-$suffix.json" | tee "$RUNNER_TEMP/terminal-$suffix.txt"
          done
          cmp "$RUNNER_TEMP/audit-a.json" "$RUNNER_TEMP/audit-b.json"
          cmp "$RUNNER_TEMP/terminal-a.txt" "$RUNNER_TEMP/terminal-b.txt"
      - name: Preserve fail-closed authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'audit-a.json').read_text())
          assert result['schema']=='ORION.AB.PR1469ProductionRegistryAudit.R20.v1'
          assert result['target_pr']==1469
          assert result['authority']['quantum_compiler_transfer'] is False
          assert result['authority']['measured_search_value'] is False
          assert result['authority']['external_independence'] is False
          assert result['authority']['journal_authority'] is False
          if result['terminal']=='AB_PR1469_PRODUCTION_REGISTRY_PASS':
              assert all(result['gates'].values())
              assert result['authority']['production_transfer'] is True
          else:
              assert result['terminal']=='AB_PR1469_PRODUCTION_TRANSFER_NOT_ESTABLISHED'
              assert result['authority']['production_transfer'] is False
          print('AB_PR1469_AUTHORITY_CLASSIFIED',result['terminal'])
          PY
      - name: Check diff hygiene
        run: git diff --check
      - name: Stage audit artifact
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ab-pr1469-production-registry-audit"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/pr.json" "$out/PR1469.json"
          cp "$RUNNER_TEMP/audit-a.json" "$out/AB_PR1469_PRODUCTION_REGISTRY_AUDIT.json"
          cp "$RUNNER_TEMP/terminal-a.txt" "$out/TERMINAL.txt"
          sha256sum "$out"/* > "$out/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: ab-pr1469-production-registry-audit
          path: ${{ runner.temp }}/ab-pr1469-production-registry-audit/
          if-no-files-found: error
          retention-days: 30
