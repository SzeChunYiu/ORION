name: chatgpt-1026-derived-artifact-repair-once

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-derived-artifacts:
    if: github.head_ref == 'claude/gap-collision-absorb-20260823' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted test dependency
        run: python -m pip install pytest
      - name: Make manifest recovery duplicate-path safe
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/regen_paper_manifests.py')
          text=path.read_text(encoding='utf-8')
          old='SUBJECT_RE = re.compile(r\'^\\s*"subject_commit":\')\n\n\ndef parse_tolerant(raw: str) -> tuple[dict, dict] | None:\n'
          new='''SUBJECT_RE = re.compile(r'^\\s*"subject_commit":')
BOUND_PATH_RE = re.compile(r'^\\s*"path":\\s*"([^"]+)"')
BOUND_FILES_START_RE = re.compile(r'^\\s*"bound_files":\\s*\\[\\s*$')
BOUND_FILES_END_RE = re.compile(r'^\\s*]\\s*,?\\s*$')


def recover_bound_paths(raw: str) -> list[str]:
    """Recover every path line from bound_files, including duplicate object keys."""
    inside = False
    found: list[str] = []
    for line in raw.splitlines():
        if not inside:
            if BOUND_FILES_START_RE.match(line):
                inside = True
            continue
        if BOUND_FILES_END_RE.match(line):
            break
        match = BOUND_PATH_RE.match(line)
        if match and match.group(1) not in found:
            found.append(match.group(1))
    return found


def parse_tolerant(raw: str) -> tuple[dict, dict, list[str]] | None:
'''
          if text.count(old) != 1:
              raise SystemExit(f'unexpected parse_tolerant prelude: {text.count(old)} matches')
          text=text.replace(old,new)
          old='    return first, latest\n'
          new='    return first, latest, recover_bound_paths(raw)\n'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected parse_tolerant return: {text.count(old)} matches')
          text=text.replace(old,new)
          old='            first, latest = parsed\n'
          new='            first, latest, recovered_bound_paths = parsed\n'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected parsed tuple use: {text.count(old)} matches')
          text=text.replace(old,new)
          old='            bound_paths = [b["path"] for b in first["bound_files"]]\n'
          new='''            parsed_bound_paths = [b["path"] for b in first["bound_files"]]
            bound_paths = list(dict.fromkeys([*parsed_bound_paths, *recovered_bound_paths]))
'''
          if text.count(old) != 1:
              raise SystemExit(f'unexpected bound_paths assignment: {text.count(old)} matches')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
      - name: Restore already-dropped P6 external test binding
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('papers/paper-06-formal-epistemic-structures-and-mechanics/CONTENT_MANIFEST_V1.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          target='tests/unit/candidates/test_p6_formal_refutation_capacity.py'
          paths=[item['path'] for item in data['bound_files']]
          if target not in paths:
              data['bound_files'].append({'path': target, 'role': None})
          path.write_text(json.dumps(data,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
      - name: Regenerate affected markdown fragments with corrected table counts
        run: |
          set -euo pipefail
          python scripts/render_md_tex.py papers/paper-11-state-as-computation/manuscript/sections/07-methods-and-related-work.md --write papers/paper-11-state-as-computation/manuscript/_markdown_main/1ef17fb518f2f22c91eb668d6953baab.md.tex
          python scripts/render_md_tex.py papers/paper-11-state-as-computation/manuscript/sections/05-hostile-decoder-substitution.md --write papers/paper-11-state-as-computation/manuscript/_markdown_main/693700d57a0441bcf23ef7e29654700f.md.tex
          python scripts/render_md_tex.py papers/paper-12-adaptive-state-reasoning/manuscript/sections/05-results.md --write papers/paper-12-adaptive-state-reasoning/manuscript/_markdown_main/470467d77cf974aeed33bd6bec9e7c12.md.tex
          python scripts/render_md_tex.py papers/paper-12-adaptive-state-reasoning/manuscript/sections/00-abstract.md --write papers/paper-12-adaptive-state-reasoning/manuscript/_markdown_main/aa467811179a5b269d90ea90ccd8ef84.md.tex
          python scripts/render_md_tex.py papers/paper-12-adaptive-state-reasoning/manuscript/sections/08-discussion.md --write papers/paper-12-adaptive-state-reasoning/manuscript/_markdown_main/f80aef237672e1bcb43c95b87716c4ce.md.tex
          python scripts/render_md_tex.py papers/paper-13-responsibility-carrying-state/manuscript/sections/05-protected-benchmark.md --write papers/paper-13-responsibility-carrying-state/manuscript/_markdown_main/573b3bb9d555ca65cff6d0f0242ab41d.md.tex
          python scripts/render_md_tex.py papers/paper-13-responsibility-carrying-state/manuscript/sections/06-results.md --write papers/paper-13-responsibility-carrying-state/manuscript/_markdown_main/9607f45ebd641439da751518eac7a2c5.md.tex
          python scripts/render_md_tex.py papers/paper-13-responsibility-carrying-state/manuscript/sections/00-abstract.md --write papers/paper-13-responsibility-carrying-state/manuscript/_markdown_main/c0e1115f24e27aa1d9b4c3e8343cbf0c.md.tex
      - name: Regenerate affected manifests and checksums
        run: |
          set -euo pipefail
          python scripts/regen_paper_manifests.py --repo-root . --papers paper-06,paper-11,paper-12,paper-13
      - name: Verify repaired tooling and derived artifacts
        run: |
          set -euo pipefail
          pytest -q tests/unit/scripts/test_manifest_and_markdown_regeneration.py
          for paper in \
            papers/paper-06-formal-epistemic-structures-and-mechanics \
            papers/paper-11-state-as-computation \
            papers/paper-12-adaptive-state-reasoning \
            papers/paper-13-responsibility-carrying-state; do
            python -m json.tool "$paper/CONTENT_MANIFEST_V1.json" >/dev/null
            sha256sum -c "$paper/SHA256SUMS"
          done
          grep -F 'tests/unit/candidates/test_p6_formal_refutation_capacity.py' papers/paper-06-formal-epistemic-structures-and-mechanics/CONTENT_MANIFEST_V1.json
          grep -F 'tests/unit/candidates/test_p6_formal_refutation_capacity.py' papers/paper-06-formal-epistemic-structures-and-mechanics/SHA256SUMS
          python scripts/render_md_tex.py papers/paper-11-state-as-computation/manuscript/sections/05-hostile-decoder-substitution.md --check papers/paper-11-state-as-computation/manuscript/_markdown_main/693700d57a0441bcf23ef7e29654700f.md.tex
          python scripts/render_md_tex.py papers/paper-12-adaptive-state-reasoning/manuscript/sections/05-results.md --check papers/paper-12-adaptive-state-reasoning/manuscript/_markdown_main/470467d77cf974aeed33bd6bec9e7c12.md.tex
      - name: Commit repairs and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/chatgpt-1026-derived-artifact-repair-once.yml
          git add \
            scripts/regen_paper_manifests.py \
            scripts/render_md_tex.py \
            tests/unit/scripts/test_manifest_and_markdown_regeneration.py \
            papers/paper-06-formal-epistemic-structures-and-mechanics/CONTENT_MANIFEST_V1.json \
            papers/paper-06-formal-epistemic-structures-and-mechanics/SHA256SUMS \
            papers/paper-11-state-as-computation/CONTENT_MANIFEST_V1.json \
            papers/paper-11-state-as-computation/SHA256SUMS \
            papers/paper-11-state-as-computation/manuscript/_markdown_main/1ef17fb518f2f22c91eb668d6953baab.md.tex \
            papers/paper-11-state-as-computation/manuscript/_markdown_main/693700d57a0441bcf23ef7e29654700f.md.tex \
            papers/paper-12-adaptive-state-reasoning/CONTENT_MANIFEST_V1.json \
            papers/paper-12-adaptive-state-reasoning/SHA256SUMS \
            papers/paper-12-adaptive-state-reasoning/manuscript/_markdown_main/470467d77cf974aeed33bd6bec9e7c12.md.tex \
            papers/paper-12-adaptive-state-reasoning/manuscript/_markdown_main/aa467811179a5b269d90ea90ccd8ef84.md.tex \
            papers/paper-12-adaptive-state-reasoning/manuscript/_markdown_main/f80aef237672e1bcb43c95b87716c4ce.md.tex \
            papers/paper-13-responsibility-carrying-state/CONTENT_MANIFEST_V1.json \
            papers/paper-13-responsibility-carrying-state/SHA256SUMS \
            papers/paper-13-responsibility-carrying-state/manuscript/_markdown_main/573b3bb9d555ca65cff6d0f0242ab41d.md.tex \
            papers/paper-13-responsibility-carrying-state/manuscript/_markdown_main/9607f45ebd641439da751518eac7a2c5.md.tex \
            papers/paper-13-responsibility-carrying-state/manuscript/_markdown_main/c0e1115f24e27aa1d9b4c3e8343cbf0c.md.tex
          git diff --cached --check
          git commit -m 'fix(manifests): preserve external bindings and correct table rows'
          git push origin HEAD:${GITHUB_HEAD_REF}
