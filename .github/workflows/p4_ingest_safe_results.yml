name: p4-ingest-safe-results

on:
  push:
    branches: [shadow/p4-issue101-results]
    paths:
      - 'papers/orion-14-verified-scientific-discovery/evidence/INGEST_SAFE_RESULTS_V1.txt'

permissions:
  contents: write
  actions: read

env:
  CAMPAIGN_RUN_ID: '31968809206'
  SAFE_ARTIFACT_NAME: p4-publication-safe-bundle-31968809206
  SUBJECT_COMMIT: 46977ea104162c4cf64da8138a4c4759065fe6d4
  PROTECTED_MANIFEST_SHA256: 23c7732118bf750b4f5b927aab271cf1e7ee1068d8dc1838ca5119d7e436b102

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shadow/p4-issue101-results
          fetch-depth: 0

      - name: Download accepted safe bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p4-safe"
          gh run download "$CAMPAIGN_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SAFE_ARTIFACT_NAME" --dir "$RUNNER_TEMP/p4-safe"
          test -f "$RUNNER_TEMP/p4-safe/evaluation/campaign_summary.json"
          test -f "$RUNNER_TEMP/p4-safe/evaluation/authority_benchmark_panel.json"
          test -f "$RUNNER_TEMP/p4-safe/reproduction/reproduction_receipt.json"

      - name: Verify acceptance before ingestion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'p4-safe'
          summary = json.loads((root/'evaluation'/'campaign_summary.json').read_text())
          ablations = json.loads((root/'evaluation'/'ablation_summary.json').read_text())
          telemetry = json.loads((root/'evaluation'/'access_telemetry_summary.json').read_text())
          repro = json.loads((root/'reproduction'/'reproduction_receipt.json').read_text())
          assert summary['campaign_run_id'] == os.environ['CAMPAIGN_RUN_ID']
          assert summary['subject_commit'] == os.environ['SUBJECT_COMMIT']
          assert summary['typed_panel_status'] == 'PASS'
          assert summary['panel_pass'] is True
          assert summary['H1']['status'] == 'PASS'
          assert summary['H2']['status'] == 'PASS'
          assert len(ablations['ablations']) == 8
          assert repro['headline_reproduced'] is True
          assert repro['protected_manifest_hash'] == os.environ['PROTECTED_MANIFEST_SHA256']
          assert telemetry['candidate_protected_identifier_hits'] == 0
          assert telemetry['comparator_protected_identifier_hits'] == 0
          assert telemetry['candidate_external_ip_connects'] == 0
          assert telemetry['comparator_external_ip_connects'] == 0
          print('accepted protected result verified for safe ingestion')
          PY

      - name: Copy canonical safe evidence and build figure summary
        shell: bash
        run: |
          set -euo pipefail
          DEST=papers/orion-14-verified-scientific-discovery/evidence/protected-campaign-31968809206
          mkdir -p "$DEST" papers/orion-14-verified-scientific-discovery/figures/data
          cp "$RUNNER_TEMP/p4-safe/evaluation/campaign_summary.json" "$DEST/CAMPAIGN_SUMMARY_V1.json"
          cp "$RUNNER_TEMP/p4-safe/evaluation/ablation_summary.json" "$DEST/ABLATION_SUMMARY_V1.json"
          cp "$RUNNER_TEMP/p4-safe/evaluation/access_telemetry_summary.json" "$DEST/ACCESS_TELEMETRY_SUMMARY_V1.json"
          cp "$RUNNER_TEMP/p4-safe/evaluation/authority_benchmark_panel.json" "$DEST/AUTHORITY_BENCHMARK_PANEL_V1.json"
          cp "$RUNNER_TEMP/p4-safe/evaluation/public_attack_manifest.jsonl" "$DEST/PUBLIC_ATTACK_MANIFEST_V1.jsonl"
          cp "$RUNNER_TEMP/p4-safe/evaluation/public_candidate_verdicts.jsonl" "$DEST/PUBLIC_CANDIDATE_VERDICTS_V1.jsonl"
          cp "$RUNNER_TEMP/p4-safe/reproduction/reproduction_receipt.json" "$DEST/INDEPENDENT_REPRODUCTION_V1.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          repo = Path.cwd()
          dest = repo/'papers/orion-14-verified-scientific-discovery/evidence/protected-campaign-31968809206'
          summary = json.loads((dest/'CAMPAIGN_SUMMARY_V1.json').read_text())
          ablations = json.loads((dest/'ABLATION_SUMMARY_V1.json').read_text())
          telemetry = json.loads((dest/'ACCESS_TELEMETRY_SUMMARY_V1.json').read_text())
          repro = json.loads((dest/'INDEPENDENT_REPRODUCTION_V1.json').read_text())
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          safe_files = {
              p.name: {'sha256': sha(p), 'bytes': p.stat().st_size}
              for p in sorted(dest.iterdir()) if p.is_file()
          }
          index = {
              'schema': 'P4ProtectedArtifactIndex.v1',
              'protocol_id': 'P4.protected-authority.v1',
              'campaign_run_id': os.environ['CAMPAIGN_RUN_ID'],
              'campaign_head_commit': '1380ca2e404254c6ba3cd55a44c1a07ae37c0f78',
              'subject_commit': os.environ['SUBJECT_COMMIT'],
              'safe_bundle_artifact': {'artifact_id': 9269235009, 'campaign_run_id': os.environ['CAMPAIGN_RUN_ID']},
              'host_custody': {
                  'host_run_id': '31967352555',
                  'candidate_visible_artifact_id': 9268846910,
                  'protected_artifact_id': 9268847119,
                  'protected_manifest_sha256': os.environ['PROTECTED_MANIFEST_SHA256'],
              },
              'campaign_jobs': {
                  'handoff': 95218032382,
                  'candidate': 95218034688,
                  'comparators_and_ablations': 95218034720,
                  'protected_evaluator': 95218082384,
                  'independent_reproduction': 95218146748,
                  'publication_safe_bundle': 95218161183,
              },
              'safe_files': safe_files,
              'protected_raw_artifacts': {
                  'description': 'Raw scored/ablation verdicts, error analysis, and candidate/comparator strace remain in protected Actions custody; they are intentionally not copied into the public repository.',
                  'campaign_run_id': os.environ['CAMPAIGN_RUN_ID'],
              },
              'integrity': {
                  'typed_panel_hash': repro['typed_panel_hash'],
                  'headline_reproduced': repro['headline_reproduced'],
                  'candidate_protected_identifier_hits': telemetry['candidate_protected_identifier_hits'],
                  'comparator_protected_identifier_hits': telemetry['comparator_protected_identifier_hits'],
                  'candidate_external_ip_connects': telemetry['candidate_external_ip_connects'],
                  'comparator_external_ip_connects': telemetry['comparator_external_ip_connects'],
              },
          }
          (dest/'ARTIFACT_INDEX_V1.json').write_text(json.dumps(index, indent=2, sort_keys=True)+'\n')

          systems = []
          for sid, data in summary['systems'].items():
              rates = data['rates']
              systems.append({
                  'system_id': sid,
                  'false_promotion': rates['false_authority_promotion_rate'],
                  'false_promotion_ci95': data['false_promotion_ci95'],
                  'coverage': data['clean_coverage'],
                  'coverage_ci95': data['clean_coverage_ci95'],
                  'attribution_accuracy': rates.get('source_attribution_accuracy'),
                  'semantic_support_accuracy': rates.get('support_contradiction_f1'),
                  'resource_cost': data['resource_units'],
                  'latency_seconds': data['mean_latency_seconds'],
                  'clean_false_negative_rate': data['clean_false_negative_rate'],
              })
          for sid, data in ablations['ablations'].items():
              systems.append({
                  'system_id': sid,
                  'false_promotion': data['false_promotion_rate'],
                  'false_promotion_ci95': None,
                  'coverage': data['clean_coverage'],
                  'coverage_ci95': None,
                  'attribution_accuracy': None,
                  'semantic_support_accuracy': None,
                  'resource_cost': ablations['resource_units_per_variant'],
                  'latency_seconds': data['mean_latency_seconds'],
                  'clean_false_negative_rate': data['clean_false_negative_count']/data['clean_total'],
              })
          comp = summary['strongest_frozen_comparator']
          families = []
          for family in sorted(summary['family_summary']['ORION']):
              o = summary['family_summary']['ORION'][family]
              b = summary['family_summary'][comp][family]
              families.append({
                  'family': family,
                  'n': o['n'],
                  'orion_false_promotion_rate': o['false_promotion_rate'],
                  'orion_correct_terminal_rate': o['correct_terminal_rate'],
                  'comparator_false_promotion_rate': b['false_promotion_rate'],
                  'comparator_correct_terminal_rate': b['correct_terminal_rate'],
              })
          figure_data = {
              'schema_version': 'orion.p4.protected-results.v1',
              'status': 'PROTECTED_RESULTS_ACCEPTED',
              'protocol_id': 'P4.protected-authority.v1',
              'campaign_run_id': os.environ['CAMPAIGN_RUN_ID'],
              'subject_commit': summary['subject_commit'],
              'typed_panel_status': summary['typed_panel_status'],
              'typed_panel_hash': summary['typed_panel_hash'],
              'strongest_frozen_comparator': comp,
              'H1': summary['H1'], 'H2': summary['H2'], 'H3': summary['H3'],
              'systems': systems,
              'attack_families': families,
              'retained_error_case_count': summary['retained_error_case_count'],
              'telemetry': telemetry,
              'independent_reproduction': {
                  'headline_reproduced': repro['headline_reproduced'],
                  'reproducer_lineage_hash': repro['reproducer_lineage_hash'],
              },
          }
          out = repo/'papers/orion-14-verified-scientific-discovery/figures/data/RESULTS_SUMMARY_V1.json'
          out.write_text(json.dumps(figure_data, indent=2, sort_keys=True)+'\n')
          PY

      - name: Commit safe evidence to this lane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/orion-14-verified-scientific-discovery/evidence/protected-campaign-31968809206 papers/orion-14-verified-scientific-discovery/figures/data/RESULTS_SUMMARY_V1.json
          git diff --cached --quiet && { echo 'nothing to ingest'; exit 1; }
          git commit -m 'data(p4): ingest accepted protected campaign safe bundle'
          git push origin HEAD:shadow/p4-issue101-results
