name: orion-02-r20-cross-language-rust

on:
  push:
    branches:
      - chatgpt/orion-02-r18-null-current-main-20260827
    paths:
      - 'papers/orion-02-fiberguard-finite-fibre/verify_r20_cross_language.rs'
      - 'papers/orion-02-fiberguard-finite-fibre/extensions/r19/JOINT_ROUTE_R19_RESULTS.json'
      - 'papers/orion-02-fiberguard-finite-fibre/CROSS_LANGUAGE_RUST_R20_RESULT.json'
      - 'papers/orion-02-fiberguard-finite-fibre/CROSS_LANGUAGE_RUST_R20_TERMINAL.txt'
      - '.github/workflows/orion-02-r20-cross-language-rust.yml'
  pull_request:
    paths:
      - 'papers/orion-02-fiberguard-finite-fibre/verify_r20_cross_language.rs'
      - 'papers/orion-02-fiberguard-finite-fibre/extensions/r19/JOINT_ROUTE_R19_RESULTS.json'
      - 'papers/orion-02-fiberguard-finite-fibre/CROSS_LANGUAGE_RUST_R20_RESULT.json'
      - 'papers/orion-02-fiberguard-finite-fibre/CROSS_LANGUAGE_RUST_R20_TERMINAL.txt'
      - '.github/workflows/orion-02-r20-cross-language-rust.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  R18_RESULT_SHA256: 8136ac6e614406a51270342d73786dfec43a9ecdac81f62e815cd14d1a739c45

jobs:
  independent-rust-checker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize immutable R18 recovery result
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/chatgpt/r18-c-paired-route-20260826
          source=FETCH_HEAD
          legacy='papers/five-paper-top-tier-r8/C/FIBERGUARD_PAIRED_ROUTE_R18_RECOVERY_RESULTS.json'
          git show "$source:$legacy" > "$RUNNER_TEMP/r18.json"
          test "$(sha256sum "$RUNNER_TEMP/r18.json" | cut -d' ' -f1)" = "$R18_RESULT_SHA256"

      - name: Resolve non-self-referential checker subject
        shell: bash
        run: |
          set -euo pipefail
          root='papers/orion-02-fiberguard-finite-fibre'
          registered="$root/CROSS_LANGUAGE_RUST_R20_RESULT.json"
          if [ -f "$registered" ]; then
            subject="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_subject"])' "$registered")"
          else
            subject="$GITHUB_SHA"
          fi
          git cat-file -e "$subject^{commit}"
          git diff --exit-code "$subject" HEAD -- \
            "$root/verify_r20_cross_language.rs" \
            "$root/extensions/r19/JOINT_ROUTE_R19_RESULTS.json"
          blob="$(git rev-parse "$subject:$root/verify_r20_cross_language.rs")"
          printf '%s\n' "$subject" > "$RUNNER_TEMP/source-subject.txt"
          printf '%s\n' "$blob" > "$RUNNER_TEMP/source-blob.txt"

      - name: Compile and replay Rust checker twice
        shell: bash
        run: |
          set -euo pipefail
          root='papers/orion-02-fiberguard-finite-fibre'
          rustc --version | tee "$RUNNER_TEMP/rustc-version.txt"
          rustc --edition=2021 -C opt-level=2 -C debuginfo=0 \
            "$root/verify_r20_cross_language.rs" \
            -o "$RUNNER_TEMP/verify-r20-rust"
          for suffix in a b; do
            "$RUNNER_TEMP/verify-r20-rust" \
              --r18 "$RUNNER_TEMP/r18.json" \
              --r19 "$root/extensions/r19/JOINT_ROUTE_R19_RESULTS.json" \
              --source-subject "$(cat "$RUNNER_TEMP/source-subject.txt")" \
              --source-blob "$(cat "$RUNNER_TEMP/source-blob.txt")" \
              --output "$RUNNER_TEMP/result-$suffix.json" \
              | tee "$RUNNER_TEMP/terminal-$suffix.txt"
          done
          cmp "$RUNNER_TEMP/result-a.json" "$RUNNER_TEMP/result-b.json"
          cmp "$RUNNER_TEMP/terminal-a.txt" "$RUNNER_TEMP/terminal-b.txt"
          grep -q '^ORION02_R20_RUST_CROSS_LANGUAGE_CHECKER_PASS$' "$RUNNER_TEMP/terminal-a.txt"

      - name: Verify exact denominators and authority ceiling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'result-a.json').read_text())
          assert result['schema']=='ORION.ORION02.R20CrossLanguageRust.v1'
          assert result['terminal']=='ORION02_R20_RUST_CROSS_LANGUAGE_CHECKER_PASS'
          assert result['source_subject']==(Path(os.environ['RUNNER_TEMP'])/'source-subject.txt').read_text().strip()
          assert len(result['source_blob'])==40
          assert all(result['controls'].values())
          checks=result['finite_checks']
          assert checks['deterministic_witness_systems']==1000
          assert checks['no_free_extension_cases']==700
          assert checks['fallback_alignment_cases']==33824
          assert checks['lower_image_families']==696
          assert checks['lower_image_ordered_comparisons']==484416
          assert checks['lower_image_monotone_linear_objectives']==15
          assert result['r18']['candidate_count']==99
          assert result['r18']['feasible_candidate_count']==0
          assert result['r18']['terminal']=='FIBERGUARD_R18_NO_PAIRED_ROUTE_VALUE'
          assert all(panel['route_change_coverage']==0.0 for panel in result['r18']['panels'])
          assert all(abs(panel['routed_mean_total_cost']-panel['full_mean_total_cost'])<1e-12 for panel in result['r18']['panels'])
          assert all(panel['full_mean_total_cost']<panel['no_feature_fallback_mean_total_cost'] for panel in result['r18']['panels'])
          assert result['r19']=={
              'diagonal_pair_randomized_value':'50',
              'full_pair_randomized_value':'0',
              'original_randomized_value':'35',
              'shortcut_randomized_value':'70',
              'terminal':'FIBERGUARD_JOINT_ROUTE_R19_REPLACEMENT_PASS',
          }
          assert result['authority']=={
              'cross_language':True,
              'external_independence':False,
              'journal_authority':False,
              'novelty':False,
              'production_value':False,
          }
          print('ORION_02_R20_RUST_RESULT_VERIFIED')
          PY

      - name: Require durable registered bytes when present
        shell: bash
        run: |
          set -euo pipefail
          root='papers/orion-02-fiberguard-finite-fibre'
          registered="$root/CROSS_LANGUAGE_RUST_R20_RESULT.json"
          terminal="$root/CROSS_LANGUAGE_RUST_R20_TERMINAL.txt"
          if [ -e "$registered" ] || [ -e "$terminal" ]; then
            test -f "$registered" && test -f "$terminal"
            cmp "$RUNNER_TEMP/result-a.json" "$registered"
            cmp "$RUNNER_TEMP/terminal-a.txt" "$terminal"
          fi

      - name: Check diff hygiene
        run: git diff --check

      - name: Stage immutable checker artifact
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/orion-02-r20-rust-checker"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/result-a.json" "$out/CROSS_LANGUAGE_RUST_R20_RESULT.json"
          cp "$RUNNER_TEMP/terminal-a.txt" "$out/TERMINAL.txt"
          cp "$RUNNER_TEMP/rustc-version.txt" "$out/RUSTC_VERSION.txt"
          cp "$RUNNER_TEMP/r18.json" "$out/FIBERGUARD_PAIRED_ROUTE_R18_RECOVERY_RESULTS.json"
          cp 'papers/orion-02-fiberguard-finite-fibre/extensions/r19/JOINT_ROUTE_R19_RESULTS.json' "$out/"
          sha256sum "$out"/* > "$out/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: orion-02-r20-cross-language-rust
          path: ${{ runner.temp }}/orion-02-r20-rust-checker/
          if-no-files-found: error
          retention-days: 30

      - name: Publish durable checker receipt once
        if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/orion-02-r18-null-current-main-20260827'
        shell: bash
        run: |
          set -euo pipefail
          root='papers/orion-02-fiberguard-finite-fibre'
          registered="$root/CROSS_LANGUAGE_RUST_R20_RESULT.json"
          terminal="$root/CROSS_LANGUAGE_RUST_R20_TERMINAL.txt"
          if [ ! -e "$registered" ] && [ ! -e "$terminal" ]; then
            cp "$RUNNER_TEMP/result-a.json" "$registered"
            cp "$RUNNER_TEMP/terminal-a.txt" "$terminal"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$registered" "$terminal"
            git commit -m 'results(ORION-02): bind Rust cross-language R20 receipt'
            git push origin HEAD:refs/heads/chatgpt/orion-02-r18-null-current-main-20260827
          else
            test -f "$registered" && test -f "$terminal"
            echo 'durable Rust checker bytes already present'
          fi
