name: dispatch-manuscript-audit-r12-final

on:
  push:
    branches:
      - chatgpt/r12-manuscript-science-audit-20260826-d
    paths:
      - .github/workflows/dispatch-manuscript-audit-r12-final.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch-and-remove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/r12-manuscript-science-audit-20260826-d
          fetch-depth: 0
      - name: Dispatch final manuscript audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run manuscript-science-audit-r12.yml --ref chatgpt/r12-manuscript-science-audit-20260826-d
      - name: Remove one-shot dispatcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/dispatch-manuscript-audit-r12-final.yml
          git commit -m 'ci(science): remove one-shot final audit dispatcher'
          git push origin HEAD:chatgpt/r12-manuscript-science-audit-20260826-d
