name: q1-pr1449-resource-audit-r20
on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths:
      - 'research/five-paper-top-tier-r20/audit_q1_pr1449.py'
      - '.github/workflows/q1-pr1449-resource-audit-r20.yml'
  workflow_dispatch:
permissions: {contents: read, pull-requests: read}
jobs:
  resource-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch and audit PR 1449 twice
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/1449" > "$RUNNER_TEMP/pr.json"
          base="$(jq -r .base.sha "$RUNNER_TEMP/pr.json")";head="$(jq -r .head.sha "$RUNNER_TEMP/pr.json")"
          git fetch --no-tags origin "$base" "$head";git worktree add --detach "$RUNNER_TEMP/pr1449" "$head"
          script='research/five-paper-top-tier-r20/audit_q1_pr1449.py';python -m py_compile "$script"
          for suffix in a b; do python "$script" --repo "$RUNNER_TEMP/pr1449" --base "$base" --head "$head" --output "$RUNNER_TEMP/audit-$suffix.json" | tee "$RUNNER_TEMP/terminal-$suffix.txt"; done
          cmp "$RUNNER_TEMP/audit-a.json" "$RUNNER_TEMP/audit-b.json";cmp "$RUNNER_TEMP/terminal-a.txt" "$RUNNER_TEMP/terminal-b.txt"
      - name: Preserve adverse resource boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'audit-a.json').read_text())
          assert r['schema']=='ORION.Q1.PR1449ResourceAudit.R20.v1'
          assert r['authority']['physical_resource_value'] is False
          assert r['authority']['novelty'] is False
          assert r['authority']['external_quantum_review'] is False
          assert r['authority']['journal_authority'] is False
          if r['terminal']=='Q1_PR1449_PARTIAL_RESOURCE_MAP_AUDITED__MEASURED_BENCHMARK_OPEN':
              assert r['authority']['logical_template_map'] is True
          else: assert r['terminal']=='Q1_PR1449_RESOURCE_AUTHORITY_NOT_ESTABLISHED'
          print('Q1_PR1449_AUTHORITY_CLASSIFIED',r['terminal'])
          PY
      - run: git diff --check
      - name: Stage audit
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/q1-pr1449-resource-audit";mkdir -p "$out"
          cp "$RUNNER_TEMP/pr.json" "$out/PR1449.json";cp "$RUNNER_TEMP/audit-a.json" "$out/Q1_PR1449_RESOURCE_AUDIT.json";cp "$RUNNER_TEMP/terminal-a.txt" "$out/TERMINAL.txt";sha256sum "$out"/* > "$out/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with: {name: q1-pr1449-resource-audit, path: '${{ runner.temp }}/q1-pr1449-resource-audit/', if-no-files-found: error, retention-days: 30}
