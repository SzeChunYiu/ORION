name: p1-necessity-world-freeze

on:
  push:
    branches:
      - shadow/p1-necessity-world-freeze-20260817
    paths:
      - '.github/workflows/p1-necessity-world-freeze.yml'
      - 'research/revival/p1/protocol/P1.epistemic-mutation-necessity.v2.2*.json'
      - 'research/revival/p1/freeze_mutation_necessity_worlds.py'
      - 'src/orion/study/p1_causal/necessity_*.py'
      - 'tests/unit/study/p1_causal/test_p1_necessity_*.py'

permissions:
  contents: write

jobs:
  freeze-worlds:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: shadow/p1-necessity-world-freeze-20260817
          fetch-depth: 0
      - name: Bind exact design head
        run: |
          echo "subject=$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact repository package
        run: python -m pip install -e '.[test]'
      - name: Compile P1 necessity surface
        run: python -m compileall -q src/orion/study/p1_causal research/revival/p1
      - name: Development-only falsifiers must pass before confirmatory seed exists
        run: >-
          pytest -q
          tests/unit/study/p1_causal/test_p1_necessity_design.py
          tests/unit/study/p1_causal/test_p1_necessity_freeze.py
      - name: Materialize protected world identity only
        run: |
          rm -rf /tmp/p1-necessity-worlds
          python research/revival/p1/freeze_mutation_necessity_worlds.py \
            --outdir /tmp/p1-necessity-worlds
      - name: Enforce no-outcome freeze boundary
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=json.loads(Path('/tmp/p1-necessity-worlds/WORLD_FREEZE.json').read_text())
          assert p['protocol_version']=='P1.epistemic-mutation-necessity.v2.2.2'
          assert p['confirmatory_seed']==202608172211
          assert p['replication_seed']==202608172212
          assert p['n']==2882
          assert p['hidden_shift_n']==480
          assert p['negative_control_n']==2402
          assert p['candidate_view_leak_count']==0
          assert p['arms_executed'] is False
          assert p['outcome_accessed'] is False
          assert p['subject_git_sha']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          print('P1 necessity world freeze: PASS')
          PY
      - name: Commit manifest only, never protected rows
        run: |
          mkdir -p research/revival/p1/confirmatory/v2.2
          cp /tmp/p1-necessity-worlds/WORLD_FREEZE.json \
            research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'research(P1): bind necessity confirmatory world identity only'
          git push origin HEAD:shadow/p1-necessity-world-freeze-20260817
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-necessity-primary-world-freeze
          path: /tmp/p1-necessity-worlds/
          if-no-files-found: error
