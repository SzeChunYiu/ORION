name: p7-real-regime-transport-v1

on:
  pull_request:
    paths:
      - 'papers/paper-07-epistemic-navigation-open-worlds/top_tier/P7_REAL_REGIME_SOURCES_2026-08-23.md'
      - 'papers/paper-07-epistemic-navigation-open-worlds/top_tier/P7_REAL_REGIME_TRANSPORT_PROTOCOL_V1.md'
      - 'papers/paper-07-epistemic-navigation-open-worlds/top_tier/run_real_regime_transport_v1.py'
      - 'papers/paper-07-epistemic-navigation-open-worlds/top_tier/check_real_regime_transport_independent_v1.py'
      - '.github/workflows/p7-real-regime-transport-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-regime-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install frozen scientific dependencies
        run: python -m pip install 'numpy==2.3.2' 'scikit-learn==1.7.1'
      - name: Execute non-synthetic regime transport study
        run: python papers/paper-07-epistemic-navigation-open-worlds/top_tier/run_real_regime_transport_v1.py | tee p7_real_regime_transport_v1.json
      - name: Verify primary byte replay
        run: |
          python papers/paper-07-epistemic-navigation-open-worlds/top_tier/run_real_regime_transport_v1.py > p7_real_regime_transport_v1_rerun.json
          cmp p7_real_regime_transport_v1.json p7_real_regime_transport_v1_rerun.json
      - name: Execute independent checker
        run: python papers/paper-07-epistemic-navigation-open-worlds/top_tier/check_real_regime_transport_independent_v1.py | tee p7_real_regime_transport_independent_v1.json
      - name: Verify independent agreement
        run: |
          python - <<'PY'
          import json
          p=json.load(open('p7_real_regime_transport_v1.json'));q=json.load(open('p7_real_regime_transport_independent_v1.json'))
          assert p['terminal']=='P7_REAL_REGIME_TRANSPORT_V1_SUPPORTED'
          assert q['terminal']=='P7_REAL_REGIME_TRANSPORT_SECOND_INDEPENDENT_CHECKER_GREEN'
          assert p['standard_case_count']==q['standard']['case_count']==14
          assert p['standard_metrics']['WITNESS_AWARE']['accuracy']==1.0
          assert p['standard_metrics']['VALUE_ONLY']['false_closure']==q['standard']['value_only_false_closure']==8
          assert p['standard_metrics']['ALWAYS_REOPEN']['unnecessary_reopen']==q['standard']['always_reopen_unnecessary']==6
          assert p['wine_sample_count']==q['wine']['sample_count']==178
          assert p['wine_row_count']==q['wine']['row_count']==712
          assert p['wine_metrics']['WITNESS_AWARE']['accuracy']==1.0
          assert p['wine_metrics']['VALUE_ONLY']['false_closure']==q['wine']['value_only_false_closure']
          assert p['wine_metrics']['ALWAYS_REOPEN']['unnecessary_reopen']==q['wine']['always_reopen_unnecessary']
          assert p['sequential_support_history_disposition_differences']==q['wine']['sequential_support_history_disposition_differences']
          print('P7_REAL_REGIME_TRANSPORT_TWO_IMPLEMENTATIONS_AGREE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p7-real-regime-transport-v1
          path: |
            p7_real_regime_transport_v1.json
            p7_real_regime_transport_independent_v1.json
