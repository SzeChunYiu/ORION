name: q-qg-figures-v2

on:
  pull_request:
    paths:
      - 'papers/Q_QG_FIGURE_SOURCE_V1.json'
      - 'papers/build_q_qg_figures_v2.py'
      - 'papers/Q-paper-02-recursive-recovery/Q2_ELIGIBLE_RECEIPT_INVENTORY_V1.json'
      - 'papers/Q-paper-02-recursive-recovery/Q2_TRANSITION_GRAPH_V2.json'
      - '.github/workflows/q-qg-figures-v2.yml'
  push:
    branches:
      - 'codex/q-qg-nature-skills-publication-closure-20260821'
    paths:
      - 'papers/Q_QG_FIGURE_SOURCE_V1.json'
      - 'papers/build_q_qg_figures_v2.py'
      - 'papers/Q-paper-02-recursive-recovery/Q2_ELIGIBLE_RECEIPT_INVENTORY_V1.json'
      - 'papers/Q-paper-02-recursive-recovery/Q2_TRANSITION_GRAPH_V2.json'
      - '.github/workflows/q-qg-figures-v2.yml'

permissions:
  contents: read

jobs:
  build-figures-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install plotting dependencies
        run: python -m pip install --disable-pip-version-check --no-input matplotlib numpy
      - name: Build receipt-verified standalone figures
        run: python papers/build_q_qg_figures_v2.py --out build/q_qg_figures_v2
      - name: Verify publication figure bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s build/q_qg_figures_v2/source_data.json
          test -s build/q_qg_figures_v2/verification.json
          test -s build/q_qg_figures_v2/generated_stems.json
          count_svg="$(find build/q_qg_figures_v2 -maxdepth 1 -name '*.svg' | wc -l)"
          count_png="$(find build/q_qg_figures_v2 -maxdepth 1 -name '*.png' | wc -l)"
          test "${count_svg}" -eq 12
          test "${count_png}" -eq 12
          echo "STANDALONE_SVG=${count_svg}"
          echo "STANDALONE_PNG=${count_png}"
      - name: Archive V2 figure/source-data bundle
        uses: actions/upload-artifact@v4
        with:
          name: q-qg-publication-figures-v2
          path: build/q_qg_figures_v2
          if-no-files-found: error
          retention-days: 30
