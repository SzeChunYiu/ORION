name: p9-m1-experiment

on:
  pull_request:
    paths:
      - 'src/orion/study/p9/**'
      - 'research/extensions/p9-structured-neural/**'
      - 'development/p9-m1-classical/**'
      - 'tests/test_p9_m1.py'
      - '.github/workflows/p9-m1-experiment.yml'
  workflow_dispatch:

concurrency:
  group: p9-m1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,candidates]'
      - name: M1 focused tests
        run: pytest -q tests/test_p9_m1.py
      - name: Execute frozen M1 protocol
        run: >-
          python research/extensions/p9-structured-neural/run_m1.py
          --output "$RUNNER_TEMP/m1-results.json"
          > "$RUNNER_TEMP/m1-full-output.log"
      - name: Print compact M1 result
        env:
          RESULT: ${{ runner.temp }}/m1-results.json
        run: |
          python - <<'PY'
          import json, os
          result = json.load(open(os.environ['RESULT'], encoding='utf-8'))
          print('P9_M1_TERMINAL=' + result['terminal'])
          print('P9_M1_RESULT_DIGEST=' + result['result_digest'])
          print('P9_M1_CORPUS_DIGEST=' + result['corpus_manifest_digest'])
          for view_name, view in result['views'].items():
              overall = view['test_overall']
              print(
                  'P9_M1_VIEW '
                  f"view={view_name} accuracy={overall['accuracy']:.6f} "
                  f"ceiling={overall['exact_view_deterministic_accuracy_ceiling']:.6f} "
                  f"gap={overall['ceiling_gap']:.6f} "
                  f"violation={overall['ceiling_violation']}"
              )
              for task_name, task in view['tasks'].items():
                  selected = task['selected']
                  print(
                      'P9_M1_SELECTED '
                      f"view={view_name} task={task_name} "
                      f"feature={selected['feature_family']} "
                      f"model={selected['config_id']} "
                      f"dev={selected['dev']['accuracy']:.6f} "
                      f"test={task['test']['accuracy']:.6f}"
                  )
          PY
      - name: Upload M1 result
        uses: actions/upload-artifact@v4
        with:
          name: p9-m1-results-${{ github.sha }}
          path: ${{ runner.temp }}/m1-results.json
          if-no-files-found: error
