name: p9-m1-experiment

on:
  pull_request:
    paths:
      - '.github/workflows/p9-m1-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p9-m1-execution2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Bind unchanged scientific subject
        run: |
          echo 'P9_M1_SCIENTIFIC_SUBJECT=ad4a5a0a722c0612222d10aa9cc9dd1ad49b1898'
          echo 'P9_M1_EXECUTION_BASE=8adb00c35cb67b31d30af204d620bc8875919552'
          echo "P9_M1_EXECUTION_HEAD=${GITHUB_SHA}"
          CHANGED="$(git diff --name-only 8adb00c35cb67b31d30af204d620bc8875919552..HEAD)"
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = '.github/workflows/p9-m1-experiment.yml'
          test "$(git diff --name-only ad4a5a0a722c0612222d10aa9cc9dd1ad49b1898..8adb00c35cb67b31d30af204d620bc8875919552)" = '.github/workflows/ci.yml'
      - run: python -m pip install -e '.[dev,candidates]'
      - name: M1 focused tests
        run: pytest -q tests/test_p9_m1.py
      - name: Execute frozen M1 v1.3 scientific protocol under v1.4 routing
        run: >-
          python research/extensions/p9-structured-neural/run_m1.py
          --output "$RUNNER_TEMP/m1-results.json"
          > "$RUNNER_TEMP/m1-full-output.log"
      - name: Print compact M1 result
        env:
          RESULT: ${{ runner.temp }}/m1-results.json
        run: |
          python - <<'PY'
          import json, os
          result = json.load(open(os.environ['RESULT'], encoding='utf-8'))
          print('P9_M1_TERMINAL=' + result['terminal'])
          print('P9_M1_RESULT_DIGEST=' + result['result_digest'])
          print('P9_M1_CORPUS_DIGEST=' + result['corpus_manifest_digest'])
          for view_name, view in result['views'].items():
              overall = view['test_overall']
              print(
                  'P9_M1_VIEW '
                  f"view={view_name} accuracy={overall['accuracy']:.6f} "
                  f"ceiling={overall['exact_view_deterministic_accuracy_ceiling']:.6f} "
                  f"gap={overall['ceiling_gap']:.6f} "
                  f"violation={overall['ceiling_violation']}"
              )
              for task_name, task in view['tasks'].items():
                  selected = task['selected']
                  print(
                      'P9_M1_SELECTED '
                      f"view={view_name} task={task_name} "
                      f"feature={selected['feature_family']} "
                      f"model={selected['config_id']} "
                      f"dev={selected['dev']['accuracy']:.6f} "
                      f"test={task['test']['accuracy']:.6f}"
                  )
          PY
      - name: Persist execution result on execution branch
        env:
          RESULT: ${{ runner.temp }}/m1-results.json
        run: |
          mkdir -p research/extensions/p9-structured-neural/execution
          cp "$RESULT" research/extensions/p9-structured-neural/execution/M1_EXECUTION_RESULT_V1_4.json
          python - <<'PY'
          import json, os, pathlib
          result = json.loads(pathlib.Path(os.environ['RESULT']).read_text())
          receipt = {
              'schema': 'P9.M1ExecutionReceipt.v1.4',
              'scientific_subject': 'ad4a5a0a722c0612222d10aa9cc9dd1ad49b1898',
              'execution_base': '8adb00c35cb67b31d30af204d620bc8875919552',
              'execution_workflow_commit': os.environ['GITHUB_SHA'],
              'protocol': result['protocol'],
              'result_digest': result['result_digest'],
              'corpus_manifest_digest': result['corpus_manifest_digest'],
              'terminal': result['terminal'],
              'authority': 'OFFICIAL_FOCUSED_EXECUTION_PENDING_SCIENTIFIC_PR_INTEGRATION'
          }
          pathlib.Path('research/extensions/p9-structured-neural/execution/M1_EXECUTION_RECEIPT_V1_4.json').write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/extensions/p9-structured-neural/execution/M1_EXECUTION_RESULT_V1_4.json research/extensions/p9-structured-neural/execution/M1_EXECUTION_RECEIPT_V1_4.json
          git commit -m 'P9 M1 v1.4: persist focused execution result'
          git push origin HEAD:${{ github.head_ref }}
      - name: Upload M1 result
        uses: actions/upload-artifact@v4
        with:
          name: p9-m1-results-${{ github.sha }}
          path: ${{ runner.temp }}/m1-results.json
          if-no-files-found: error
