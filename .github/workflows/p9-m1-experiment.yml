name: p9-m1-experiment

on:
  pull_request:
    paths:
      - '.github/workflows/p9-m1-experiment.yml'
      - 'development/p9-m1-classical/**'
      - 'research/extensions/p9-structured-neural/M1_*'
      - 'research/extensions/p9-structured-neural/execution/M1_*'
      - 'research/extensions/p9-structured-neural/run_m1.py'
      - 'src/orion/study/p9/m1*.py'
      - 'tests/test_p9_m1*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,candidates]'
      - name: M1 focused tests
        run: pytest -q tests/test_p9_m1.py tests/test_p9_m1_v12.py
      - name: Replay frozen M1 on this exact PR head
        run: python research/extensions/p9-structured-neural/run_m1.py --output "$RUNNER_TEMP/m1-results.json" > "$RUNNER_TEMP/m1-full-output.log"
      - name: Assert official M1 identity
        env:
          RESULT: ${{ runner.temp }}/m1-results.json
        run: |
          python - <<'PY'
          import json, os, pathlib
          got=json.load(open(os.environ['RESULT'], encoding='utf-8'))
          archived=json.load(open('research/extensions/p9-structured-neural/execution/M1_EXECUTION_RESULT_V1_5.json', encoding='utf-8'))
          assert got['terminal']=='M1_GLOBAL_COMPOSITION_RESIDUAL', got['terminal']
          assert got['result_digest']=='sha256:01e1b62da27b424d453c63b798a5cbb13a915a4546b8ced68fcf84c32d04d97e', got['result_digest']
          assert got['corpus_manifest_digest']=='sha256:01ae54ca4d8cf423b0ac20bf0e085f1ecdf6cec7a1f142cc09b5df0a90d9cc3a'
          assert got['result_digest']==archived['result_digest']
          assert got['terminal']==archived['terminal']
          print('P9_M1_EXACT_HEAD_REPLAY=true')
          print('P9_M1_RESULT_DIGEST='+got['result_digest'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p9-m1-exact-head-${{ github.sha }}
          path: ${{ runner.temp }}/m1-results.json
          if-no-files-found: error
