name: p10-a0-responsibility-control

on:
  pull_request:
    paths:
      - 'src/orion/study/p10/**'
      - 'tests/test_p10_a0_control.py'
      - 'tests/test_p10_a0_runtime.py'
      - 'research/extensions/p10-structured-reasoning/**'
      - '.github/workflows/p10-a0-responsibility-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: A0 hostile tests
        run: pytest -q tests/test_p10_a0_control.py tests/test_p10_a0_runtime.py
      - name: Execute frozen A0 protocol v1.1
        run: python research/extensions/p10-structured-reasoning/run_a0.py --output "$RUNNER_TEMP/p10-a0-results.json"
      - name: Print compact result
        env:
          RESULT: ${{ runner.temp }}/p10-a0-results.json
        run: |
          python - <<'PY'
          import json, os
          result = json.load(open(os.environ['RESULT'], encoding='utf-8'))
          print('P10_A0_PROTOCOL=' + result['protocol'])
          print('P10_A0_SURFACE_CONTRACT=' + str(result['same_surface_hostile_contract_green']))
          print('P10_A0_TERMINAL=' + result['terminal'])
          for name, arm in result['arms'].items():
              print(
                  f"P10_A0_ARM arm={name} accuracy={arm['accuracy']:.6f} "
                  f"false_closure={arm['false_closure_rate']:.6f} "
                  f"reframe={arm['unnecessary_reframe_rate']:.6f} "
                  f"unresolved={arm['unresolved_accuracy']:.6f}"
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p10-a0-results-${{ github.sha }}
          path: ${{ runner.temp }}/p10-a0-results.json
          if-no-files-found: error
