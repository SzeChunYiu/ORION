name: p1-u-r6-native-runtime

on:
  pull_request:
    paths:
      - 'development/p1-u-gpt-r6-native-runtime/**'
      - 'research/claim_expansion/p1/gpt_r6/**'
      - 'research/claim_expansion/p1/gpt_r5/FIXED_SOURCE_SET_V1.json'
      - 'research/claim_expansion/p1/gpt_r5/build_fixed_corpus.py'
      - 'tests/unit/p1/test_p1_u_r6_native_runtime.py'
      - 'tests/unit/p1/test_p1_u_r6_native_evaluator.py'
      - '.github/workflows/p1-u-r6-native-runtime.yml'
      - 'src/orion/**'
  workflow_dispatch:

concurrency:
  group: p1-u-r6-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-runtime-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ORION and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify native ORION architecture and evaluator gates
        run: >-
          pytest -q
          tests/unit/p1/test_p1_u_r6_native_runtime.py
          tests/unit/p1/test_p1_u_r6_native_evaluator.py
