name: p9-s3-domain-rotation-result

on:
  pull_request:
    paths:
      - 'src/orion/study/p9/s3_rotation.py'
      - 'src/orion/study/p9/s3_rotation_experiment.py'
      - 'research/extensions/p9-structured-neural/run_s3_domain_rotations.py'
      - 'research/extensions/p9-structured-neural/successors/S3_DOMAIN_ROTATION_PROTOCOL_V1.json'
      - 'research/extensions/p9-structured-neural/successors/S3_DOMAIN_ROTATION_PRE_RESULT_EXPECTATION_V1.json'
      - 'tests/test_p9_s3_domain_rotations.py'
      - '.github/workflows/p9-s3-domain-rotation-result.yml'

permissions:
  contents: read

jobs:
  protected-rotations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,candidates]'
      - name: Re-run pre-protected rotation gate
        run: pytest -q tests/test_p9_s3_domain_rotations.py tests/test_p9_s3_access_attribution.py tests/test_p9_d1.py
      - name: Execute frozen protected domain rotations
        run: python research/extensions/p9-structured-neural/run_s3_domain_rotations.py --out research/extensions/p9-structured-neural/results/s3-domain-rotations-result.json --subject-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: p9-s3-domain-rotations-result
          path: research/extensions/p9-structured-neural/results/s3-domain-rotations-result.json
          if-no-files-found: error
