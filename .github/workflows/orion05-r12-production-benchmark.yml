name: ORION-05 R12 production benchmark

on:
  pull_request:
    paths:
      - "papers/orion_05_r12_production_benchmark.py"
      - "papers/orion-05-tare-expressivity/rounds/r12-production-benchmark/**"
      - "development/orion-05-r12-production-benchmark-2026-08-27/**"
      - "tests/unit/publication/test_orion05_r12_production_benchmark.py"
      - ".github/workflows/orion05-r12-production-benchmark.yml"
  push:
    branches: [main]
    paths:
      - "papers/orion_05_r12_production_benchmark.py"
      - "papers/orion-05-tare-expressivity/rounds/r12-production-benchmark/**"
      - "development/orion-05-r12-production-benchmark-2026-08-27/**"
      - "tests/unit/publication/test_orion05_r12_production_benchmark.py"
      - ".github/workflows/orion05-r12-production-benchmark.yml"

permissions:
  contents: read

jobs:
  protocol-and-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - run: python -m pip install numpy==2.4.6 pytest==8.4.2 ruff==0.12.12
      - name: Check source, style and unit adjudication
        run: |
          ruff check papers/orion_05_r12_production_benchmark.py tests/unit/publication/test_orion05_r12_production_benchmark.py
          python -m pytest -q tests/unit/publication/test_orion05_r12_production_benchmark.py
          python - <<'PY'
          from papers.orion_05_r12_production_benchmark import load_protocol, load_subject_panels, verify_source_bindings
          protocol = load_protocol()
          bindings = verify_source_bindings(protocol)
          panels = load_subject_panels(protocol)
          assert bindings["all_match"], bindings
          assert all(row["all_matching_target_maps_consistent"] for row in panels.values()), panels
          print("ORION05_R12_PROTOCOL_AND_HARNESS_PASS")
          PY
          if test -f papers/orion-05-tare-expressivity/rounds/r12-production-benchmark/result/ORION05_R12_PRODUCTION_BENCHMARK_RESULT.json; then
            python papers/orion_05_r12_production_benchmark.py \
              --verify-bundle papers/orion-05-tare-expressivity/rounds/r12-production-benchmark/result
          fi
      - name: Enforce protected Task-3/P9 zero diff
        run: |
          python - <<'PY'
          import subprocess
          base = "${{ github.event.pull_request.base.sha || github.event.before }}"
          if not base or set(base) == {"0"}:
              raise SystemExit("missing event base")
          changed = subprocess.check_output(["git", "diff", "--name-only", f"{base}...HEAD"], text=True).splitlines()
          protected = (
              "research/orion-v1-freeze/",
              "research/extensions/p9-structured-neural/",
              "papers/orion-19-structured-epistemic-learning/",
              "development/p1-scienceagentbench-protected-",
              "development/p9-",
          )
          touched = [path for path in changed if path.startswith(protected)]
          assert not touched, touched
          PY
