name: diagnose-phase1-donors

on:
  pull_request:
    paths:
      - 'src/orion/knowledge/**'
      - 'tests/unit/knowledge/**'
      - 'tests/unit/self_orion/test_rakl_donor_inventory_v3.py'
      - 'provenance/rakl/**'
      - '.github/workflows/diagnose-phase1-donors.yml'

jobs:
  retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/knowledge/test_retrieval_benchmark_rakl.py
  route-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/knowledge/test_route_family_health_rakl.py
  backward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/knowledge/test_backward_multiseed_rakl.py
  hidden-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/knowledge/test_backward_multiseed_benchmark_rakl.py
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/self_orion/test_rakl_donor_inventory_v3.py tests/unit/knowledge/test_phase1_donor_tranche.py
  rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q --ignore=tests/unit/knowledge/test_retrieval_benchmark_rakl.py --ignore=tests/unit/knowledge/test_route_family_health_rakl.py --ignore=tests/unit/knowledge/test_backward_multiseed_rakl.py --ignore=tests/unit/knowledge/test_backward_multiseed_benchmark_rakl.py --ignore=tests/unit/self_orion/test_rakl_donor_inventory_v3.py --ignore=tests/unit/knowledge/test_phase1_donor_tranche.py
