name: milestone-614-inventory-rebind

on:
  pull_request:
    paths:
      - '.github/workflows/milestone-614-inventory-rebind.yml'
      - 'src/orion/study/goal_evolution_closure.py'
      - 'src/orion/study/goal_evolution_closure_independent.py'

permissions:
  contents: write

jobs:
  rebind:
    if: github.head_ref == 'milestone/replay-goal-evolution-20260820' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild derived inventory and verify
        run: |
          set -euo pipefail
          python research/development/cannot_check_inventory.py --write
          python research/development/cannot_check_inventory.py --check
      - name: Commit inventory and self-delete
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/development/cannot_check_inventory.json
          git rm .github/workflows/milestone-614-inventory-rebind.yml
          git commit -m 'chore(governance): rebind combined goal-evolution CANNOT_CHECK inventory'
          git push origin HEAD:milestone/replay-goal-evolution-20260820
