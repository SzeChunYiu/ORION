name: orion16-claude-binding-final-freeze

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/integrate-claude-orion16-binding-20260827
    paths:
      - 'papers/publication_closure/remaining11/check_orion16_final_content_freeze.py'
      - 'papers/publication_closure/remaining11/repair_orion16_v2_manifest_pin.py'
      - '.github/workflows/orion16-claude-binding-final-freeze.yml'

permissions:
  contents: write

concurrency:
  group: orion16-claude-binding-final-freeze
  cancel-in-progress: true

jobs:
  freeze:
    if: ${{ !contains(github.event.head_commit.message, '[orion16-final-frozen]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/integrate-claude-orion16-binding-20260827
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install P6 proof/test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[proofs]' pytest
      - name: Compile custody and final-freeze checkers
        run: |
          python -m py_compile papers/publication_closure/remaining11/repair_orion16_v2_manifest_pin.py
          python -m py_compile papers/publication_closure/remaining11/check_orion16_final_content_freeze.py
      - name: Apply the single audited V2-to-V1 custody re-pin
        run: python papers/publication_closure/remaining11/repair_orion16_v2_manifest_pin.py
      - name: Require the custody repair to touch only its audited targets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected={
            'papers/orion-16-formal-epistemic-structures-and-mechanics/CONTENT_MANIFEST_V2.json',
            'papers/orion-16-formal-epistemic-structures-and-mechanics/content_binding_v2/SHA256SUMS',
            'papers/publication_closure/receipts/remaining11/ORION-16_V2_MANIFEST_REPIN_V1.json',
          }
          actual=set(filter(None,subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()))
          assert actual==expected,(sorted(actual),sorted(expected))
          print('ORION16_V2_REPIN_DIFF_EXACT')
          PY
      - name: Commit custody repair locally before computing final paper tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            papers/orion-16-formal-epistemic-structures-and-mechanics/CONTENT_MANIFEST_V2.json \
            papers/orion-16-formal-epistemic-structures-and-mechanics/content_binding_v2/SHA256SUMS \
            papers/publication_closure/receipts/remaining11/ORION-16_V2_MANIFEST_REPIN_V1.json
          git diff --check --cached
          git commit -m 'fix(custody): re-pin ORION-16 V2 to sanctioned current V1 manifest'
      - name: Re-run Claude repaired V4 contract binding test
        run: python -m pytest -q tests/unit/study/p6/test_p6_certificate_as_dependency_graph.py -k 'v4_contract_binds_the_actual_generator_and_authority_ceiling'
      - name: Verify complete content-manifest chain and write whole-tree freeze
        run: python papers/publication_closure/remaining11/check_orion16_final_content_freeze.py
      - name: Require final checker to leave canonical paper bytes unchanged
        run: git diff --exit-code -- papers/orion-16-formal-epistemic-structures-and-mechanics
      - name: Validate final receipt, commit, and push both commits
        shell: bash
        run: |
          set -euo pipefail
          receipt='papers/publication_closure/receipts/remaining11/ORION-16_SCIENCE_CONTENT_FREEZE_V1.json'
          test -s "$receipt"
          python - "$receipt" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['science_frozen'] is True and x['paper_content_frozen'] is True
          assert x['claude_r0_binding_repair_integrated'] is True
          assert x['successor_required_for_future_science'] is True
          assert x['submission_authority'] is False
          print(x['terminal'])
          PY
          git add "$receipt"
          git diff --check --cached
          git commit -m 'papers(publication): freeze ORION-16 science and content [orion16-final-frozen]'
          git push origin HEAD:chatgpt/integrate-claude-orion16-binding-20260827
      - uses: actions/upload-artifact@v4
        with:
          name: orion16-final-freeze-${{ github.sha }}
          path: |
            papers/publication_closure/receipts/remaining11/ORION-16_V2_MANIFEST_REPIN_V1.json
            papers/publication_closure/receipts/remaining11/ORION-16_SCIENCE_CONTENT_FREEZE_V1.json
          if-no-files-found: error
          retention-days: 30
