name: one-shot-consolidate-orion-02-r20-gates
on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths: ['.github/workflows/one-shot-consolidate-orion-02-r20-gates.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  consolidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: chatgpt/orion-02-r18-null-current-main-20260827}
      - shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/orion-02-r20-story.yml \
            .github/workflows/orion-02-r20-manuscript.yml \
            .github/workflows/orion-02-r20-finite-verifier.yml \
            .github/workflows/one-shot-fix-orion-02-r20-story.yml \
            .github/workflows/one-shot-fix-orion-02-r20-manuscript.yml \
            .github/workflows/one-shot-fix-orion-02-r20-finite-verifier.yml; do
            rm -f "$path"
          done
          rm .github/workflows/one-shot-consolidate-orion-02-r20-gates.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows
          git commit -m 'ci(ORION-02): consolidate R20 checks into strict release gate'
          git push origin HEAD:refs/heads/chatgpt/orion-02-r18-null-current-main-20260827
