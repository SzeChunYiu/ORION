name: q3-tmlr-package

on:
  pull_request:
    paths:
      - 'papers/Q-paper-03-dual-instrument/**'
      - 'papers/Q_QG_CITATION_INSERTION_MAP_V1.json'
      - 'papers/Q_QG_VERIFIED_CORE_REFERENCES_V1.bib'
      - 'papers/Q2_Q3_VERIFIED_BENCHMARK_REFERENCES_V1.bib'
      - 'papers/Q3_VERIFIED_CURRENT_REFERENCES_V2.bib'
      - 'papers/build_q_qg_cited_masters.py'
      - 'papers/check_q_qg_publication.py'
      - 'papers/check_q_qg_science_manifests.py'
      - '.github/workflows/q3-tmlr-package.yml'
  push:
    branches:
      - 'codex/q-qg-nature-skills-publication-closure-20260821'
    paths:
      - 'papers/Q-paper-03-dual-instrument/**'
      - 'papers/Q_QG_CITATION_INSERTION_MAP_V1.json'
      - 'papers/Q_QG_VERIFIED_CORE_REFERENCES_V1.bib'
      - 'papers/Q2_Q3_VERIFIED_BENCHMARK_REFERENCES_V1.bib'
      - 'papers/Q3_VERIFIED_CURRENT_REFERENCES_V2.bib'
      - 'papers/build_q_qg_cited_masters.py'
      - 'papers/check_q_qg_publication.py'
      - 'papers/check_q_qg_science_manifests.py'
      - '.github/workflows/q3-tmlr-package.yml'

permissions:
  contents: read

jobs:
  build-q3-tmlr:
    runs-on: ubuntu-24.04
    env:
      TMLR_STYLE_COMMIT: 7bf90efe3a0debbba703c05c43f3ff7e4d4a2992
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            lmodern pandoc texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            poppler-utils curl zip
      - name: Re-run Q3 and portfolio integrity gates
        run: |
          python papers/Q-paper-03-dual-instrument/replay_q3_v0.py
          python papers/Q-paper-03-dual-instrument/check_q3_result_bindings.py
          python papers/Q-paper-03-dual-instrument/check_q3_completion.py
          python papers/check_q_qg_publication.py
          python papers/check_q_qg_science_manifests.py
      - name: Generate cited masters
        run: python papers/build_q_qg_cited_masters.py --clean
      - name: Prepare Q3 TMLR Markdown and source directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/q3_tmlr/source build/q3_tmlr/rendered
          python papers/Q-paper-03-dual-instrument/submission_tmlr/build_tmlr_source.py \
            --cited-master build/q_qg_cited/Q3/MANUSCRIPT_CITED.md \
            --out build/q3_tmlr/q3_tmlr.md
          cp build/q_qg_cited/Q3/references.bib build/q3_tmlr/source/references.bib
          cp papers/Q-paper-03-dual-instrument/submission_tmlr/tmlr_pandoc_template.tex \
            build/q3_tmlr/source/pandoc_template.tex
      - name: Fetch exact official TMLR style files
        shell: bash
        working-directory: build/q3_tmlr/source
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/JmlrOrg/tmlr-style-file/${TMLR_STYLE_COMMIT}"
          curl --fail --location --silent --show-error "${base}/tmlr.sty" -o tmlr.sty
          curl --fail --location --silent --show-error "${base}/tmlr.bst" -o tmlr.bst
          curl --fail --location --silent --show-error "${base}/fancyhdr.sty" -o fancyhdr.sty
          test -s tmlr.sty && test -s tmlr.bst && test -s fancyhdr.sty
          sha256sum tmlr.sty tmlr.bst fancyhdr.sty > style_sha256.txt
          printf '%s\n' "${TMLR_STYLE_COMMIT}" > style_commit.txt
      - name: Generate anonymous TMLR LaTeX from cited Q3 master
        shell: bash
        run: |
          set -euo pipefail
          pandoc build/q3_tmlr/q3_tmlr.md \
            --from=markdown+citations \
            --to=latex \
            --natbib \
            --template=build/q3_tmlr/source/pandoc_template.tex \
            -o build/q3_tmlr/source/main.tex
          grep -Fq '\usepackage{tmlr}' build/q3_tmlr/source/main.tex
          grep -Fq '\author{Anonymous Authors}' build/q3_tmlr/source/main.tex
          grep -Eq '\\cite[pt]?\{' build/q3_tmlr/source/main.tex
          grep -Fq '39,489' build/q3_tmlr/source/main.tex
          if grep -Eiq 'Sze[[:space:]-]*Chun|SzeChunYiu|Billy[[:space:]]+Yiu' \
              build/q3_tmlr/source/main.tex build/q3_tmlr/source/references.bib; then
            echo 'Q3_TMLR_SOURCE_ANONYMITY=FAIL'
            exit 1
          fi
          echo 'Q3_TMLR_SOURCE_ANONYMITY=PASS'
      - name: Build exact TMLR review PDF
        shell: bash
        working-directory: build/q3_tmlr/source
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
      - name: Audit anonymity, references, decisive result and page rendering
        shell: bash
        run: |
          set -euo pipefail
          pdfinfo build/q3_tmlr/source/main.pdf > build/q3_tmlr/pdfinfo.txt
          pdffonts build/q3_tmlr/source/main.pdf > build/q3_tmlr/pdffonts.txt
          pdftotext build/q3_tmlr/source/main.pdf build/q3_tmlr/pdf.txt
          if grep -Eiq 'Sze[[:space:]-]*Chun|SzeChunYiu|Billy[[:space:]]+Yiu' \
              build/q3_tmlr/pdf.txt build/q3_tmlr/pdfinfo.txt; then
            echo 'Q3_TMLR_PDF_ANONYMITY=FAIL'
            exit 1
          fi
          grep -Fq 'Anonymous' build/q3_tmlr/pdf.txt
          grep -Fq 'References' build/q3_tmlr/pdf.txt
          grep -Fq '39,489' build/q3_tmlr/pdf.txt
          grep -Fq 'Q3-R2' build/q3_tmlr/pdf.txt
          if grep -Eq '\[@[A-Za-z0-9_:-]+' build/q3_tmlr/pdf.txt; then
            echo 'Q3_TMLR_UNRESOLVED_CITATION_TOKEN=FAIL'
            exit 1
          fi
          pdftoppm -png -r 144 build/q3_tmlr/source/main.pdf build/q3_tmlr/rendered/page
          pages="$(find build/q3_tmlr/rendered -name 'page-*.png' | wc -l)"
          test "${pages}" -gt 0
          sha256sum build/q3_tmlr/source/main.pdf > build/q3_tmlr/pdf_sha256.txt
          printf 'Q3_TMLR_PDF_ANONYMITY=PASS\nQ3_TMLR_RENDERED_PAGES=%s\n' "${pages}"
      - name: Build source archive
        shell: bash
        working-directory: build/q3_tmlr
        run: |
          set -euo pipefail
          cp q3_tmlr.md source/SCIENTIFIC_MASTER_CITED.md
          zip -qr q3-tmlr-review-source.zip source
          sha256sum q3-tmlr-review-source.zip > source_zip_sha256.txt
      - name: Archive Q3 TMLR review package
        uses: actions/upload-artifact@v4
        with:
          name: q3-tmlr-review-package
          path: |
            build/q3_tmlr/source/main.pdf
            build/q3_tmlr/q3-tmlr-review-source.zip
            build/q3_tmlr/pdfinfo.txt
            build/q3_tmlr/pdffonts.txt
            build/q3_tmlr/pdf_sha256.txt
            build/q3_tmlr/source_zip_sha256.txt
            build/q3_tmlr/source/style_sha256.txt
            build/q3_tmlr/source/style_commit.txt
            build/q3_tmlr/rendered
          if-no-files-found: error
          retention-days: 30
