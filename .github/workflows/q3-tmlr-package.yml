name: q3-tmlr-package

on:
  pull_request:
    paths:
      - 'papers/orion-07-dual-instrument/**'
      - '.github/workflows/q3-tmlr-package.yml'
  push:
    paths:
      - 'papers/orion-07-dual-instrument/**'
      - '.github/workflows/q3-tmlr-package.yml'

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            lmodern texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            poppler-utils unzip zip
      - name: Verify scientific bindings
        run: |
          python papers/orion-07-dual-instrument/replay_q3_v0.py
          python papers/orion-07-dual-instrument/check_q3_result_bindings.py
          python papers/orion-07-dual-instrument/check_q3_completion.py
      - name: Rebuild and verify anonymous archives
        run: |
          python papers/orion-07-dual-instrument/editorial/build_submission_archives.py
          python papers/orion-07-dual-instrument/submission_tmlr/review_materials/verify_case_series.py
          python papers/orion-07-dual-instrument/editorial/verify_closeout.py
          git diff --exit-code -- \
            papers/orion-07-dual-instrument/submission_tmlr/anonymous-source.zip \
            papers/orion-07-dual-instrument/submission_tmlr/anonymous-review-supplement.zip
      - name: Clean source-archive build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/q3_tmlr/rendered
          cd build/q3_tmlr
          unzip -q ../../papers/orion-07-dual-instrument/submission_tmlr/anonymous-source.zip
          mv manuscript.tex main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          pdftotext main.pdf pdf.txt
          grep -Fq '39,489' pdf.txt
          grep -Fq '53 frozen rows' pdf.txt
          grep -Fq 'Anonymous authors' pdf.txt
          if grep -Eiq '\bORION\b|\bQG-?[0-9]+\b|\bR6[A-Z0-9]*\b|\bV0\b|\bD[23]\b|\bP0\b|github|[0-9a-f]{40,64}' pdf.txt; then
            echo 'reader-facing programme or provenance leak'
            exit 1
          fi
          pdftoppm -png -r 144 main.pdf rendered/page
          test "$(find rendered -name 'page-*.png' | wc -l)" -gt 0
      - name: Archive exact filing objects and clean-build evidence
        uses: actions/upload-artifact@v4
        with:
          name: q3-tmlr-filing-package
          path: |
            papers/orion-07-dual-instrument/submission_tmlr/main.pdf
            papers/orion-07-dual-instrument/submission_tmlr/anonymous-source.zip
            papers/orion-07-dual-instrument/submission_tmlr/anonymous-review-supplement.zip
            papers/orion-07-dual-instrument/submission_tmlr/COVER_LETTER.md
            papers/orion-07-dual-instrument/submission_tmlr/AVAILABILITY_STATEMENT.md
            build/q3_tmlr/main.pdf
            build/q3_tmlr/rendered
          if-no-files-found: error
          retention-days: 30
