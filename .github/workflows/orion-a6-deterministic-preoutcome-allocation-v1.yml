name: ORION A6 deterministic pre-outcome allocation v1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/orion-a6-deterministic-preoutcome-allocation-v1.yml"
      - "papers/publication_closure/a6-external-authority-study-v1/A6_DETERMINISTIC_PREOUTCOME_ALLOCATION_V1.json"
      - "papers/publication_closure/a6-external-authority-study-v1/allocate_external_authority_packets_v1.py"
permissions:
  contents: read
jobs:
  deterministic-allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify allocation boundary
        run: |
          python - <<'PY'
          import json
          p='papers/publication_closure/a6-external-authority-study-v1/A6_DETERMINISTIC_PREOUTCOME_ALLOCATION_V1.json'
          d=json.load(open(p))
          assert d['schema']=='ORION.A6.DeterministicPreOutcomeAllocation.v1'
          assert d['protected_outcomes_accessed'] is False
          assert d['candidate_predictions_accessed'] is False
          assert sorted(d['primary_quota_by_stratum'].values())==[20,20,20]
          assert 'does not invent' in d['replication_quota_rule']
          PY
      - name: Compile and run hostile self-tests
        run: |
          python -m py_compile papers/publication_closure/a6-external-authority-study-v1/allocate_external_authority_packets_v1.py
          python papers/publication_closure/a6-external-authority-study-v1/allocate_external_authority_packets_v1.py --self-test
      - name: Ban host RNG and outcome-dependent key
        run: |
          set -euo pipefail
          f=papers/publication_closure/a6-external-authority-study-v1/allocate_external_authority_packets_v1.py
          ! grep -Eq '^import (random|numpy)|^from (random|numpy)' "$f"
          python - <<'PY'
          import ast,pathlib
          mod=ast.parse(pathlib.Path('papers/publication_closure/a6-external-authority-study-v1/allocate_external_authority_packets_v1.py').read_text())
          fn=next(n for n in mod.body if isinstance(n,ast.FunctionDef) and n.name=='akey')
          literals=' '.join(n.value for n in ast.walk(fn) if isinstance(n,ast.Constant) and isinstance(n.value,str)).lower()
          for x in ('gold','outcome','score','success','prediction'):
              assert x not in literals,(x,literals)
          PY
      - name: Repository cleanliness
        run: |
          git diff --check
          git diff --exit-code
