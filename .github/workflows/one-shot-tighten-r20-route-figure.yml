name: one-shot-tighten-r20-route-figure
on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths: ['.github/workflows/one-shot-tighten-r20-route-figure.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  tighten:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: chatgpt/orion-02-r18-null-current-main-20260827}
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('papers/orion-02-fiberguard-finite-fibre/FIGURE_JOINT_ROUTE_R20.tex')
          t=p.read_text().replace('node distance=7mm and 9mm','node distance=7mm and 6mm').replace('text width=0.22\\linewidth','text width=0.20\\linewidth').replace('text width=0.17\\linewidth','text width=0.15\\linewidth')
          p.write_text(t)
          PY
          rm .github/workflows/one-shot-tighten-r20-route-figure.yml
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/orion-02-fiberguard-finite-fibre/FIGURE_JOINT_ROUTE_R20.tex .github/workflows/one-shot-tighten-r20-route-figure.yml
          git commit -m 'fix(ORION-02): keep joint-route figure inside text width'
          git push origin HEAD:refs/heads/chatgpt/orion-02-r18-null-current-main-20260827
