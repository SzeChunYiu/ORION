name: p9-s1-focused-ci

on:
  pull_request:
    paths:
      - 'src/orion/study/p9/uncertain_transport.py'
      - 'tests/test_p9_uncertain_transport.py'
      - 'tests/test_p9_uncertain_transport_evaluator.py'
      - 'research/extensions/p9-structured-neural/successors/S1_TRANSFORM_RESPONSIBILITY_PROTOCOL_V1.md'
      - '.github/workflows/p9-s1-focused-ci.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,candidates]'
      - name: Run frozen S1 benchmark and hostile evaluator tests
        run: >-
          pytest -q
          tests/test_p9_uncertain_transport.py
          tests/test_p9_uncertain_transport_evaluator.py
          tests/test_p9_structural_world.py
