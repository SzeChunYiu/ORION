name: p2-autoresearchbench-wide-keyless

on:
  push:
    branches:
      - chatgpt/p2-remaining-closure

permissions:
  contents: read

jobs:
  wide:
    if: contains(github.event.head_commit.message, '[run-wide]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ORION and pinned scorer dependency
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install requests

      - name: Fetch pinned AutoResearchBench code and public bundle
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/CherYou/AutoResearchBench.git /tmp/arb-upstream
          git -C /tmp/arb-upstream checkout a46c9bfb8968786f73f0a6a5b365b5384cd0f96d
          mkdir -p /tmp/arb-run
          curl --fail --location --retry 4 --retry-delay 3 \
            --output /tmp/arb-run/AutoResearchBench.jsonl.obf.json \
            https://huggingface.co/datasets/Lk123/AutoResearchBench/resolve/main/AutoResearchBench.jsonl.obf.json
          python /tmp/arb-upstream/decrypt_benchmark.py \
            --input-file /tmp/arb-run/AutoResearchBench.jsonl.obf.json \
            --output-file /tmp/arb-run/AutoResearchBench.jsonl
          git -C /tmp/arb-upstream rev-parse HEAD
          sha256sum /tmp/arb-run/AutoResearchBench.jsonl.obf.json /tmp/arb-run/AutoResearchBench.jsonl

      - name: Diagnose released task partition without exposing labels
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          rows=[json.loads(x) for x in Path('/tmp/arb-run/AutoResearchBench.jsonl').read_text().splitlines() if x.strip()]
          print('ARB_RECORDS', len(rows))
          print('KEY_SETS', Counter(tuple(sorted(r)) for r in rows))
          print('ARXIV_TYPES', Counter(type(r.get('arxiv_id')).__name__ for r in rows))
          print('ARXIV_LIST_LENGTHS', Counter(len(r.get('arxiv_id') or []) if isinstance(r.get('arxiv_id'), list) else -1 for r in rows))
          print('ANSWER_TYPES', Counter(type(r.get('answer')).__name__ for r in rows))
          print('ANSWER_LIST_LENGTHS', Counter(len(r.get('answer') or []) if isinstance(r.get('answer'), list) else -1 for r in rows))
          print('METADATA_TYPES', Counter(type(r.get('metadata')).__name__ for r in rows))
          print('METADATA_KEY_SETS', Counter(tuple(sorted((r.get('metadata') or {}).keys())) if isinstance(r.get('metadata'), dict) else () for r in rows))
          for key in ('task_type','type','task','paradigm','mode','split'):
              vals=Counter(str(r.get(key)) for r in rows if key in r)
              if vals: print('TOPLEVEL_'+key.upper(), vals)
              mvals=Counter(str((r.get('metadata') or {}).get(key)) for r in rows if isinstance(r.get('metadata'), dict) and key in (r.get('metadata') or {}))
              if mvals: print('METADATA_'+key.upper(), mvals)
          PY

      - name: Split gold before candidate custody
        run: |
          set -euo pipefail
          python papers/orion-12-open-world-scientific-discovery/scripts/run_autoresearchbench_wide_compat.py prepare \
            --full /tmp/arb-run/AutoResearchBench.jsonl \
            --public /tmp/arb-run/wide_public.jsonl \
            --gt /tmp/arb-run/wide_gt.jsonl \
            --manifest /tmp/arb-run/split_manifest.json

      - name: Run gold-blind keyless arXiv candidate
        run: |
          set -euo pipefail
          python papers/orion-12-open-world-scientific-discovery/scripts/run_autoresearchbench_wide_compat.py run \
            --public /tmp/arb-run/wide_public.jsonl \
            --output /tmp/arb-run/candidate.jsonl \
            --trace /tmp/arb-run/trace.jsonl \
            --manifest /tmp/arb-run/run_manifest.json \
            --max-results 20

      - name: Run pinned official Wide scorer
        run: |
          set -euo pipefail
          python /tmp/arb-upstream/evaluate/evaluate_wide_search.py \
            --input-file /tmp/arb-run/candidate.jsonl \
            --gt-file /tmp/arb-run/wide_gt.jsonl \
            --no-jina \
            --output-file /tmp/arb-run/official_evaluation.json
          python papers/orion-12-open-world-scientific-discovery/scripts/run_autoresearchbench_wide_compat.py summarize \
            --split-manifest /tmp/arb-run/split_manifest.json \
            --run-manifest /tmp/arb-run/run_manifest.json \
            --evaluation /tmp/arb-run/official_evaluation.json \
            --candidate /tmp/arb-run/candidate.jsonl \
            --trace /tmp/arb-run/trace.jsonl \
            --output /tmp/arb-run/summary.json
          cat /tmp/arb-run/summary.json

      - name: Archive result-bearing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-autoresearchbench-wide-keyless-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            /tmp/arb-run/split_manifest.json
            /tmp/arb-run/run_manifest.json
            /tmp/arb-run/wide_public.jsonl
            /tmp/arb-run/candidate.jsonl
            /tmp/arb-run/trace.jsonl
            /tmp/arb-run/official_evaluation.json
            /tmp/arb-run/summary.json
