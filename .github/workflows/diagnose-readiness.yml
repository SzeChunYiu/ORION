name: diagnose-readiness

on:
  pull_request:
    paths:
      - 'src/orion/self_orion/**'
      - 'tests/unit/self_orion/**'
      - '.github/workflows/diagnose-readiness.yml'

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/self_orion/test_readiness_stages.py

  change-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/self_orion/test_change_control.py

  self-driving:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/self_orion/test_self_driving.py

  factory-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/self_orion/test_self_driving_factory.py::test_factory_composes_shadow_ready_controller

  factory-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/self_orion/test_self_driving_factory.py::test_factory_known_world_cycle_recommends_host_promotion_only

  evolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/self_orion/test_selective_rakl_transfers.py

  rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q tests/unit/self_orion --ignore=tests/unit/self_orion/test_readiness_stages.py --ignore=tests/unit/self_orion/test_change_control.py --ignore=tests/unit/self_orion/test_self_driving.py --ignore=tests/unit/self_orion/test_self_driving_factory.py --ignore=tests/unit/self_orion/test_selective_rakl_transfers.py
