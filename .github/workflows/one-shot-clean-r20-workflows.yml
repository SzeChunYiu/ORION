name: one-shot-clean-r20-workflows

on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths: ['.github/workflows/one-shot-clean-r20-workflows.yml']
  workflow_dispatch:

permissions: {contents: write}

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: chatgpt/orion-02-r18-null-current-main-20260827}
      - name: Replace stale NQ and meta workflows
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/nq-pr1472-exact-subject-audit-r20.yml <<'YAML'
          name: nq-pr1472-exact-subject-audit-r20

          on:
            push:
              branches: [chatgpt/orion-02-r18-null-current-main-20260827]
              paths:
                - 'research/five-paper-top-tier-r20/audit_nq_pr1472_v2.py'
                - '.github/workflows/nq-pr1472-exact-subject-audit-r20.yml'
            workflow_dispatch:

          permissions: {contents: read, pull-requests: read}

          jobs:
            exact-subject-audit:
              runs-on: ubuntu-24.04
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                  with: {fetch-depth: 0}
                - uses: actions/setup-python@v5
                  with: {python-version: '3.12'}
                - name: Fetch and audit exact PR 1472 twice
                  shell: bash
                  env: {GH_TOKEN: '${{ github.token }}'}
                  run: |
                    set -euo pipefail
                    gh api "repos/$GITHUB_REPOSITORY/pulls/1472" > "$RUNNER_TEMP/pr.json"
                    base="$(jq -r .base.sha "$RUNNER_TEMP/pr.json")";head="$(jq -r .head.sha "$RUNNER_TEMP/pr.json")"
                    git fetch --no-tags origin "$base" "$head";git worktree add --detach "$RUNNER_TEMP/pr1472" "$head"
                    script='research/five-paper-top-tier-r20/audit_nq_pr1472_v2.py';python -m py_compile "$script"
                    for suffix in a b; do python "$script" --repo "$RUNNER_TEMP/pr1472" --base "$base" --head "$head" --output "$RUNNER_TEMP/audit-$suffix.json" | tee "$RUNNER_TEMP/terminal-$suffix.txt"; done
                    cmp "$RUNNER_TEMP/audit-a.json" "$RUNNER_TEMP/audit-b.json";cmp "$RUNNER_TEMP/terminal-a.txt" "$RUNNER_TEMP/terminal-b.txt"
                - name: Preserve numerical and journal ceilings
                  shell: bash
                  run: |
                    set -euo pipefail
                    python - <<'PY'
                    import json,os
                    from pathlib import Path
                    r=json.loads((Path(os.environ['RUNNER_TEMP'])/'audit-a.json').read_text())
                    assert r['schema']=='ORION.NQ.PR1472ExactSubjectAudit.R20.v2'
                    assert r['authority']['D4_authority'] is False
                    assert r['authority']['external_independence'] is False
                    assert r['authority']['novelty'] is False
                    assert r['authority']['journal_authority'] is False
                    if r['terminal']=='NQ_PR1472_FULL_REPLAY_SUBJECT_PASS':
                      assert all(r['gates'].values()) and r['authority']['D2_D3_numerical_authority'] is True
                    else:
                      assert r['terminal']=='NQ_PR1472_NOT_FULL_REPLAY_AUTHORITY'
                      assert r['authority']['D2_D3_numerical_authority'] is False
                    print('NQ_PR1472_V2_AUTHORITY_CLASSIFIED',r['terminal'])
                    PY
                - run: git diff --check
                - name: Stage audit
                  shell: bash
                  run: |
                    set -euo pipefail
                    out="$RUNNER_TEMP/nq-pr1472-v2";mkdir -p "$out";cp "$RUNNER_TEMP/pr.json" "$out/PR1472.json";cp "$RUNNER_TEMP/audit-a.json" "$out/NQ_PR1472_EXACT_SUBJECT_AUDIT_V2.json";cp "$RUNNER_TEMP/terminal-a.txt" "$out/TERMINAL.txt";sha256sum "$out"/* > "$out/SHA256SUMS"
                - uses: actions/upload-artifact@v4
                  with: {name: nq-pr1472-exact-subject-audit-v2, path: '${{ runner.temp }}/nq-pr1472-v2/', if-no-files-found: error, retention-days: 30}
          YAML

          cat > .github/workflows/orion-02-r20-meta-gate.yml <<'YAML'
          name: orion-02-r20-meta-gate

          on:
            push:
              branches: [chatgpt/orion-02-r18-null-current-main-20260827]
              paths:
                - 'papers/orion-02-fiberguard-finite-fibre/JOURNAL_GATE_R20.json'
                - 'papers/orion-02-fiberguard-finite-fibre/INTERNAL_RELEASE_RECEIPT_R20.json'
                - '.github/workflows/orion-02-r20-meta-gate.yml'
            workflow_dispatch:

          permissions: {actions: read, contents: read}

          jobs:
            require-current-internal-gates:
              runs-on: ubuntu-24.04
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                - name: Poll current required workflows
                  shell: bash
                  env: {GH_TOKEN: '${{ github.token }}'}
                  run: |
                    set -euo pipefail
                    python - <<'PY'
                    import json,os,time,urllib.parse,urllib.request
                    branch='chatgpt/orion-02-r18-null-current-main-20260827'
                    required={
                      'orion-02-r18-recovery-null-custody',
                      'orion-02-r20-internal-release-gate',
                      'orion-02-r20-visual-pdf-audit',
                      'orion-02-r20-cross-language-rust',
                      'orion-02-aslib-rights-audit-r20',
                      'nq-pr1472-exact-subject-audit-r20',
                      'ab-pr1469-production-registry-audit-r20',
                      'd-pr1466-first-mixing-audit-r20',
                      'q1-pr1449-resource-audit-r20',
                      'five-paper-blocker-audit-r20',
                    }
                    headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'ORION-R20-meta-gate'}
                    url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?branch={urllib.parse.quote(branch,safe='')}&per_page=100"
                    deadline=time.time()+1200
                    while True:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as response:data=json.load(response)
                      latest={}
                      for row in sorted(data['workflow_runs'],key=lambda item:item['id'],reverse=True):latest.setdefault(row['name'],row)
                      snapshot={name:({'id':latest[name]['id'],'status':latest[name]['status'],'conclusion':latest[name]['conclusion'],'head_sha':latest[name]['head_sha'],'html_url':latest[name]['html_url']} if name in latest else {'status':'missing','conclusion':None}) for name in sorted(required)}
                      pending=[name for name,row in snapshot.items() if row['status'] in {'queued','in_progress','waiting','requested'}]
                      missing=[name for name,row in snapshot.items() if row['status']=='missing']
                      if not pending and not missing:break
                      if time.time()>=deadline:break
                      time.sleep(30)
                    result={'schema':'ORION.ORION02.R20MetaGate.v2','branch':branch,'required':snapshot,'all_current_internal_workflows_green':all(row['status']=='completed' and row['conclusion']=='success' for row in snapshot.values()),'authority':{'external_independence':False,'novelty':False,'rights_complete':False,'journal_authority':False,'submission_authorized':False}}
                    open(os.path.join(os.environ['RUNNER_TEMP'],'META_GATE.json'),'w').write(json.dumps(result,sort_keys=True,separators=(',',':'))+'\n')
                    print(json.dumps(result,indent=2,sort_keys=True))
                    if not result['all_current_internal_workflows_green']:raise SystemExit('current internal workflow meta-gate not green')
                    PY
                - run: git diff --check
                - uses: actions/upload-artifact@v4
                  if: always()
                  with: {name: orion-02-r20-meta-gate, path: '${{ runner.temp }}/META_GATE.json', if-no-files-found: warn, retention-days: 30}
          YAML

          rm -f research/five-paper-top-tier-r20/audit_nq_pr1472.py
          rm -f .github/workflows/one-shot-publish-five-paper-audits-r20.yml
          rm -f .github/workflows/one-shot-clean-r20-workflows.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A research/five-paper-top-tier-r20 .github/workflows
          git commit -m 'ci(R20): replace stale NQ audit and internal meta-gate'
          git push origin HEAD:refs/heads/chatgpt/orion-02-r18-null-current-main-20260827
