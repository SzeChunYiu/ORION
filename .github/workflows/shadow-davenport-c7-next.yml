name: shadow-davenport-c7-next

on:
  push:
    branches:
      - shadow/davenport-c7-frontier-20260903
    paths:
      - .github/workflows/shadow-davenport-c7-next.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ingest-and-recurse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/orion-research-harness/pyproject.toml
      - name: Install canonical ORION and harness
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Restore previous immutable workspace
        uses: actions/download-artifact@v4
        with:
          name: davenport-c7-harness-cycle4
          path: .previous
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SzeChunYiu/ORION
          run-id: 33759666185
      - name: Ingest exact host response
        run: |
          set -euo pipefail
          rm -rf .research .next-logs
          cp -a .previous/.research .research
          mkdir -p .next-logs
          orion-harness show-request .research hostreq:9a419df297956550b5115301271641673e8d056f777be50258cf60122da23baa | tee .next-logs/request.json
          orion-harness ingest .research hostreq:9a419df297956550b5115301271641673e8d056f777be50258cf60122da23baa \
            --file research/experiments/davenport-c7-frontier/host-results/cycle4-web-lexical-multiwise.json \
            --executor 'chatgpt:web-search' | tee .next-logs/ingest.json
      - name: Re-run canonical recursive solver
        shell: bash
        run: |
          set +e
          orion-harness solve .research c7-d3 \
            --max-iterations 2 \
            --max-recursion-depth 5 \
            --max-recursive-nodes 32 \
            --max-children-per-residual 12 \
            --max-children-per-problem 12 | tee .next-logs/solve.json
          rc=${PIPESTATUS[0]}
          echo "$rc" > .next-logs/solve-exit-code.txt
          orion-harness pending .research | tee .next-logs/pending.json
          orion-harness handoff .research | tee .next-logs/handoff.txt
          exit 0
      - name: Upload next immutable workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davenport-c7-harness-next
          include-hidden-files: true
          path: |
            .research
            .next-logs
            research/experiments/davenport-c7-frontier/FRAME_V1.md
          if-no-files-found: error
          retention-days: 14
