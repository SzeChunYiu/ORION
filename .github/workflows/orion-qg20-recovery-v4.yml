name: orion-qg20-recovery-v4

on:
  pull_request:
    paths:
      - 'research/extensions/orion-qg/qg20_recovery_v4_signed_complete.py'
      - 'development/orion-qg-regime-geometry/qg20_recovery_v4_signed_complete_verify.py'
      - 'development/orion-qg-regime-geometry/run_qg20_recovery_v4_signed_complete_dual.py'
      - 'development/orion-qg-regime-geometry/QG20_RECOVERY_V4_SIGNED_COMPLETE_WEIGHT_PROTOCOL_V1.md'
      - '.github/workflows/orion-qg20-recovery-v4.yml'
  workflow_dispatch:

concurrency:
  group: orion-qg20-recovery-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  signed-complete-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run V4 dual recovery
        run: |
          python development/orion-qg-regime-geometry/run_qg20_recovery_v4_signed_complete_dual.py | tee /tmp/qg20-v4.txt
          grep '^ORIONQG_QG20_RECOVERY_V4_SIGNED_COMPLETE_DUAL=' /tmp/qg20-v4.txt
      - name: Enforce V4 fixed-representation integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/orion-qg-qg20-recovery-v4-signed-complete-dual.json').read_text())
          if p.get('instances') != 36720: raise SystemExit('V4 domain count mismatch')
          if p.get('representation') != 'SIGNED_COMPLETE_WEIGHT_V1': raise SystemExit('V4 representation drift')
          if p.get('coefficient_count') != 34: raise SystemExit(f"unexpected V4 coefficient count {p.get('coefficient_count')!r}")
          if p.get('feature_search_performed') is not False: raise SystemExit('V4 performed forbidden feature search')
          if p.get('analyzer_replay_identical') is not True: raise SystemExit('V4 replay mismatch')
          if p.get('verifier_decision') not in {'ACCEPT','REJECT'}: raise SystemExit('V4 verifier decision missing')
          checks=p.get('verifier_checks')
          if not isinstance(checks,dict) or not checks: raise SystemExit('V4 verifier checks missing')
          if p['verifier_decision']=='ACCEPT' and not all(checks.values()): raise SystemExit('V4 ACCEPT contains failed check')
          if p['verifier_decision']=='REJECT' and all(checks.values()): raise SystemExit('V4 REJECT lacks failed check')
          allowed={'QG20_RECOVERY_V4_SIGNED_COMPLETE_WEIGHT_ENUMERATOR_DETERMINES_DONOR_EXACTNESS_COMPLETE_N4','QG20_RECOVERY_V4_COMPLETE_ENUMERATOR_NONIDENTIFYING__EXACT_QUOTIENT_REQUIRED','QG20_RECOVERY_V4_DUAL_DISAGREEMENT'}
          if p.get('terminal') not in allowed: raise SystemExit(f"unexpected V4 terminal: {p.get('terminal')!r}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orion-qg20-recovery-v4
          path: |
            artifacts/orion-qg-qg20-recovery-v4-signed-complete.json
            artifacts/orion-qg-qg20-recovery-v4-signed-complete-verification.json
            artifacts/orion-qg-qg20-recovery-v4-signed-complete-dual.json
            /tmp/qg20-v4.txt
          if-no-files-found: warn
          retention-days: 30
