name: ORION A6 external adjudicator handoff validator v1
on:
  pull_request:
    paths:
      - ".github/workflows/orion-a6-external-adjudicator-handoff-v1.yml"
      - "papers/publication_closure/a6-external-authority-study-v1/A6_EXTERNAL_ADJUDICATOR_HANDOFF_V1.json"
      - "papers/publication_closure/a6-external-authority-study-v1/validate_external_adjudicator_packet_v1.py"
      - "papers/publication_closure/a6-external-authority-study-v1/validate_external_authority_packet_manifest_v1.py"
permissions:
  contents: read
jobs:
  adjudicator-handoff-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify frozen handoff authority boundary
        run: |
          python - <<'PY'
          import json
          p='papers/publication_closure/a6-external-authority-study-v1/A6_EXTERNAL_ADJUDICATOR_HANDOFF_V1.json'
          d=json.load(open(p))
          assert d['schema']=='ORION.A6.ExternalAdjudicatorHandoffContract.v1'
          assert d['gold_labels']==['local_action_release_authority','scientific_discharge_admission_authority']
          assert d['allowed_targets']==['ADMIT','DENY','CANNOT_CHECK']
          assert d['external_packet_committed_by_this_contract'] is False
          assert d['gold_labels_created_by_this_contract'] is False
          assert d['gold_labels_inferred_by_this_contract'] is False
          assert d['candidate_predictions_accessed'] is False
          assert d['baseline_predictions_accessed'] is False
          assert d['protected_outcomes_accessed'] is False
          assert d['grants_scientific_authority'] is False
          assert d['scientific_authority_delta']=='NONE__CUSTODY_VALIDATION_ONLY'
          PY
      - name: Compile and run hostile self-tests
        run: |
          python -m py_compile papers/publication_closure/a6-external-authority-study-v1/validate_external_authority_packet_manifest_v1.py
          python -m py_compile papers/publication_closure/a6-external-authority-study-v1/validate_external_adjudicator_packet_v1.py
          python papers/publication_closure/a6-external-authority-study-v1/validate_external_adjudicator_packet_v1.py --self-test
      - name: Ban judgment inference and prediction inputs
        run: |
          python - <<'PY'
          import ast,pathlib
          p=pathlib.Path('papers/publication_closure/a6-external-authority-study-v1/validate_external_adjudicator_packet_v1.py')
          mod=ast.parse(p.read_text())
          forbidden_imports={'random','numpy','sklearn','torch','openai'}
          for node in ast.walk(mod):
              if isinstance(node,ast.Import):
                  for alias in node.names:
                      assert alias.name.split('.')[0] not in forbidden_imports
              if isinstance(node,ast.ImportFrom) and node.module:
                  assert node.module.split('.')[0] not in forbidden_imports
          PY
      - name: Repository cleanliness
        run: |
          git diff --check
          git diff --exit-code
