name: orion-qg-qg7f-representation-audit
on:
  pull_request:
    paths:
      - 'development/orion-qg-regime-geometry/QG7F_*'
      - 'development/orion-qg-regime-geometry/qg7f_*'
      - 'development/orion-qg-regime-geometry/run_qg7f_dual_harness.py'
      - 'research/extensions/orion-qg/qg7f_*'
      - '.github/workflows/orion-qg-qg7f-representation-audit.yml'
  workflow_dispatch:
concurrency:
  group: orion-qg-qg7f-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,candidates]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Execute dual harness
        run: |
          set -o pipefail
          mkdir -p artifacts
          python development/orion-qg-regime-geometry/run_qg7f_dual_harness.py | tee artifacts/orion-qg-qg7f-summary.json
      - name: Deterministic analyzer replay
        run: |
          python research/extensions/orion-qg/qg7f_chain_representation_audit.py --output artifacts/orion-qg-qg7f-replay.json > artifacts/orion-qg-qg7f-replay.log
          cmp artifacts/orion-qg-qg7f-chain-representation-audit.json artifacts/orion-qg-qg7f-replay.json
      - name: Enforce representation-only authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/orion-qg-qg7f-chain-representation-audit.json').read_text())
          g=json.loads(Path('artifacts/orion-qg-qg7f-generic-verification.json').read_text())
          n=json.loads(Path('artifacts/orion-qg-qg7f-native-verification.json').read_text())
          d=json.loads(Path('artifacts/orion-qg-qg7f-dual-harness.json').read_text())
          pos='QG7F_TWO_COORD_REDUCTION_REFUTED__TAG3_MULTI_COMM_S2_CONFIGURATION'
          assert a['terminal']==pos and a['representation_premise_refuted'] is True
          assert a['candidate']['tag_weight']==3
          assert a['observed_comm_s2_support_pairs']=={'B':[0,1],'C':[1,2]}
          assert g['decision']=='ACCEPT_REPRESENTATION_PREMISE_REFUTATION' and g['all_checks'] is True
          assert n['decision']=='ACCEPT_REPRESENTATION_PREMISE_REFUTATION' and n['all_checks'] is True
          assert n['responsibility']=='REPRESENTATION_PREMISE_REFUTATION'
          assert d['terminal']==pos and d['both_accept'] is True
          for x in (a,g,n,d):
            assert x['CHAIN_REPRESENTATION_COMPLETE'] is False
            assert x['CHAIN_ALL_N'] is False
            assert x['GLOBAL_BDOUBLEPRIME_COMPLETENESS'] is False
            assert x['FIFTH_REGIME_FOUND'] is False
            assert x['novelty_authority'] is False and x['r6_authority'] is False and x['physical_quantum_advantage_claim'] is False
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-qg-qg7f-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/orion-qg-qg7f-*.json
            artifacts/orion-qg-qg7f-*.log
            .orion-qg-qg7f-generic/.orion-harness/**
            .orion-qg-qg7f-native/.orion-harness/**
          include-hidden-files: true
          if-no-files-found: warn
