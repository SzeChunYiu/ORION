name: orion-q-max-r6-p10

on:
  pull_request:
    paths:
      - 'research/extensions/orion-q/**'
      - 'development/orion-q-max-r0/**'
      - '.github/workflows/orion-q-max-r6-p10.yml'

jobs:
  candidate-blind-frame-optimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run candidate-blind P10 auxiliary-frame optimizer
        run: |
          cd research/extensions/orion-q
          python max_r6_p10_candidate_blind_frame_optimizer.py | tee /tmp/r6-p10.txt
          grep '^ORIONQ_MAX_R6_P10_FRAME=' /tmp/r6-p10.txt
