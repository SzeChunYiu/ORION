name: orion03-04-15-24-final-freeze
on:
  workflow_dispatch:
  push:
    branches: [chatgpt/orion03-04-15-24-final-freeze-20260827]
    paths:
      - 'papers/publication_closure/remaining11/check_orion03_04_15_24_final_freeze.py'
      - '.github/workflows/orion03-04-15-24-final-freeze.yml'
permissions: {contents: write}
concurrency: {group: orion03-04-15-24-final-freeze, cancel-in-progress: true}
jobs:
  freeze:
    if: ${{ !contains(github.event.head_commit.message, '[orion03-04-15-24-final-frozen]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: {PYTHONPATH: src}
    steps:
      - uses: actions/checkout@v4
        with: {ref: chatgpt/orion03-04-15-24-final-freeze-20260827, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install current project and pytest
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Re-verify ORION-01--05 convergence authority
        run: python research/orion-01-05-convergence-v1/verify_convergence_v1.py
      - name: Re-run Self-ORION non-self-promotion controls
        run: python -m pytest -q tests/unit/self_orion/test_revision_gate.py tests/unit/self_orion/test_epistemic_control.py
      - name: Re-run ORION-24 authoritative P14C replay adjudication
        run: python papers/orion-24-orion-rse/verify_p14c_protocol_adjudication_v2.py > "$RUNNER_TEMP/p14c.json"
      - name: Require current paper trees clean
        run: git diff --exit-code -- papers/orion-03-typed-merge-falsification papers/orion-04-rooted-completion-certificates papers/orion-15-self-orion papers/orion-24-orion-rse
      - name: Write four whole-tree receipts
        run: python papers/publication_closure/remaining11/check_orion03_04_15_24_final_freeze.py
      - name: Validate and commit receipts
        shell: bash
        run: |
          set -euo pipefail
          for n in 03 04 15 24; do f="papers/publication_closure/receipts/remaining11/ORION-${n}_SCIENCE_CONTENT_FREEZE_V1.json"; python - "$f" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]));assert x['science_frozen'] and x['paper_content_frozen'];assert x['successor_required_for_future_science'];assert not x['submission_authority'];assert len(x['paper_tree_oid'])==40;print(x['terminal'])
          PY
          done
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/publication_closure/receipts/remaining11/ORION-{03,04,15,24}_SCIENCE_CONTENT_FREEZE_V1.json
          git diff --check --cached;git commit -m 'papers(publication): freeze ORION-03/04/15/24 science and content [orion03-04-15-24-final-frozen]';git push origin HEAD:chatgpt/orion03-04-15-24-final-freeze-20260827
