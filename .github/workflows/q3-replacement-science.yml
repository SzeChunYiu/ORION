name: q3-replacement-science

on:
  pull_request:
    paths:
      - 'research/extensions/orion-qg/qg19_outside_cone_sharpness.py'
      - 'research/extensions/orion-qg/qg20_sixlcu_objective_scope.py'
      - 'development/orion-qg-regime-geometry/QG19_OUTSIDE_CONE_SHARPNESS_PROTOCOL_V1.md'
      - 'development/orion-qg-regime-geometry/QG20_SIXLCU_OBJECTIVE_SCOPE_PROTOCOL_V1.md'
      - '.github/workflows/q3-replacement-science.yml'
  push:
    branches:
      - 'codex/q-qg-nature-skills-publication-closure-20260821'
    paths:
      - 'research/extensions/orion-qg/qg19_outside_cone_sharpness.py'
      - 'research/extensions/orion-qg/qg20_sixlcu_objective_scope.py'
      - 'development/orion-qg-regime-geometry/QG19_OUTSIDE_CONE_SHARPNESS_PROTOCOL_V1.md'
      - 'development/orion-qg-regime-geometry/QG20_SIXLCU_OBJECTIVE_SCOPE_PROTOCOL_V1.md'
      - '.github/workflows/q3-replacement-science.yml'

permissions:
  contents: read

jobs:
  qg19-qg20-outcomes:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific runtime
        run: python -m pip install --disable-pip-version-check numpy
      - name: Verify Q3 pre-outcome freeze predates analyzers
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 85bb1bc013b8148e2e2d9664cabd17e8bbd7b1a1 HEAD
          test -f papers/orion-07-dual-instrument/instances/Q3-R1-QG19/PREOUTCOME_AGREEMENT.json
          test -f papers/orion-07-dual-instrument/instances/Q3-R2-QG20/PREOUTCOME_AGREEMENT.json
          grep -Fq '"scientific_outcome_accessed": false' papers/orion-07-dual-instrument/instances/Q3-R1-QG19/PREOUTCOME_AGREEMENT.json
          grep -Fq '"scientific_outcome_accessed": false' papers/orion-07-dual-instrument/instances/Q3-R2-QG20/PREOUTCOME_AGREEMENT.json
      - name: Execute QG19 twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/q3_replacements
          python research/extensions/orion-qg/qg19_outside_cone_sharpness.py --output build/q3_replacements/QG19_A.json > build/q3_replacements/QG19_A.stdout
          python research/extensions/orion-qg/qg19_outside_cone_sharpness.py --output build/q3_replacements/QG19_B.json > build/q3_replacements/QG19_B.stdout
          cmp build/q3_replacements/QG19_A.json build/q3_replacements/QG19_B.json
          cmp build/q3_replacements/QG19_A.stdout build/q3_replacements/QG19_B.stdout
          sha256sum build/q3_replacements/QG19_A.json > build/q3_replacements/QG19_SHA256.txt
      - name: Execute QG20 twice
        shell: bash
        run: |
          set -euo pipefail
          python research/extensions/orion-qg/qg20_sixlcu_objective_scope.py --output build/q3_replacements/QG20_A.json > build/q3_replacements/QG20_A.stdout
          python research/extensions/orion-qg/qg20_sixlcu_objective_scope.py --output build/q3_replacements/QG20_B.json > build/q3_replacements/QG20_B.stdout
          cmp build/q3_replacements/QG20_A.json build/q3_replacements/QG20_B.json
          cmp build/q3_replacements/QG20_A.stdout build/q3_replacements/QG20_B.stdout
          sha256sum build/q3_replacements/QG20_A.json > build/q3_replacements/QG20_SHA256.txt
      - name: Summarize terminals
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for q in ('QG19','QG20'):
              d=json.loads(Path(f'build/q3_replacements/{q}_A.json').read_text())
              print(q, d['terminal'], d['result_digest'])
          PY
      - name: Archive replacement outcomes
        uses: actions/upload-artifact@v4
        with:
          name: q3-replacement-scientific-outcomes
          path: build/q3_replacements
          if-no-files-found: error
          retention-days: 30
