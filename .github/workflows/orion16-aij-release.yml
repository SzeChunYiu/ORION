name: orion16-aij-release

on:
  pull_request:
    branches: [main]
    paths:
      - 'papers/orion-16-formal-epistemic-structures-and-mechanics/**'
      - 'papers/top_tier_gap_closure/release_builders/orion16/**'
      - 'research/claim_expansion/p6/**'
      - '.github/workflows/orion16-aij-release.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared ORION runtime dependencies
        run: python -m pip install -e .
      - name: Verify frozen candidate byte binding
        run: PYTHONPATH=src python papers/candidates/checkers/check_content_binding_v1.py --check
      - name: Re-run normative theorem checks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python papers/orion-16-formal-epistemic-structures-and-mechanics/formal/check_theory_closure_v2_1.py
          PYTHONPATH=src python papers/orion-16-formal-epistemic-structures-and-mechanics/formal/check_theory_closure_v2.py
          PYTHONPATH=src python papers/orion-16-formal-epistemic-structures-and-mechanics/formal/refutation_audit.py
      - name: Verify V3 frozen receipts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('research/claim_expansion/p6')
          p=json.dumps(json.loads((r/'P6_X_FINITE_MODEL_RESULT_V1.json').read_text()),sort_keys=True)
          i=json.dumps(json.loads((r/'P6_X_INDEPENDENT_VERIFICATION_V1.json').read_text()),sort_keys=True)
          for token in ('1536','96'):
              assert token in p and token in i
          print('ORION16_V3_RECEIPTS=PASS')
          PY
      - name: Generate current submission manuscript
        run: python papers/top_tier_gap_closure/release_builders/orion16/build_current_aij.py
      - name: Install TeX and PDF tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils zip
      - name: Compile current manuscript
        shell: bash
        working-directory: build/orion16_release
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error AIJ_MANUSCRIPT_CURRENT.tex
          test -s AIJ_MANUSCRIPT_CURRENT.pdf
          if grep -E 'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|Undefined control sequence|Overfull \\hbox' AIJ_MANUSCRIPT_CURRENT.log; then exit 1; fi
      - name: Audit release surface
        shell: bash
        run: |
          set -euo pipefail
          D=build/orion16_release
          C=papers/top_tier_gap_closure/release_builders/orion16/COVER_LETTER.md
          pdftotext "$D/AIJ_MANUSCRIPT_CURRENT.pdf" "$RUNNER_TEMP/orion16.txt"
          pdfinfo "$D/AIJ_MANUSCRIPT_CURRENT.pdf" > "$RUNNER_TEMP/orion16-pdfinfo.txt"
          for token in 'SzeChunYiu' 'Stockholm University' 'sze-chun.yiu@fysik.su.se' '1,536 states' '96 typed-erasure separation witnesses' 'ideal donor product' 'The author received no specific funding for this work.' 'The author declares no competing interests.' 'Declaration of generative AI'; do grep -Fq "$token" "$RUNNER_TEMP/orion16.txt"; done
          if grep -Eiq 'AUTHOR INPUT REQUIRED|CORRESPONDING AUTHOR INPUT REQUIRED|supplied through the journal submission interface after author confirmation' "$RUNNER_TEMP/orion16.txt" "$D/AIJ_MANUSCRIPT_CURRENT.tex" "$C"; then exit 1; fi
          sha256sum "$D/AIJ_MANUSCRIPT_CURRENT.pdf" > "$RUNNER_TEMP/orion16.pdf.sha256"
          printf '%s\n' 'arXiv.org perpetual, non-exclusive license 1.0' > "$RUNNER_TEMP/ARXIV_LICENSE.txt"
          printf '%s\n' 'cs.AI' > "$RUNNER_TEMP/ARXIV_PRIMARY_CATEGORY.txt"
      - name: Build source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orion16-source"
          cp build/orion16_release/AIJ_MANUSCRIPT_CURRENT.tex "$RUNNER_TEMP/orion16-source/main.tex"
          cp papers/top_tier_gap_closure/release_builders/orion16/V3_SCIENCE_UPDATE.tex "$RUNNER_TEMP/orion16-source/V3_SCIENCE_UPDATE.tex"
          cp papers/top_tier_gap_closure/release_builders/orion16/COVER_LETTER.md "$RUNNER_TEMP/orion16-source/COVER_LETTER.md"
          (cd "$RUNNER_TEMP/orion16-source" && zip -qr "$RUNNER_TEMP/orion-16-source.zip" .)
          sha256sum "$RUNNER_TEMP/orion-16-source.zip" > "$RUNNER_TEMP/orion16-source.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: orion-16-aij-and-arxiv-package
          path: |
            build/orion16_release/AIJ_MANUSCRIPT_CURRENT.pdf
            build/orion16_release/AIJ_MANUSCRIPT_CURRENT.tex
            papers/top_tier_gap_closure/release_builders/orion16/COVER_LETTER.md
            ${{ runner.temp }}/orion-16-source.zip
            ${{ runner.temp }}/orion16.pdf.sha256
            ${{ runner.temp }}/orion16-source.sha256
            ${{ runner.temp }}/orion16-pdfinfo.txt
            ${{ runner.temp }}/ARXIV_LICENSE.txt
            ${{ runner.temp }}/ARXIV_PRIMARY_CATEGORY.txt
          if-no-files-found: error
          retention-days: 90
