name: p3-p5-publication-byte-sync

on:
  pull_request:
    paths:
      - 'papers/paper-03-global-knowledge-portrait/**'
      - 'papers/paper-05-self-orion/**'
      - 'research/publication/publication_status.json'
      - '.github/workflows/p3-manuscript-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: python -m pip install -e '.[dev,candidates]'

      - name: Install TeX/PDF/SVG toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-pictures texlive-fonts-recommended poppler-utils librsvg2-bin

      - name: Render tracked P5 SVG to publication PDF asset
        run: |
          set -euo pipefail
          rsvg-convert -f pdf \
            -o papers/paper-05-self-orion/figures/p5_1_governed_development_loop.pdf \
            papers/paper-05-self-orion/figures/p5_1_governed_development_loop.svg
          test -s papers/paper-05-self-orion/figures/p5_1_governed_development_loop.pdf
          pdfinfo papers/paper-05-self-orion/figures/p5_1_governed_development_loop.pdf | tee /tmp/p5-figure-pdfinfo.txt

      - name: Audit P3 scoped claim wiring and manuscript inputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          paper = Path('papers/paper-03-global-knowledge-portrait')
          root = paper / 'manuscript'
          tex_files = [root / 'main.tex', *sorted((root / 'sections').glob('*.tex'))]
          text = '\n'.join(path.read_text(encoding='utf-8') for path in tex_files)
          bib_text = '\n'.join(
              path.read_text(encoding='utf-8')
              for path in (root / 'bibliography.bib', root / 'novelty_refresh_2026.bib')
          )
          bib_keys = set(re.findall(r'@\w+\s*\{\s*([^,\s]+)', bib_text))
          cite_keys = set()
          for group in re.findall(r'\\cite\w*\{([^}]+)\}', text):
              cite_keys.update(key.strip() for key in group.split(',') if key.strip())
          missing_cites = sorted(cite_keys - bib_keys)

          missing_inputs = []
          for target in re.findall(r'\\input\{([^}]+)\}', (root / 'main.tex').read_text(encoding='utf-8')):
              path = root / target
              if not path.suffix:
                  path = path.with_suffix('.tex')
              if not path.is_file():
                  missing_inputs.append(str(path.relative_to(root)))

          labels = re.findall(r'\\label\{([^}]+)\}', text)
          duplicate_labels = sorted({label for label in labels if labels.count(label) > 1})
          abstract = (root / 'sections' / '00-abstract.tex').read_text(encoding='utf-8')
          introduction = (root / 'sections' / '10-introduction.tex').read_text(encoding='utf-8')
          dataset = (root / 'sections' / '40-dataset.tex').read_text(encoding='utf-8')
          evaluation = (root / 'sections' / '50-evaluation.tex').read_text(encoding='utf-8')
          conclusion = (root / 'sections' / '08-conclusion.tex').read_text(encoding='utf-8')
          limitations = (root / 'sections' / '07-limitations.tex').read_text(encoding='utf-8')
          scoped = (paper / 'SCOPED_PUBLICATION_TRACK_V1.md').read_text(encoding='utf-8')
          ledger = (paper / 'CLAIM_LEDGER_V1.md').read_text(encoding='utf-8')

          claim_errors = []
          for name, fragment in [('abstract', abstract), ('introduction', introduction), ('conclusion', conclusion)]:
              if '0.1875' not in fragment or '-0.1875' not in fragment:
                  claim_errors.append(f'{name}_missing_confirmatory_effect')
              if '0.125 for flat predicate' in fragment or '$-0.125$' in fragment:
                  claim_errors.append(f'{name}_still_uses_exploratory_headline')
          if '\\conststatus{}' not in abstract or '\\conststatus{}' not in conclusion:
              claim_errors.append('headline_missing_cannot_check_boundary')
          if 'has not been executed' not in limitations:
              claim_errors.append('limitations_do_not_mark_broad_study_unexecuted')
          if 'P3.C7' not in scoped or 'P3.C8' not in scoped:
              claim_errors.append('scoped_track_missing_nonclaim_ids')
          if 'P3.C10' not in ledger or 'P3.C11' not in ledger:
              claim_errors.append('claim_ledger_missing_p3x_identity_authority')
          if '400/400' not in abstract or '400/400' not in conclusion:
              claim_errors.append('headline_missing_p3x_400_400')

          forbidden_executed_broad_claims = {
              'introduction': ['independently annotated gold dataset spanning four disciplines', 'gold study is designed to test'],
              'dataset': ['The released manifest is \\texttt{SEED}', 'Final gold replaces these', 'all 32 samples annotated and adjudicated'],
              'evaluation': ['same gold dataset', 'five stochastic seeds', 'deepseek-v4-pro', 'Six baselines are implemented', 'Eight ablations are implemented', 'Seventeen metrics are computed per run'],
          }
          for name, phrases in forbidden_executed_broad_claims.items():
              fragment = {'introduction': introduction, 'dataset': dataset, 'evaluation': evaluation}[name]
              for phrase in phrases:
                  if phrase in fragment:
                      claim_errors.append(f'{name}_reintroduces_unexecuted_broad_claim:{phrase}')

          forbidden_removed_keys = {'adias2026','raghunathan2022stance','liu2022scholar','oh2017unified','sebastian2017measurement','chang2012','swanson1990'}
          stale_keys = sorted((cite_keys | bib_keys) & forbidden_removed_keys)
          if stale_keys:
              claim_errors.append('stale_or_invalid_reference_keys:' + ','.join(stale_keys))

          report = {
              'schema_version': 'orion.p3.manuscript-static-audit.v3',
              'tex_files_scanned': len(tex_files),
              'bibliography_entries': len(bib_keys),
              'citation_keys_used': len(cite_keys),
              'missing_citation_keys': missing_cites,
              'missing_input_files': missing_inputs,
              'duplicate_labels': duplicate_labels,
              'claim_errors': claim_errors,
          }
          Path('/tmp/p3-manuscript-audit.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('P3_MANUSCRIPT_STATIC_AUDIT=' + json.dumps(report, sort_keys=True))
          if missing_cites or missing_inputs or duplicate_labels or claim_errors:
              raise SystemExit(1)
          PY

      - name: Compile final P3 identity-authority PDF
        working-directory: papers/paper-03-global-knowledge-portrait/manuscript
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          if grep -E 'LaTeX Warning: (Citation|Reference).*(undefined)|There were undefined references|undefined citations|multiply defined' main.log; then
            echo 'P3 unresolved or duplicate LaTeX reference/citation remains.' >&2
            exit 1
          fi
          pdfinfo main.pdf | tee /tmp/p3-pdfinfo.txt
          cp main.pdf ../journal_package/manuscript.pdf

      - name: Compile final scoped P5 non-self-promotion PDF
        working-directory: papers/paper-05-self-orion/manuscript
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          if grep -E 'LaTeX Warning: (Citation|Reference).*(undefined)|There were undefined references|undefined citations|multiply defined' main.log; then
            echo 'P5 unresolved or duplicate LaTeX reference/citation remains.' >&2
            exit 1
          fi
          pdfinfo main.pdf | tee /tmp/p5-pdfinfo.txt
          cp main.pdf ../journal_package/manuscript.pdf

      - name: Seal scoped readiness and PDF audit receipts
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          source_head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def pages(path: Path) -> str:
              out = subprocess.check_output(['pdfinfo', str(path)], text=True)
              for line in out.splitlines():
                  if line.startswith('Pages:'):
                      return line.split(':',1)[1].strip()
              raise RuntimeError('Pages missing from pdfinfo')

          p3 = Path('papers/paper-03-global-knowledge-portrait')
          p5 = Path('papers/paper-05-self-orion')

          for paper in (p3, p5):
              manifest_path = paper / 'journal_package' / 'MANIFEST.json'
              payload = json.loads(manifest_path.read_text(encoding='utf-8'))
              payload['audit_subject_revision'] = source_head
              payload['audit_date'] = '2026-08-20'
              manifest_path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          p5_readiness = (p5 / 'JOURNAL_READINESS.md').read_text(encoding='utf-8')
          p5_readiness = p5_readiness.replace(
              '**Scoped paper terminal:** `SCOPED_NON_SELF_PROMOTION_SUPPORTED`  ',
              '**Terminal:** `PEER_REVIEW_READY`  '
          )
          p5_readiness = p5_readiness.replace(
              '- [ ] exact final PDF rebuilt from the scoped source and independently audited;',
              '- [x] exact final PDF rebuilt from the scoped source and independently audited;'
          ).replace(
              '- [ ] final package hashes regenerated on the exact scoped source/PDF;',
              '- [x] final package hashes regenerated on the exact scoped source/PDF;'
          )
          p5_readiness = p5_readiness.replace(
              '`ORION-P5 = SCOPED_PEER_REVIEW_READY` when the final scoped PDF and hashes are rebuilt from the current source and pass the package/claim audit.',
              '**`ORION-P5 = PEER_REVIEW_READY`.** The scoped PDF and hashes are rebuilt from the exact source and are subject to the same-head package/claim audit.'
          )
          (p5 / 'JOURNAL_READINESS.md').write_text(p5_readiness, encoding='utf-8')

          p5_readme = (p5 / 'README.md').read_text(encoding='utf-8')
          if '**Status:**' in p5_readme:
              lines = p5_readme.splitlines()
              for i, line in enumerate(lines[:12]):
                  if line.startswith('**Status:**'):
                      lines[i] = '**Status:** `PEER_REVIEW_READY` for the scoped non-self-promotion claim; transferable improvement remains `CANNOT_CHECK`.'
                      break
              (p5 / 'README.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          p3_readme = (p3 / 'README.md').read_text(encoding='utf-8')
          if '**Status:**' in p3_readme:
              lines = p3_readme.splitlines()
              for i, line in enumerate(lines[:12]):
                  if line.startswith('**Status:**'):
                      lines[i] = '**Status:** `PEER_REVIEW_READY` for the scoped scientific-identity-authority paper.'
                      break
              (p3 / 'README.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          p3_pdf = p3 / 'journal_package' / 'manuscript.pdf'
          p5_pdf = p5 / 'journal_package' / 'manuscript.pdf'

          (p3 / 'journal_package' / 'CLAIM_PDF_AUDIT.md').write_text(f'''# ORION-P3 independent claim / PDF audit\n\nBuild subject before generated-package commit: `{source_head}`.\nTracked PDF: `journal_package/manuscript.pdf`.\nPDF SHA256: `{digest(p3_pdf)}`.\nPages: `{pages(p3_pdf)}`; bytes: `{p3_pdf.stat().st_size}`.\n\n| ID | Claim | Artifact | Status |\n|---|---|---|---|\n| P3.C5 | Disjoint confirmatory mapping n=32; false-merge 0 vs 0.1875 | `evidence/public-reference-v1.1-confirmatory/CONFIRMATORY_ANALYSIS.json` | BOUNDED |\n| P3.C10 | P3-X 400/400 vs strong semantic product 250/400 and canonical 50/400; +0.375 CI [0.3275,0.4225], zero false GLUE, clean 1.0 | `evidence/P3_X_RESULT_RECEIPT_V1.md` | BOUNDED |\n| P3.C11 | Information-equivalent typed product 400/400, zero mismatches | `evidence/P3_X_RESULT_RECEIPT_V1.md` | BOUNDED / PORTABILITY |\n| P3.C7 | Raw-text end-to-end integration superiority | excluded follow-up in claim ledger | CANNOT_CHECK / NOT_CLAIMED |\n| P3.C8 | Downstream answer-quality improvement | excluded follow-up in claim ledger | CANNOT_CHECK / NOT_CLAIMED |\n| P3.STRUCTURE | Exact-ground-truth method-projection non-vacuity pilot | `evidence/method-structure/BOUNDED_PILOT_RECEIPT_V1.md` | BOUNDED |\n| P3.PDF | Canonical scoped identity-authority PDF compiled with converged references/citations | `journal_package/manuscript.pdf` | SUPPORTED |\n\nThe PDF claim is scoped to structured scientific-integration and identity-authority evidence. It does not complete the raw-text expert atlas or downstream utility studies.\n''', encoding='utf-8')

          (p5 / 'journal_package' / 'CLAIM_PDF_AUDIT.md').write_text(f'''# ORION-P5 independent claim / PDF audit\n\nBuild subject before generated-package commit: `{source_head}`.\nTracked PDF: `journal_package/manuscript.pdf`.\nPDF SHA256: `{digest(p5_pdf)}`.\nPages: `{pages(p5_pdf)}`; bytes: `{p5_pdf.stat().st_size}`.\n\n| ID | Claim | Artifact | Status |\n|---|---|---|---|\n| P5.AUTHORITY_SEPARATION | Internal diagnosis/proposal/T7 recommendation lacks revision/adoption/promotion/merge/global-stop authority; final adoption remains host-owned | `evidence/CLAIM_LEDGER_V1.md`; `evidence/FALSIFIER_V1.md` | SUPPORTED |\n| P5.ERROR_CONTAINMENT | Three retained attribution errors do not become adoption certificates under the registered authority graph | `evidence/glm-5.2-attribution/report.json`; claim ledger | BOUNDED ARCHITECTURE |\n| P5.ATTR | GLM-5.2 attribution 21/24 = 0.875, three retained errors | `evidence/glm-5.2-attribution/report.json` | BOUNDED DIAGNOSTIC |\n| P5.H1 | Fresh-transfer improvement vs matched self-improvement baselines | separate protected campaign not executed | CANNOT_CHECK |\n| P5.PDF | Canonical scoped governance PDF compiled with converged references/citations | `journal_package/manuscript.pdf` | SUPPORTED |\n\nDo not promote P5.ATTR or the scoped authority result into transferable self-improvement performance evidence.\n''', encoding='utf-8')
          PY

      - name: Regenerate and verify P1-P5 journal package hashes
        run: |
          set -euo pipefail
          python research/paper-programme-v1/journal_package/check_journal_package.py --root . --write-hashes
          python research/paper-programme-v1/journal_package/check_journal_package.py --root .

      - name: Derive and verify publication scoreboard
        run: |
          set -euo pipefail
          python research/publication/scoreboard.py --write
          python research/publication/scoreboard.py --check
          pytest -q tests/test_publication_status.py tests/unit/publication/test_journal_package.py

      - name: Commit generated publication bytes
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            papers/paper-01-recursive-epistemic-reconstruction/journal_package/SHA256SUMS \
            papers/paper-02-open-world-scientific-discovery/journal_package/SHA256SUMS \
            papers/paper-03-global-knowledge-portrait/README.md \
            papers/paper-03-global-knowledge-portrait/journal_package/MANIFEST.json \
            papers/paper-03-global-knowledge-portrait/journal_package/CLAIM_PDF_AUDIT.md \
            papers/paper-03-global-knowledge-portrait/journal_package/SHA256SUMS \
            papers/paper-03-global-knowledge-portrait/journal_package/manuscript.pdf \
            papers/paper-04-verified-scientific-discovery/journal_package/SHA256SUMS \
            papers/paper-05-self-orion/README.md \
            papers/paper-05-self-orion/JOURNAL_READINESS.md \
            papers/paper-05-self-orion/figures/p5_1_governed_development_loop.pdf \
            papers/paper-05-self-orion/journal_package/MANIFEST.json \
            papers/paper-05-self-orion/journal_package/CLAIM_PDF_AUDIT.md \
            papers/paper-05-self-orion/journal_package/SHA256SUMS \
            papers/paper-05-self-orion/journal_package/manuscript.pdf \
            research/publication/publication_status.json
          if git diff --cached --quiet; then
            echo 'No publication-byte changes to commit.'
            exit 0
          fi
          git commit -m 'papers: seal final P3 identity and scoped P5 governance packages'
          git push origin "HEAD:${BRANCH}"

      - name: Archive rebuilt PDFs and audit receipts
        uses: actions/upload-artifact@v4
        with:
          name: p3-p5-final-publication-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/p3-manuscript-audit.json
            /tmp/p3-pdfinfo.txt
            /tmp/p5-pdfinfo.txt
            /tmp/p5-figure-pdfinfo.txt
            papers/paper-03-global-knowledge-portrait/journal_package/manuscript.pdf
            papers/paper-05-self-orion/figures/p5_1_governed_development_loop.pdf
            papers/paper-05-self-orion/journal_package/manuscript.pdf
