name: q1-r11-sparse-direct-gate

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/orion-publication-closure-wave-a-20260827
    paths:
      - 'papers/orion-05-tare-expressivity/Q1_R11_N9_RUNTIME_THEOREM_CANDIDATE.md'
      - 'papers/orion-05-tare-expressivity/Q1_R11_SPARSE_DIRECT_EXECUTABLE_PROTOCOL_V1.md'
      - 'papers/orion-05-tare-expressivity/q1_r11_pair_count_independent.py'
      - 'papers/orion-05-tare-expressivity/q1_r11_sparse_direct_solver.py'
      - 'papers/orion-05-tare-expressivity/q1_r11_sparse_direct_gate.py'
      - '.github/workflows/q1-r11-sparse-direct-gate.yml'

permissions:
  contents: write

concurrency:
  group: q1-r11-sparse-direct-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute-and-bind:
    if: ${{ !contains(github.event.head_commit.message, '[q1-r11-gate]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/orion-publication-closure-wave-a-20260827
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install exact runtime
        run: python -m pip install -e '.[dev]'

      - name: Compile isolated solver and hostile harness
        run: |
          python -m py_compile papers/orion-05-tare-expressivity/q1_r11_pair_count_independent.py
          python -m py_compile papers/orion-05-tare-expressivity/q1_r11_sparse_direct_solver.py
          python -m py_compile papers/orion-05-tare-expressivity/q1_r11_sparse_direct_gate.py

      - name: Run prospective sparse-direct executable gate
        shell: bash
        run: |
          set -euo pipefail
          out='papers/orion-05-tare-expressivity/Q1_R11_SPARSE_DIRECT_EXECUTABLE_RESULT_V1.json'
          python papers/orion-05-tare-expressivity/q1_r11_sparse_direct_gate.py --output "$out" \
            | tee "$RUNNER_TEMP/q1-r11-gate.stdout.log"
          python - "$out" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          d = json.loads(p.read_text())
          assert d['terminal'] == 'Q1_R11_EXACT_O_N9_DIRECT_SOLVER_THEOREM', d['terminal']
          assert all(d['gates'].values()), d['gates']
          PY

      - name: Bind exact positive result to branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/orion-05-tare-expressivity/Q1_R11_SPARSE_DIRECT_EXECUTABLE_RESULT_V1.json
          git commit -m 'science(ORION-05): bind R11 sparse-direct theorem result [q1-r11-gate]'
          git push origin HEAD:chatgpt/orion-publication-closure-wave-a-20260827

      - uses: actions/upload-artifact@v4
        with:
          name: q1-r11-sparse-direct-gate-${{ github.sha }}
          path: |
            papers/orion-05-tare-expressivity/Q1_R11_SPARSE_DIRECT_EXECUTABLE_RESULT_V1.json
            ${{ runner.temp }}/q1-r11-gate.stdout.log
          if-no-files-found: error
          retention-days: 30
