name: saturation-final-render-audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/saturation-final-render-audit.yml'
      - 'research/saturation/FINAL_RENDER_PLAN_V1.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository and render toolchains
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev,candidates]'
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended lmodern poppler-utils librsvg2-bin
          mkdir -p research/saturation/_render_out/{P1,P2,P3,P4}

      - name: Render P1 from saturated source
        run: |
          set -euo pipefail
          cd papers/paper-01-recursive-epistemic-reconstruction/manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          ! grep -Eqi 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log
          ! grep -Eq 'Overfull \\hbox|Overfull \\vbox' main.log
          pdfinfo main.pdf > ../../../../research/saturation/_render_out/P1/pdfinfo.txt
          sha256sum main.pdf > ../../../../research/saturation/_render_out/P1/sha256.txt
          cp main.pdf main.log ../../../../research/saturation/_render_out/P1/

      - name: Validate and render P2; compare tracked PDF
        run: |
          set -euo pipefail
          python papers/paper-02-open-world-scientific-discovery/scripts/check_claim_ledger.py --check
          python papers/paper-02-open-world-scientific-discovery/scripts/check_p2_v2.py
          python -m unittest discover -s papers/paper-02-open-world-scientific-discovery/tests -p 'test_p2_v2.py'
          cd papers/paper-02-open-world-scientific-discovery/manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          ! grep -Eqi 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log
          ! grep -Eq 'Overfull \\hbox|Overfull \\vbox' main.log
          pdftotext main.pdf /tmp/p2-rebuilt.txt
          pdftotext ../journal_package/manuscript.pdf /tmp/p2-tracked.txt
          cmp /tmp/p2-rebuilt.txt /tmp/p2-tracked.txt
          test "$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')" = "$(pdfinfo ../journal_package/manuscript.pdf | awk '/^Pages:/ {print $2}')"
          pdfinfo ../journal_package/manuscript.pdf > ../../../../research/saturation/_render_out/P2/pdfinfo.txt
          sha256sum ../journal_package/manuscript.pdf > ../../../../research/saturation/_render_out/P2/sha256.txt
          cp ../journal_package/manuscript.pdf ../../../../research/saturation/_render_out/P2/P2.pdf
          cp main.log ../../../../research/saturation/_render_out/P2/

      - name: Render P3 from saturated source
        run: |
          set -euo pipefail
          cd papers/paper-03-global-knowledge-portrait/manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          ! grep -E 'LaTeX Warning: (Citation|Reference).*(undefined)|There were undefined references|undefined citations|multiply defined' main.log
          ! grep -E 'Overfull \\[hv]box' main.log
          pdfinfo main.pdf > ../../../research/saturation/_render_out/P3/pdfinfo.txt
          sha256sum main.pdf > ../../../research/saturation/_render_out/P3/sha256.txt
          cp main.pdf main.log ../../../research/saturation/_render_out/P3/

      - name: Render P4 through pinned TMLR path
        run: |
          set -euo pipefail
          pytest -q tests/unit/p4/test_p4_publication_v2.py tests/unit/p4/test_p4_v2_execution_freeze.py
          python papers/paper-04-verified-scientific-discovery/figures/generate_figures.py
          F=papers/paper-04-verified-scientific-discovery/figures
          for stem in p4_2_false_promotion p4_3_coverage_frontier p4_4_detection_by_attack p4_5_attribution_vs_support p4_6_cost_false_promotion; do
            rsvg-convert -w 1440 -o "$F/$stem.png" "$F/$stem.svg"
          done
          git diff --exit-code -- papers/paper-04-verified-scientific-discovery/tables
          BASE=https://raw.githubusercontent.com/JmlrOrg/tmlr-style-file/7bf90efe3a0debbba703c05c43f3ff7e4d4a2992
          curl -fsSL "$BASE/tmlr.sty" -o papers/paper-04-verified-scientific-discovery/manuscript/tmlr.sty
          curl -fsSL "$BASE/tmlr.bst" -o papers/paper-04-verified-scientific-discovery/manuscript/tmlr.bst
          cd papers/paper-04-verified-scientific-discovery/manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          ! grep -Eqi 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log
          ! grep -E 'Overfull \\[hv]box' main.log
          pdftotext main.pdf /tmp/p4.txt
          grep -q 'Under review as submission to TMLR' /tmp/p4.txt
          grep -q '0/360' /tmp/p4.txt
          grep -q '180/360' /tmp/p4.txt
          grep -q '60/60' /tmp/p4.txt
          grep -qi 'not supported' /tmp/p4.txt
          pdfinfo main.pdf > ../../../research/saturation/_render_out/P4/pdfinfo.txt
          sha256sum main.pdf > ../../../research/saturation/_render_out/P4/sha256.txt
          cp main.pdf main.log ../../../research/saturation/_render_out/P4/

      - name: Archive final render subjects
        uses: actions/upload-artifact@v4
        with:
          name: seven-paper-final-render-${{ github.sha }}
          path: research/saturation/_render_out/
          if-no-files-found: error
          retention-days: 90
