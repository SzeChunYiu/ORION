name: rematerialize-orion-02-r20-current-main

on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths:
      - 'papers/orion-02-fiberguard-finite-fibre/INTERNAL_RELEASE_RECEIPT_R20.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rematerialize-clean-current-main-child:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/orion-02-r18-null-current-main-20260827
          fetch-depth: 0
      - name: Verify internal release receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('papers/orion-02-fiberguard-finite-fibre/INTERNAL_RELEASE_RECEIPT_R20.json')
          receipt=json.loads(path.read_text())
          assert receipt['schema']=='ORION.ORION02.InternalReleaseReceipt.R20.v1'
          assert receipt['terminal']=='ORION02_R20_INTERNAL_RELEASE_GATE_PASS__EXTERNAL_REVIEW_NOVELTY_RIGHTS_AND_SUBMISSION_OPEN'
          assert receipt['authority']['analytic_internal_review'] is True
          assert receipt['authority']['finite_implementation_corroboration'] is True
          assert receipt['authority']['external_independence'] is False
          assert receipt['authority']['novelty'] is False
          assert receipt['authority']['data_rights_complete'] is False
          assert receipt['authority']['journal_authority'] is False
          assert receipt['authority']['submission_authorized'] is False
          print('ORION_02_R20_INTERNAL_RECEIPT_VALID')
          PY
      - name: Create clean child of live main
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch='chatgpt/orion-02-r20-current-main-20260827'
          git fetch --no-tags origin main
          base="$(git rev-parse origin/main)"
          git checkout -B "$branch" origin/main
          git checkout "$SOURCE_SHA" -- papers/orion-02-fiberguard-finite-fibre
          rm -f papers/orion-02-fiberguard-finite-fibre/R20_RELEASE_REQUEST_V1.txt
          python - <<PY
          import json
          from pathlib import Path
          result={'schema':'ORION.ORION02.CurrentMainCustody.R20.v1','live_main_base':'$base','source_branch':'chatgpt/orion-02-r18-null-current-main-20260827','source_commit':'$SOURCE_SHA','internal_receipt':'INTERNAL_RELEASE_RECEIPT_R20.json','terminal':'ORION02_R20_REMATERIALIZED_ON_LIVE_MAIN__EXTERNAL_GATES_OPEN','authority':{'scientific_claims_unchanged':True,'external_independence':False,'novelty':False,'rights_complete':False,'journal_authority':False,'submission_authorized':False}}
          Path('papers/orion-02-fiberguard-finite-fibre/CURRENT_MAIN_CUSTODY_R20.json').write_text(json.dumps(result,sort_keys=True,separators=(',',':'))+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/orion-02-fiberguard-finite-fibre
          git commit -m 'research(ORION-02): rematerialize R20 paper on live main'
          git push --force-with-lease origin HEAD:refs/heads/$branch
          printf '%s\n' "$branch" > "$RUNNER_TEMP/branch.txt"
      - name: Open or update draft PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="$(cat "$RUNNER_TEMP/branch.txt")"
          number="$(gh pr list --head "$branch" --state all --json number --jq '.[0].number // empty')"
          body='R20 ORION-02 manuscript and evidence package rematerialized as a clean child of live main only after the strict internal release receipt. Exact finite-fibre theory, complete-corpus positive result, R14/R16/R18/neighborhood adverse results, R19 joint-route repair, formal manuscript, claims ledger, evidence manifest, prior-art ceiling, and fail-closed journal gate are included. External independence, novelty, ASlib data-rights interpretation, permanent archive, author metadata, and submission authority remain open; no adverse terminal is weakened.'
          if [ -z "$number" ]; then
            gh pr create --draft --base main --head "$branch" --title '[ORION-02][R20] Exact finite-fibre theory and prospective deployment refutations' --body "$body"
          else
            gh pr edit "$number" --title '[ORION-02][R20] Exact finite-fibre theory and prospective deployment refutations' --body "$body"
          fi
