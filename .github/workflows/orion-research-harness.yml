name: orion-research-harness

on:
  pull_request:
    paths:
      - 'packages/orion-research-harness/**'
      - 'development/orion-research-harness/**'
      - '.github/workflows/orion-research-harness.yml'
      - 'src/orion/**'
  workflow_dispatch:

concurrency:
  group: orion-research-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ORION and harness
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Test harness
        run: pytest -q packages/orion-research-harness/tests
