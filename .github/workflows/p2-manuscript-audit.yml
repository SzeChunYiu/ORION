name: p2-manuscript-audit

# This workflow does exactly what P2's JOURNAL_READINESS.md line 108 asks -- compile the
# narrowed manuscript in repository CI and retain the PDF/log artifact -- and it feeds line
# 109's reference-metadata audit. It was unreachable: triggered only by a push to
# `chatgpt/p2-remaining-closure` carrying a magic token in the commit message, so it could
# never run on `main` and neither box could be closed by anything short of recreating that
# branch. The gate existed and was wired to nothing.
#
# `workflow_dispatch` makes it runnable on demand; the `main` push trigger produces the
# artifact automatically at whatever commit the manuscript last changed, which is what
# #160 and #376 want the evidence bound to. The TeX toolchain install is slow, so this is
# deliberately not on `pull_request`.
on:
  push:
    branches:
      - chatgpt/p2-remaining-closure
      - main
    paths:
      - 'papers/paper-02-open-world-scientific-discovery/**'
      - 'research/paper-programme-v1/journal_package/check_journal_package.py'
      - 'research/publication/scoreboard.py'
      - 'research/publication/publication_status.schema.json'
      - 'research/publication/publication_status.json'
      - 'papers/candidates/checkers/check_p1_p5_native_embedding_v1.py'
      - '.github/workflows/p2-manuscript-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manuscript:
    # The magic-token guard applies only to the legacy feature-branch trigger. A manual
    # dispatch or a manuscript change on `main` is already an explicit request to run.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
      || contains(github.event.head_commit.message, '[run-p2-manuscript-audit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publication checker dependencies
        run: python -m pip install --disable-pip-version-check -e .

      - name: Validate P1-P5 journal package inventory (P2)
        run: |
          set -euo pipefail
          python research/paper-programme-v1/journal_package/check_journal_package.py

      - name: Validate P2 claim ledger and assimilation boundaries
        run: |
          set -euo pipefail
          python papers/paper-02-open-world-scientific-discovery/scripts/check_claim_ledger.py --check
          python papers/paper-02-open-world-scientific-discovery/scripts/check_p2_assimilation.py
          python papers/paper-02-open-world-scientific-discovery/scripts/check_p2_v2.py

      - name: Validate publication schema, readiness, and scoreboard
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m json.tool research/publication/publication_status.schema.json >/dev/null
          python -m json.tool research/publication/publication_status.json >/dev/null
          python research/publication/scoreboard.py --check
          grep -q 'CANNOT_CHECK' papers/paper-02-open-world-scientific-discovery/JOURNAL_READINESS.md
          grep -q 'CANNOT_CHECK' papers/paper-02-open-world-scientific-discovery/protocol/EXTERNAL_ACCESS_AUDIT_V1.json

      - name: Validate P1-P5 native boundary embedding
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python papers/candidates/checkers/check_p1_p5_native_embedding_v1.py

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-pictures texlive-fonts-recommended

      - name: Audit manuscript inputs, references, and retained source metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path

          paper = Path('papers/paper-02-open-world-scientific-discovery')
          root = paper / 'manuscript'
          evidence = paper / 'evidence' / 'literature'
          tex_files = [root / 'main.tex', *sorted((root / 'sections').glob('*.tex'))]
          text = '\n'.join(path.read_text(encoding='utf-8') for path in tex_files)
          bib = (root / 'bibliography.bib').read_text(encoding='utf-8')
          bib_keys = set(re.findall(r'@\w+\s*\{\s*([^,\s]+)', bib))
          cite_keys = set()
          for group in re.findall(r'\\cite\w*\{([^}]+)\}', text):
              cite_keys.update(key.strip() for key in group.split(',') if key.strip())
          missing_cites = sorted(cite_keys - bib_keys)
          missing_metadata = sorted(
              key for key in bib_keys if not (evidence / f'{key}.json').is_file()
          )

          missing_inputs = []
          for target in re.findall(r'\\input\{([^}]+)\}', text):
              path = root / target
              if not path.suffix:
                  path = path.with_suffix('.tex')
              if not path.exists():
                  missing_inputs.append(str(path.relative_to(root)))

          figure_files = sorted((root / 'figures').iterdir())
          empty_figures = [str(p.relative_to(root)) for p in figure_files if p.is_file() and p.stat().st_size == 0]
          report = {
              'schema_version': 'orion.p2.manuscript-static-audit.v2',
              'tex_files_scanned': len(tex_files),
              'bibliography_entries': len(bib_keys),
              'citation_keys_used': len(cite_keys),
              'retained_reference_metadata_records': len(bib_keys) - len(missing_metadata),
              'missing_citation_keys': missing_cites,
              'missing_reference_metadata_records': missing_metadata,
              'missing_input_files': missing_inputs,
              'empty_figure_files': empty_figures,
          }
          Path('/tmp').joinpath('p2-manuscript-audit.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print('P2_MANUSCRIPT_STATIC_AUDIT=' + json.dumps(report, sort_keys=True))
          if missing_cites or missing_metadata or missing_inputs or empty_figures:
              raise SystemExit(1)
          PY

      - name: Compile canonical PDF
        working-directory: papers/paper-02-open-world-scientific-discovery/manuscript
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          python3 ../scripts/check_manuscript_typography.py --log main.log
          if grep -E 'LaTeX Warning: (Citation|Reference).*(undefined)|There were undefined references|undefined citations' main.log; then
            echo 'Undefined citation/reference warning remains after latexmk convergence.' >&2
            exit 1
          fi
          pdfinfo main.pdf | tee /tmp/p2-pdfinfo.txt

      - name: Archive audit and compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: p2-manuscript-audit-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/p2-manuscript-audit.json
            /tmp/p2-pdfinfo.txt
            papers/paper-02-open-world-scientific-discovery/manuscript/main.pdf
            papers/paper-02-open-world-scientific-discovery/manuscript/main.log
