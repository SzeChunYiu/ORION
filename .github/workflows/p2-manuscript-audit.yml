name: p2-manuscript-audit

on:
  push:
    branches:
      - chatgpt/p2-remaining-closure

permissions:
  contents: read

jobs:
  manuscript:
    if: contains(github.event.head_commit.message, '[run-p2-manuscript-audit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-pictures texlive-fonts-recommended

      - name: Audit manuscript inputs and bibliography keys
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path

          root = Path('papers/paper-02-open-world-scientific-discovery/manuscript')
          tex_files = [root / 'main.tex', *sorted((root / 'sections').glob('*.tex'))]
          text = '\n'.join(path.read_text(encoding='utf-8') for path in tex_files)
          bib = (root / 'bibliography.bib').read_text(encoding='utf-8')
          bib_keys = set(re.findall(r'@\w+\s*\{\s*([^,\s]+)', bib))
          cite_keys = set()
          for group in re.findall(r'\\cite\w*\{([^}]+)\}', text):
              cite_keys.update(key.strip() for key in group.split(',') if key.strip())
          missing_cites = sorted(cite_keys - bib_keys)

          missing_inputs = []
          for target in re.findall(r'\\input\{([^}]+)\}', text):
              path = root / target
              if not path.suffix:
                  path = path.with_suffix('.tex')
              if not path.exists():
                  missing_inputs.append(str(path.relative_to(root)))

          figure_files = sorted((root / 'figures').iterdir())
          empty_figures = [str(p.relative_to(root)) for p in figure_files if p.is_file() and p.stat().st_size == 0]
          report = {
              'schema_version': 'orion.p2.manuscript-static-audit.v1',
              'tex_files_scanned': len(tex_files),
              'bibliography_entries': len(bib_keys),
              'citation_keys_used': len(cite_keys),
              'missing_citation_keys': missing_cites,
              'missing_input_files': missing_inputs,
              'empty_figure_files': empty_figures,
          }
          Path('/tmp').joinpath('p2-manuscript-audit.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print('P2_MANUSCRIPT_STATIC_AUDIT=' + json.dumps(report, sort_keys=True))
          if missing_cites or missing_inputs or empty_figures:
              raise SystemExit(1)
          PY

      - name: Compile canonical PDF
        working-directory: papers/paper-02-open-world-scientific-discovery/manuscript
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          if grep -E 'LaTeX Warning: (Citation|Reference).*(undefined)|There were undefined references|undefined citations' main.log; then
            echo 'Undefined citation/reference warning remains after latexmk convergence.' >&2
            exit 1
          fi
          pdfinfo main.pdf | tee /tmp/p2-pdfinfo.txt

      - name: Archive audit and compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: p2-manuscript-audit-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/p2-manuscript-audit.json
            /tmp/p2-pdfinfo.txt
            papers/paper-02-open-world-scientific-discovery/manuscript/main.pdf
            papers/paper-02-open-world-scientific-discovery/manuscript/main.log
