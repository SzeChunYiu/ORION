name: ORION-04 Wave 3 M4 support 11-13

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/orion-04-wave3-m4-support11-13.yml"
      - "papers/orion-04-rooted-completion-certificates/CLAIM_LEDGER.md"
      - "research/orion-rg/NONQUANTUM_M3_SUPPORT10_REPLAY_RESULTS_2026-08-24.json"
      - "research/orion-rg/x1k_c0_support10_13_rank3_u128.c"
      - "research/orion-rg/x1k_c0_support10_13_rank3_bytes.c"
      - "research/orion-rg/x1k_c0_support13_rank2_u128.c"
      - "research/orion-rg/x1k_c0_support13_rank2_bytes.c"
      - "research/orion-rg/wave3/orion04-support11-13-v1/**"
      - "tests/research/test_orion04_wave3_m4_packet.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/orion-04-wave3-m4-support11-13.yml"
      - "papers/orion-04-rooted-completion-certificates/CLAIM_LEDGER.md"
      - "research/orion-rg/NONQUANTUM_M3_SUPPORT10_REPLAY_RESULTS_2026-08-24.json"
      - "research/orion-rg/x1k_c0_support10_13_rank3_u128.c"
      - "research/orion-rg/x1k_c0_support10_13_rank3_bytes.c"
      - "research/orion-rg/x1k_c0_support13_rank2_u128.c"
      - "research/orion-rg/x1k_c0_support13_rank2_bytes.c"
      - "research/orion-rg/wave3/orion04-support11-13-v1/**"
      - "tests/research/test_orion04_wave3_m4_packet.py"

permissions:
  contents: read

jobs:
  exact-replay-and-hostile-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen checker runtime
        run: python -m pip install pytest==8.4.2 ruff==0.15.10
      - name: Rebuild the exact dual-engine receipt
        run: |
          set -euo pipefail
          packet=research/orion-rg/wave3/orion04-support11-13-v1
          python "$packet/run_replay.py" --output /tmp/ORION04_M4_RESULT.json
          cmp "$packet/RESULT.json" /tmp/ORION04_M4_RESULT.json
      - name: Run the non-generating independent checker
        run: |
          set -euo pipefail
          packet=research/orion-rg/wave3/orion04-support11-13-v1
          python "$packet/independent_checker/check_result.py" \
            --input /tmp/ORION04_M4_RESULT.json \
            --output /tmp/ORION04_M4_GENERIC_RESULT.json
          cmp "$packet/GENERIC_RESULT.json" /tmp/ORION04_M4_GENERIC_RESULT.json
      - name: Run hostile receipt controls
        run: python -m pytest -q tests/research/test_orion04_wave3_m4_packet.py
      - name: Enforce authority boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          packet = Path("research/orion-rg/wave3/orion04-support11-13-v1")
          result = json.loads((packet / "RESULT.json").read_text())
          generic = json.loads((packet / "GENERIC_RESULT.json").read_text())
          assert result["bounded_support_le13_theorem_authority"] is True
          assert result["support_14_plus_theorem_authority"] is False
          assert result["support_23_theorem_authority"] is False
          assert result["independent_external_replay_complete"] is False
          assert result["c0_31_authority"] is False
          assert result["exact_d4_authority"] is False
          assert generic["decision"] == "ACCEPT_ORION04_SUPPORT_LE13_EXCLUSION"
          assert all(generic["checks"].values())
          PY
          ! grep -F "X1K_C0_SUPPORT_BOUND_RESULTS_V1" \
            research/orion-rg/wave3/orion04-support11-13-v1/run_replay.py \
            research/orion-rg/wave3/orion04-support11-13-v1/independent_checker/check_result.py
      - name: Static checks and clean-tree proof
        run: |
          set -euo pipefail
          python -m compileall -q \
            research/orion-rg/wave3/orion04-support11-13-v1 \
            tests/research/test_orion04_wave3_m4_packet.py
          ruff check \
            research/orion-rg/wave3/orion04-support11-13-v1/run_replay.py \
            research/orion-rg/wave3/orion04-support11-13-v1/independent_checker/check_result.py \
            tests/research/test_orion04_wave3_m4_packet.py
          find research/orion-rg/wave3/orion04-support11-13-v1 tests/research \
            -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(find research/orion-rg/wave3/orion04-support11-13-v1 tests/research \
            -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit)"
          git diff --check
          git diff --exit-code
