name: p1-saturation-sha-once

on:
  push:
    branches:
      - saturation/p1-nature-skills-round-a-2026-08-19
    paths:
      - .github/workflows/p1-saturation-sha-once.yml

permissions:
  contents: write

jobs:
  bind-checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saturation/p1-nature-skills-round-a-2026-08-19
      - name: Bind bibliography checksum and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          target='papers/paper-01-recursive-epistemic-reconstruction/manuscript/bibliography.bib'
          sums='papers/paper-01-recursive-epistemic-reconstruction/journal_package/SHA256SUMS'
          new_hash="$(sha256sum "$target" | awk '{print $1}')"
          python - "$sums" "$new_hash" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          digest = sys.argv[2]
          suffix = '  manuscript/bibliography.bib'
          lines = path.read_text(encoding='utf-8').splitlines()
          matches = [i for i, line in enumerate(lines) if line.endswith(suffix)]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one bibliography checksum line, found {len(matches)}')
          lines[matches[0]] = digest + suffix
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/p1-saturation-sha-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$sums" .github/workflows/p1-saturation-sha-once.yml
          git diff --cached --check
          git commit -m 'P1 saturation: bind bibliography checksum'
          git push origin HEAD:saturation/p1-nature-skills-round-a-2026-08-19
