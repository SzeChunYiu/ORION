name: ORION V1 Open-Issue Census

on:
  pull_request:
    paths:
      - "scripts/census_orion_v1_open_issues.py"
      - "tests/unit/orion_v1/test_open_issue_census.py"
      - "research/orion-v1-freeze/**"
      - ".github/workflows/orion-v1-open-issue-census.yml"
  push:
    branches: [main]
    paths:
      - "scripts/census_orion_v1_open_issues.py"
      - "tests/unit/orion_v1/test_open_issue_census.py"
      - "research/orion-v1-freeze/**"
      - ".github/workflows/orion-v1-open-issue-census.yml"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  denominator-complete-census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run acquisition hostile/unit tests
        run: |
          python -m py_compile scripts/census_orion_v1_open_issues.py
          python -m pytest -q tests/unit/orion_v1/test_open_issue_census.py
      - name: Acquire immutable issue census
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/census_orion_v1_open_issues.py
          --repository "${{ github.repository }}"
          --output-dir orion-v1-issue-census
          --frozen-base-main ef51b7b9263a72c725dc9d2045627b934b772a92
          --acquisition-attempts 3
      - name: Independently verify the result-binding packet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("orion-v1-issue-census/complete")
          packet_path = root / "RESULT_BINDING_PACKET.json"
          if not packet_path.is_file():
              raise SystemExit("result-binding packet missing")
          packet = json.loads(packet_path.read_text(encoding="utf-8"))
          if packet.get("terminal") != "V1_OPEN_ISSUE_CENSUS_COMPLETE":
              raise SystemExit("success terminal not earned")
          expected_packet_names = {
              "FREEZE.json",
              "RAW_MANIFEST.json",
              "PRIMARY_RESULT.json",
              "DONOR_RESULT.json",
              "NEGATIVE_CONTROLS.json",
              "RESOURCE_LEDGER.json",
              "TRANSFER_RESULT.json",
              "RESULT_BINDING_PACKET.json",
          }
          actual_packet_names = {
              path.name for path in root.iterdir()
              if path.is_file() and path.name in expected_packet_names
          }
          if actual_packet_names != expected_packet_names:
              raise SystemExit(
                  f"exact eight-file packet missing: {sorted(expected_packet_names-actual_packet_names)}"
              )
          listed = packet.get("bound_files")
          if not isinstance(listed, list) or not listed:
              raise SystemExit("bound_files missing")
          paths = [row.get("path") for row in listed]
          if len(paths) != len(set(paths)):
              raise SystemExit("duplicate bound file")
          for row in listed:
              path = root / row["path"]
              raw = path.read_bytes()
              if len(raw) != row.get("bytes"):
                  raise SystemExit(f"byte drift: {path}")
              if hashlib.sha256(raw).hexdigest() != row.get("sha256"):
                  raise SystemExit(f"digest drift: {path}")
          primary = json.loads((root / "PRIMARY_RESULT.json").read_text(encoding="utf-8"))
          issues = json.loads((root / "OPEN_ISSUES.json").read_text(encoding="utf-8"))
          quantum = json.loads((root / "QUANTUM_CANDIDATES.json").read_text(encoding="utf-8"))
          if not (
              primary["open_issue_count"]
              == issues["count"]
              == packet["open_issue_count"]
          ):
              raise SystemExit("open issue denominator mismatch")
          if not (
              primary["quantum_candidate_count"]
              == quantum["count"]
              == packet["quantum_candidate_count"]
          ):
              raise SystemExit("quantum candidate denominator mismatch")
          if primary["search_denominator_stable"] is not True:
              raise SystemExit("search denominator drift")
          if primary["pagination_complete"] is not True:
              raise SystemExit("pagination incomplete")
          print(json.dumps({
              "terminal": packet["terminal"],
              "open_issue_count": packet["open_issue_count"],
              "quantum_candidate_count": packet["quantum_candidate_count"],
              "bound_files": len(listed),
          }, indent=2, sort_keys=True))
          PY
      - name: Re-run V1 control-plane checker
        run: |
          python scripts/check_orion_v1_freeze.py --json
          python -m pytest -q --runxfail tests/unit/orion_v1/test_orion_v1_freeze.py
      - name: Upload content-bound census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-v1-open-issue-census-${{ github.sha }}
          path: orion-v1-issue-census/
          if-no-files-found: error
          retention-days: 30
