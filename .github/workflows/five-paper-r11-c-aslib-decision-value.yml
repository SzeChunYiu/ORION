name: five-paper-r11-c-aslib-decision-value

on:
  push:
    branches:
      - chatgpt/r11-c-aslib-decision-value-20260826
    paths:
      - 'papers/five-paper-top-tier-r8/C/fiberguard_aslib_sat12_all_r11.py'
      - 'papers/five-paper-top-tier-r8/C/FIBERGUARD_ASLIB_DECISION_VALUE_R11.md'
      - '.github/workflows/five-paper-r11-c-aslib-decision-value.yml'
  pull_request:
    paths:
      - 'papers/five-paper-top-tier-r8/C/fiberguard_aslib_sat12_all_r11.py'
      - 'papers/five-paper-top-tier-r8/C/FIBERGUARD_ASLIB_DECISION_VALUE_R11.md'
      - '.github/workflows/five-paper-r11-c-aslib-decision-value.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-aslib-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen parser dependency
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Materialize pinned ASlib SAT12-ALL corpus
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/aslib_data"
          git init "$root"
          git -C "$root" remote add origin https://github.com/coseal/aslib_data.git
          git -C "$root" config core.sparseCheckout true
          printf '/SAT12-ALL/\n' > "$root/.git/info/sparse-checkout"
          git -C "$root" fetch --depth 1 origin 551b22beef8df17de59286b4822ef720e0aa4d6f
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = '551b22beef8df17de59286b4822ef720e0aa4d6f'

      - name: Run exact audit twice
        shell: bash
        run: |
          set -euo pipefail
          script='papers/five-paper-top-tier-r8/C/fiberguard_aslib_sat12_all_r11.py'
          root="$RUNNER_TEMP/aslib_data"
          python "$script" --aslib-root "$root" --output "$RUNNER_TEMP/result-a.json" | tee "$RUNNER_TEMP/terminal.txt"
          python "$script" --aslib-root "$root" --output "$RUNNER_TEMP/result-b.json"
          cmp "$RUNNER_TEMP/result-a.json" "$RUNNER_TEMP/result-b.json"
          grep -q '^FIBERGUARD_ASLIB_SAT12_ALL_PASS ' "$RUNNER_TEMP/terminal.txt"

      - name: Verify result authority and controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'result-a.json'
          r = json.loads(p.read_text())
          assert r['schema'] == 'ORION.FiberGuard.ASlibSAT12ALL.R11.v1'
          assert r['upstream']['commit'] == '551b22beef8df17de59286b4822ef720e0aa4d6f'
          assert r['authority']['corpus_complete_for_pinned_ASlib_scenario'] is True
          assert r['authority']['unseen_instance_generalization'] is False
          assert r['authority']['grants_journal_authority'] is False
          assert all(r['controls'].values())
          print('ASLIB_R11_RESULT_VERIFIED')
          PY

      - name: Stage immutable result artifact
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/fiberguard-aslib-r11"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/result-a.json" "$out/FIBERGUARD_ASLIB_SAT12_ALL_R11_RESULTS.json"
          cp "$RUNNER_TEMP/terminal.txt" "$out/TERMINAL.txt"
          sha256sum "$out"/* > "$out/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: fiberguard-aslib-sat12-all-r11
          path: ${{ runner.temp }}/fiberguard-aslib-r11/
          if-no-files-found: error
          retention-days: 30
