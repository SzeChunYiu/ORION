name: q4-tmlr-package

on:
  pull_request:
    paths:
      - 'papers/Q-paper-04-typed-state/**'
      - 'papers/Q_QG_CITATION_INSERTION_MAP_V1.json'
      - 'papers/Q_QG_VERIFIED_CORE_REFERENCES_V1.bib'
      - 'papers/build_q_qg_cited_masters.py'
      - '.github/workflows/q4-tmlr-package.yml'
  push:
    branches:
      - 'codex/q-qg-nature-skills-publication-closure-20260821'
    paths:
      - 'papers/Q-paper-04-typed-state/**'
      - 'papers/Q_QG_CITATION_INSERTION_MAP_V1.json'
      - 'papers/Q_QG_VERIFIED_CORE_REFERENCES_V1.bib'
      - 'papers/build_q_qg_cited_masters.py'
      - '.github/workflows/q4-tmlr-package.yml'

permissions:
  contents: read

jobs:
  build-q4-tmlr:
    runs-on: ubuntu-24.04
    env:
      TMLR_STYLE_COMMIT: 7bf90efe3a0debbba703c05c43f3ff7e4d4a2992
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            lmodern pandoc texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            poppler-utils curl zip
      - name: Re-run Q/QG publication integrity gates
        run: |
          python papers/check_q_qg_publication.py
          python papers/check_q_qg_science_manifests.py
      - name: Generate cited Q4 master
        run: python papers/build_q_qg_cited_masters.py --clean
      - name: Prepare Q4 TMLR Markdown and source directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/q4_tmlr/source build/q4_tmlr/rendered
          python papers/Q-paper-04-typed-state/submission_tmlr/build_tmlr_source.py \
            --cited-master build/q_qg_cited/Q4/MANUSCRIPT_CITED.md \
            --out build/q4_tmlr/q4_tmlr.md
          cp build/q_qg_cited/Q4/references.bib build/q4_tmlr/source/references.bib
          cp papers/Q-paper-04-typed-state/submission_tmlr/tmlr_pandoc_template.tex \
            build/q4_tmlr/source/pandoc_template.tex
      - name: Fetch exact official TMLR style files
        shell: bash
        working-directory: build/q4_tmlr/source
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/JmlrOrg/tmlr-style-file/${TMLR_STYLE_COMMIT}"
          curl --fail --location --silent --show-error "${base}/tmlr.sty" -o tmlr.sty
          curl --fail --location --silent --show-error "${base}/tmlr.bst" -o tmlr.bst
          curl --fail --location --silent --show-error "${base}/fancyhdr.sty" -o fancyhdr.sty
          test -s tmlr.sty && test -s tmlr.bst && test -s fancyhdr.sty
          sha256sum tmlr.sty tmlr.bst fancyhdr.sty > style_sha256.txt
          printf '%s\n' "${TMLR_STYLE_COMMIT}" > style_commit.txt
      - name: Generate anonymous TMLR LaTeX from cited scientific master
        shell: bash
        run: |
          set -euo pipefail
          pandoc build/q4_tmlr/q4_tmlr.md \
            --from=markdown+citations \
            --to=latex \
            --natbib \
            --template=build/q4_tmlr/source/pandoc_template.tex \
            -o build/q4_tmlr/source/main.tex
          grep -Fq '\usepackage{tmlr}' build/q4_tmlr/source/main.tex
          grep -Fq '\author{Anonymous Authors}' build/q4_tmlr/source/main.tex
          grep -Eq '\\cite[pt]?\{' build/q4_tmlr/source/main.tex
          if grep -Eiq 'Sze[[:space:]-]*Chun|SzeChunYiu|Billy[[:space:]]+Yiu' \
              build/q4_tmlr/source/main.tex build/q4_tmlr/source/references.bib; then
            echo 'Q4_TMLR_SOURCE_ANONYMITY=FAIL'
            exit 1
          fi
          echo 'Q4_TMLR_SOURCE_ANONYMITY=PASS'
      - name: Build exact TMLR review PDF
        shell: bash
        working-directory: build/q4_tmlr/source
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
      - name: Audit anonymity, references, PDF structure and page rendering
        shell: bash
        run: |
          set -euo pipefail
          pdfinfo build/q4_tmlr/source/main.pdf > build/q4_tmlr/pdfinfo.txt
          pdffonts build/q4_tmlr/source/main.pdf > build/q4_tmlr/pdffonts.txt
          pdftotext build/q4_tmlr/source/main.pdf build/q4_tmlr/pdf.txt
          if grep -Eiq 'Sze[[:space:]-]*Chun|SzeChunYiu|Billy[[:space:]]+Yiu' \
              build/q4_tmlr/pdf.txt build/q4_tmlr/pdfinfo.txt; then
            echo 'Q4_TMLR_PDF_ANONYMITY=FAIL'
            exit 1
          fi
          grep -Fq 'Anonymous' build/q4_tmlr/pdf.txt
          grep -Fq 'References' build/q4_tmlr/pdf.txt
          if grep -Eq '\[@[A-Za-z0-9_:-]+' build/q4_tmlr/pdf.txt; then
            echo 'Q4_TMLR_UNRESOLVED_CITATION_TOKEN=FAIL'
            exit 1
          fi
          pdftoppm -png -r 144 build/q4_tmlr/source/main.pdf build/q4_tmlr/rendered/page
          pages="$(find build/q4_tmlr/rendered -name 'page-*.png' | wc -l)"
          test "${pages}" -gt 0
          sha256sum build/q4_tmlr/source/main.pdf > build/q4_tmlr/pdf_sha256.txt
          printf 'Q4_TMLR_PDF_ANONYMITY=PASS\nQ4_TMLR_RENDERED_PAGES=%s\n' "${pages}"
      - name: Build source archive
        shell: bash
        working-directory: build/q4_tmlr
        run: |
          set -euo pipefail
          cp q4_tmlr.md source/SCIENTIFIC_MASTER_CITED.md
          zip -qr q4-tmlr-review-source.zip source
          sha256sum q4-tmlr-review-source.zip > source_zip_sha256.txt
      - name: Archive Q4 TMLR review package
        uses: actions/upload-artifact@v4
        with:
          name: q4-tmlr-review-package
          path: |
            build/q4_tmlr/source/main.pdf
            build/q4_tmlr/q4-tmlr-review-source.zip
            build/q4_tmlr/pdfinfo.txt
            build/q4_tmlr/pdffonts.txt
            build/q4_tmlr/pdf_sha256.txt
            build/q4_tmlr/source_zip_sha256.txt
            build/q4_tmlr/source/style_sha256.txt
            build/q4_tmlr/source/style_commit.txt
            build/q4_tmlr/rendered
          if-no-files-found: error
          retention-days: 30
