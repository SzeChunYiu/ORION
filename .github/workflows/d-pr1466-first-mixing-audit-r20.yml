name: d-pr1466-first-mixing-audit-r20
on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths:
      - 'research/five-paper-top-tier-r20/audit_d_pr1466.py'
      - '.github/workflows/d-pr1466-first-mixing-audit-r20.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  theorem-and-domain-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch PR 1466 and audit twice
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/1466" > "$RUNNER_TEMP/pr.json"
          base="$(jq -r .base.sha "$RUNNER_TEMP/pr.json")"; head="$(jq -r .head.sha "$RUNNER_TEMP/pr.json")"
          git fetch --no-tags origin "$base" "$head"
          git worktree add --detach "$RUNNER_TEMP/pr1466" "$head"
          script='research/five-paper-top-tier-r20/audit_d_pr1466.py'
          python -m py_compile "$script"
          for suffix in a b; do
            python "$script" --repo "$RUNNER_TEMP/pr1466" --base "$base" --head "$head" --output "$RUNNER_TEMP/audit-$suffix.json" | tee "$RUNNER_TEMP/terminal-$suffix.txt"
          done
          cmp "$RUNNER_TEMP/audit-a.json" "$RUNNER_TEMP/audit-b.json"
          cmp "$RUNNER_TEMP/terminal-a.txt" "$RUNNER_TEMP/terminal-b.txt"
      - name: Preserve domain and journal ceilings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'audit-a.json').read_text())
          assert r['schema']=='ORION.D.PR1466FirstMixingAudit.R20.v1'
          assert r['authority']['agentgateway_native_merge_vulnerability'] is False
          assert r['authority']['production_safety'] is False
          assert r['authority']['novelty'] is False
          assert r['authority']['journal_authority'] is False
          if r['terminal']=='D_PR1466_FIRST_MIXING_THEOREM_PASS__EXTERNAL_DOMAIN_OPEN':
              assert r['authority']['analytic_first_mixing_theorem'] is True
          else:
              assert r['terminal']=='D_PR1466_THEOREM_AUTHORITY_NOT_ESTABLISHED'
          print('D_PR1466_AUTHORITY_CLASSIFIED',r['terminal'])
          PY
      - run: git diff --check
      - name: Stage audit
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/d-pr1466-audit"; mkdir -p "$out"
          cp "$RUNNER_TEMP/pr.json" "$out/PR1466.json"
          cp "$RUNNER_TEMP/audit-a.json" "$out/D_PR1466_AUDIT.json"
          cp "$RUNNER_TEMP/terminal-a.txt" "$out/TERMINAL.txt"
          sha256sum "$out"/* > "$out/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: d-pr1466-first-mixing-audit
          path: ${{ runner.temp }}/d-pr1466-audit/
          if-no-files-found: error
          retention-days: 30
