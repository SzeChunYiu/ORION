name: p4-saturation-package-once

on:
  push:
    branches: [saturation/p4-nature-skills-round-a-2026-08-19]
    paths: ['.github/workflows/p4-saturation-package-once.yml']

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saturation/p4-nature-skills-round-a-2026-08-19
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ORION
        run: python -m pip install -e '.[dev,candidates]'
      - name: Insert closest provenance-authorization donor
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('papers/paper-04-verified-scientific-discovery/manuscript')
          p=root/'main.tex'; s=p.read_text()
          marker=r'''\paragraph{Auditability, citation fidelity, and influence.}'''
          para=r'''\paragraph{Provenance-sensitive authorization.}
A current controlled audit makes the authorization distinction especially direct: evidence can be relevant to an agent decision without being authorized to determine that decision, and target-specific tests can hold the task and proposition fixed while varying only source authority~\citep{provsen2026}. P4 therefore does not claim the relevance-versus-authorized-evidence distinction as new. Its empirical residual is the protected, non-compensatory conjunction of content, ownership, support, checker, influence, evaluator, access and contamination prerequisites.

'''
          if 'provsen2026' not in s:
              if marker not in s: raise SystemExit('P4 insertion marker missing')
              p.write_text(s.replace(marker,para+marker))
          bib=root/'bibliography.bib'; b=bib.read_text()
          if 'provsen2026' not in b:
              b += r'''

@article{provsen2026,
  author={Liao, Junchi},
  title={Auditing Provenance Sensitivity in LLM Agent Action Selection},
  journal={arXiv preprint arXiv:2607.20827},
  year={2026},
  eprint={2607.20827},
  archivePrefix={arXiv},
  url={https://arxiv.org/abs/2607.20827}
}
'''
              bib.write_text(b)
          PY
      - name: Run P4 result and headroom guards
        run: pytest -q tests/unit/p4/test_p4_metric_headroom.py tests/unit/p4/test_p4_publication_v2.py
      - name: Install TeX/render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra librsvg2-bin poppler-utils
      - name: Regenerate immutable-result tables/figures and compile
        working-directory: papers/paper-04-verified-scientific-discovery
        run: |
          python figures/generate_figures.py
          for stem in p4_2_false_promotion p4_3_coverage_frontier p4_4_detection_heatmap p4_5_attribution_vs_support p4_6_cost_tradeoff; do rsvg-convert -w 1440 figures/${stem}.svg -o figures/${stem}.png; done
          cd manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          if grep -Eqi 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log; then exit 1; fi
          if grep -Eq 'Overfull \\hbox|Overfull \\vbox' main.log; then echo 'Overfull box in P4 saturation PDF' >&2; grep -E 'Overfull \\hbox|Overfull \\vbox' main.log >&2; exit 1; fi
          pdfinfo main.pdf > P4_SATURATION_PDFINFO.txt
      - name: Rebind exact P4 journal package
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cp papers/paper-04-verified-scientific-discovery/manuscript/main.pdf papers/paper-04-verified-scientific-discovery/journal_package/manuscript.pdf
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('papers/paper-04-verified-scientific-discovery')
          p=root/'journal_package/MANIFEST.json'; m=json.loads(p.read_text())
          m['audit_subject_revision']=os.environ['SOURCE_SHA']; m['audit_date']='2026-08-19'
          p.write_text(json.dumps(m,indent=2)+'\n')
          (root/'journal_package/CLAIM_PDF_AUDIT.md').write_text(f'''# ORION-P4 saturation claim / PDF audit\n\nAudit source: `{os.environ['SOURCE_SHA']}`.\n\n- Protected V2 H1 false-promotion result and H2 clean coverage are unchanged.\n- H3 remains `NOT_SUPPORTED`/non-discriminating on the saturated correct-`CANNOT_CHECK` axis; it is not evidence of equality.\n- Provenance-sensitive authorization is explicitly donor-credited; P4 does not claim relevance-versus-authorized-evidence as new.\n- Comparator arms remain frozen mechanism reimplementations, not donor authors' original systems.\n- The exact saturated manuscript rebuilt with no unresolved citation/reference or overfull-box failures.\n- The protected custody and non-compensatory authority boundary is unchanged.\n''')
          PY
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'research/paper-programme-v1/journal_package')
          import check_journal_package as c
          root=Path('papers/paper-04-verified-scientific-discovery')
          m=c.load_manifest(root/'journal_package')
          c.write_sha256sums(root,c.hashed_paths(m))
          PY
          python research/paper-programme-v1/journal_package/check_journal_package.py --root .
      - uses: actions/upload-artifact@v4
        with:
          name: p4-saturation-review-${{ github.sha }}
          path: |
            papers/paper-04-verified-scientific-discovery/manuscript/main.pdf
            papers/paper-04-verified-scientific-discovery/manuscript/main.log
            papers/paper-04-verified-scientific-discovery/manuscript/P4_SATURATION_PDFINFO.txt
            papers/paper-04-verified-scientific-discovery/journal_package/manuscript.pdf
          if-no-files-found: error
      - name: Commit exact saturation package and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p4-saturation-package-once.yml
          git add papers/paper-04-verified-scientific-discovery/manuscript/main.tex \
                  papers/paper-04-verified-scientific-discovery/manuscript/bibliography.bib \
                  papers/paper-04-verified-scientific-discovery/journal_package/MANIFEST.json \
                  papers/paper-04-verified-scientific-discovery/journal_package/CLAIM_PDF_AUDIT.md \
                  papers/paper-04-verified-scientific-discovery/journal_package/manuscript.pdf \
                  papers/paper-04-verified-scientific-discovery/journal_package/SHA256SUMS
          git commit -m 'papers(p4): cite provenance donor and rebind saturation package'
          git push origin HEAD:saturation/p4-nature-skills-round-a-2026-08-19
