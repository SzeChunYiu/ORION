name: qg1-prx-preflight

on:
  pull_request:
    paths:
      - 'papers/QG-paper-01-compilation-regime-geometry/**'
      - 'papers/Q_QG_CITATION_INSERTION_MAP_V1.json'
      - 'papers/Q_QG_VERIFIED_CORE_REFERENCES_V1.bib'
      - 'papers/build_q_qg_cited_masters.py'
      - '.github/workflows/qg1-prx-preflight.yml'
  push:
    branches:
      - 'codex/q-qg-nature-skills-publication-closure-20260821'
    paths:
      - 'papers/QG-paper-01-compilation-regime-geometry/**'
      - 'papers/Q_QG_CITATION_INSERTION_MAP_V1.json'
      - 'papers/Q_QG_VERIFIED_CORE_REFERENCES_V1.bib'
      - 'papers/build_q_qg_cited_masters.py'
      - '.github/workflows/qg1-prx-preflight.yml'

permissions:
  contents: read

jobs:
  build-qg1-prx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pandoc texlive-latex-recommended texlive-latex-extra texlive-publishers \
            texlive-fonts-recommended poppler-utils zip
      - name: Re-run Q/QG publication integrity gates
        run: |
          python papers/check_q_qg_publication.py
          python papers/check_q_qg_science_manifests.py
      - name: Generate cited scientific masters
        run: python papers/build_q_qg_cited_masters.py --clean
      - name: Prepare PRX Markdown and popular summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qg1_prx/source build/qg1_prx/rendered
          python papers/QG-paper-01-compilation-regime-geometry/submission_prx/build_prx_source.py \
            --cited-master build/q_qg_cited/QG1/MANUSCRIPT_CITED.md \
            --popular-summary papers/QG-paper-01-compilation-regime-geometry/submission_prx/POPULAR_SUMMARY.md \
            --out build/qg1_prx/prepared.md
          cp build/q_qg_cited/QG1/references.bib build/qg1_prx/source/references.bib
          cp papers/QG-paper-01-compilation-regime-geometry/submission_prx/prx_pandoc_template.tex \
            build/qg1_prx/source/pandoc_template.tex
          cp papers/QG-paper-01-compilation-regime-geometry/submission_prx/POPULAR_SUMMARY.md \
            build/qg1_prx/source/POPULAR_SUMMARY.md
      - name: Generate REVTeX source
        shell: bash
        run: |
          set -euo pipefail
          pandoc build/qg1_prx/prepared.md \
            --from=markdown+citations \
            --to=latex \
            --natbib \
            --template=build/qg1_prx/source/pandoc_template.tex \
            -o build/qg1_prx/source/main.tex
          grep -Fq '\documentclass[aps,prx,twocolumn,superscriptaddress]{revtex4-2}' \
            build/qg1_prx/source/main.tex
          grep -Fq 'AUTHOR METADATA REQUIRED BEFORE SUBMISSION' build/qg1_prx/source/main.tex
          grep -Eq '\\cite[pt]?\{' build/qg1_prx/source/main.tex
      - name: Build PRX preflight PDF
        shell: bash
        working-directory: build/qg1_prx/source
        run: |
          set -euo pipefail
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
      - name: Audit PDF and popular-summary fit
        shell: bash
        run: |
          set -euo pipefail
          pdfinfo build/qg1_prx/source/main.pdf > build/qg1_prx/pdfinfo.txt
          pdftotext build/qg1_prx/source/main.pdf build/qg1_prx/pdf.txt
          grep -Fq 'AUTHOR METADATA REQUIRED BEFORE SUBMISSION' build/qg1_prx/pdf.txt
          grep -Fq 'References' build/qg1_prx/pdf.txt
          if grep -Eq '\[@[A-Za-z0-9_:-]+' build/qg1_prx/pdf.txt; then
            echo 'QG1_PRX_UNRESOLVED_CITATION_TOKEN=FAIL'
            exit 1
          fi
          if grep -Eiq 'universal phase theory|proves all compilers|physical quantum advantage' \
              build/qg1_prx/source/POPULAR_SUMMARY.md; then
            echo 'QG1_PRX_POPULAR_SUMMARY_OVERCLAIM=FAIL'
            exit 1
          fi
          pdftoppm -png -r 144 build/qg1_prx/source/main.pdf build/qg1_prx/rendered/page
          sha256sum build/qg1_prx/source/main.pdf > build/qg1_prx/pdf_sha256.txt
      - name: Build source archive
        shell: bash
        working-directory: build/qg1_prx
        run: |
          set -euo pipefail
          cp prepared.md source/SCIENTIFIC_MASTER_CITED.md
          zip -qr qg1-prx-preflight-source.zip source
          sha256sum qg1-prx-preflight-source.zip > source_zip_sha256.txt
      - name: Archive QG1 PRX preflight package
        uses: actions/upload-artifact@v4
        with:
          name: qg1-prx-preflight-package
          path: |
            build/qg1_prx/source/main.pdf
            build/qg1_prx/qg1-prx-preflight-source.zip
            build/qg1_prx/source/POPULAR_SUMMARY.md
            build/qg1_prx/pdfinfo.txt
            build/qg1_prx/pdf_sha256.txt
            build/qg1_prx/source_zip_sha256.txt
            build/qg1_prx/rendered
          if-no-files-found: error
          retention-days: 30
