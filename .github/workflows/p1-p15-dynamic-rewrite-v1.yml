name: P1-P15 Dynamic Epistemic Rewrite
on:
  push:
    paths:
      - papers/P1_P15_TOP_TIER_*
      - papers/paper-*/TOP_TIER_DYNAMIC_EPISTEMIC_MANUSCRIPT_V1.md
      - research/orion-epistemic-state-v1/**
      - src/orion/epistemic_state_v1/**
      - tests/unit/epistemic_state_v1/**
      - scripts/check_p1_p15_dynamic_rewrite_v1.py
      - .github/workflows/p1-p15-dynamic-rewrite-v1.yml
  pull_request:
    paths:
      - papers/P1_P15_TOP_TIER_*
      - papers/paper-*/TOP_TIER_DYNAMIC_EPISTEMIC_MANUSCRIPT_V1.md
      - research/orion-epistemic-state-v1/**
      - src/orion/epistemic_state_v1/**
      - tests/unit/epistemic_state_v1/**
      - scripts/check_p1_p15_dynamic_rewrite_v1.py
      - .github/workflows/p1-p15-dynamic-rewrite-v1.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pytest
      - run: python scripts/check_p1_p15_dynamic_rewrite_v1.py
      - run: PYTHONPATH=src python -m pytest -q tests/unit/epistemic_state_v1/test_model.py
      - run: python -m compileall -q src/orion/epistemic_state_v1 scripts/check_p1_p15_dynamic_rewrite_v1.py
