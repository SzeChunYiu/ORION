name: ORION-paper exact mirror bridge 2026-08-31

on:
  push:
    branches:
      - ops/orion-paper-exact-mirror-bridge-20260831

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact ORION source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assert source anchor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e7cadc870a783e49bd54df1b2f0d4a95a0a02908"

      - name: Clone ORION-paper target branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch publication/orion-04-05-06-exact-mirror-20260831 \
            "https://x-access-token:${GH_TOKEN}@github.com/SzeChunYiu/ORION-paper.git" target

      - name: Exact mirror paper trees and preserve declared overlays
        shell: bash
        run: |
          set -euo pipefail
          for paper in \
            orion-04-rooted-completion-certificates \
            orion-05-tare-expressivity \
            orion-06-recursive-recovery
          do
            src="papers/${paper}"
            dst="target/v1-papers/${paper}"
            keep="$(mktemp -d)"
            for item in PROVENANCE.md MIRROR_RECEIPT_2026-08-31.md code; do
              if [ -e "${dst}/${item}" ]; then cp -a "${dst}/${item}" "${keep}/"; fi
            done
            rm -rf "${dst}"
            mkdir -p "${dst}"
            rsync -a "${src}/" "${dst}/"
            for item in PROVENANCE.md MIRROR_RECEIPT_2026-08-31.md code; do
              if [ -e "${keep}/${item}" ]; then cp -a "${keep}/${item}" "${dst}/"; fi
            done
            rm -rf "${keep}"
            cat > "${dst}/MIRROR_RECEIPT_2026-08-31.md" <<EOF
# Exact mirror receipt — ${paper}

Source repository: \`SzeChunYiu/ORION\`
Source commit: \`e7cadc870a783e49bd54df1b2f0d4a95a0a02908\`
Source path: \`papers/${paper}/\`
Target path: \`v1-papers/${paper}/\`

The source tree is mirrored byte-for-byte except the declared target-only overlays \`PROVENANCE.md\`, \`MIRROR_RECEIPT_2026-08-31.md\`, and \`code/\`.
EOF
            delta="$(rsync -ani --delete \
              --exclude=PROVENANCE.md \
              --exclude=MIRROR_RECEIPT_2026-08-31.md \
              --exclude=code/ \
              "${src}/" "${dst}/")"
            test -z "${delta}"
          done

      - name: Verify deterministic submission package hashes
        shell: bash
        run: |
          set -euo pipefail
          (cd target/v1-papers/orion-04-rooted-completion-certificates/submission/final-20260831 && sha256sum -c SHA256SUMS)
          (cd target/v1-papers/orion-05-tare-expressivity/submission/final-20260831 && sha256sum -c SHA256SUMS)
          (cd target/v1-papers/orion-06-recursive-recovery/submission_tmlr && sha256sum -c SHA256SUMS)

      - name: Commit exact mirror to existing ORION-paper PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v1-papers/orion-04-rooted-completion-certificates \
                  v1-papers/orion-05-tare-expressivity \
                  v1-papers/orion-06-recursive-recovery
          git diff --cached --quiet && exit 0
          git commit -m "papers: exact-mirror ORION-04/05/06 from e7cadc87"
          git push origin HEAD:publication/orion-04-05-06-exact-mirror-20260831
