name: p9-d1-method-transfer

on:
  pull_request:
    paths:
      - 'src/orion/study/p9/d1*.py'
      - 'research/extensions/p9-structured-neural/D1_*'
      - 'research/extensions/p9-structured-neural/run_d1.py'
      - 'development/p9-d1-method-transfer/**'
      - 'tests/test_p9_d1.py'
      - '.github/workflows/p9-d1-experiment.yml'
  workflow_dispatch:

concurrency:
  group: p9-d1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  d1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,candidates]'
      - name: D1 focused tests
        run: pytest -q tests/test_p9_d1.py
      - name: Execute frozen D1 protocol
        run: >-
          python research/extensions/p9-structured-neural/run_d1.py
          --output "$RUNNER_TEMP/d1-results.json"
          > "$RUNNER_TEMP/d1-full-output.log"
      - name: Print compact D1 result
        env:
          RESULT: ${{ runner.temp }}/d1-results.json
        run: |
          python - <<'PY'
          import json, os
          result = json.load(open(os.environ['RESULT'], encoding='utf-8'))
          print('P9_D1_TERMINAL=' + result['terminal'])
          print('P9_D1_RESULT_DIGEST=' + result['result_digest'])
          print('P9_D1_DATASET_DIGEST=' + result['dataset_manifest_digest'])
          print('P9_D1_TYPED_MINUS_TRANSCRIPT=' + str(result['typed_minus_transcript']))
          print('P9_D1_TYPED_MINUS_SERIALIZED=' + str(result['typed_minus_same_information_serialized']))
          for name, arm in result['results'].items():
              print(
                  'P9_D1_ARM '
                  f"arm={name} model={arm['selected']['config_id']} "
                  f"accuracy={arm['test']['accuracy']:.6f} "
                  f"macro_f1={arm['test']['macro_f1']:.6f} "
                  f"double={arm['test']['double_corruption_accuracy']} "
                  f"unresolved={arm['test']['unresolved_accuracy']}"
              )
          PY
      - name: Upload D1 result
        uses: actions/upload-artifact@v4
        with:
          name: p9-d1-results-${{ github.sha }}
          path: ${{ runner.temp }}/d1-results.json
          if-no-files-found: error
