name: one-shot-force-correct-r20-no-free-extension
on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths: ['.github/workflows/one-shot-force-correct-r20-no-free-extension.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: chatgpt/orion-02-r18-null-current-main-20260827}
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('papers/orion-02-fiberguard-finite-fibre/MANUSCRIPT_R20.tex')
          text=path.read_text()
          replacement=r'''\begin{theorem}[No-free extension]\label{thm:nofree}
          Let $S$ be any finite observed fibre with $|\A|\ge2$, and suppose no constraint is imposed on costs at unseen states sharing the same representation value.  For every $M>0$, there is a finite extension that agrees with every observed cost on $S$ but whose extended fibre has deterministic regret at least $M$.
          \end{theorem}
          \begin{proof}
          Keep every observed cost unchanged.  For each action $a\in\A$, add one unseen state $x_a$ with $C(a,x_a)=0$ and $C(b,x_a)=M$ for every $b\ne a$.  At every new state the oracle cost is zero.  Fix any common action $b$.  Because $|\A|\ge2$, choose $a\ne b$; then $R(b,x_a)=M$.  Hence every common action has worst-state regret at least $M$, so the extended fibre has deterministic regret at least $M$ while all observed bytes remain unchanged.
          \end{proof}'''.replace('          ','')
          pattern=r'\\begin\{theorem\}\[No-free extension\]\\label\{thm:nofree\}.*?\\end\{proof\}'
          updated,count=re.subn(pattern,lambda _:replacement,text,count=1,flags=re.DOTALL)
          if count!=1: raise SystemExit(f'expected one no-free theorem block, found {count}')
          path.write_text(updated)
          PY
          grep -q 'For each action.*add one unseen state' papers/orion-02-fiberguard-finite-fibre/MANUSCRIPT_R20.tex
          rm .github/workflows/one-shot-force-correct-r20-no-free-extension.yml
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/orion-02-fiberguard-finite-fibre/MANUSCRIPT_R20.tex .github/workflows/one-shot-force-correct-r20-no-free-extension.yml
          git commit -m 'fix(ORION-02): enforce exact no-free-extension construction'
          git push origin HEAD:refs/heads/chatgpt/orion-02-r18-null-current-main-20260827
