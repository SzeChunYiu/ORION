name: one-shot-integrate-orion-02-r28-rust-story
on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths: ['.github/workflows/one-shot-integrate-orion-02-r28-rust-story.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: chatgpt/orion-02-r18-null-current-main-20260827}
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          tex=Path('papers/orion-02-fiberguard-finite-fibre/MANUSCRIPT_R20.tex')
          text=tex.read_text()
          old='''The repository binds protocols, source revisions, exact result digests, negative terminals, and authority ceilings.  The complete R18 recovery result is durably retained; the R19 replacement theorem has a byte-stable verifier; the neighbourhood refutation was executed prospectively on LUNARC and is undergoing cross-host replay.  Same-owner CI and finite re-execution are implementation corroboration, not external peer review.'''
          new='''The repository binds protocols, source revisions, exact result digests, negative terminals, and authority ceilings.  The complete R18 recovery result is durably retained; the R19 replacement theorem has a byte-stable verifier; and a standard-library-only Rust implementation independently parses the R18 and R19 receipts and recomputes theorem-critical finite controls without importing the ORION Python machinery.  The neighbourhood refutation was executed prospectively on LUNARC and is undergoing cross-host replay.  Same-owner CI, cross-language reconstruction, and finite re-execution are implementation corroboration, not external peer review.'''
          if old not in text: raise SystemExit('manuscript reproducibility paragraph not found')
          tex.write_text(text.replace(old,new))

          story=Path('papers/orion-02-fiberguard-finite-fibre/CURRENT_STORY_R20.md')
          content=story.read_text()
          anchor='''## 5. What the paper claims'''
          insertion='''## 4.1 Cross-language implementation control\n\nA standard-library-only Rust checker now parses the durable R18 and R19 JSON subjects directly and recomputes the no-free-extension, fallback-alignment, witness-compression, lower-image, joint-marginal, route-coarsening, and acquisition-timing controls. It shares repository ownership but not language, parser, or ORION Python implementation. Its authority is same-owner structural corroboration, not external independence.\n\n'''
          if insertion not in content:
              if anchor not in content: raise SystemExit('story insertion anchor not found')
              story.write_text(content.replace(anchor,insertion+anchor))
          PY
          rm .github/workflows/one-shot-integrate-orion-02-r28-rust-story.yml
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/orion-02-fiberguard-finite-fibre/MANUSCRIPT_R20.tex papers/orion-02-fiberguard-finite-fibre/CURRENT_STORY_R20.md .github/workflows/one-shot-integrate-orion-02-r28-rust-story.yml
          git commit -m 'manuscript(ORION-02): integrate Rust cross-language corroboration'
          git push origin HEAD:refs/heads/chatgpt/orion-02-r18-null-current-main-20260827
