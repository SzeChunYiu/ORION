name: orion-02-r20-visual-pdf-audit

on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths:
      - 'papers/orion-02-fiberguard-finite-fibre/MANUSCRIPT_R20.tex'
      - 'papers/orion-02-fiberguard-finite-fibre/REFERENCES_R20.bib'
      - '.github/workflows/orion-02-r20-visual-pdf-audit.yml'
  pull_request:
    paths:
      - 'papers/orion-02-fiberguard-finite-fibre/MANUSCRIPT_R20.tex'
      - 'papers/orion-02-fiberguard-finite-fibre/REFERENCES_R20.bib'
      - '.github/workflows/orion-02-r20-visual-pdf-audit.yml'
  workflow_dispatch:

permissions: {contents: read}

jobs:
  compile-render-inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install frozen rendering surface
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends latexmk poppler-utils texlive-bibtex-extra texlive-fonts-recommended texlive-latex-base texlive-latex-extra texlive-latex-recommended
          python -m pip install 'Pillow==10.4.0'
      - name: Compile twice and require byte identity
        shell: bash
        run: |
          set -euo pipefail
          root='papers/orion-02-fiberguard-finite-fibre'
          cd "$root"
          latexmk -C MANUSCRIPT_R20.tex
          SOURCE_DATE_EPOCH=0 FORCE_SOURCE_DATE=1 latexmk -pdf -interaction=nonstopmode -halt-on-error MANUSCRIPT_R20.tex
          cp MANUSCRIPT_R20.pdf "$RUNNER_TEMP/manuscript-a.pdf"
          latexmk -C MANUSCRIPT_R20.tex
          SOURCE_DATE_EPOCH=0 FORCE_SOURCE_DATE=1 latexmk -pdf -interaction=nonstopmode -halt-on-error MANUSCRIPT_R20.tex
          cp MANUSCRIPT_R20.pdf "$RUNNER_TEMP/manuscript-b.pdf"
          cmp "$RUNNER_TEMP/manuscript-a.pdf" "$RUNNER_TEMP/manuscript-b.pdf"
          pdfinfo "$RUNNER_TEMP/manuscript-a.pdf" | tee "$RUNNER_TEMP/pdfinfo.txt"
          pdftotext "$RUNNER_TEMP/manuscript-a.pdf" "$RUNNER_TEMP/manuscript.txt"
          ! grep -Eq 'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references' MANUSCRIPT_R20.log
      - name: Render every page and audit visible content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages"
          pdftoppm -png -r 120 "$RUNNER_TEMP/manuscript-a.pdf" "$RUNNER_TEMP/pages/page" >/dev/null
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops, ImageDraw
          import json, os, statistics
          root=Path(os.environ['RUNNER_TEMP'])
          pages=sorted((root/'pages').glob('page-*.png'))
          if not pages: raise SystemExit('no rendered manuscript pages')
          rows=[];thumbs=[]
          for index,path in enumerate(pages,1):
              image=Image.open(path).convert('L')
              background=Image.new('L',image.size,255)
              diff=ImageChops.difference(image,background)
              bbox=diff.point(lambda value: 255 if value>8 else 0).getbbox()
              if bbox is None: raise SystemExit(f'blank page {index}')
              left,top,right,bottom=bbox
              margin=min(left,top,image.width-right,image.height-bottom)
              pixels=list(image.resize((max(1,image.width//8),max(1,image.height//8))).getdata())
              standard_deviation=statistics.pstdev(pixels)
              if standard_deviation<3.0: raise SystemExit(f'near-blank page {index}: {standard_deviation}')
              if left<8 or top<8 or right>image.width-8 or bottom>image.height-8: raise SystemExit(f'content clipping risk page {index}: {bbox}')
              rows.append({'page':index,'width':image.width,'height':image.height,'content_bbox':[left,top,right,bottom],'minimum_margin_pixels':margin,'grayscale_stddev':standard_deviation})
              thumb=Image.open(path).convert('RGB');thumb.thumbnail((320,420));thumbs.append(thumb)
          columns=4;cell_w=340;cell_h=450;rows_count=(len(thumbs)+columns-1)//columns
          sheet=Image.new('RGB',(columns*cell_w,rows_count*cell_h),'white');draw=ImageDraw.Draw(sheet)
          for offset,thumb in enumerate(thumbs):
              x=(offset%columns)*cell_w+(cell_w-thumb.width)//2;y=(offset//columns)*cell_h+24
              sheet.paste(thumb,(x,y));draw.text(((offset%columns)*cell_w+10,(offset//columns)*cell_h+5),f'Page {offset+1}',fill='black')
          sheet.save(root/'CONTACT_SHEET.png')
          receipt={'schema':'ORION.ORION02.R20VisualPdfAudit.v1','page_count':len(pages),'pages':rows,'first_page':1,'middle_page':(len(pages)+1)//2,'last_page':len(pages),'all_pages_nonblank':True,'no_page_edge_clipping_detected':True,'byte_identical_double_build':True,'authority':{'visual_internal_review':True,'external_independence':False,'journal_authority':False}}
          (root/'VISUAL_AUDIT.json').write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          print('ORION_02_R20_VISUAL_PDF_AUDIT_PASS',len(pages))
          PY
      - name: Verify first, middle, and last page text presence
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Finite-Fibre Decision Certificates Do Not Extrapolate' "$RUNNER_TEMP/manuscript.txt"
          grep -q 'Registered algorithm-selection evidence' "$RUNNER_TEMP/manuscript.txt"
          grep -q 'Reproducibility and claim boundary' "$RUNNER_TEMP/manuscript.txt"
      - run: git diff --check
      - name: Stage visual reviewer artifact
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/orion-02-r20-visual-pdf";mkdir -p "$out"
          cp "$RUNNER_TEMP/manuscript-a.pdf" "$out/MANUSCRIPT_R20.pdf"
          cp "$RUNNER_TEMP/pdfinfo.txt" "$out/"
          cp "$RUNNER_TEMP/VISUAL_AUDIT.json" "$out/"
          cp "$RUNNER_TEMP/CONTACT_SHEET.png" "$out/"
          first="$(ls "$RUNNER_TEMP/pages"/page-*.png | head -n1)";last="$(ls "$RUNNER_TEMP/pages"/page-*.png | tail -n1)";count="$(ls "$RUNNER_TEMP/pages"/page-*.png | wc -l)";middle="$(ls "$RUNNER_TEMP/pages"/page-*.png | sed -n "$(( (count+1)/2 ))p")"
          cp "$first" "$out/FIRST_PAGE.png";cp "$middle" "$out/MIDDLE_PAGE.png";cp "$last" "$out/LAST_PAGE.png"
          sha256sum "$out"/* > "$out/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: orion-02-r20-visual-pdf
          path: ${{ runner.temp }}/orion-02-r20-visual-pdf/
          if-no-files-found: error
          retention-days: 30
