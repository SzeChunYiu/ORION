name: p4-tmlr-submission-audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'papers/orion-14-verified-scientific-discovery/**'
      - 'research/claim_expansion/p4/P4_X_PROTECTED_RESULT_V1.json'
      - 'research/claim_expansion/p4/P4_X_INDEPENDENT_VERIFICATION_V1.json'
      - 'tests/unit/p4/test_p4_publication_v2.py'
      - '.github/workflows/p4_tmlr_submission_audit.yml'
  push:
    branches: [main]
    paths:
      - 'papers/orion-14-verified-scientific-discovery/**'
      - 'research/claim_expansion/p4/P4_X_PROTECTED_RESULT_V1.json'
      - 'research/claim_expansion/p4/P4_X_INDEPENDENT_VERIFICATION_V1.json'
      - 'tests/unit/p4/test_p4_publication_v2.py'
      - '.github/workflows/p4_tmlr_submission_audit.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    # Kept wide as defence in depth. The install is the real fix (see below), but
    # GitHub reports a job timeout as `cancelled`, which reads as a failed gate in
    # `gh pr checks` while telling nobody the gate never ran -- so the budget
    # should not be the thing that decides whether this audit has an opinion.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repository dev dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify immutable V2 claims and lifecycle
        run: pytest -q tests/unit/p4/test_p4_publication_v2.py tests/unit/p4/test_p4_v2_execution_freeze.py

      - name: Regenerate safe V2 figures and tables
        shell: bash
        run: |
          set -euo pipefail
          python papers/orion-14-verified-scientific-discovery/figures/generate_figures.py
          for f in p4_2_false_promotion p4_3_coverage_frontier p4_4_detection_by_attack p4_5_attribution_vs_support p4_6_cost_false_promotion; do
            test -s "papers/orion-14-verified-scientific-discovery/figures/$f.svg"
          done
          for f in p4_t1_attack_custody p4_t2_baseline_ablation_results p4_t3_cannot_check_errors; do
            test -s "papers/orion-14-verified-scientific-discovery/tables/$f.tex"
          done
          git diff --exit-code -- papers/orion-14-verified-scientific-discovery/tables

      - name: Retain regenerated safe publication sources
        uses: actions/upload-artifact@v4
        with:
          name: p4-v2-generated-sources-${{ github.run_id }}
          path: |
            papers/orion-14-verified-scientific-discovery/figures/p4_2_false_promotion.svg
            papers/orion-14-verified-scientific-discovery/figures/p4_3_coverage_frontier.svg
            papers/orion-14-verified-scientific-discovery/figures/p4_4_detection_by_attack.svg
            papers/orion-14-verified-scientific-discovery/figures/p4_5_attribution_vs_support.svg
            papers/orion-14-verified-scientific-discovery/figures/p4_6_cost_false_promotion.svg
            papers/orion-14-verified-scientific-discovery/tables/p4_t1_attack_custody.tex
            papers/orion-14-verified-scientific-discovery/tables/p4_t2_baseline_ablation_results.tex
            papers/orion-14-verified-scientific-discovery/tables/p4_t3_cannot_check_errors.tex
          if-no-files-found: error
          retention-days: 7

      - name: Build fail-closed anonymous review artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/p4_anonymous"
          python papers/orion-14-verified-scientific-discovery/submission/build_anonymous_review_artifact.py --out-dir "$OUT" | tee "$RUNNER_TEMP/anonymous_build.txt"
          test -s "$OUT/orion14_anonymous_review.zip"
          unzip -t "$OUT/orion14_anonymous_review.zip"
          unzip -l "$OUT/orion14_anonymous_review.zip"
          sha256sum "$OUT/orion14_anonymous_review.zip" | tee "$RUNNER_TEMP/orion14_anonymous_review.zip.sha256"

      - name: Retain anonymous double-blind review artifact
        uses: actions/upload-artifact@v4
        with:
          name: p4-tmlr-anonymous-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p4_anonymous/orion14_anonymous_review.zip
            ${{ runner.temp }}/orion14_anonymous_review.zip.sha256
            ${{ runner.temp }}/anonymous_build.txt
          if-no-files-found: error
          retention-days: 90

      - name: Install TeX/PDF/rendering tools
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          PKGS="latexmk texlive-latex-base texlive-latex-extra texlive-fonts-recommended"
          PKGS="$PKGS lmodern poppler-utils librsvg2-bin"
          sudo apt-get install -y -qq --no-install-recommends $PKGS \
            || { sleep 15; sudo apt-get update -qq; sudo apt-get install -y -qq --no-install-recommends $PKGS; }

      - name: Render SVG result figures to submission PNGs
        shell: bash
        run: |
          set -euo pipefail
          F=papers/orion-14-verified-scientific-discovery/figures
          for stem in p4_2_false_promotion p4_3_coverage_frontier p4_4_detection_by_attack p4_5_attribution_vs_support p4_6_cost_false_promotion; do
            rsvg-convert -w 1440 -o "$F/$stem.png" "$F/$stem.svg"
          done

      - name: Fetch unmodified pinned official TMLR styles
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://raw.githubusercontent.com/JmlrOrg/tmlr-style-file/7bf90efe3a0debbba703c05c43f3ff7e4d4a2992
          curl -fsSL "$BASE/tmlr.sty" -o papers/orion-14-verified-scientific-discovery/manuscript/tmlr.sty
          curl -fsSL "$BASE/tmlr.bst" -o papers/orion-14-verified-scientific-discovery/manuscript/tmlr.bst

      - name: Compile anonymous TMLR PDF
        shell: bash
        run: |
          set -euo pipefail
          cd papers/orion-14-verified-scientific-discovery/manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          if grep -E 'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references|Undefined control sequence' main.log; then exit 1; fi

      - name: Independent PDF/stale-claim/blindness audit
        shell: bash
        run: |
          set -euo pipefail
          PDF=papers/orion-14-verified-scientific-discovery/manuscript/main.pdf
          TXT="$RUNNER_TEMP/p4.txt"
          pdftotext "$PDF" "$TXT"
          grep -q 'Under review as submission to TMLR' "$TXT"
          grep -q '0/360' "$TXT"; grep -q '180/360' "$TXT"; grep -q '60/60' "$TXT"
          grep -qi 'not supported' "$TXT"
          if grep -Eiq 'execution bindings remain.*UNBOUND|awaiting external campaign|No external results are reported|remains externally.*CANNOT_CHECK' "$TXT"; then exit 1; fi
          if grep -Eiq 'SzeChunYiu|github\.com/|GitHub Actions|workflow run|pull request|papers/orion-14-verified-scientific-discovery/|development/' "$TXT"; then exit 1; fi
          pdfinfo "$PDF" | tee "$RUNNER_TEMP/pdfinfo.txt"
          sha256sum "$PDF" | tee "$RUNNER_TEMP/main.pdf.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: p4-tmlr-audited-pdf-${{ github.run_id }}
          path: |
            papers/orion-14-verified-scientific-discovery/manuscript/main.pdf
            ${{ runner.temp }}/main.pdf.sha256
            ${{ runner.temp }}/pdfinfo.txt
          if-no-files-found: error
          retention-days: 90
