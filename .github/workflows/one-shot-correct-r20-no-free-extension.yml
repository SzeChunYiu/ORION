name: one-shot-correct-r20-no-free-extension

on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths: ['.github/workflows/one-shot-correct-r20-no-free-extension.yml']
  workflow_dispatch:

permissions: {contents: write}

jobs:
  correct-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: chatgpt/orion-02-r18-null-current-main-20260827}
      - name: Replace singular hostile extension with the exact all-action construction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('papers/orion-02-fiberguard-finite-fibre/MANUSCRIPT_R20.tex')
          text=path.read_text()
          old=r'''\begin{theorem}[No-free extension]\label{thm:nofree}
          Let $S$ be any finite observed fibre, $|\A|\ge2$, and suppose no constraint is imposed on the costs of an unseen state $x_0$ with the same representation value.  For every $M>0$, there is an extension of the state space that agrees with all observed data on $S$ but whose extended fibre has deterministic regret at least $M$.
          \end{theorem}
          \begin{proof}
          Choose two actions $a,b$.  Keep every observed cost unchanged.  Add $x_0$ with $C(a,x_0)=M$ and $C(b,x_0)=0$.  If an observed state makes $a$ the only low-regret common action, then the extended fibre forces regret at least $M$ for $a$; if not, relabel the two actions or add two unseen states with opposite unique optima.  Since unseen costs are unconstrained, an extension with arbitrarily large common-action regret always exists while preserving the observations on $S$.
          \end{proof}'''.replace('          ','')
          new=r'''\begin{theorem}[No-free extension]\label{thm:nofree}
          Let $S$ be any finite observed fibre with $|\A|\ge2$, and suppose no constraint is imposed on costs at unseen states sharing the same representation value.  For every $M>0$, there is a finite extension that agrees with every observed cost on $S$ but whose extended fibre has deterministic regret at least $M$.
          \end{theorem}
          \begin{proof}
          Keep every observed cost unchanged.  For each action $a\in\A$, add one unseen state $x_a$ with $C(a,x_a)=0$ and $C(b,x_a)=M$ for every $b\ne a$.  At every new state the oracle cost is zero.  Fix any common action $b$.  Because $|\A|\ge2$, choose $a\ne b$; then $R(b,x_a)=M$.  Hence every common action has worst-state regret at least $M$, so the extended fibre has deterministic regret at least $M$ while all observed bytes remain unchanged.
          \end{proof}'''.replace('          ','')
          if old not in text:
              raise SystemExit('registered no-free-extension proof block not found')
          path.write_text(text.replace(old,new))
          PY
          rm .github/workflows/one-shot-correct-r20-no-free-extension.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/orion-02-fiberguard-finite-fibre/MANUSCRIPT_R20.tex .github/workflows/one-shot-correct-r20-no-free-extension.yml
          git commit -m 'fix(ORION-02): make no-free-extension proof exact'
          git push origin HEAD:refs/heads/chatgpt/orion-02-r18-null-current-main-20260827
