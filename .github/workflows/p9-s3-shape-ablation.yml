name: p9-s3-shape-ablation
on:
  pull_request:
    paths:
      - 'src/orion/study/p9/s3_shape_ablation.py'
      - 'research/extensions/p9-structured-neural/run_s3_shape_ablation.py'
      - 'research/extensions/p9-structured-neural/successors/S3_SHAPE_ABLATION_PROTOCOL_V1.json'
      - '.github/workflows/p9-s3-shape-ablation.yml'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,candidates]'
      - run: python research/extensions/p9-structured-neural/run_s3_shape_ablation.py
