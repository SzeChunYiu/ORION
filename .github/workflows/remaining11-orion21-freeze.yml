name: remaining11-orion21-freeze

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/remaining11-orion21-freeze-20260827
    paths:
      - 'papers/publication_closure/remaining11/**'
      - '.github/workflows/remaining11-orion21-freeze.yml'

permissions:
  contents: write

concurrency:
  group: remaining11-orion21-freeze
  cancel-in-progress: true

jobs:
  freeze:
    if: ${{ !contains(github.event.head_commit.message, '[orion21-science-frozen]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/remaining11-orion21-freeze-20260827
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen replay dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==1.26.4' 'scikit-learn==1.5.2'
      - name: Compile freeze gate
        run: python -m py_compile papers/publication_closure/remaining11/check_orion21_science_freeze.py
      - name: Re-run decoder and donor studies plus independent implementations
        shell: bash
        run: |
          set -euo pipefail
          python papers/orion-21-state-as-computation/top_tier/run_decoder_attacks_v1.py > p11_decoder_attack_v1.json
          python papers/orion-21-state-as-computation/top_tier/check_decoder_attacks_independent_v1.py > "$RUNNER_TEMP/decoder.json"
          python papers/orion-21-state-as-computation/top_tier/run_donor_compiler_comparator_v1.py > p11_donor_comparator_v1.json
          python papers/orion-21-state-as-computation/top_tier/check_donor_comparator_independent_v1.py > "$RUNNER_TEMP/donor.json"
      - name: Re-run selective-placement independent implementation
        run: python papers/orion-21-state-as-computation/top_tier/check_selective_placement_independent_v1.py > "$RUNNER_TEMP/selective.json"
      - name: Reproduce the registered ten-responsibility negative exactly
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python papers/orion-21-state-as-computation/top_tier/run_query_family_phase_v1.py > "$RUNNER_TEMP/query-negative.out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          python - "$RUNNER_TEMP/query-negative.out" <<'PY'
          import json, pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          start = text.find('{')
          assert start >= 0, text[-2000:]
          obj, _ = json.JSONDecoder().raw_decode(text[start:])
          assert obj['terminal'] == 'P11_QUERY_FAMILY_PHASE_V1_GATE_NOT_MET', obj['terminal']
          assert obj['support_counts'] == {'LINEAR': 3, 'RBF': 5, 'KNN': 5}, obj['support_counts']
          print('ORION21_QUERY_FAMILY_NEGATIVE_REPRODUCED')
          PY
      - name: Require replay to leave tracked paper bytes unchanged
        shell: bash
        run: |
          rm -f p11_decoder_attack_v1.json p11_donor_comparator_v1.json
          git diff --exit-code -- papers/orion-21-state-as-computation
      - name: Verify active authority and write bounded freeze receipt
        run: python papers/publication_closure/remaining11/check_orion21_science_freeze.py
      - name: Publish exact freeze receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt='papers/publication_closure/receipts/remaining11/ORION-21_SCIENCE_FREEZE_V1.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$receipt"
          git diff --check --cached
          git commit -m 'papers(publication): freeze ORION-21 bounded science [orion21-science-frozen]'
          git push origin HEAD:chatgpt/remaining11-orion21-freeze-20260827
      - uses: actions/upload-artifact@v4
        with:
          name: orion21-bounded-science-freeze-${{ github.sha }}
          path: |
            papers/publication_closure/receipts/remaining11/ORION-21_SCIENCE_FREEZE_V1.json
            ${{ runner.temp }}/decoder.json
            ${{ runner.temp }}/donor.json
            ${{ runner.temp }}/selective.json
            ${{ runner.temp }}/query-negative.out
          if-no-files-found: error
          retention-days: 30
