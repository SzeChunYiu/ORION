name: orion-02-r20-meta-gate

on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths:
      - 'papers/orion-02-fiberguard-finite-fibre/JOURNAL_GATE_R20.json'
      - '.github/workflows/orion-02-r20-meta-gate.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  require-internal-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Poll latest branch runs for required internal gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/check.py" <<'PY'
          import json,os,time,urllib.request
          branch='chatgpt/orion-02-r18-null-current-main-20260827'
          required={
            'orion-02-r18-recovery-null-custody',
            'orion-02-r20-internal-release-gate',
            'orion-02-aslib-rights-audit-r20',
            'q1-pr1449-resource-audit-r20',
            'ab-pr1469-production-registry-audit-r20',
            'd-pr1466-first-mixing-audit-r20',
            'nq-pr1472-exact-subject-audit-r20',
            'five-paper-blocker-audit-r20',
          }
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'ORION-R20-meta-gate'}
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?branch={branch}&per_page=100"
          deadline=time.time()+1200
          snapshot={}
          while True:
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as response:data=json.load(response)
            latest={}
            for row in sorted(data['workflow_runs'],key=lambda item:item['id'],reverse=True):
              latest.setdefault(row['name'],row)
            snapshot={name:{'id':latest[name]['id'],'status':latest[name]['status'],'conclusion':latest[name]['conclusion'],'head_sha':latest[name]['head_sha'],'html_url':latest[name]['html_url']} if name in latest else {'status':'missing','conclusion':None} for name in sorted(required)}
            pending=[name for name,row in snapshot.items() if row['status'] in {'queued','in_progress','waiting','requested'}]
            missing=[name for name,row in snapshot.items() if row['status']=='missing']
            if not pending and not missing:break
            if time.time()>=deadline:break
            time.sleep(30)
          result={'schema':'ORION.ORION02.R20MetaGate.v1','branch':branch,'required':snapshot,'all_internal_workflows_green':all(row['status']=='completed' and row['conclusion']=='success' for row in snapshot.values()),'authority':{'external_independence':False,'novelty':False,'rights_complete':False,'journal_authority':False}}
          open(os.path.join(os.environ['RUNNER_TEMP'],'META_GATE.json'),'w').write(json.dumps(result,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          if not result['all_internal_workflows_green']:raise SystemExit('internal workflow meta-gate not green')
          PY
          python "$RUNNER_TEMP/check.py"
      - name: Check diff hygiene
        if: always()
        run: git diff --check
      - name: Stage meta-gate artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/orion-02-r20-meta-gate";mkdir -p "$out"
          cp "$RUNNER_TEMP/META_GATE.json" "$out/" || true
          sha256sum "$out"/* > "$out/SHA256SUMS" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orion-02-r20-meta-gate
          path: ${{ runner.temp }}/orion-02-r20-meta-gate/
          if-no-files-found: warn
          retention-days: 30
