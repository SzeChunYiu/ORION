name: P6-P7 successor binding refresh

on:
  push:
    branches:
      - external/cohorts-v1

permissions:
  contents: write

jobs:
  regenerate-bindings:
    if: ${{ !contains(github.event.head_commit.message, '[binding-refresh]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: external/cohorts-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository
        run: python -m pip install -e '.[dev]'
      - name: Refresh P6/P7 successor V2 bindings only
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          from orion.programme.content_binding_coverage import is_build_artifact

          root = Path('.').resolve()
          head = os.environ['GITHUB_SHA']
          tree = subprocess.check_output(
              ['git', 'rev-parse', f'{head}^{{tree}}'], text=True
          ).strip()

          papers = {
              'P6': root / 'papers/orion-16-formal-epistemic-structures-and-mechanics',
              'P7': root / 'papers/orion-17-epistemic-navigation-open-worlds',
          }

          def sha(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as fh:
                  for block in iter(lambda: fh.read(1 << 20), b''):
                      h.update(block)
              return h.hexdigest()

          def repo_rel(path: Path) -> str:
              return path.relative_to(root).as_posix()

          def refresh_local_sums(directory: Path) -> None:
              # The external cohort is a self-contained additive packet. Bind every
              # non-build file except the checksum file itself.
              entries = []
              for path in sorted(directory.rglob('*')):
                  if not path.is_file() or path.name == 'SHA256SUMS' or is_build_artifact(path):
                      continue
                  entries.append(f'{sha(path)}  {repo_rel(path)}')
              (directory / 'SHA256SUMS').write_text('\n'.join(entries) + '\n', encoding='utf-8')

          for candidate, paper in papers.items():
              cohort = paper / 'external-cohort-v1'
              if not cohort.is_dir():
                  raise SystemExit(f'{candidate}: external-cohort-v1 missing')
              refresh_local_sums(cohort)

              v1_path = paper / 'CONTENT_MANIFEST_V1.json'
              v2_path = paper / 'CONTENT_MANIFEST_V2.json'
              v1 = json.loads(v1_path.read_text(encoding='utf-8'))
              v2 = json.loads(v2_path.read_text(encoding='utf-8'))
              if v2.get('schema_version') != 'orion.candidate-content-binding.v2':
                  raise SystemExit(f'{candidate}: unexpected V2 schema')
              if v2.get('candidate_id') != candidate:
                  raise SystemExit(f'{candidate}: V2 candidate id mismatch')

              existing = {
                  entry['path']: dict(entry)
                  for entry in v2.get('bound_files', [])
                  if isinstance(entry, dict) and isinstance(entry.get('path'), str)
              }

              # V2 is the current additive subject. Append newly tracked paper files
              # without touching V1. SHA256SUMS files are digest layers, not subject
              # files, and V2 cannot bind itself without a cycle.
              for path in sorted(paper.rglob('*')):
                  if not path.is_file() or is_build_artifact(path):
                      continue
                  if path.name == 'SHA256SUMS' or path == v2_path:
                      continue
                  rel = repo_rel(path)
                  existing.setdefault(rel, {'path': rel})

              # Preserve the external shared files already present in V2 and
              # recompute every digest from current bytes. Missing old rows are a
              # hard error rather than silently shrinking the subject.
              refreshed = []
              for rel in sorted(existing):
                  path = root / rel
                  if not path.is_file():
                      raise SystemExit(f'{candidate}: bound V2 path missing: {rel}')
                  refreshed.append({'path': rel, 'sha256': sha(path)})

              # V1 is historical. Sanity-check that V2 still contains every V1
              # subject row, rather than becoming a replacement that forgets it.
              v1_paths = {
                  entry['path'] for entry in v1.get('bound_files', [])
                  if isinstance(entry, dict) and isinstance(entry.get('path'), str)
              }
              v2_paths = {entry['path'] for entry in refreshed}
              missing_v1 = sorted(v1_paths - v2_paths)
              if missing_v1:
                  raise SystemExit(f'{candidate}: V2 lost V1 paths: {missing_v1[:5]}')

              v2['bound_files'] = refreshed
              v2['subject_commit'] = head
              v2['subject_commit_status'] = 'BOUND'
              v2['subject_commit_blocker'] = None
              v2['subject_commit_unbound_paths'] = []
              v2['subject_tree'] = tree
              if isinstance(v2.get('environment_lock'), dict):
                  env_path = root / v2['environment_lock']['path']
                  if not env_path.is_file():
                      raise SystemExit(f'{candidate}: environment lock missing: {env_path}')
                  v2['environment_lock']['sha256'] = sha(env_path)

              text = json.dumps(v2, indent=2, sort_keys=True) + '\n'
              v2_path.write_text(text, encoding='utf-8')
              nested = paper / 'content_binding_v2/SHA256SUMS'
              nested.parent.mkdir(parents=True, exist_ok=True)
              nested.write_text(
                  f'{hashlib.sha256(text.encode()).hexdigest()}  {repo_rel(v2_path)}\n',
                  encoding='utf-8',
              )
              print(candidate, 'V2 rows', len(refreshed), 'successor rows', len(v2_paths - v1_paths))
          PY
      - name: Verify local cohort checksum packets
        run: |
          sha256sum -c papers/orion-16-formal-epistemic-structures-and-mechanics/external-cohort-v1/SHA256SUMS
          sha256sum -c papers/orion-17-epistemic-navigation-open-worlds/external-cohort-v1/SHA256SUMS
          sha256sum -c papers/orion-16-formal-epistemic-structures-and-mechanics/content_binding_v2/SHA256SUMS
          sha256sum -c papers/orion-17-epistemic-navigation-open-worlds/content_binding_v2/SHA256SUMS
      - name: Verify historical V1 candidate gate now excludes V2 successor rows
        run: python papers/candidates/checkers/check_content_binding_v1.py --check
      - name: Verify whole-paper coverage and drift guard
        run: python -m pytest tests/unit/programme/test_content_binding_coverage.py -q
      - name: Refuse unexpected generated paths
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'papers/orion-16-formal-epistemic-structures-and-mechanics/CONTENT_MANIFEST_V2.json',
              'papers/orion-16-formal-epistemic-structures-and-mechanics/content_binding_v2/SHA256SUMS',
              'papers/orion-16-formal-epistemic-structures-and-mechanics/external-cohort-v1/SHA256SUMS',
              'papers/orion-17-epistemic-navigation-open-worlds/CONTENT_MANIFEST_V2.json',
              'papers/orion-17-epistemic-navigation-open-worlds/content_binding_v2/SHA256SUMS',
              'papers/orion-17-epistemic-navigation-open-worlds/external-cohort-v1/SHA256SUMS',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          extra = sorted(changed - allowed)
          if extra:
              raise SystemExit(f'unexpected generated paths: {extra}')
          print('generated paths:', *sorted(changed), sep='\n  ')
          PY
      - name: Commit verified successor binding refresh
        run: |
          if git diff --quiet; then
            echo 'No binding changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            papers/orion-16-formal-epistemic-structures-and-mechanics/CONTENT_MANIFEST_V2.json \
            papers/orion-16-formal-epistemic-structures-and-mechanics/content_binding_v2/SHA256SUMS \
            papers/orion-16-formal-epistemic-structures-and-mechanics/external-cohort-v1/SHA256SUMS \
            papers/orion-17-epistemic-navigation-open-worlds/CONTENT_MANIFEST_V2.json \
            papers/orion-17-epistemic-navigation-open-worlds/content_binding_v2/SHA256SUMS \
            papers/orion-17-epistemic-navigation-open-worlds/external-cohort-v1/SHA256SUMS
          git commit -m 'chore(candidates): refresh P6/P7 successor V2 bindings [binding-refresh]'
          git push origin HEAD:external/cohorts-v1
