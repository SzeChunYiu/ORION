name: orion-qg-qg10c-interval-closure
on:
  pull_request:
    paths:
      - 'development/orion-qg-regime-geometry/QG10C_*'
      - 'development/orion-qg-regime-geometry/qg10c_*'
      - 'development/orion-qg-regime-geometry/run_qg10c_dual_harness.py'
      - 'research/extensions/orion-qg/qg10c_*'
      - '.github/workflows/orion-qg-qg10c-interval-closure.yml'
  workflow_dispatch:
concurrency:
  group: orion-qg-qg10c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qg10c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QG10C_BASE: c5ba39fef4f25c46de5fb69bf07f50530f4693ca
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert lineage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git merge-base HEAD "${QG10C_BASE}")" = "${QG10C_BASE}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ORION and harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,candidates]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Syntax
        run: python -m py_compile research/extensions/orion-qg/qg10c_interval_closure.py development/orion-qg-regime-geometry/qg10c_generic_verify.py development/orion-qg-regime-geometry/qg10c_native_verify.py development/orion-qg-regime-geometry/run_qg10c_dual_harness.py
      - name: Execute interval calibration through both instruments
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python development/orion-qg-regime-geometry/run_qg10c_dual_harness.py | tee artifacts/orion-qg-qg10c-summary.json
      - name: Deterministic replay
        run: |
          set -euo pipefail
          python research/extensions/orion-qg/qg10c_interval_closure.py --output artifacts/orion-qg-qg10c-interval-closure-replay.json > artifacts/orion-qg-qg10c-replay.log
          cmp artifacts/orion-qg-qg10c-interval-closure.json artifacts/orion-qg-qg10c-interval-closure-replay.json
      - name: Enforce bounded closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/orion-qg-qg10c-interval-closure.json').read_text()); g=json.loads(Path('artifacts/orion-qg-qg10c-generic.json').read_text()); n=json.loads(Path('artifacts/orion-qg-qg10c-native.json').read_text()); d=json.loads(Path('artifacts/orion-qg-qg10c-dual.json').read_text())
          t='QG10_SOUND_CERTIFICATION_CALIBRATED__INCREMENTAL_INTERVAL_VALUE_DONOR_DEPENDENT_OR_WEAK'; assert a['terminal']==t and a['all_gates'] is True; assert a['sixlcu']['instances']==39489 and a['sixlcu']['false_certifications']==0 and a['sixlcu']['resolved']==39489; assert a['tare']['instances']==50 and a['tare']['coarse_false_certifications']==0; assert a['interpretation']['new_scalable_interval_value_supported'] is False; assert g['decision']=='ACCEPT_BOUNDED_CLOSURE' and g['all_checks'] is True; assert n['decision']=='ACCEPT_BOUNDED_CLOSURE' and n['all_checks'] is True; assert d['terminal']==t and d['both_accept'] is True
          PY
      - name: Upload receipts
        uses: actions/upload-artifact@v4
        with:
          name: orion-qg-qg10c-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/orion-qg-qg10c-interval-closure.json
            artifacts/orion-qg-qg10c-interval-closure-replay.json
            artifacts/orion-qg-qg10c-generic.json
            artifacts/orion-qg-qg10c-native.json
            artifacts/orion-qg-qg10c-dual.json
            artifacts/orion-qg-qg10c-summary.json
            .orion-qg-qg10c-generic/.orion-harness/**
            .orion-qg-qg10c-native/.orion-harness/**
          include-hidden-files: true
          if-no-files-found: error
