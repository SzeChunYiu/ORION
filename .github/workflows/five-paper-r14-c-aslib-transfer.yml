name: five-paper-r14-c-aslib-transfer

on:
  push:
    branches:
      - chatgpt/r14-c-aslib-transfer-20260826
    paths:
      - 'papers/five-paper-top-tier-r8/C/FIBERGUARD_ASLIB_TRANSFER_PROTOCOL_R14.md'
      - 'papers/five-paper-top-tier-r8/C/fiberguard_aslib_transfer_r14.py'
      - '.github/workflows/five-paper-r14-c-aslib-transfer.yml'
  pull_request:
    paths:
      - 'papers/five-paper-top-tier-r8/C/FIBERGUARD_ASLIB_TRANSFER_PROTOCOL_R14.md'
      - 'papers/five-paper-top-tier-r8/C/fiberguard_aslib_transfer_r14.py'
      - '.github/workflows/five-paper-r14-c-aslib-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prospective-held-out-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen parser dependency
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Materialize pinned ASlib SAT12-ALL corpus
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/aslib_data"
          git init "$root"
          git -C "$root" remote add origin https://github.com/coseal/aslib_data.git
          git -C "$root" config core.sparseCheckout true
          printf '/SAT12-ALL/\n' > "$root/.git/info/sparse-checkout"
          git -C "$root" fetch --depth 1 origin 551b22beef8df17de59286b4822ef720e0aa4d6f
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = '551b22beef8df17de59286b4822ef720e0aa4d6f'

      - name: Compile and run hostile self-test
        shell: bash
        run: |
          set -euo pipefail
          script='papers/five-paper-top-tier-r8/C/fiberguard_aslib_transfer_r14.py'
          parent='papers/five-paper-top-tier-r8/C/fiberguard_aslib_sat12_all_r11.py'
          python -m py_compile "$parent" "$script"
          python "$script" --self-test | tee "$RUNNER_TEMP/self-test.json"
          grep -q '"support_gate":true' "$RUNNER_TEMP/self-test.json"

      - name: Execute frozen transfer audit twice
        shell: bash
        run: |
          set -euo pipefail
          script='papers/five-paper-top-tier-r8/C/fiberguard_aslib_transfer_r14.py'
          root="$RUNNER_TEMP/aslib_data"
          python "$script" --aslib-root "$root" --output "$RUNNER_TEMP/result-a.json" | tee "$RUNNER_TEMP/terminal-a.txt"
          python "$script" --aslib-root "$root" --output "$RUNNER_TEMP/result-b.json" | tee "$RUNNER_TEMP/terminal-b.txt"
          cmp "$RUNNER_TEMP/result-a.json" "$RUNNER_TEMP/result-b.json"
          cmp "$RUNNER_TEMP/terminal-a.txt" "$RUNNER_TEMP/terminal-b.txt"
          grep -q '^FIBERGUARD_ASLIB_TRANSFER_R14_PASS ' "$RUNNER_TEMP/terminal-a.txt"

      - name: Verify prospective authority and split controls
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ['RUNNER_TEMP']) / 'result-a.json').read_text()
          )
          assert result['schema'] == 'ORION.FiberGuard.ASlibTransfer.R14.v1'
          assert result['source_parent'] == '6c23a3fe4ccf415bc3a73794878d72583ed48eb2'
          assert result['upstream']['commit'] == '551b22beef8df17de59286b4822ef720e0aa4d6f'
          assert result['upstream']['files']['cv.arff']['git_blob_sha1'] == '63d3922abaae67e690f31a74c7daa1be6981fb70'
          assert result['protocol']['candidate_representation_count'] == 513
          assert all(result['controls'].values())
          assert result['authority']['primary_training_selected_arm_uses_training_outcomes_only'] is True
          assert result['authority']['prefix_group_is_family_ground_truth'] is False
          assert result['authority']['grants_journal_authority'] is False
          assert len(result['splits']) == 2
          assert result['splits'][1]['leakage_audit']['prefix_groups_crossing_folds'] == 0
          print('ASLIB_TRANSFER_R14_RESULT_VERIFIED')
          PY

      - name: Check diff hygiene
        run: git diff --check

      - name: Stage immutable result artifact
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/fiberguard-aslib-transfer-r14"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/result-a.json" "$out/FIBERGUARD_ASLIB_TRANSFER_R14_RESULTS.json"
          cp "$RUNNER_TEMP/terminal-a.txt" "$out/TERMINAL.txt"
          cp "$RUNNER_TEMP/self-test.json" "$out/SELF_TEST.json"
          sha256sum "$out"/* > "$out/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: fiberguard-aslib-transfer-r14
          path: ${{ runner.temp }}/fiberguard-aslib-transfer-r14/
          if-no-files-found: error
          retention-days: 30
