name: cannot-check-inventory-artifact

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check and derive inventory only on semantic drift
        id: inventory
        shell: bash
        run: |
          if python research/development/cannot_check_inventory.py --check; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "inventory already semantically exact"
          else
            python research/development/cannot_check_inventory.py --write
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload derived inventory
        if: steps.inventory.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cannot-check-inventory-derived
          path: research/development/cannot_check_inventory.json
          if-no-files-found: error
      - name: Commit exact derived inventory
        if: steps.inventory.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "orion-shadow-inventory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/development/cannot_check_inventory.json
          git commit -m "Regenerate CANNOT_CHECK inventory for issue coordination"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
