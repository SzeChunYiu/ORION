name: ORION-01 issue progress and cleanup

on:
  push:
    paths:
      - ".github/workflows/issue1701-progress-and-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: issue1701-progress-cleanup
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close exact accidental connector artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 300 \
            --json number,title,body \
            --jq '.[] | select((.title == "IGNORE" and .body == "IGNORE") or (.title == "IGNORE2" and .body == "IGNORE2") or (.title == "IGNORE3" and .body == "IGNORE3")) | .number' \
            | while read -r number; do
                test -n "$number" || continue
                gh issue close "$number" \
                  --repo "$GITHUB_REPOSITORY" \
                  --comment 'Closed: accidental connector artifact; no project work was attached.'
              done

      - name: Post Paper 1 progress once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker='<!-- ORION01_PAPER1_V3_20260829 -->'
          existing="$(gh issue view 1701 --repo "$GITHUB_REPOSITORY" --json comments --jq '.comments[].body' || true)"
          if printf '%s\n' "$existing" | grep -Fq "$marker"; then
            echo 'Progress comment already present.'
            exit 0
          fi
          cat > /tmp/orion01-comment.md <<'EOF'
          <!-- ORION01_PAPER1_V3_20260829 -->
          Paper 1 / ORION-01 has been worked first, in ascending order, on branch `codex/issue-1701-orion01-paper1-v3-20260829`.

          Implemented: a new bounded V3 manuscript identity with the hostile proof findings repaired; direct sibling evidence binding; implementation-independent theorem checker; primary-source novelty subtraction; deterministic PDF/manifest/checksum tooling; and CI.

          The production successor is frozen under a distinct V1 identity with unique source resolution, source/call-graph/mutation-root closure, finite domain partitions, canonical effects, extensional classes, an O1–O6 conditional completeness theorem, exhaustive terminals, and an independent fail-closed protocol checker. Any exact-compute phase is gated on `REGISTRY_COMPLETE` and a fresh material predicate rather than a larger old-cap run.

          Preserved without promotion: PR #1602's eight cap hits and `CANNOT_CHECK_MOVE_COMPLETENESS` terminal.

          Explicitly open: full raw path-by-path transplant from the stale PR branch; observed CI/PDF visual-review receipts; and source-instance discharge of O1–O6. No external proof, novelty, replication, or submission authority is claimed.
          EOF
          sed -i 's/^          //' /tmp/orion01-comment.md
          gh issue comment 1701 --repo "$GITHUB_REPOSITORY" --body-file /tmp/orion01-comment.md

      - name: Remove one-shot workflow when possible
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort; exit 0; }
          git rm .github/workflows/issue1701-progress-and-cleanup.yml
          git commit -m 'chore: remove issue progress one-shot [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
