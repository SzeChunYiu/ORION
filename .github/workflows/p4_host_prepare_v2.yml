name: p4-host-prepare-v2

on:
  push:
    branches: [main]
    paths:
      - 'papers/orion-14-verified-scientific-discovery/host/PREP_TRIGGER_V2.txt'

permissions:
  contents: read

env:
  SUBJECT_COMMIT: f6e51b5c8f905382b8e2f5568d9035fc14241aa1

jobs:
  independent-host-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mint fresh post-repair hidden split
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SUBJECT_COMMIT}^{commit}"
          git archive --format=tar "$SUBJECT_COMMIT" > "$RUNNER_TEMP/p4-v2-subject.tar"
          SUBJECT_HASH=$(sha256sum "$RUNNER_TEMP/p4-v2-subject.tar" | awk '{print $1}')
          HARNESS_HASH=$(python - <<'PY'
          import hashlib
          from pathlib import Path
          files = [
              'papers/orion-14-verified-scientific-discovery/host/generate_protected_cases.py',
              'papers/orion-14-verified-scientific-discovery/host/run_candidate.py',
              'papers/orion-14-verified-scientific-discovery/host/run_baselines.py',
              'papers/orion-14-verified-scientific-discovery/host/run_baselines_v2.py',
              'papers/orion-14-verified-scientific-discovery/host/run_ablations.py',
              'papers/orion-14-verified-scientific-discovery/host/evaluate_campaign.py',
              'papers/orion-14-verified-scientific-discovery/host/evaluate_campaign_v2.py',
              'papers/orion-14-verified-scientific-discovery/host/evaluate_ablations.py',
              'papers/orion-14-verified-scientific-discovery/host/independent_reproduce.py',
              'papers/orion-14-verified-scientific-discovery/host/independent_reproduce_v2.py',
              'papers/orion-14-verified-scientific-discovery/host/BASELINE_CONFIGS_V2.json',
          ]
          digest = hashlib.sha256()
          for name in files:
              data = Path(name).read_bytes()
              digest.update(name.encode())
              digest.update(b'\0')
              digest.update(hashlib.sha256(data).digest())
          print(digest.hexdigest())
          PY
          )
          BASELINE_HASH=$(sha256sum papers/orion-14-verified-scientific-discovery/host/BASELINE_CONFIGS_V2.json | awk '{print $1}')
          EPOCH=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          SECRET_SEED=$(openssl rand -hex 32)
          python papers/orion-14-verified-scientific-discovery/host/generate_protected_cases.py \
            --seed "$SECRET_SEED" \
            --output-dir "$RUNNER_TEMP/p4-v2-host-prep" \
            --subject-commit "$SUBJECT_COMMIT" \
            --subject-archive-sha256 "$SUBJECT_HASH" \
            --evaluator-artifact-sha256 "$HARNESS_HASH" \
            --baseline-config-sha256 "$BASELINE_HASH" \
            --host-run-id "$GITHUB_RUN_ID" \
            --evaluation-epoch "$EPOCH"
          unset SECRET_SEED

      - name: Prove candidate handoff is label-blind and outcome-blind
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'p4-v2-host-prep'
          candidate = root/'candidate_manifest.jsonl'
          rows = [json.loads(line) for line in candidate.read_text().splitlines() if line.strip()]
          assert len(rows) == 420
          assert all(set(row) == {'case_id','candidate_visible'} for row in rows)
          blob = candidate.read_text()
          assert not any(token in blob for token in ('protected_gold','attack_family','custody_class','expected_authority_terminal'))
          summary = json.loads((root/'host_prep_summary.json').read_text())
          assert summary['attack_labels_visible_to_candidate'] is False
          assert summary['outcome_accessed'] is False
          assert summary['case_count'] == 420
          assert summary['ambiguous_cases'] == 0
          print('P4_V2_HOST_SAFE_SUMMARY_BEGIN')
          print(json.dumps(summary, indent=2, sort_keys=True))
          print('P4_V2_HOST_SAFE_SUMMARY_END')
          PY

      - name: Stage public handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p4-v2-public"
          cp "$RUNNER_TEMP/p4-v2-host-prep/candidate_manifest.jsonl" "$RUNNER_TEMP/p4-v2-public/"
          cp "$RUNNER_TEMP/p4-v2-host-prep/RUN_MANIFEST_V1.json" "$RUNNER_TEMP/p4-v2-public/"
          cp "$RUNNER_TEMP/p4-v2-host-prep/host_prep_summary.json" "$RUNNER_TEMP/p4-v2-public/"
          cp papers/orion-14-verified-scientific-discovery/host/BASELINE_CONFIGS_V2.json "$RUNNER_TEMP/p4-v2-public/"

      - name: Upload V2 candidate-visible handoff
        uses: actions/upload-artifact@v4
        with:
          name: p4-v2-host-prep-public-${{ github.run_id }}
          path: ${{ runner.temp }}/p4-v2-public
          if-no-files-found: error
          retention-days: 90

      - name: Upload V2 protected custody artifact
        uses: actions/upload-artifact@v4
        with:
          name: p4-v2-host-prep-protected-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p4-v2-host-prep/protected_manifest.jsonl
            ${{ runner.temp }}/p4-v2-host-prep/source_snapshots.jsonl
            ${{ runner.temp }}/p4-v2-host-prep/RUN_MANIFEST_V1.json
          if-no-files-found: error
          retention-days: 90
