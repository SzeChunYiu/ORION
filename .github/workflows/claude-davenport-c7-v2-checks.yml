name: claude-davenport-c7-v2-checks

on:
  push:
    branches:
      - claude/orion-research-frontier-3ck9yt
    paths:
      - 'research/experiments/davenport-c7-frontier/**'
      - '.github/workflows/claude-davenport-c7-v2-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-checks-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/experiments/davenport-c7-frontier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: V1 hand-derived orbit cover and certificates (binary cube, length 37)
        run: python check_support7_binary_cube_v1.py
      - name: V2 spectrum congruence suite (D2 gate, D3 short-zero-sum lemma, certificates)
        run: python spectrum_congruences_v2.py
      - name: V2 cube families S_2(p), S_3(p) for p = 3, 5, 7 (independent packing recursion)
        run: python verify_cube_family_v2.py --fast
      - name: V3 binary-cube packing profile (independent Python recomputation, n = 3 and 5)
        run: python cube_packing_profile_v3.py
      - name: V3 extremal families S_2, S_3, S_4 for n = 5, 7, 9, 11
        run: python tools/famcheck_v3.py 5 7 9
      - name: V3 general family T_k(n) for n = 3, 5, 7 and k <= 6
        run: python verify_tk_family_v3.py
      - name: V3 uniform D_2 digit certificate (all primes 5 <= p <= 200)
        run: python tools/d2_digit_certificate_v3.py
      - name: V3 rank-r D_2 bounds (certificates for r <= 5, p <= 13)
        run: python -c "import sys; sys.path.insert(0,'tools'); from d2_rank_bounds_v3 import threshold; known={2:lambda p:3*p-1,3:lambda p:(9*p-5)//2}; ok=all(threshold(p,r)-1==known[r](p) for r in (2,3) for p in (5,7,11,13)); print('rank bounds reproduce known D_2 at r=2,3:', ok); assert ok"
      - name: V3 atom-spectrum congruence (identity brute force, real-object validation, forced atom lengths)
        run: python verify_atom_spectrum_v3.py
      - name: V3 hypothesis (Z) and the pointed identity
        run: python verify_hypothesis_Z_v3.py && python verify_pointed_identity_v3.py
      - name: V2 exhaustive analogues (compile enumerator, replay p = 3 and p = 5 D2 frames)
        run: bash run_exhaustive_analogs_v2.sh --ci
