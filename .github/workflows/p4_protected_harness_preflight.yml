name: p4-protected-harness-preflight

on:
  push:
    branches: [shadow/p4-issue101-protected-closure]
    paths:
      - 'papers/paper-04-verified-scientific-discovery/host/**'
      - 'development/P4_PROTECTED_CLOSURE_PACKET_2026-08-16.md'
      - '.github/workflows/p4_protected_harness_preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen subject revision
        shell: bash
        run: |
          set -euo pipefail
          SUBJECT=46977ea104162c4cf64da8138a4c4759065fe6d4
          mkdir -p "$RUNNER_TEMP/subject"
          git archive "$SUBJECT" | tar -x -C "$RUNNER_TEMP/subject"
          python -m pip install -e "$RUNNER_TEMP/subject"

      - name: Generate public-seed preflight battery
        shell: bash
        run: |
          set -euo pipefail
          SUBJECT=46977ea104162c4cf64da8138a4c4759065fe6d4
          git archive --format=tar "$SUBJECT" > "$RUNNER_TEMP/subject.tar"
          SUBJECT_HASH=$(sha256sum "$RUNNER_TEMP/subject.tar" | awk '{print $1}')
          EVALUATOR_HASH=$(sha256sum papers/paper-04-verified-scientific-discovery/host/evaluate_campaign.py | awk '{print $1}')
          BASELINE_HASH=$(sha256sum papers/paper-04-verified-scientific-discovery/host/BASELINE_CONFIGS_V1.json | awk '{print $1}')
          python papers/paper-04-verified-scientific-discovery/host/generate_protected_cases.py \
            --seed 'PUBLIC-PREFLIGHT-SEED-NOT-PROTECTED-EVIDENCE' \
            --output-dir "$RUNNER_TEMP/prep" \
            --subject-commit "$SUBJECT" \
            --subject-archive-sha256 "$SUBJECT_HASH" \
            --evaluator-artifact-sha256 "$EVALUATOR_HASH" \
            --baseline-config-sha256 "$BASELINE_HASH" \
            --host-run-id "preflight-${GITHUB_RUN_ID}" \
            --evaluation-epoch '2026-08-16T00:00:00Z'

      - name: Verify candidate artifact is gold-blind
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'prep' / 'candidate_manifest.jsonl'
          rows = [json.loads(line) for line in path.read_text().splitlines() if line.strip()]
          assert len(rows) == 420
          assert all(set(row) == {'case_id', 'candidate_visible'} for row in rows)
          forbidden = ('protected_gold', 'attack_family', 'custody_class', 'expected_authority_terminal')
          blob = path.read_text()
          assert not any(token in blob for token in forbidden)
          print('gold-blind candidate manifest verified: 420 opaque cases')
          PY

      - name: Execute five deterministic repeats
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/outputs"
          for i in 1 2 3 4 5; do
            python papers/paper-04-verified-scientific-discovery/host/run_candidate.py \
              "$RUNNER_TEMP/prep/candidate_manifest.jsonl" \
              "$RUNNER_TEMP/outputs/orion-${i}.jsonl"
            python papers/paper-04-verified-scientific-discovery/host/run_baselines.py \
              "$RUNNER_TEMP/prep/candidate_manifest.jsonl" \
              "$RUNNER_TEMP/outputs/baselines-${i}.jsonl"
          done

      - name: Protected evaluator preflight
        shell: bash
        run: |
          set -euo pipefail
          ARGS=()
          for i in 1 2 3 4 5; do
            ARGS+=(--orion-output "$RUNNER_TEMP/outputs/orion-${i}.jsonl")
            ARGS+=(--baseline-output "$RUNNER_TEMP/outputs/baselines-${i}.jsonl")
          done
          python papers/paper-04-verified-scientific-discovery/host/evaluate_campaign.py \
            --protected-manifest "$RUNNER_TEMP/prep/protected_manifest.jsonl" \
            --run-manifest "$RUNNER_TEMP/prep/RUN_MANIFEST_V1.json" \
            --output-dir "$RUNNER_TEMP/evaluation" \
            --campaign-run-id "preflight-${GITHUB_RUN_ID}" \
            "${ARGS[@]}"

      - name: Independent headline reproduction preflight
        shell: bash
        run: |
          set -euo pipefail
          python papers/paper-04-verified-scientific-discovery/host/independent_reproduce.py \
            --protected-manifest "$RUNNER_TEMP/prep/protected_manifest.jsonl" \
            --orion-output "$RUNNER_TEMP/outputs/orion-1.jsonl" \
            --baseline-output "$RUNNER_TEMP/outputs/baselines-1.jsonl" \
            --panel "$RUNNER_TEMP/evaluation/authority_benchmark_panel.json" \
            --summary "$RUNNER_TEMP/evaluation/campaign_summary.json" \
            --output "$RUNNER_TEMP/reproduction_receipt.json" \
            --campaign-run-id "preflight-${GITHUB_RUN_ID}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          summary = json.loads((root / 'evaluation' / 'campaign_summary.json').read_text())
          receipt = json.loads((root / 'reproduction_receipt.json').read_text())
          assert summary['panel_pass'] is True
          assert summary['H1']['status'] == 'PASS'
          assert summary['H2']['status'] == 'PASS'
          assert receipt['headline_reproduced'] is True
          print('PRE-FREEZE TEST ONLY — not publication evidence')
          print(json.dumps({
              'typed_panel_status': summary['typed_panel_status'],
              'H1': summary['H1'],
              'H2': summary['H2'],
              'H3': summary['H3'],
              'comparator': summary['strongest_frozen_comparator'],
          }, indent=2, sort_keys=True))
          PY
