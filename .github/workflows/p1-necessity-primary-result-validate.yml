name: p1-necessity-primary-result-validate

on:
  pull_request:
    branches:
      - main
      - shadow/p1-necessity-execution-freeze-20260817
    paths:
      - '.github/workflows/p1-necessity-primary-result-validate.yml'
      - '.github/workflows/p1-necessity-primary-result.yml'
      - 'research/revival/p1/confirmatory/v2.2/PRIMARY_*_FREEZE.json'
      - 'research/revival/p1/confirmatory/v2.2/primary/**'
      - 'research/revival/p1/confirmatory/v2.2/replication/**'
      - 'research/revival/p1/confirmatory/v2.2/PRIMARY_REPLICATION_CONCORDANCE.json'
      - 'research/revival/p1/verify_mutation_necessity_independent.py'
      - 'research/revival/p1/run_mutation_necessity_campaign.py'
      - 'research/revival/p1/freeze_mutation_necessity_worlds.py'
      - 'research/revival/p1/validate_mutation_necessity_amendment_chain.py'
      - 'src/orion/study/p1_causal/absorbed_mechanics.py'
      - 'src/orion/study/p1_causal/necessity_*.py'

permissions:
  contents: read

jobs:
  primary-outcome:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Verify immutable execution prerequisites
        run: |
          test -f research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json
          test -f research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE_V3.json
          python - <<'PY'
          import json
          from pathlib import Path
          w=json.loads(Path('research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json').read_text())
          e=json.loads(Path('research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE_V3.json').read_text())
          assert w['protocol_version']==e['protocol_version']=='P1.epistemic-mutation-necessity.v2.2.4'
          assert w['protocol_chain']['chain_sha256']==e['protocol_chain_sha256']
          assert w['n']==e['n']==2882
          assert w['public_sha256']==e['public_sha256']
          assert w['protected_response_matrix_sha256']==e['protected_response_matrix_sha256']
          assert w['arms_executed'] is False and w['outcome_accessed'] is False
          assert e['arms_executed'] is False and e['outcome_accessed'] is False
          PY
      - name: Replay exact frozen worlds
        run: |
          rm -rf /tmp/p1-worlds /tmp/p1-result
          python research/revival/p1/freeze_mutation_necessity_worlds.py --outdir /tmp/p1-worlds
          python research/revival/p1/validate_mutation_necessity_amendment_chain.py \
            --repo-root . \
            --fresh-world-freeze /tmp/p1-worlds/WORLD_FREEZE.json \
            --out /tmp/p1-worlds/AMENDMENT_CHAIN_VALIDATION.json
          cp research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json \
            /tmp/p1-worlds/WORLD_FREEZE.json
      - name: Execute frozen primary outcome read-only
        run: |
          python research/revival/p1/run_mutation_necessity_campaign.py \
            --world-dir /tmp/p1-worlds \
            --execution-freeze research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE_V3.json \
            --outdir /tmp/p1-result
      - name: Emit immutable primary terminal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/p1-result/RESULT.json').read_text())
          assert p['terminal'] in {'P1_MUTATION_NECESSITY_SUPPORTED','P1_MUTATION_NECESSITY_NOT_SUPPORTED'}
          print(json.dumps({
              'terminal':p['terminal'],
              'all_support_gates_pass':p['analysis']['all_support_gates_pass'],
              'gates':p['analysis']['gates'],
              'h1_hidden_shift':p['analysis']['h1_hidden_shift'],
              'h1_holm':p['analysis']['h1_holm'],
              'h2_control_success':p['analysis']['h2_control_success'],
              'h2_unnecessary_reframe_count':p['analysis']['h2_full_unnecessary_reframe_count'],
              'whole_grid_success':p['analysis']['whole_grid_success'],
              'cost':p['analysis']['cost'],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-necessity-v2-2-4-primary-readonly
          path: /tmp/p1-result/
          if-no-files-found: error
