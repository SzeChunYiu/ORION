name: shadow-davenport-c7-cycle3

on:
  push:
    branches:
      - shadow/davenport-c7-frontier-20260903
    paths:
      - .github/workflows/shadow-davenport-c7-cycle3.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ingest-plan-and-recurse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/orion-research-harness/pyproject.toml
      - name: Install canonical ORION and harness
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Restore exact cycle-2 workspace
        uses: actions/download-artifact@v4
        with:
          name: davenport-c7-harness-cycle2
          path: .cycle2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: SzeChunYiu/ORION
          run-id: 33758980026
      - name: Ingest exact search-plan response
        run: |
          set -euo pipefail
          rm -rf .research .cycle3-logs
          cp -a .cycle2/.research .research
          mkdir -p .cycle3-logs
          orion-harness show-request .research hostreq:68b7ea4970bed4fdd2f5fbbbe571dca593cbd50fd473f44db06d8e3e94c01c43 | tee .cycle3-logs/request.json
          orion-harness ingest .research hostreq:68b7ea4970bed4fdd2f5fbbbe571dca593cbd50fd473f44db06d8e3e94c01c43 \
            --file research/experiments/davenport-c7-frontier/host-results/cycle2-search-plan.json \
            --executor 'chatgpt:gpt-5.6-sol' | tee .cycle3-logs/ingest.json
      - name: Re-run canonical recursive solver
        shell: bash
        run: |
          set +e
          orion-harness solve .research c7-d3 \
            --max-iterations 2 \
            --max-recursion-depth 5 \
            --max-recursive-nodes 32 \
            --max-children-per-residual 12 \
            --max-children-per-problem 12 | tee .cycle3-logs/solve.json
          rc=${PIPESTATUS[0]}
          echo "$rc" > .cycle3-logs/solve-exit-code.txt
          orion-harness pending .research | tee .cycle3-logs/pending.json
          orion-harness handoff .research | tee .cycle3-logs/handoff.txt
          exit 0
      - name: Upload next immutable workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davenport-c7-harness-cycle3
          include-hidden-files: true
          path: |
            .research
            .cycle3-logs
            research/experiments/davenport-c7-frontier/FRAME_V1.md
            research/experiments/davenport-c7-frontier/host-results/cycle1-decomposition.json
            research/experiments/davenport-c7-frontier/host-results/cycle2-search-plan.json
          if-no-files-found: error
          retention-days: 14
