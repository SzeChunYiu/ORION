name: p2x-promotion-integrity-repair

on:
  pull_request:
    paths:
      - 'papers/paper-02-open-world-scientific-discovery/scripts/repair_p2x_promotion_integrity.py'
      - '.github/workflows/p2x-promotion-integrity-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p2x-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/p2x-claim-literature-integrity-20260819
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,candidates]'
      - name: Apply deterministic static P2-X promotion repair
        run: python papers/paper-02-open-world-scientific-discovery/scripts/repair_p2x_promotion_integrity.py
      - name: Bind fetch registry to the exact titles already promoted in the bibliography
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('papers/paper-02-open-world-scientific-discovery/evidence/literature/fetch_literature_evidence.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'KnowPlan: An Actionable Knowledge Graph for Planning-grounded Retrieval-Augmented Generation': 'KNOWPLAN: An Information-Efficient Neuro-Symbolic Architecture for Zero-Retraining Data Engineering',
              'Do Not Stop Too Early: An Information-Looking Framework for Adaptive Reliability in Deep Research': "Don't Stop Early: Scalable Enterprise Deep Research with Controlled Information Flow and Evidence-Aware Termination",
              'Confidence Based Stopping Criteria for Reinforcement Learning': 'Confidence-Based Stopping Methods for Systematic Reviews',
              'iCORE: A Cost Reduction Engine for Computer Use Agents via Internalized Execution': 'Auditing Emergent LLM-Agent Collaboration through Cooperation-Obligation Coupling',
              'Intent Modeling for Customer Support with Scientific Computing and NLP': 'Toward a Science of Intent: Closure Gaps and Delegation Envelopes for Open-World AI Agents',
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise SystemExit(f'P2-X fetcher title not found for replacement: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Fetch live evidence for newly promoted P2-X bibliography entries
        run: >-
          python papers/paper-02-open-world-scientific-discovery/evidence/literature/fetch_literature_evidence.py
          knowplan2026 donotstopearly2026 confidencebasedstop2026 icore2026 scienceintent2026
      - name: Disclose any live-fetch mismatch or CANNOT_CHECK without laundering it
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = Path('papers/paper-02-open-world-scientific-discovery/evidence/literature')
          audit = Path('papers/paper-02-open-world-scientific-discovery/notes/NEAREST_WORK_AUDIT_2026-08.md')
          keys = [
              'knowplan2026',
              'donotstopearly2026',
              'confidencebasedstop2026',
              'icore2026',
              'scienceintent2026',
          ]
          bad = []
          for key in keys:
              record = json.loads((evidence / f'{key}.json').read_text(encoding='utf-8'))
              verdict = record.get('verdict')
              if verdict in {'MISMATCH', 'CANNOT_CHECK'}:
                  bad.append((key, verdict, record.get('verdict_reason', '')))
          if bad:
              text = audit.read_text(encoding='utf-8')
              summary = '; '.join(f'{k}={v}' for k, v, _ in bad)
              line = f'P2-X promotion live-fetch disclosure: {summary}. See evidence/literature records for exact reasons.'
              if line not in text:
                  audit.write_text(text.rstrip() + '\n\n' + line + '\n', encoding='utf-8')
              print('P2_X_LITERATURE_NONVERIFIED=' + summary)
          else:
              print('P2_X_LITERATURE_ALL_VERIFIED=true')
          PY
      - name: Verify claim ledger fail-closed
        run: python papers/paper-02-open-world-scientific-discovery/scripts/check_claim_ledger.py --check
      - name: Run focused P2 integrity and P2-X result tests
        run: >-
          pytest -q
          tests/unit/p2/test_p2_claim_ledger.py
          tests/unit/p2/test_p2_literature_closure.py
          tests/unit/study/p2_open_world/test_p2_x_protected_results.py
      - name: Refresh journal-package hashes after bounded bookkeeping changes
        run: python research/paper-programme-v1/journal_package/check_journal_package.py --write-hashes
      - name: Recheck journal packages
        run: python research/paper-programme-v1/journal_package/check_journal_package.py
      - name: Commit verified P2 integrity repair to repair branch
        run: |
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            papers/paper-02-open-world-scientific-discovery \
            tests/unit/p2/test_p2_claim_ledger.py
          git commit -m 'P2: synchronize P2-X claim and literature evidence' || true
          git push origin HEAD:repair/p2x-claim-literature-integrity-20260819
