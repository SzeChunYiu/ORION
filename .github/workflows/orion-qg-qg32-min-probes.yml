name: orion-qg-qg32-min-probes
on:
  pull_request:
    paths:
      - 'development/orion-qg-regime-geometry/QG32_*'
      - 'development/orion-qg-regime-geometry/qg32_*'
      - 'development/orion-qg-regime-geometry/run_qg32_dual_harness.py'
      - 'research/extensions/orion-qg/qg32_*'
      - '.github/workflows/orion-qg-qg32-min-probes.yml'
  workflow_dispatch:
concurrency:
  group: orion-qg-qg32-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  minimum-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,candidates]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Execute dual harness
        run: |
          set -o pipefail
          mkdir -p artifacts
          python development/orion-qg-regime-geometry/run_qg32_dual_harness.py | tee artifacts/orion-qg-qg32-summary.json
      - name: Deterministic analyzer replay
        run: |
          python research/extensions/orion-qg/qg32_min_separating_probes.py --output artifacts/orion-qg-qg32-replay.json > artifacts/orion-qg-qg32-replay.log
          cmp artifacts/orion-qg-qg32-min-probes.json artifacts/orion-qg-qg32-replay.json
      - name: Self-consistent probe tamper must be rejected
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          src=Path('artifacts/orion-qg-qg32-min-probes.json')
          d=json.loads(src.read_text())
          probes=list(d['selected_probe_indices'])
          assert probes
          d['selected_probe_indices']=probes[:-1]
          d['selected_separates_715']=False
          u={k:v for k,v in d.items() if k!='result_digest'}
          raw=json.dumps(u,sort_keys=True,separators=(',',':'),allow_nan=False)
          d['result_digest']=hashlib.sha256(raw.encode()).hexdigest()
          Path('artifacts/orion-qg-qg32-tampered.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          python development/orion-qg-regime-geometry/qg32_generic_verify.py --input artifacts/orion-qg-qg32-tampered.json --output artifacts/orion-qg-qg32-tampered-verify.json > artifacts/orion-qg-qg32-tampered-verify.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/orion-qg-qg32-tampered-verify.json').read_text())
          assert d['decision']=='REJECT' and d['all_checks'] is False
          PY
      - name: Enforce minimum-probe authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/orion-qg-qg32-min-probes.json').read_text())
          g=json.loads(Path('artifacts/orion-qg-qg32-generic-verification.json').read_text())
          n=json.loads(Path('artifacts/orion-qg-qg32-native-verification.json').read_text())
          d=json.loads(Path('artifacts/orion-qg-qg32-dual-harness.json').read_text())
          strong='QG32_MINIMUM_FIXED_PROBE_BASIS_ABOVE_JOINT_BULK_SPECTRUM_MACHINE_CHECKED'
          assert d['terminal']==strong and d['both_accept'] is True
          assert all(a['parent_checks'].values())
          assert a['PRODUCTION_MILP_MINIMUM_OPTIMAL'] is True
          assert a['selected_separates_715'] is True
          assert a['minimum_probe_cardinality']==len(a['selected_probe_indices'])
          assert 'NO_LEX_AUTHORITY' in a['selected_canonicalization']
          assert g['decision']=='ACCEPT_MINIMUM_FIXED_PROBE_BASIS' and g['all_checks'] is True
          proof=g['independent']['proof']
          assert proof['no_smaller'] is True
          assert n['decision']=='ACCEPT_MINIMUM_FIXED_PROBE_BASIS' and n['all_checks'] is True
          assert n['responsibility']=='JOINT_SUMMARY_PLUS_MINIMUM_FIXED_PROBE_ACTIVE_VERIFICATION_ONLY'
          for x in (a,g,n,d):
            assert x['MINIMUM_FULL_FINITE_OPTIMUM_PROBES'] is False
            assert x['HARDWARE_MEASUREMENT_MINIMUM'] is False
            assert x['QG28_GLOBAL_STATE_MINIMALITY'] is False
            assert x['ADAPTIVE_TREE_OPTIMALITY'] is False
            assert x['novelty_authority'] is False
            assert x['physical_quantum_advantage_claim'] is False
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-qg-qg32-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/orion-qg-qg32-*.json
            artifacts/orion-qg-qg32-*.log
            .orion-qg-qg32-generic/.orion-harness/**
            .orion-qg-qg32-native/.orion-harness/**
          include-hidden-files: true
          if-no-files-found: warn
