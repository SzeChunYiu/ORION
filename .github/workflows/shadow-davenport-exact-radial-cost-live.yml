name: shadow-davenport-exact-radial-cost-live

on:
  push:
    branches:
      - shadow/davenport-c7-frontier-20260903
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-davenport-exact-radial-cost-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run exact radial lifting cost regression
        run: python3 research/experiments/davenport-c7-frontier/check_support4_exact_radial_lifting_cost_v1.py
