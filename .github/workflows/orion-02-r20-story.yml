name: orion-02-r20-story

on:
  push:
    branches:
      - chatgpt/orion-02-r18-null-current-main-20260827
    paths:
      - 'papers/orion-02-fiberguard-finite-fibre/CURRENT_STORY_R20.md'
      - 'papers/orion-02-fiberguard-finite-fibre/CLAIM_LEDGER_R20.json'
      - 'papers/orion-02-fiberguard-finite-fibre/EVIDENCE_MANIFEST_R20.json'
      - 'papers/orion-02-fiberguard-finite-fibre/extensions/r18/**'
      - 'papers/orion-02-fiberguard-finite-fibre/extensions/r19/**'
      - '.github/workflows/orion-02-r20-story.yml'
  pull_request:
    paths:
      - 'papers/orion-02-fiberguard-finite-fibre/CURRENT_STORY_R20.md'
      - 'papers/orion-02-fiberguard-finite-fibre/CLAIM_LEDGER_R20.json'
      - 'papers/orion-02-fiberguard-finite-fibre/EVIDENCE_MANIFEST_R20.json'
      - 'papers/orion-02-fiberguard-finite-fibre/extensions/r18/**'
      - 'papers/orion-02-fiberguard-finite-fibre/extensions/r19/**'
      - '.github/workflows/orion-02-r20-story.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-integrated-story:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse and cross-check claim authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('papers/orion-02-fiberguard-finite-fibre')
          ledger = json.loads((root / 'CLAIM_LEDGER_R20.json').read_text())
          manifest = json.loads((root / 'EVIDENCE_MANIFEST_R20.json').read_text())
          story = (root / 'CURRENT_STORY_R20.md').read_text()
          r18 = json.loads((root / 'extensions/r18/R18_RECOVERY_CUSTODY.json').read_text())
          r19 = json.loads((root / 'extensions/r19/CURRENT_MAIN_CUSTODY_R19.json').read_text())

          assert ledger['schema'] == 'ORION.ORION02.ClaimLedger.R20.v1'
          assert manifest['schema'] == 'ORION.ORION02.EvidenceManifest.R20.v1'
          claim_ids = [row['claim_id'] for row in ledger['claims']]
          assert len(claim_ids) == len(set(claim_ids)) == 10
          assert ledger['global_authority'] == {
              'external_independence': 'CANNOT_CHECK',
              'journal_authority': False,
              'novelty': 'CANNOT_CHECK',
              'production_value': False,
              'submission_ready': False,
          }
          evidence_ids = [row['evidence_id'] for row in manifest['evidence']]
          assert len(evidence_ids) == len(set(evidence_ids)) == 5
          expected = {
              'R11_STATIC_ASLIB': 'FIBERGUARD_ASLIB_SAT12_ALL_PASS',
              'R14_HELDOUT_EQUALITY': 'FIBERGUARD_ASLIB_HELDOUT_R14_PARTIAL_MEAN_ONLY',
              'R16_ONE_SIDED_ROUTE': 'FIBERGUARD_R16_NO_PORTABLE_CERTIFICATE_VALUE',
              'R18_PAIRED_MARGINAL_ROUTE': 'FIBERGUARD_R18_NO_PAIRED_ROUTE_VALUE',
              'R19_JOINT_ROUTE_REPAIR': 'FIBERGUARD_JOINT_ROUTE_R19_REPLACEMENT_PASS',
              'CNBR_NEIGHBORHOOD_REFUTATION': 'CERTIFICATE_INVALID',
          }
          # R19 is theorem evidence and CNBR is an application refutation; both
          # are mandatory even though the five-row manifest groups theorem and
          # application authority separately.
          observed = {row['evidence_id']: row['expected_terminal'] for row in manifest['evidence']}
          assert observed['R11_STATIC_ASLIB'] == expected['R11_STATIC_ASLIB']
          assert observed['R14_HELDOUT_EQUALITY'] == expected['R14_HELDOUT_EQUALITY']
          assert observed['R16_ONE_SIDED_ROUTE'] == expected['R16_ONE_SIDED_ROUTE']
          assert observed['R18_PAIRED_MARGINAL_ROUTE'] == expected['R18_PAIRED_MARGINAL_ROUTE']
          assert observed['R19_JOINT_ROUTE_REPAIR'] == expected['R19_JOINT_ROUTE_REPAIR']
          assert any(row['evidence_id'] == 'CNBR_NEIGHBORHOOD_REFUTATION' and row['expected_terminal'] == 'CERTIFICATE_INVALID' for row in manifest['evidence'])

          assert r18['former_positive_terminal'] == 'RETRACTED'
          assert r18['current_terminal'] == 'FIBERGUARD_R18_NO_PAIRED_ROUTE_VALUE'
          assert r18['recovery']['candidate_denominator'] == 99
          assert r19['authority']['R18_positive_terminal'] == 'RETRACTED'
          assert r19['authority']['paired_ASlib_experiment_executed'] is False
          assert r19['authority']['journal_authority'] is False

          required_story_tokens = [
              'Exact finite-fibre certificates are closed-world objects',
              'FIBERGUARD_R18_NO_PAIRED_ROUTE_VALUE',
              'CERTIFICATE_INVALID',
              'conv(P_joint)+R_+^F',
              'The negative outcomes are load-bearing results',
          ]
          for token in required_story_tokens:
              assert token in story, token
          forbidden_unqualified = [
              'journal-ready',
              'production-safe',
              'universal solver-selection improvement',
              'deterministic unseen-state certificate',
          ]
          lowered = story.lower()
          for token in forbidden_unqualified:
              assert token not in lowered, token
          print('ORION_02_R20_CLAIM_AUTHORITY_ALIGNED')
          PY

      - name: Verify exact R18 source bytes and null terminal
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/chatgpt/r18-c-paired-route-20260826
          source=FETCH_HEAD
          root='papers/five-paper-top-tier-r8/C'
          git show "$source:$root/FIBERGUARD_PAIRED_ROUTE_R18_RECOVERY_RESULTS.json" > "$RUNNER_TEMP/r18.json"
          test "$(sha256sum "$RUNNER_TEMP/r18.json" | cut -d' ' -f1)" = '8136ac6e614406a51270342d73786dfec43a9ecdac81f62e815cd14d1a739c45'
          python - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'r18.json').read_text())
          assert result['terminal']=='FIBERGUARD_R18_NO_PAIRED_ROUTE_VALUE'
          assert result['development']['candidate_count']==99
          assert result['development']['feasible_candidate_count']==0
          assert all(result[key]['selected_route']['metrics']['route_change_coverage']==0.0 for key in ('development','validation','test'))
          assert result['authority']['recovery_status']=='OUTCOME_EXPOSED_CORROBORATION'
          assert result['authority']['grants_journal_authority'] is False
          print('ORION_02_R20_R18_NULL_BOUND')
          PY

      - name: Verify exact R19 and neighborhood adverse subjects
        shell: bash
        run: |
          set -euo pipefail
          root='papers/orion-02-fiberguard-finite-fibre'
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('papers/orion-02-fiberguard-finite-fibre')
          r19=json.loads((root/'extensions/r19/JOINT_ROUTE_R19_RESULTS.json').read_text())
          assert r19['terminal']=='FIBERGUARD_JOINT_ROUTE_R19_REPLACEMENT_PASS'
          assert r19['invalid_R19_pairing_counterexample']['original_randomized_value']=='35'
          assert r19['invalid_R19_pairing_counterexample']['shortcut_randomized_value']=='70'
          assert r19['same_marginals_different_joint_system']['full_pair_randomized_value']=='0'
          assert r19['same_marginals_different_joint_system']['diagonal_pair_randomized_value']=='50'
          assert r19['authority']['paired_ASlib_experiment_executed'] is False
          print('ORION_02_R20_R19_THEOREM_BOUND')
          PY
          git fetch --no-tags origin refs/heads/r1/c-nbr-20260827
          git show FETCH_HEAD:papers/orion-02-fiberguard-finite-fibre/experiments/results/CERTIFIED_NEIGHBORHOOD_RESULT_V1.json > "$RUNNER_TEMP/cnbr.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'cnbr.json').read_text())
          assert result['schema']=='ORION02.CNBR.Result.v1'
          assert result['overall_verdict']=='CERTIFICATE_INVALID'
          assert [row['verdict'] for row in result['splits']]==['CERTIFICATE_INVALID','CERTIFICATE_INVALID']
          official,family=result['splits']
          assert official['representations']['NBR_FULL']['certificate_heldout_violation_rate']>0.10
          assert official['representations']['NBR_PCA10']['certificate_heldout_violation_rate']>0.10
          assert family['representations']['NBR_FULL']['heldout_coverage']['epsilon_5000']==0.0
          assert family['representations']['NBR_PCA10']['heldout_coverage']['epsilon_5000']==0.0
          print('ORION_02_R20_NEIGHBORHOOD_REFUTATION_BOUND')
          PY

      - name: Verify named PR custody exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pr in 1450 1457 1461 1471 1485 1486; do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '[.number,.state,.head.sha,.base.ref] | @tsv'
          done

      - name: Check diff hygiene
        run: git diff --check

      - name: Stage reviewer story packet
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/orion-02-r20-story"
          mkdir -p "$out"
          root='papers/orion-02-fiberguard-finite-fibre'
          cp "$root/CURRENT_STORY_R20.md" "$out/"
          cp "$root/CLAIM_LEDGER_R20.json" "$out/"
          cp "$root/EVIDENCE_MANIFEST_R20.json" "$out/"
          cp "$root/extensions/r18/R18_RECOVERY_CUSTODY.json" "$out/"
          cp "$root/extensions/r19/CURRENT_MAIN_CUSTODY_R19.json" "$out/"
          cp "$RUNNER_TEMP/r18.json" "$out/FIBERGUARD_PAIRED_ROUTE_R18_RECOVERY_RESULTS.json"
          cp "$RUNNER_TEMP/cnbr.json" "$out/CERTIFIED_NEIGHBORHOOD_RESULT_V1.json"
          sha256sum "$out"/* > "$out/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: orion-02-r20-story
          path: ${{ runner.temp }}/orion-02-r20-story/
          if-no-files-found: error
          retention-days: 30
