name: one-shot-r30-clean-branch-recovery

on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths: ['.github/workflows/one-shot-r30-clean-branch-recovery.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  verify-or-repair-clean-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/orion-02-r18-null-current-main-20260827
          fetch-depth: 0
      - name: Inspect clean-branch custody
        id: inspect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='chatgpt/five-paper-r30-current-main-20260827'
          sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq .commit.sha)"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100" --jq '.workflow_runs | map(select(.name=="five-paper-r30-current-main-custody")) | sort_by(.id) | reverse | .[0].id // empty')"
          test -n "$run"
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT";echo "run=$run" >> "$GITHUB_OUTPUT";echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
      - name: Preserve green clean branch
        if: steps.inspect.outputs.conclusion == 'success'
        run: echo 'Clean R30 current-main custody is green.'
      - name: Harden and retrigger failed clean custody
        if: steps.inspect.outputs.conclusion != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN: ${{ steps.inspect.outputs.run }}
        run: |
          set -euo pipefail
          branch='chatgpt/five-paper-r30-current-main-20260827'
          gh run view "$FAILED_RUN" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/failed.log" 2>&1 || true
          git fetch --no-tags origin "$branch";git checkout -B "$branch" FETCH_HEAD
          workflow='.github/workflows/five-paper-r30-current-main-custody.yml'
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/five-paper-r30-current-main-custody.yml')
          text=path.read_text()
          target="""                - name: Re-run Python and Rust exact controls\n                  shell: bash\n                  run: |\n                    set -euo pipefail\n"""
          replacement="""                - name: Re-run Python and Rust exact controls\n                  shell: bash\n                  run: |\n                    set -euo pipefail\n                    if ! command -v rustc >/dev/null 2>&1; then\n                      sudo apt-get update -qq\n                      sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends rustc\n                    fi\n"""
          if target in text:text=text.replace(target,replacement,1)
          path.write_text(text)
          PY
          mkdir -p research/five-paper-top-tier-r30
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          log=Path(os.environ['RUNNER_TEMP'],'failed.log').read_text(errors='replace')
          errors=[line for line in log.splitlines() if '##[error]' in line or re.search(r'(AssertionError|Traceback|error:|FAILED|not found|No such file)',line,re.I)]
          result={'schema':'ORION.FivePaper.R30CleanCustodyDiagnosis.v1','failed_run':int(os.environ['FAILED_RUN']),'error_excerpt':errors[:200],'authority':{'scientific_promotion':False,'journal_authority':False}}
          Path('research/five-paper-top-tier-r30/R30_CLEAN_CUSTODY_DIAGNOSIS.json').write_text(json.dumps(result,sort_keys=True,separators=(',',':'))+'\n')
          PY
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$workflow" research/five-paper-top-tier-r30/R30_CLEAN_CUSTODY_DIAGNOSIS.json
          git commit -m 'fix(R30): harden clean current-main custody replay'
          git push origin HEAD:refs/heads/$branch
