                  raise SystemExit(f'N-lane frozen blob drift: {name}: {got} != {want}')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Save committed N-lane receipts before re-execution
        run: |
          mkdir -p /tmp/nlane-committed
          cp research/extensions/orion-q/nlanes/N*_RESULTS.json /tmp/nlane-committed/
      - name: Re-run frozen N-lane closure studies
        # All 19 studies are deterministic and fast (measured 0.04s-32s each);
        # n2_f5b consumes the N2-F5 receipt so it runs after n2_f5, and every
        # script rewrites its own RESULTS file in place before the equality gate.
        run: |
          cd research/extensions/orion-q/nlanes
          {
          python n1_lower_bound.py
          python n1a_parameterized_schema_invention.py
          python n1b_failure_conditioned_grammar_growth.py
          python n1c_costly_verification_voi.py
          python n1d_representation_frame_edit.py
          python n2_f3_partial_evidence.py
          python n2_f4_access_edits.py
          python n2_f5_crossover_prediction.py
          python n2_f5b_donor_comparison.py
          python n3_a_symbolic_induction.py
          python n3_b_obligation_expansion.py
          python n3_c_operator_induction.py
          python n3_d_representation_variables.py
          python n4_a_unknown_voi.py
          python n4_b_stale_receipt_reopening.py
          python n4_c_interval_pareto.py
          python n4_d_laundering_detection.py
          python n4_e_active_experiments.py
          python n4_f3_remint_transport.py
          } | tee /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N1_LOWER_BOUND=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N1A_PARAM_SCHEMA=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N1B_GRAMMAR_GROWTH=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N1C_COSTLY_VERIFICATION=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N1D_REPRESENTATION_EDIT=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N2_F3_PARTIAL_EVIDENCE=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N2_F4_ACCESS_EDITS=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N2_F5_CROSSOVER_PREDICTION=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N2_F5B_DONOR_COMPARISON=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N3_A_SYMBOLIC_INDUCTION=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N3_B_OBLIGATION_EXPANSION=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N3_C_OPERATOR_INDUCTION=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N3_D_REPRESENTATION_VARIABLES=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N4_A_UNKNOWN_VOI=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N4_B_STALE_RECEIPT=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N4_C_INTERVAL_PARETO=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N4_D_LAUNDERING=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N4_E_ACTIVE_EXPERIMENTS=' /tmp/nlane-receipts.txt
          grep -c '^ORIONQ_N4_F3_REMINT_TRANSPORT=' /tmp/nlane-receipts.txt
      - name: Assert regenerated receipts equal committed receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipts = [
              ('ORIONQ_N1_LOWER_BOUND', 'N1_LOWER_BOUND_RESULTS.json'),
              ('ORIONQ_N1A_PARAM_SCHEMA', 'N1_A_PARAM_SCHEMA_RESULTS.json'),
              ('ORIONQ_N1B_GRAMMAR_GROWTH', 'N1_B_GRAMMAR_GROWTH_RESULTS.json'),
              ('ORIONQ_N1C_COSTLY_VERIFICATION', 'N1_C_COSTLY_VERIFICATION_RESULTS.json'),
              ('ORIONQ_N1D_REPRESENTATION_EDIT', 'N1_D_REPRESENTATION_EDIT_RESULTS.json'),
              ('ORIONQ_N2_F3_PARTIAL_EVIDENCE', 'N2_F3_PARTIAL_EVIDENCE_RESULTS.json'),
              ('ORIONQ_N2_F4_ACCESS_EDITS', 'N2_F4_ACCESS_EDITS_RESULTS.json'),
              ('ORIONQ_N2_F5_CROSSOVER_PREDICTION', 'N2_F5_CROSSOVER_PREDICTION_RESULTS.json'),
              ('ORIONQ_N2_F5B_DONOR_COMPARISON', 'N2_F5B_DONOR_COMPARISON_RESULTS.json'),
              ('ORIONQ_N3_A_SYMBOLIC_INDUCTION', 'N3_A_SYMBOLIC_INDUCTION_RESULTS.json'),
              ('ORIONQ_N3_B_OBLIGATION_EXPANSION', 'N3_B_OBLIGATION_EXPANSION_RESULTS.json'),
              ('ORIONQ_N3_C_OPERATOR_INDUCTION', 'N3_C_OPERATOR_INDUCTION_RESULTS.json'),
              ('ORIONQ_N3_D_REPRESENTATION_VARIABLES', 'N3_D_REPRESENTATION_VARIABLES_RESULTS.json'),
              ('ORIONQ_N4_A_UNKNOWN_VOI', 'N4_A_UNKNOWN_VOI_RESULTS.json'),
              ('ORIONQ_N4_B_STALE_RECEIPT', 'N4_B_STALE_RECEIPT_REOPENING_RESULTS.json'),
              ('ORIONQ_N4_C_INTERVAL_PARETO', 'N4_C_INTERVAL_PARETO_RESULTS.json'),
              ('ORIONQ_N4_D_LAUNDERING', 'N4_D_LAUNDERING_DETECTION_RESULTS.json'),
              ('ORIONQ_N4_E_ACTIVE_EXPERIMENTS', 'N4_E_ACTIVE_EXPERIMENTS_RESULTS.json'),
              ('ORIONQ_N4_F3_REMINT_TRANSPORT', 'N4_F3_REMINT_TRANSPORT_RESULTS.json'),
          ]
          lines = Path('/tmp/nlane-receipts.txt').read_text().splitlines()

          def canonical(obj):
              return json.dumps(obj, sort_keys=True, separators=(',', ':'), allow_nan=False)

          regenerated = Path('research/extensions/orion-q/nlanes')
          committed = Path('/tmp/nlane-committed')
          for prefix, results_name in receipts:
              rows = [x for x in lines if x.startswith(prefix + '=')]
              if len(rows) != 1:
                  raise SystemExit(f'expected exactly one {prefix} receipt line, got {len(rows)}')
              json.loads(rows[0][len(prefix) + 1:])  # receipt line must be valid JSON
              new = json.loads((regenerated / results_name).read_text())
              old = json.loads((committed / results_name).read_text())
              if canonical(new) != canonical(old):
                  raise SystemExit(f'N-lane receipt drift: regenerated {results_name} != committed receipt')
              print(f'N_LANE_RECEIPT_MATCH={results_name}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orion-q-nlane-closure-receipts
          path: /tmp/nlane-receipts.txt
          if-no-files-found: warn
          retention-days: 30
