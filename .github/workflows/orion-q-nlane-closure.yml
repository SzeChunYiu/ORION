              'development/orion-q-nlane-closure/N3_A_SYMBOLIC_INDUCTION_PROTOCOL.md': 'dbe2d6209d7d212f954b0d23ea96b8e1f7873d58',
              'development/orion-q-nlane-closure/N3_B_OBLIGATION_EXPANSION_PROTOCOL.md': '7b9b60cd3327bdbe8557b8ce758e06dc301ff898',
              'development/orion-q-nlane-closure/N3_CLOSURE.md': 'b7d8186035e3a61467632a726345cd5f87a95b8e',
              'development/orion-q-nlane-closure/N3_C_OPERATOR_INDUCTION_PROTOCOL.md': '73fa01b9523888938bad8f65aa54588309a2718f',
              'development/orion-q-nlane-closure/N3_D_REPRESENTATION_VARIABLES_PROTOCOL.md': 'd2fa2419c4b9ff194dcf145a119e6a615970b374',
              'development/orion-q-nlane-closure/N4_A_UNKNOWN_VOI_PROTOCOL.md': 'dcfdad46ad0c4d1d554b3683ac59957a067369bc',
              'development/orion-q-nlane-closure/N4_B_STALE_RECEIPT_REOPENING_PROTOCOL.md': 'e5bc184bed1a6ad88491236d7a259aacf3f0693a',
