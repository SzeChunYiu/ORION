  group: orion-q-nlane-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  frozen-nlane-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Refuse N-lane frozen blob drift
