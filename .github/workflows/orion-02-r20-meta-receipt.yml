name: orion-02-r20-meta-receipt

on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths:
      - 'papers/orion-02-fiberguard-finite-fibre/INTERNAL_RELEASE_RECEIPT_R20.json'
      - '.github/workflows/orion-02-r20-meta-receipt.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  bind-current-internal-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Poll and bind required workflow runs
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,time,urllib.parse,urllib.request
          from pathlib import Path
          branch='chatgpt/orion-02-r18-null-current-main-20260827'
          required={
            'orion-02-r18-recovery-null-custody',
            'orion-02-r20-internal-release-gate',
            'orion-02-r20-visual-pdf-audit',
            'orion-02-r20-cross-language-rust',
            'orion-02-r20-retraction-audit',
            'orion-02-aslib-rights-audit-r20',
            'nq-pr1472-exact-subject-audit-r20',
            'ab-pr1469-production-registry-audit-r20',
            'd-pr1466-first-mixing-audit-r20',
            'q1-pr1449-resource-audit-r20',
            'five-paper-blocker-audit-r20',
          }
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'ORION-R20-meta-receipt'}
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?branch={urllib.parse.quote(branch,safe='')}&per_page=100"
          deadline=time.time()+1500
          snapshot={}
          while True:
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as response:data=json.load(response)
            latest={}
            for row in sorted(data['workflow_runs'],key=lambda item:item['id'],reverse=True):latest.setdefault(row['name'],row)
            snapshot={name:({'id':latest[name]['id'],'status':latest[name]['status'],'conclusion':latest[name]['conclusion'],'head_sha':latest[name]['head_sha'],'event':latest[name]['event'],'html_url':latest[name]['html_url']} if name in latest else {'status':'missing','conclusion':None}) for name in sorted(required)}
            pending=[name for name,row in snapshot.items() if row['status'] in {'queued','in_progress','waiting','requested'}]
            missing=[name for name,row in snapshot.items() if row['status']=='missing']
            if not pending and not missing:break
            if time.time()>=deadline:break
            time.sleep(30)
          all_green=all(row['status']=='completed' and row['conclusion']=='success' for row in snapshot.values())
          receipt_path=Path('papers/orion-02-fiberguard-finite-fibre/INTERNAL_RELEASE_RECEIPT_R20.json')
          if not receipt_path.is_file():raise SystemExit('strict internal release receipt absent')
          internal=json.loads(receipt_path.read_text())
          result={'schema':'ORION.ORION02.InternalWorkflowMetaReceipt.R20.v1','branch':branch,'executed_subject_commit':internal['executed_subject_commit'],'internal_release_terminal':internal['terminal'],'required_workflows':snapshot,'all_required_internal_workflows_green':all_green,'terminal':'ORION02_R20_INTERNAL_WORKFLOW_META_PASS__EXTERNAL_GATES_OPEN' if all_green else 'ORION02_R20_INTERNAL_WORKFLOW_META_NOT_GREEN','authority':{'external_independence':False,'novelty':False,'rights_complete':False,'journal_authority':False,'submission_authorized':False}}
          Path(os.environ['RUNNER_TEMP'],'META_RECEIPT.json').write_text(json.dumps(result,sort_keys=True,separators=(',',':'))+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          if not all_green:raise SystemExit('required internal workflows not all green')
          PY
      - name: Publish durable meta receipt once
        if: github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/orion-02-r18-null-current-main-20260827'
        shell: bash
        run: |
          set -euo pipefail
          path='papers/orion-02-fiberguard-finite-fibre/INTERNAL_WORKFLOW_META_R20.json'
          if [ ! -e "$path" ]; then
            cp "$RUNNER_TEMP/META_RECEIPT.json" "$path"
            git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$path";git commit -m 'results(ORION-02): bind R20 internal workflow meta receipt';git push origin HEAD:refs/heads/chatgpt/orion-02-r18-null-current-main-20260827
          else
            cmp "$RUNNER_TEMP/META_RECEIPT.json" "$path"
            echo 'meta receipt already present'
          fi
      - name: Stage meta receipt artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/orion-02-r20-meta-receipt";mkdir -p "$out";cp "$RUNNER_TEMP/META_RECEIPT.json" "$out/" || true;sha256sum "$out"/* > "$out/SHA256SUMS" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: orion-02-r20-meta-receipt, path: '${{ runner.temp }}/orion-02-r20-meta-receipt/', if-no-files-found: warn, retention-days: 30}
