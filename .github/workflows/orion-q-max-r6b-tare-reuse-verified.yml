name: orion-q-max-r6b-tare-reuse-verified

on:
  pull_request:
    paths:
      - 'development/orion-q-max-r0/MAX_R6B_TARE_TRANSFORMATION_REUSE_DONOR_ABSORPTION_PROTOCOL.md'
      - 'research/extensions/orion-q/max_r6b_tare_transformation_reuse_donor.py'
      - 'research/extensions/orion-q/max_r6b_tare_transformation_reuse_donor_verified.py'
      - 'research/extensions/orion-q/max_r6_p10_candidate_blind_frame_optimizer.py'
      - 'research/extensions/orion-q/max_r6_exact_tare3_joint_frame_dp.py'
      - '.github/workflows/orion-q-max-r6b-tare-reuse-verified.yml'
  workflow_dispatch:

concurrency:
  group: orion-q-max-r6b-tare-reuse-verified-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frozen-donor-reuse-search-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run frozen donor search with corrected hostile verifier
        run: |
          cd research/extensions/orion-q
          python max_r6b_tare_transformation_reuse_donor_verified.py | tee /tmp/r6b-tare-reuse-verified.txt
          grep '^ORIONQ_MAX_R6B_TARE_REUSE=' /tmp/r6b-tare-reuse-verified.txt
      - name: Enforce receipt integrity without coercing scientific sign
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          prefix = 'ORIONQ_MAX_R6B_TARE_REUSE='
          lines = [
              line for line in Path('/tmp/r6b-tare-reuse-verified.txt').read_text().splitlines()
              if line.startswith(prefix)
          ]
          if len(lines) != 1:
              raise SystemExit(f'expected exactly one R6B receipt, got {len(lines)}')
          payload = json.loads(lines[0][len(prefix):])
          gates = payload.get('gates')
          if not isinstance(gates, dict) or not gates:
              raise SystemExit('missing R6B gate map')
          supported = payload.get('development_supported') is True
          conjunction = all(value is True for value in gates.values())
          if supported != conjunction:
              raise SystemExit('R6B support bit does not equal frozen gate conjunction')
          if payload.get('reserved_stretched_n2_accessed') is not False:
              raise SystemExit('R6B donor search accessed protected stretched N2')
          if payload.get('novelty_credit') is not False:
              raise SystemExit('donor-owned TARE reuse was incorrectly assigned novelty credit')
          hostile = payload.get('hostile', {})
          if hostile.get('all_pass') is not True:
              raise SystemExit(f'R6B hostile verification failed: {hostile}')
          print('R6B_VERIFIED_SCIENTIFIC_SIGN=' + ('POSITIVE' if supported else 'NEGATIVE'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orion-q-max-r6b-tare-reuse-verified-receipt
          path: /tmp/r6b-tare-reuse-verified.txt
          if-no-files-found: warn
          retention-days: 30
