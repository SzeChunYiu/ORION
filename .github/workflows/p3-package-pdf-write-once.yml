name: p3-package-pdf-write-once

on:
  push:
    branches:
      - cleanup/p3-scoped-ready-2026-08-18
    paths:
      - .github/workflows/p3-package-pdf-write-once.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/p3-scoped-ready-2026-08-18
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python and TeX toolchains
        run: |
          python -m pip install -e '.[dev,candidates]'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-pictures texlive-fonts-recommended poppler-utils

      - name: Reconcile publication-scoreboard expectation for scoped P3
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_publication_status.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'def test_p1_p2_and_p4_are_peer_review_ready_and_others_are_blocked():',
              'def test_p1_through_p4_are_peer_review_ready_and_p5_is_blocked():'
          )
          start = text.index('    """P2 joined P1 and P4 when its terminal line stopped naming two terminals.')
          end = text.index('    module = _load_module()', start)
          replacement = '''    """P3 joins P1/P2/P4 only after its bounded artifact gate is real.\n\n    This does not treat the retired eight-family/raw-text programme as executed.\n    P3 is ready only on the scoped P3.C5/P3.C9 claim, with its own attestation,\n    tracked checksummed PDF and exact-head manuscript audit. P5 remains blocked.\n    """\n\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              'for paper_id in ("P1", "P2", "P4"):',
              'for paper_id in ("P1", "P2", "P3", "P4"):'
          )
          text = text.replace(
              'for paper_id in ("P3", "P5"):',
              'for paper_id in ("P5",):'
          )
          text = text.replace(
              'assert derived["programme"]["papers_peer_review_ready"] == ["P1", "P2", "P4"]',
              'assert derived["programme"]["papers_peer_review_ready"] == ["P1", "P2", "P3", "P4"]'
          )
          text = text.replace(
              '# Still false: two papers remain blocked, so the programme does not close.',
              '# Still false: P5 remains blocked, so the programme does not close.'
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile exact scoped manuscript PDF
        working-directory: papers/paper-03-global-knowledge-portrait/manuscript
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          if grep -E 'LaTeX Warning: (Citation|Reference).*(undefined)|There were undefined references|undefined citations|multiply defined' main.log; then
            echo 'Unresolved or duplicate LaTeX reference/citation remains after convergence.' >&2
            exit 1
          fi
          pdfinfo main.pdf

      - name: Bind tracked PDF and claim audit
        run: |
          set -euo pipefail
          paper='papers/paper-03-global-knowledge-portrait'
          cp "$paper/manuscript/main.pdf" "$paper/journal_package/manuscript.pdf"
          pdf_sha=$(sha256sum "$paper/journal_package/manuscript.pdf" | awk '{print $1}')
          pages=$(pdfinfo "$paper/journal_package/manuscript.pdf" | awk '/^Pages:/ {print $2}')
          bytes=$(stat -c '%s' "$paper/journal_package/manuscript.pdf")
          cat > "$paper/journal_package/CLAIM_PDF_AUDIT.md" <<EOF
          # ORION-P3 independent claim / PDF audit

          Build input commit: \`${GITHUB_SHA}\`.
          Manuscript audit source commit: \`403e10016345656c93aadafa30048dc0a62e7363\` (green \`p3-manuscript-audit\` source head).
          Tracked PDF: \`journal_package/manuscript.pdf\`.
          PDF SHA256: \`${pdf_sha}\`.
          Pages: \`${pages}\`; bytes: \`${bytes}\`.

          | ID | Claim | Artifact | Status |
          |---|---|---|---|
          | P3.C5 | Disjoint confirmatory mapping n=32; false-merge 0 vs 0.1875 | \`evidence/public-reference-v1.1-confirmatory/CONFIRMATORY_ANALYSIS.json\` | BOUNDED |
          | P3.C7 | Raw-text end-to-end integration superiority | excluded follow-up in claim ledger | CANNOT_CHECK / NOT_CLAIMED |
          | P3.C8 | Downstream answer-quality improvement | excluded follow-up in claim ledger | CANNOT_CHECK / NOT_CLAIMED |
          | P3.STRUCTURE | Exact-ground-truth method-projection non-vacuity pilot | \`research/extensions/p1-p3-structure/RESULTS_V1.json\` | BOUNDED |
          | P3.PDF | Canonical scoped PDF compiled with converged references/citations and rendered audit | \`journal_package/manuscript.pdf\` | SUPPORTED |

          The PDF claim is scoped to the manuscript actually built here. It does not complete or imply the retired eight-family expert/raw-text study.
          EOF

      - name: Regenerate exact P3 package hashes and publication scoreboard
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          paper = Path('papers/paper-03-global-knowledge-portrait')
          manifest = json.loads((paper/'journal_package/MANIFEST.json').read_text(encoding='utf-8'))
          docs = ['MANIFEST.json','COMPILE.md','LICENSE.md','CLAIM_PDF_AUDIT.md','README.md']
          paths = [f'journal_package/{name}' for name in docs]
          for item in manifest['required_files']:
              rel = item['path']
              if rel not in paths:
                  paths.append(rel)
          lines = []
          for rel in paths:
              target = paper/rel
              if not target.is_file():
                  raise SystemExit(f'missing required hash target: {rel}')
              h = hashlib.sha256(target.read_bytes()).hexdigest()
              lines.append(f'{h}  {rel}')
          (paper/'journal_package/SHA256SUMS').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY
          python research/publication/scoreboard.py --write

      - name: Run package and scoreboard gates before commit
        run: |
          python research/paper-programme-v1/journal_package/check_journal_package.py --root .
          pytest -q tests/test_publication_status.py tests/unit/publication/test_journal_package.py

      - name: Commit exact generated package and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/p3-package-pdf-write-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'P3: bind exact audited PDF and readiness scoreboard'
          git push origin HEAD:cleanup/p3-scoped-ready-2026-08-18
