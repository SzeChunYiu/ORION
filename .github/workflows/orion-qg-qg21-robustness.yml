name: orion-qg-qg21-robustness
on:
  pull_request:
    paths:
      - 'development/orion-qg-regime-geometry/QG21_*'
      - 'development/orion-qg-regime-geometry/qg21_*'
      - 'development/orion-qg-regime-geometry/run_qg21_dual_harness.py'
      - 'research/extensions/orion-qg/qg21_*'
      - '.github/workflows/orion-qg-qg21-robustness.yml'
  workflow_dispatch:
concurrency:
  group: orion-qg-qg21-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,candidates]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Execute dual harness
        run: |
          set -o pipefail
          mkdir -p artifacts
          python development/orion-qg-regime-geometry/run_qg21_dual_harness.py | tee artifacts/orion-qg-qg21-summary.json
      - name: Deterministic analyzer replay
        run: |
          python research/extensions/orion-qg/qg21_regime_robustness.py --output artifacts/orion-qg-qg21-replay.json > artifacts/orion-qg-qg21-replay.log
          cmp artifacts/orion-qg-qg21-regime-robustness.json artifacts/orion-qg-qg21-replay.json
      - name: Enforce authority separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/orion-qg-qg21-regime-robustness.json').read_text())
          g=json.loads(Path('artifacts/orion-qg-qg21-generic-verification.json').read_text())
          n=json.loads(Path('artifacts/orion-qg-qg21-native-verification.json').read_text())
          d=json.loads(Path('artifacts/orion-qg-qg21-dual-harness.json').read_text())
          pos='QG21_CERTIFIED_REGIME_ROBUSTNESS_RADIUS_MACHINE_CHECKED'
          assert a['terminal']==pos and a['certificate_margin_authority'] is True
          assert a['qg8']['O0']['linf_fixed_tr_radius']=='0'
          assert a['qg8']['O2']['linf_fixed_tr_radius']=='0'
          assert a['qg16']['O_in']['linf_fixed_tr_radius']=='1/2'
          assert a['qg16']['O_in']['active_facet']=='c_plus_nc_minus_2r_minus_2tag'
          assert g['decision']=='ACCEPT_CERTIFICATE_ROBUSTNESS' and g['all_checks'] is True
          assert n['decision']=='ACCEPT_CERTIFICATE_ROBUSTNESS' and n['all_checks'] is True
          assert d['terminal']==pos and d['both_accept'] is True
          for x in (a,g,n,d):
            assert x.get('novelty_authority') is False
            assert x.get('r6_authority') is False
            assert x.get('physical_quantum_advantage_claim') is False
          assert a['true_phase_boundary']=='OPEN'
          assert n['TRUE_PHASE_BOUNDARY'] is False and d['TRUE_PHASE_BOUNDARY'] is False
          PY
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-qg-qg21-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/orion-qg-qg21-*.json
            artifacts/orion-qg-qg21-*.log
            .orion-qg-qg21-generic/.orion-harness/**
            .orion-qg-qg21-native/.orion-harness/**
          include-hidden-files: true
          if-no-files-found: warn
