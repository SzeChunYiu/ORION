name: p8-normative-content-rebind-once

on:
  push:
    branches:
      - promote/p8-chain-theorem-current-main

permissions:
  contents: write

jobs:
  rebind-once:
    if: ${{ !contains(github.event.head_commit.message, 'bind P8 chain-theorem authority bytes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/p8-chain-theorem-current-main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate with the normative P6-P8 binder
        run: |
          set -euo pipefail
          python papers/candidates/checkers/check_content_binding_v1.py --write
          python papers/candidates/checkers/check_content_binding_v1.py --check

      - name: Commit only P8 binding and remove one-shot helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            papers/paper-08-epistemic-authority-autonomous-science/CONTENT_MANIFEST_V1.json \
            papers/paper-08-epistemic-authority-autonomous-science/SHA256SUMS
          git rm -f \
            .github/workflows/p8-content-rebind-audit-once.yml \
            .github/workflows/p8-normative-content-rebind-once.yml
          git commit -m 'bind P8 chain-theorem authority bytes'
          git push origin HEAD:promote/p8-chain-theorem-current-main
