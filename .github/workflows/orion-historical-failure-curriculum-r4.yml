name: orion-historical-failure-curriculum-r4

on:
  pull_request:
    paths:
      - 'research/negative-recovery/R4_HISTORICAL_FAILURE_CURRICULUM_PROTOCOL_V1.md'
      - 'research/negative-recovery/HISTORICAL_FAILURE_CURRICULUM_V1.json'
      - 'development/orion-research-harness/run_historical_failure_curriculum_r4.py'
      - '.github/workflows/orion-historical-failure-curriculum-r4.yml'
  workflow_dispatch:

concurrency:
  group: orion-historical-failure-curriculum-r4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  historical-curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed learner dependencies
        run: python -m pip install 'scikit-learn==1.8.0'
      - name: Run blind historical failure curriculum twice
        run: |
          python development/orion-research-harness/run_historical_failure_curriculum_r4.py | tee /tmp/r4-run1.txt
          cp artifacts/orion-historical-failure-curriculum-r4.json /tmp/r4-result1.json
          python development/orion-research-harness/run_historical_failure_curriculum_r4.py | tee /tmp/r4-run2.txt
          cmp /tmp/r4-result1.json artifacts/orion-historical-failure-curriculum-r4.json
          grep '^ORION_HISTORICAL_FAILURE_CURRICULUM_R4=' /tmp/r4-run1.txt
      - name: Enforce frozen integrity and inspectable terminal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('artifacts/orion-historical-failure-curriculum-r4.json').read_text())
          if p.get('record_count') != 30 or p.get('class_count') != 6:
              raise SystemExit('historical curriculum cardinality drift')
          if p.get('leakage_failures'):
              raise SystemExit('historical candidate payload leakage detected')
          gates=p.get('gates')
          if not isinstance(gates,dict) or not gates:
              raise SystemExit('historical curriculum gate map missing')
          allowed={'ORION_HISTORICAL_FAILURE_CURRICULUM_REPAIR_RESPONSIBILITY_SUPPORTED','ORION_HISTORICAL_FAILURE_CURRICULUM_REPAIR_RESPONSIBILITY_NOT_SUPPORTED'}
          if p.get('terminal') not in allowed:
              raise SystemExit(f"unexpected historical terminal: {p.get('terminal')!r}")
          if p['terminal'].endswith('_SUPPORTED') and not all(gates.values()):
              raise SystemExit('positive historical terminal contains failed gate')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orion-historical-failure-curriculum-r4
          path: |
            artifacts/orion-historical-failure-curriculum-r4.json
            /tmp/r4-result1.json
            /tmp/r4-run1.txt
            /tmp/r4-run2.txt
          if-no-files-found: warn
          retention-days: 30
