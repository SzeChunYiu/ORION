name: refinement-binding-refresh

on:
  push:
    branches:
      - codex/papers-1-8-academic-refine
    paths:
      - '.github/workflows/refinement-binding-refresh.yml'
      - 'papers/**'
      - 'research/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out refinement branch
        uses: actions/checkout@v4
        with:
          ref: codex/papers-1-8-academic-refine
          fetch-depth: 0

      - name: Restore explicit P4 saturation wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('papers/paper-04-verified-scientific-discovery/manuscript/main.tex')
          text = path.read_text(encoding='utf-8')
          old = 'The axis is saturated by construction and has no resolving power.'
          new = 'The axis saturates by construction and has no resolving power.'
          if old not in text and new not in text:
              raise SystemExit('P4 saturation sentence not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Regenerate P6-P8 candidate content bindings
        run: python papers/candidates/checkers/check_content_binding_v1.py --write

      - name: Regenerate P1-P5 journal package hashes
        run: python research/paper-programme-v1/journal_package/check_journal_package.py --root . --write-hashes

      - name: Verify refreshed bindings before commit
        run: |
          python papers/candidates/checkers/check_content_binding_v1.py --check
          python research/paper-programme-v1/journal_package/check_journal_package.py --root .

      - name: Commit refreshed integrity bindings
        env:
          BRANCH: codex/papers-1-8-academic-refine
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            papers/paper-04-verified-scientific-discovery/manuscript/main.tex \
            papers/paper-01-recursive-epistemic-reconstruction/journal_package/SHA256SUMS \
            papers/paper-02-open-world-scientific-discovery/journal_package/SHA256SUMS \
            papers/paper-03-global-knowledge-portrait/journal_package/SHA256SUMS \
            papers/paper-04-verified-scientific-discovery/journal_package/SHA256SUMS \
            papers/paper-05-self-orion/journal_package/SHA256SUMS \
            papers/candidates/paper-06-formal-epistemic-structures-and-mechanics/CONTENT_MANIFEST_V1.json \
            papers/candidates/paper-06-formal-epistemic-structures-and-mechanics/SHA256SUMS \
            papers/candidates/paper-07-epistemic-navigation-open-worlds/CONTENT_MANIFEST_V1.json \
            papers/candidates/paper-07-epistemic-navigation-open-worlds/SHA256SUMS \
            papers/candidates/paper-08-epistemic-authority-autonomous-science/CONTENT_MANIFEST_V1.json \
            papers/candidates/paper-08-epistemic-authority-autonomous-science/SHA256SUMS
          if git diff --cached --quiet; then
            echo 'No binding changes to commit.'
            exit 0
          fi
          git commit -m 'papers: refresh integrity bindings for academic refinement'
          git push origin "HEAD:${BRANCH}"
