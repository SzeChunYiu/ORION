name: p12-selection-sufficiency-theorem-v1

on:
  pull_request:
    paths:
      - 'papers/paper-12-adaptive-state-reasoning/top_tier/P12_SELECTION_SUFFICIENCY_THEOREM_V1.md'
      - 'papers/paper-12-adaptive-state-reasoning/top_tier/check_p12_selection_sufficiency_theorem_v1.py'
      - 'papers/paper-12-adaptive-state-reasoning/top_tier/p12_price_aware_allocator_v1.py'
      - 'papers/paper-12-adaptive-state-reasoning/top_tier/run_p12_price_aware_successor_v1.py'
      - '.github/workflows/p12-selection-sufficiency-theorem-v1.yml'
  push:
    branches: [main]
    paths:
      - 'papers/paper-12-adaptive-state-reasoning/top_tier/P12_SELECTION_SUFFICIENCY_THEOREM_V1.md'
      - 'papers/paper-12-adaptive-state-reasoning/top_tier/check_p12_selection_sufficiency_theorem_v1.py'
      - 'papers/paper-12-adaptive-state-reasoning/top_tier/p12_price_aware_allocator_v1.py'
      - 'papers/paper-12-adaptive-state-reasoning/top_tier/run_p12_price_aware_successor_v1.py'
      - '.github/workflows/p12-selection-sufficiency-theorem-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: papers/paper-12-adaptive-state-reasoning/top_tier
    steps:
      - uses: actions/checkout@v4
      - name: Execute independent theorem falsifier
        run: |
          set -euo pipefail
          python check_p12_selection_sufficiency_theorem_v1.py > p12_selection_sufficiency_theorem_falsifier_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('p12_selection_sufficiency_theorem_falsifier_v1.json').read_text())
          assert p['terminal'] == 'P12_SELECTION_SUFFICIENCY_THEOREM_FALSIFIER_GREEN'
          assert p['candidate_global_optimality_falsifier_green'] is True
          assert p['mutation_sensitivity_green'] is True
          assert p['bound_nr13_replay']['successor_zero_regret_case_cells'] == 195
          print(json.dumps({
              'terminal': p['terminal'],
              'abstract_cells': p['abstract_reduced_state']['cells_checked'],
              't4_witness_cases': p['bound_nr13_replay']['price_oblivious_impossibility_witness_cases'],
          }, sort_keys=True))
          PY
      - name: Upload theorem falsifier receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p12-selection-sufficiency-theorem-v1
          path: papers/paper-12-adaptive-state-reasoning/top_tier/p12_selection_sufficiency_theorem_falsifier_v1.json
