name: p8-saturation-citation-once

on:
  push:
    branches: [saturation/p8-nature-skills-round-a-2026-08-19]
    paths: ['.github/workflows/p8-saturation-citation-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saturation/p8-nature-skills-round-a-2026-08-19
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev,candidates]'
      - name: Add source-verified delegation donor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('papers/candidates/paper-08-epistemic-authority-autonomous-science/submission/JAAMAS_MANUSCRIPT.tex')
          s=p.read_text()
          old='''ETAS exposes typed requested\\slash handled\\slash denied\\slash committed agent effects and residual obligations \\cite{etas2026}. FAVA formalizes evidence-backed permission graphs and deterministic authorization before effects \\cite{fava2026}. AgentBound composes multiple authority sources into verifiable behavioral governance \\cite{agentbound2026}; authorization-propagation work models transitive delegation and temporal validity across agent workflows \\cite{propagation2026}. These systems own typed action governance and authority propagation.'''
          new='''ETAS exposes typed requested\\slash handled\\slash denied\\slash committed agent effects and residual obligations \\cite{etas2026}. FAVA formalizes evidence-backed permission graphs and deterministic authorization before effects \\cite{fava2026}. AgentBound composes multiple authority sources into verifiable behavioral governance \\cite{agentbound2026}; authorization-propagation work models transitive delegation and temporal validity across agent workflows \\cite{propagation2026}. Bounded Agents carries delegated authority through an Agentic Principal Chain, narrows scope and budgets across delegation, checks requests against accumulated session state, and proves composition-safety properties under stated restriction and serialization assumptions \\cite{boundedagents2026}. These systems own typed action governance, authority propagation, narrowing and composition-safe delegation.'''
          if 'boundedagents2026' not in s:
              if old not in s: raise SystemExit('donor paragraph marker missing')
              s=s.replace(old,new)
              mark='''\\bibitem{propagation2026} K. Tallam, Authorization propagation in multi-agent AI systems: identity governance as infrastructure, arXiv:2605.05440, 2026.'''
              if mark not in s: raise SystemExit('bibliography marker missing')
              s=s.replace(mark,mark+'\n\\bibitem{boundedagents2026} X. Muruaga, Bounded Agents: Delegation Security for Multi-Agent AI Systems, arXiv:2608.15888, 2026.')
              p.write_text(s)
          assert 'boundedagents2026' in p.read_text()
          PY
      - name: Rebind candidate and verify
        run: |
          python papers/candidates/checkers/check_content_binding_v1.py --root . --write
          git checkout -- papers/candidates/paper-06-formal-epistemic-structures-and-mechanics/CONTENT_MANIFEST_V1.json papers/candidates/paper-06-formal-epistemic-structures-and-mechanics/SHA256SUMS papers/candidates/paper-07-epistemic-navigation-open-worlds/CONTENT_MANIFEST_V1.json papers/candidates/paper-07-epistemic-navigation-open-worlds/SHA256SUMS
          python papers/candidates/checkers/check_content_binding_v1.py --root . --check
          pytest -q tests/unit/candidates/test_p8_formal_core_primitives.py tests/unit/candidates/test_p6_p8_theory_closure_v21.py tests/unit/candidates/test_candidate_content_binding.py tests/unit/candidates/test_p6_p8_merged_review_suites.py
          python papers/candidates/submission/check_peer_review_ready.py --root .
      - name: Compile P8
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra poppler-utils
          cd papers/candidates/paper-08-epistemic-authority-autonomous-science/submission
          latexmk -pdf -interaction=nonstopmode -halt-on-error JAAMAS_MANUSCRIPT.tex
          ! grep -E 'Overfull \\[hv]box' JAAMAS_MANUSCRIPT.log
          ! grep -Eqi 'undefined citations|undefined references|Citation .* undefined|Reference .* undefined' JAAMAS_MANUSCRIPT.log
          pdfinfo JAAMAS_MANUSCRIPT.pdf > P8_SATURATION_PDFINFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p8-saturation-final-${{ github.sha }}
          path: |
            papers/candidates/paper-08-epistemic-authority-autonomous-science/submission/JAAMAS_MANUSCRIPT.pdf
            papers/candidates/paper-08-epistemic-authority-autonomous-science/submission/JAAMAS_MANUSCRIPT.log
            papers/candidates/paper-08-epistemic-authority-autonomous-science/submission/P8_SATURATION_PDFINFO.txt
      - name: Commit and self-remove
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p8-saturation-citation-once.yml
          git add papers/candidates/paper-08-epistemic-authority-autonomous-science/submission/JAAMAS_MANUSCRIPT.tex papers/candidates/paper-08-epistemic-authority-autonomous-science/CONTENT_MANIFEST_V1.json papers/candidates/paper-08-epistemic-authority-autonomous-science/SHA256SUMS
          git commit -m 'papers(p8): cite delegation donor in saturated JAAMAS source'
          git push origin HEAD:saturation/p8-nature-skills-round-a-2026-08-19
