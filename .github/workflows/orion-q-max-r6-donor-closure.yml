name: orion-q-max-r6-donor-closure

on:
  pull_request:
    paths:
      - 'research/extensions/orion-q/**'
      - 'development/orion-q-max-r0/**'
      - '.github/workflows/orion-q-max-r6-donor-closure.yml'

jobs:
  native-selected-donor-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Execute donor-closure packet selected by native Self-ORION N0
        run: |
          cd research/extensions/orion-q
          python max_r6_donor_closure_h4_fast.py | tee /tmp/r6-donor-closure.txt
          grep '^ORIONQ_MAX_R6_DONOR_CLOSURE=' /tmp/r6-donor-closure.txt
      - name: Execute interface envelope selected by native Self-ORION N1
        run: |
          cd research/extensions/orion-q
          python max_r6_foqcs_interface_envelope.py | tee /tmp/r6-interface.txt
          grep '^ORIONQ_MAX_R6_FOQCS_INTERFACE=' /tmp/r6-interface.txt
