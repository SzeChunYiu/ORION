name: p1-final-render-p1x

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p1-final-render-p1x.yml'
      - 'research/saturation/p1/P1_X_FINAL_RENDER_PLAN.md'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install LaTeX and PDF tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended lmodern poppler-utils
      - name: Render and audit P1 exact head
        run: |
          set -euo pipefail
          cd papers/paper-01-recursive-epistemic-reconstruction/manuscript
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          ! grep -Eqi 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log
          ! grep -Eq 'Overfull \\hbox|Overfull \\vbox' main.log
          pdftotext main.pdf /tmp/p1.txt
          grep -q '400/400' /tmp/p1.txt
          grep -q '275/400' /tmp/p1.txt
          grep -q '0.3125' /tmp/p1.txt
          grep -q '0.2675' /tmp/p1.txt
          grep -q '0.3575' /tmp/p1.txt
          grep -qi 'ideal' /tmp/p1.txt
          grep -qi 'open-ended' /tmp/p1.txt
          mkdir -p ../../../../research/saturation/_p1_final_render
          pdfinfo main.pdf > ../../../../research/saturation/_p1_final_render/pdfinfo.txt
          sha256sum main.pdf > ../../../../research/saturation/_p1_final_render/sha256.txt
          cp main.pdf main.log ../../../../research/saturation/_p1_final_render/
      - name: Archive P1 final render
        uses: actions/upload-artifact@v4
        with:
          name: p1-final-render-${{ github.sha }}
          path: research/saturation/_p1_final_render/
          if-no-files-found: error
          retention-days: 90
