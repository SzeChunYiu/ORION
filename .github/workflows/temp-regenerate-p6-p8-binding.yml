name: temp-regenerate-p6-p8-binding

on:
  push:
    branches:
      - research/top-tier-p6-p15-2026-08-23
    paths:
      - .github/workflows/temp-regenerate-p6-p8-binding.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-regenerate-p6-p8-binding.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/top-tier-p6-p15-2026-08-23
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate exact candidate bindings
        run: python papers/candidates/checkers/check_content_binding_v1.py --write
      - name: Verify regenerated bindings
        run: python papers/candidates/checkers/check_content_binding_v1.py --check
      - name: Commit exact generated bytes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            papers/paper-06-formal-epistemic-structures-and-mechanics/CONTENT_MANIFEST_V1.json \
            papers/paper-06-formal-epistemic-structures-and-mechanics/SHA256SUMS \
            papers/paper-07-epistemic-navigation-open-worlds/CONTENT_MANIFEST_V1.json \
            papers/paper-07-epistemic-navigation-open-worlds/SHA256SUMS \
            papers/paper-08-epistemic-authority-autonomous-science/CONTENT_MANIFEST_V1.json \
            papers/paper-08-epistemic-authority-autonomous-science/SHA256SUMS
          if git diff --cached --quiet; then
            echo P6_P8_BINDING_ALREADY_CURRENT
            exit 0
          fi
          git commit -m 'papers: regenerate p6-p8 candidate content binding'
          git push origin HEAD:research/top-tier-p6-p15-2026-08-23

