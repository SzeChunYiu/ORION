name: ORION V1 Receipt V3 Hostile Audit

on:
  pull_request:
    paths:
      - "src/orion/kernel/process_receipt.py"
      - "tests/unit/kernel/test_process_receipt_v3*.py"
      - "research/orion-v1-freeze/**"
      - "scripts/check_orion_v1_freeze.py"
      - ".github/workflows/orion-v1-receipt-v3-audit.yml"
  push:
    branches: [main]
    paths:
      - "src/orion/kernel/process_receipt.py"
      - "tests/unit/kernel/test_process_receipt_v3*.py"
      - "research/orion-v1-freeze/**"
      - "scripts/check_orion_v1_freeze.py"
      - ".github/workflows/orion-v1-receipt-v3-audit.yml"

permissions:
  contents: read

jobs:
  receipt-v3-hostile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/ci-fast-replay-constraints.txt
      - name: Install the recorded test environment
        run: >-
          python -m pip install -e '.[dev,candidates]'
          --constraint .github/ci-fast-replay-constraints.txt
      - name: Freeze source, environment, and all hostile test identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipt-v3-audit
          git status --porcelain=v2 --branch > receipt-v3-audit/git-status.txt
          git rev-parse HEAD > receipt-v3-audit/commit.txt
          git rev-parse 'HEAD^{tree}' > receipt-v3-audit/tree.txt
          git log -1 --format=fuller --decorate HEAD > receipt-v3-audit/commit-fuller.txt
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          tracked = [
              Path("src/orion/kernel/process_receipt.py"),
              Path("tests/unit/kernel/test_process_receipt_v3.py"),
              Path("tests/unit/kernel/test_process_receipt_v3_hostile.py"),
              Path("tests/unit/kernel/test_process_receipt_v3_wait_hostile.py"),
              Path(".github/workflows/orion-v1-receipt-v3-audit.yml"),
          ]
          files = []
          for relative in tracked:
              raw = (root / relative).read_bytes()
              files.append({
                  "path": relative.as_posix(),
                  "git_blob": subprocess.check_output(
                      ["git", "rev-parse", f"HEAD:{relative.as_posix()}"], text=True
                  ).strip(),
                  "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              })
          freeze = {
              "schema": "ORION.V1.ReceiptV3HostileFreeze.v2",
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "base_ref": os.environ.get("GITHUB_BASE_REF") or None,
              "head_ref": os.environ.get("GITHUB_HEAD_REF") or None,
              "event_name": os.environ.get("GITHUB_EVENT_NAME"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "python": sys.version,
              "platform": platform.platform(),
              "files": files,
              "suite_roles": {
                  "test_process_receipt_v3.py": "owned_core_and_public_boundary_suite",
                  "test_process_receipt_v3_hostile.py": "independent_17_counterexample_suite",
                  "test_process_receipt_v3_wait_hostile.py": "wait_reap_signal_and_finalization_suite",
              },
              "authority_ceiling": {
                  "local_process_receipt_conformance": "AUDITABLE",
                  "independent_reproduction": "NOT_GRANTED_BY_SAME_REPOSITORY_CI",
                  "orion_v1_freeze": "NOT_GRANTED",
                  "paper_authority_delta": "NONE",
              },
          }
          Path("receipt-v3-audit/FREEZE.json").write_text(
              json.dumps(freeze, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Collect the complete declared hostile denominator
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --collect-only -q \
            tests/unit/kernel/test_process_receipt_v3.py \
            tests/unit/kernel/test_process_receipt_v3_hostile.py \
            tests/unit/kernel/test_process_receipt_v3_wait_hostile.py \
            | tee receipt-v3-audit/collect.txt
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          text = Path("receipt-v3-audit/collect.txt").read_text(encoding="utf-8")
          node_ids = [line.strip() for line in text.splitlines() if "::test_" in line]
          if not node_ids:
              raise SystemExit("no Receipt V3 hostile tests were collected")
          if len(node_ids) != len(set(node_ids)):
              raise SystemExit("duplicate Receipt V3 node ids in collected denominator")
          by_file = Counter(node_id.split("::", 1)[0] for node_id in node_ids)
          required_files = {
              "tests/unit/kernel/test_process_receipt_v3.py",
              "tests/unit/kernel/test_process_receipt_v3_hostile.py",
              "tests/unit/kernel/test_process_receipt_v3_wait_hostile.py",
          }
          if set(by_file) != required_files:
              raise SystemExit(
                  f"hostile suite file coverage mismatch: {sorted(set(by_file))}"
              )
          if by_file["tests/unit/kernel/test_process_receipt_v3_hostile.py"] != 17:
              raise SystemExit("historical 17-counterexample denominator drift")
          Path("receipt-v3-audit/DENOMINATOR.json").write_text(
              json.dumps(
                  {
                      "schema": "ORION.V1.ReceiptV3HostileDenominator.v2",
                      "count": len(node_ids),
                      "by_file": dict(sorted(by_file.items())),
                      "node_ids": node_ids,
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          print(f"RECEIPT_V3_DECLARED_DENOMINATOR={len(node_ids)}")
          print(json.dumps(dict(sorted(by_file.items())), indent=2))
          PY
      - name: Execute all hostile suites in clean process A
        env:
          PYTHONHASHSEED: "0"
        run: >-
          python -m pytest -q --runxfail
          tests/unit/kernel/test_process_receipt_v3.py
          tests/unit/kernel/test_process_receipt_v3_hostile.py
          tests/unit/kernel/test_process_receipt_v3_wait_hostile.py
          --junitxml=receipt-v3-audit/run-a.xml
          -rA
          | tee receipt-v3-audit/run-a.log
      - name: Execute all hostile suites in clean process B
        env:
          PYTHONHASHSEED: "8675309"
        run: >-
          python -m pytest -q --runxfail
          tests/unit/kernel/test_process_receipt_v3.py
          tests/unit/kernel/test_process_receipt_v3_hostile.py
          tests/unit/kernel/test_process_receipt_v3_wait_hostile.py
          --junitxml=receipt-v3-audit/run-b.xml
          -rA
          | tee receipt-v3-audit/run-b.log
      - name: Derive fail-closed audit receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          audit = Path("receipt-v3-audit")
          denominator = json.loads((audit / "DENOMINATOR.json").read_text(encoding="utf-8"))

          def parse(path: Path) -> dict[str, int]:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
              totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.attrib.get(key, "0"))
              return totals

          run_a = parse(audit / "run-a.xml")
          run_b = parse(audit / "run-b.xml")
          expected = denominator["count"]
          for name, result in (("A", run_a), ("B", run_b)):
              if result["tests"] != expected:
                  raise SystemExit(f"run {name}: denominator drift {result['tests']} != {expected}")
              if any(result[key] for key in ("failures", "errors", "skipped")):
                  raise SystemExit(f"run {name}: non-green result {result}")

          bound_files = []
          for path in sorted(audit.iterdir()):
              if path.name == "RESULT_BINDING_PACKET.json" or not path.is_file():
                  continue
              raw = path.read_bytes()
              bound_files.append({
                  "path": path.as_posix(),
                  "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              })

          receipt = {
              "schema": "ORION.V1.ReceiptV3HostileResultBindingPacket.v2",
              "terminal": "V1_RECEIPT_V3_CURRENT_DECLARED_HOSTILE_FRONTIER_GREEN",
              "denominator": expected,
              "denominator_by_file": denominator["by_file"],
              "run_a": run_a,
              "run_b": run_b,
              "deterministic_denominator": run_a["tests"] == run_b["tests"] == expected,
              "bound_files": bound_files,
              "authority_ceiling": {
                  "declared_local_hostile_suite": "GREEN",
                  "historical_17_counterexample_suite": "BOUND_AND_GREEN_ON_CURRENT_SUBJECT",
                  "archived_branch_and_legacy_identity_reconstruction": "OPEN",
                  "full_dual_lane_execution": "OPEN",
                  "independent_reproduction": "CANNOT_CHECK",
                  "orion_v1_freeze": "NOT_EARNED",
                  "paper_authority_delta": "NONE",
              },
          }
          (audit / "RESULT_BINDING_PACKET.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
      - name: Re-run V1 control-plane checker after Receipt V3 audit
        run: |
          python scripts/check_orion_v1_freeze.py --json
          python -m pytest -q --runxfail tests/unit/orion_v1/test_orion_v1_freeze.py
      - name: Upload immutable audit packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-v1-receipt-v3-hostile-audit-${{ github.sha }}
          path: receipt-v3-audit/
          if-no-files-found: error
          retention-days: 30
