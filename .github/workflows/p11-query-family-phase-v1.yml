name: p11-query-family-phase-v1

on:
  pull_request:
    paths:
      - 'papers/paper-11-state-as-computation/top_tier/P11_QUERY_FAMILY_PHASE_PROTOCOL_V1.md'
      - 'papers/paper-11-state-as-computation/top_tier/run_query_family_phase_v1.py'
      - '.github/workflows/p11-query-family-phase-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query-family-phase-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install frozen scientific dependencies
        run: python -m pip install 'numpy==2.3.2' 'scikit-learn==1.7.1'
      - name: Execute query-family placement phase study
        run: python papers/paper-11-state-as-computation/top_tier/run_query_family_phase_v1.py | tee p11_query_family_phase_v1.json
      - name: Execute deterministic replay
        run: |
          python papers/paper-11-state-as-computation/top_tier/run_query_family_phase_v1.py > p11_query_family_phase_v1_rerun.json
          cmp p11_query_family_phase_v1.json p11_query_family_phase_v1_rerun.json
          python - <<'PY'
          import json
          p=json.load(open('p11_query_family_phase_v1.json'))
          assert p['terminal']=='P11_QUERY_FAMILY_PHASE_V1_SUPPORTED',p
          assert p['query_count']==10
          assert p['support_counts']['LINEAR']>=8
          assert max(p['support_counts']['RBF'],p['support_counts']['KNN'])>=8
          assert all(row['memory_prediction_correct'] for row in p['phase_rows'])
          for u in range(1,11):
              vals={r['break_even_horizon'] for r in p['phase_rows'] if r['U']==u}
              assert len(vals)==1
          print('P11_QUERY_FAMILY_PHASE_V1_BYTE_REPLAY_GREEN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p11-query-family-phase-v1
          path: p11_query_family_phase_v1.json
