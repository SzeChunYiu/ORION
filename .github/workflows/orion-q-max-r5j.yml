name: orion-q-max-r5j

on:
  pull_request:
    paths:
      - 'research/extensions/orion-q/**'
      - 'development/orion-q-max-r0/**'
      - '.github/workflows/orion-q-max-r5j.yml'

jobs:
  anchored-dependent-tare3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run frozen ADT3 open-subject development
        run: |
          cd research/extensions/orion-q
          python max_r5j_anchored_dependent_tare3_development.py | tee /tmp/r5j.txt
          grep '^ORIONQ_MAX_R5J_DEV=' /tmp/r5j.txt
