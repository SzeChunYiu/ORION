name: ORION V1 Component Content Binding

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/orion-v1-freeze/V1_COMPONENT_GRAPH_V1.json"
      - "scripts/build_orion_v1_component_binding.py"
      - "tests/unit/orion_v1/test_component_binding_builder.py"
      - ".github/workflows/orion-v1-component-binding.yml"
  push:
    branches:
      - shadow/orion-v1-deadline-migration-freeze-20260826
    paths:
      - "research/orion-v1-freeze/V1_COMPONENT_GRAPH_V1.json"
      - "scripts/build_orion_v1_component_binding.py"
      - "tests/unit/orion_v1/test_component_binding_builder.py"
      - ".github/workflows/orion-v1-component-binding.yml"

concurrency:
  group: orion-v1-component-binding-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bind-frozen-git-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Hostile tests and syntax
        run: |
          python -m py_compile scripts/build_orion_v1_component_binding.py
          python -m pytest -q tests/unit/orion_v1/test_component_binding_builder.py
      - name: Build two independent content-binding packets
        run: |
          rm -rf /tmp/orion-v1-component-binding-a /tmp/orion-v1-component-binding-b
          python scripts/build_orion_v1_component_binding.py \
            --root . \
            --ref HEAD \
            --output-dir /tmp/orion-v1-component-binding-a
          python scripts/build_orion_v1_component_binding.py \
            --root . \
            --ref HEAD \
            --output-dir /tmp/orion-v1-component-binding-b
          diff -ru /tmp/orion-v1-component-binding-a /tmp/orion-v1-component-binding-b
      - name: Validate packet bindings
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/orion-v1-component-binding-a")
          packet = json.loads((root / "RESULT_BINDING_PACKET.json").read_text())
          assert packet["schema"] == "ORION.V1.ComponentContentBindingPacket.v1"
          assert packet["paper_authority_delta"] == "NONE"
          assert packet["terminal"] in {
              "V1_COMPONENT_GRAPH_PATHS_AND_BYTES_BOUND__INTERFACE_PROOF_OPEN",
              "V1_COMPONENT_GRAPH_CONTENT_AND_INTERFACES_BOUND",
          }
          for row in packet["files"]:
              data = (root / row["path"]).read_bytes()
              assert len(data) == row["bytes"]
              assert hashlib.sha256(data).hexdigest() == row["sha256"]
          primary = json.loads((root / "PRIMARY_RESULT.json").read_text())
          assert primary["content_complete"] is True
          assert primary["missing_configured_paths"] == []
          print(packet["terminal"])
          print("components", primary["component_count"])
          print("dependency_edges", primary["dependency_edge_count"])
          print("bound_files", primary["globally_bound_file_count"])
          print("global_binding_digest", primary["global_binding_digest"])
          PY
      - name: Add workflow receipt and checksums
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("/tmp/orion-v1-component-binding-a")
          receipt = {
              "schema": "ORION.V1.ComponentBindingWorkflowReceipt.v1",
              "workflow_run_id": int(os.environ["WORKFLOW_RUN_ID"]),
              "workflow_attempt": int(os.environ["WORKFLOW_ATTEMPT"]),
              "source_commit": os.environ["GITHUB_SHA"],
              "authority_ceiling": "LOCAL_GIT_OBJECT_BINDING_ONLY",
              "independent_reproduction": "CANNOT_CHECK",
              "paper_authority_delta": "NONE",
          }
          (root / "WORKFLOW_RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          (cd /tmp/orion-v1-component-binding-a && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: orion-v1-component-binding-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/orion-v1-component-binding-a/
          if-no-files-found: error
          retention-days: 30
