name: ORION-01-05 convergence V1

on:
  pull_request:
    paths:
      - ".github/workflows/orion-01-05-convergence-v1.yml"
      - "papers/README.md"
      - "papers/orion-01-certificate-realization/evidence/convergence-v1/**"
      - "papers/orion-02-fiberguard-finite-fibre/extensions/**"
      - "papers/orion-03-typed-merge-falsification/evidence/convergence-v1/**"
      - "papers/orion-04-rooted-completion-certificates/evidence/convergence-v1/**"
      - "papers/orion-04-rooted-completion-certificates/evidence/crb-full-replay/post-execution/job-3544056/**"
      - "papers/orion-05-tare-expressivity/evidence/convergence-v1/**"
      - "research/orion-01-05-convergence-v1/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/orion-01-05-convergence-v1.yml"
      - "papers/README.md"
      - "papers/orion-01-certificate-realization/evidence/convergence-v1/**"
      - "papers/orion-02-fiberguard-finite-fibre/extensions/**"
      - "papers/orion-03-typed-merge-falsification/evidence/convergence-v1/**"
      - "papers/orion-04-rooted-completion-certificates/evidence/convergence-v1/**"
      - "papers/orion-04-rooted-completion-certificates/evidence/crb-full-replay/post-execution/job-3544056/**"
      - "papers/orion-05-tare-expressivity/evidence/convergence-v1/**"
      - "research/orion-01-05-convergence-v1/**"

permissions:
  contents: read

jobs:
  evidence-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install pytest==8.4.2
          -r papers/orion-02-fiberguard-finite-fibre/extensions/r18/R18_REPLAY_REQUIREMENTS_LOCK.txt
      - name: Verify R18 replay code prerequisites without claiming corpus replay
        working-directory: papers/orion-02-fiberguard-finite-fibre/extensions/r18
        run: |
          python verify_r18_replay_prerequisites.py
          python fiberguard_paired_route_r18.py --help >/dev/null
      - name: Verify preserved FiberGuard R15, R17, and relative-R18 code
        run: |
          r15=papers/orion-02-fiberguard-finite-fibre/extensions/r15
          python "$r15/fiberguard_multidomain_r15_schema_repair.py" --self-test > "$RUNNER_TEMP/r15-self-test.json"
          python -m json.tool "$RUNNER_TEMP/r15-self-test.json" >/dev/null
          r17=papers/orion-02-fiberguard-finite-fibre/extensions/r17
          python "$r17/verify_fiberguard_fallback_alignment_r17.py" --output "$RUNNER_TEMP/r17-a.json"
          python "$r17/verify_fiberguard_fallback_alignment_r17.py" --output "$RUNNER_TEMP/r17-b.json"
          cmp "$RUNNER_TEMP/r17-a.json" "$RUNNER_TEMP/r17-b.json"
          cmp "$RUNNER_TEMP/r17-a.json" "$r17/FALLBACK_ALIGNMENT_R17_RESULTS.json"
          relative=papers/orion-02-fiberguard-finite-fibre/extensions/r18-relative
          python "$relative/verify_fiberguard_relative_route_extension_r18.py" --output "$RUNNER_TEMP/r18-relative-a.json"
          python "$relative/verify_fiberguard_relative_route_extension_r18.py" --output "$RUNNER_TEMP/r18-relative-b.json"
          cmp "$RUNNER_TEMP/r18-relative-a.json" "$RUNNER_TEMP/r18-relative-b.json"
          cmp "$RUNNER_TEMP/r18-relative-a.json" "$relative/RELATIVE_ROUTE_EXTENSION_R18_RESULTS.json"
      - name: Regenerate bounded ORION-01 and ORION-03 theorem receipts
        run: |
          orion01=papers/orion-01-certificate-realization/evidence/convergence-v1
          python "$orion01/verify_registry_nonidentifiability_r12.py" --output "$RUNNER_TEMP/orion01-a.json"
          python "$orion01/verify_registry_nonidentifiability_r12.py" --output "$RUNNER_TEMP/orion01-b.json"
          cmp "$RUNNER_TEMP/orion01-a.json" "$RUNNER_TEMP/orion01-b.json"
          cmp "$RUNNER_TEMP/orion01-a.json" "$orion01/REGISTRY_NONIDENTIFIABILITY_R12_RESULTS.json"
          orion03=papers/orion-03-typed-merge-falsification/evidence/convergence-v1
          python "$orion03/verify_origin_witness_first_mixing_r12.py" --output "$RUNNER_TEMP/orion03-a.json"
          python "$orion03/verify_origin_witness_first_mixing_r12.py" --output "$RUNNER_TEMP/orion03-b.json"
          cmp "$RUNNER_TEMP/orion03-a.json" "$RUNNER_TEMP/orion03-b.json"
          cmp "$RUNNER_TEMP/orion03-a.json" "$orion03/FIRST_MIXING_R12_RESULTS.json"
      - name: Verify frozen V1 or revalidate it on a successor event
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'b1e65d4445a9b2ef5aa44f7adc2838f968f84ff1' }}
        run: |
          if [[ "$PR_BASE_SHA" == "b1e65d4445a9b2ef5aa44f7adc2838f968f84ff1" ]]; then
            python research/orion-01-05-convergence-v1/verify_convergence_v1.py \
              --repo . --check-diff --event-base "$PR_BASE_SHA"
          else
            # Revalidate the immutable V1 subject on successor events. The
            # original exact-base changed-path gate is not a perpetual ban on
            # additive per-paper successor evidence.
            python research/orion-01-05-convergence-v1/verify_convergence_v1.py \
              --repo .
          fi
      - name: Run focused convergence and ORION-04 custody tests
        run: >-
          python -m pytest -q
          research/orion-01-05-convergence-v1/test_convergence_v1.py
          research/orion-01-05-convergence-ci-successor-v1/test_workflow_successor_mode.py
          papers/orion-04-rooted-completion-certificates/evidence/crb-full-replay/post-execution/job-3544056/tests/test_job_3544056.py
      - name: Regenerate ORION-02 R19 result independently
        run: |
          r19=papers/orion-02-fiberguard-finite-fibre/extensions/r19
          python "$r19/verify_fiberguard_joint_route_r19.py" --output "$RUNNER_TEMP/r19-a.json"
          python "$r19/verify_fiberguard_joint_route_r19.py" --output "$RUNNER_TEMP/r19-b.json"
          cmp "$RUNNER_TEMP/r19-a.json" "$RUNNER_TEMP/r19-b.json"
          cmp "$RUNNER_TEMP/r19-a.json" "$r19/JOINT_ROUTE_R19_RESULTS.json"
      - name: Verify ORION-04 internal checksums
        working-directory: papers/orion-04-rooted-completion-certificates/evidence/crb-full-replay/post-execution/job-3544056
        run: sha256sum -c SHA256SUMS
