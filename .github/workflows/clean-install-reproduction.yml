name: clean-install-reproduction

on:
  pull_request:
    branches: [main]
    paths:
      - 'papers/paper-01-recursive-epistemic-reconstruction/manuscript/**'
      - '.github/workflows/clean-install-reproduction.yml'

permissions:
  contents: read

jobs:
  p1-saturation-prebind:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX/PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures poppler-utils
      - name: Compile exact P1 saturation manuscript
        working-directory: papers/paper-01-recursive-epistemic-reconstruction/manuscript
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          if grep -Eqi 'LaTeX Warning: (Citation .* undefined|Reference .* undefined)|There were undefined references|There were undefined citations' main.log; then
            echo 'P1 unresolved citation/reference' >&2
            exit 1
          fi
          if grep -Eq 'Overfull \\hbox|Overfull \\vbox' main.log; then
            echo 'P1 overfull box' >&2
            grep -E 'Overfull \\hbox|Overfull \\vbox' main.log >&2
            exit 1
          fi
          pdfinfo main.pdf | tee /tmp/p1-pdfinfo.txt
      - name: Archive exact prebind PDF
        uses: actions/upload-artifact@v4
        with:
          name: p1-saturation-prebind-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            /tmp/p1-pdfinfo.txt
            papers/paper-01-recursive-epistemic-reconstruction/manuscript/main.pdf
            papers/paper-01-recursive-epistemic-reconstruction/manuscript/main.log
