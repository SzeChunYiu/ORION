name: shadow-davenport-a2-light-c3-elimination

on:
  push:
    branches:
      - shadow/davenport-a2-light-c12-elimination-20260904
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadow-davenport-a2-light-c3-elimination-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theorem-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run primary symbolic and hostile-mutation replay
        run: python research/experiments/davenport-c7-frontier/check_a2_light_support3_three_share_elimination_v1.py
      - name: Compile independent radial-resource verifier
        run: g++ -O3 -std=c++17 research/experiments/davenport-c7-frontier/verify_a2_light_support3_three_share_independent_v1.cpp -o /tmp/a2-light-c3-independent
      - name: Run independent prime scan and mutation control
        run: /tmp/a2-light-c3-independent
      - name: Compile ASan and UBSan replay
        run: g++ -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -std=c++17 research/experiments/davenport-c7-frontier/verify_a2_light_support3_three_share_independent_v1.cpp -o /tmp/a2-light-c3-sanitized
      - name: Run sanitizer replay
        run: ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 /tmp/a2-light-c3-sanitized
