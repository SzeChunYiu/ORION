name: orion-qg-qg35-summary-conditioned-fixed
on:
  pull_request:
    paths:
      - 'research/extensions/orion-qg/qg35_summary_conditioned_fixed.py'
      - 'development/orion-qg-regime-geometry/QG35_SUMMARY_CONDITIONED_FIXED_PROTOCOL_V1.md'
      - 'development/orion-qg-regime-geometry/qg35_generic_verify.py'
      - 'development/orion-qg-regime-geometry/qg35_native_verify.py'
      - 'development/orion-qg-regime-geometry/run_qg35_dual_harness.py'
      - '.github/workflows/orion-qg-qg35.yml'
  workflow_dispatch:
jobs:
  fair-fixed-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,candidates]'
      - name: Execute dual harness
        run: |
          set -o pipefail
          mkdir -p artifacts
          python development/orion-qg-regime-geometry/run_qg35_dual_harness.py | tee artifacts/orion-qg-qg35-summary.json
      - name: Deterministic production replay
        run: |
          python research/extensions/orion-qg/qg35_summary_conditioned_fixed.py --output artifacts/orion-qg-qg35-replay.json > artifacts/orion-qg-qg35-replay.log
          cmp artifacts/orion-qg-qg35-summary-conditioned-fixed.json artifacts/orion-qg-qg35-replay.json
      - name: Self-consistent class-minimum tamper must be rejected
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('artifacts/orion-qg-qg35-summary-conditioned-fixed.json');d=json.loads(p.read_text());i=next(i for i,x in enumerate(d['class_minima']) if x>0);d['class_minima'][i]+=1
          u={k:v for k,v in d.items() if k!='result_digest'};d['result_digest']=hashlib.sha256(json.dumps(u,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest();Path('artifacts/orion-qg-qg35-tampered.json').write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
          python development/orion-qg-regime-geometry/qg35_generic_verify.py --input artifacts/orion-qg-qg35-tampered.json --output artifacts/orion-qg-qg35-tampered-verify.json > artifacts/orion-qg-qg35-tampered-verify.log
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/orion-qg-qg35-tampered-verify.json').read_text());assert d['decision']=='REJECT' and d['all_checks'] is False
          PY
      - name: Enforce fair fixed-baseline authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('artifacts/orion-qg-qg35-summary-conditioned-fixed.json').read_text());g=json.loads(Path('artifacts/orion-qg-qg35-generic-verification.json').read_text());n=json.loads(Path('artifacts/orion-qg-qg35-native-verification.json').read_text());d=json.loads(Path('artifacts/orion-qg-qg35-dual-harness.json').read_text())
          assert d['both_accept'] is True;assert s['EXACT_SUMMARY_CONDITIONED_FIXED_AUTHORITY'] is True;assert g['all_checks'] is True and n['all_checks'] is True
          for x in (s,g,n,d):
              assert x['ADAPTIVE_MINIMAX_AUTHORITY'] is False;assert x['STRICT_ADAPTIVITY_ADVANTAGE_AUTHORITY'] is False;assert x['UNIVERSAL_FIXED_MINIMUM_REDERIVED'] is False;assert x['MINIMUM_FULL_FINITE_OPTIMUM_PROBES'] is False;assert x['HARDWARE_MEASUREMENT_MINIMUM'] is False;assert x['QG28_GLOBAL_STATE_MINIMALITY'] is False;assert x['novelty_authority'] is False;assert x['physical_quantum_advantage_claim'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orion-qg-qg35-${{ github.sha }}
          path: |
            artifacts/orion-qg-qg35-*.json
            artifacts/orion-qg-qg35-*.log
