name: p9-llm-gguf-scaling

on:
  pull_request:
    paths:
      - 'research/extensions/p9-p10-structural-scaling/P9_LLM_GGUF_EXECUTION_AMENDMENT_V1.md'
      - 'research/extensions/p9-p10-structural-scaling/P9_LLM_GGUF_HOSTILE_CONTROL_AMENDMENT_V1.md'
      - 'research/extensions/p9-p10-structural-scaling/run_p9_llm_gguf_server_v1.py'
      - 'research/extensions/p9-p10-structural-scaling/analyze_p9_llm_gguf_v1.py'
      - 'src/orion/study/p9/d1.py'
      - 'src/orion/study/p9/d1_data_runtime.py'
      - '.github/workflows/p9-llm-gguf-scaling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        scale: ['0.5B','1.5B','3B']
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MODEL_SCALE: ${{ matrix.scale }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ORION runtime
        run: python -m pip install -e .
      - name: Build pinned llama.cpp server
        run: |
          git clone --depth 1 --branch b6635 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          test "$(git -C /tmp/llama.cpp rev-parse HEAD)" = "b77e6c18e1a6fac5705ed95f03af5436d67484c1"
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/llama.cpp/build -j2 --target llama-server
          /tmp/llama.cpp/build/bin/llama-server --version | tee /tmp/llama-version.txt
      - name: Download and verify exact official Qwen GGUF
        run: |
          mkdir -p /tmp/models
          python - <<'PY'
          import hashlib, os, urllib.request
          from pathlib import Path
          models={
            '0.5B':('Qwen/Qwen2.5-0.5B-Instruct-GGUF','qwen2.5-0.5b-instruct-q4_k_m.gguf','74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db'),
            '1.5B':('Qwen/Qwen2.5-1.5B-Instruct-GGUF','qwen2.5-1.5b-instruct-q4_k_m.gguf','6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e'),
            '3B':('Qwen/Qwen2.5-3B-Instruct-GGUF','qwen2.5-3b-instruct-q4_k_m.gguf','626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d'),
          }
          repo,name,expected=models[os.environ['MODEL_SCALE']]
          path=Path('/tmp/models')/name
          urllib.request.urlretrieve(f'https://huggingface.co/{repo}/resolve/main/{name}?download=true',path)
          actual=hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'INVALID_MODEL_IDENTITY {actual} != {expected}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'MODEL_PATH={path}\nMODEL_SHA256={actual}\n')
          print(name,actual)
          PY
      - name: Start one persistent inference server
        run: |
          nohup /tmp/llama.cpp/build/bin/llama-server \
            -m "$MODEL_PATH" --host 127.0.0.1 --port 8080 \
            --ctx-size 4096 --threads 4 --parallel 1 \
            > /tmp/llama-server.log 2>&1 &
          echo $! > /tmp/llama-server.pid
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/llama-server.pid)" 2>/dev/null; then
              cat /tmp/llama-server.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/llama-server.log
          exit 1
      - name: Execute frozen primary and hostile-control cells
        run: |
          mkdir -p out
          python research/extensions/p9-p10-structural-scaling/run_p9_llm_gguf_server_v1.py \
            --server-url http://127.0.0.1:8080 \
            --model-scale "$MODEL_SCALE" \
            --model-sha256 "$MODEL_SHA256" \
            --llama-commit b77e6c18e1a6fac5705ed95f03af5436d67484c1 \
            --output "out/p9-llm-${MODEL_SCALE}.json"
      - name: Preserve server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-llm-${{ matrix.scale }}-${{ github.sha }}
          path: |
            out/p9-llm-${{ matrix.scale }}.json
            /tmp/llama-version.txt
            /tmp/llama-server.log
          if-no-files-found: warn

  analyze:
    needs: evaluate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p9-llm-*-${{ github.sha }}
          path: inputs
          merge-multiple: true
      - name: Analyze frozen scaling and hostile-control gate
        run: |
          python research/extensions/p9-p10-structural-scaling/analyze_p9_llm_gguf_v1.py \
            --inputs inputs/p9-llm-0.5B.json inputs/p9-llm-1.5B.json inputs/p9-llm-3B.json \
            --output P9_LLM_GGUF_SCALING_ANALYSIS_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: p9-llm-analysis-${{ github.sha }}
          path: P9_LLM_GGUF_SCALING_ANALYSIS_V1.json
          if-no-files-found: error
