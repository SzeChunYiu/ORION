name: p1-necessity-execution-freeze

on:
  push:
    branches:
      - shadow/p1-necessity-execution-freeze-20260817
    paths:
      - '.github/workflows/p1-necessity-execution-freeze.yml'

permissions:
  contents: write

jobs:
  freeze-execution:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: shadow/p1-necessity-execution-freeze-20260817
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install repository package
        run: python -m pip install -e '.[test]'
      - name: Require prior no-outcome world receipt
        run: |
          test -f research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json').read_text())
          assert p['n']==2882
          assert p['hidden_shift_n']==480
          assert p['negative_control_n']==2402
          assert p['candidate_view_leak_count']==0
          assert p['arms_executed'] is False
          assert p['outcome_accessed'] is False
          PY
      - name: Regenerate exact worlds and require frozen hashes
        run: |
          rm -rf /tmp/p1-necessity-worlds
          python research/revival/p1/freeze_mutation_necessity_worlds.py --outdir /tmp/p1-necessity-worlds
          python - <<'PY'
          import json
          from pathlib import Path
          frozen=json.loads(Path('research/revival/p1/confirmatory/v2.2/PRIMARY_WORLD_FREEZE.json').read_text())
          fresh=json.loads(Path('/tmp/p1-necessity-worlds/WORLD_FREEZE.json').read_text())
          for key in ['protocol_version','confirmatory_seed','replication_seed','n','hidden_shift_n','negative_control_n','public_sha256','protected_response_matrix_sha256','candidate_view_leak_count','by_family']:
              assert fresh[key]==frozen[key], (key,fresh[key],frozen[key])
          assert fresh['source_sha256']==frozen['source_sha256']
          assert fresh['arms_executed'] is False and fresh['outcome_accessed'] is False
          print('world replay: exact')
          PY
      - name: Bind exact runner/scorer/statistics without arm execution
        run: |
          python research/revival/p1/freeze_mutation_necessity_execution.py \
            --world-dir /tmp/p1-necessity-worlds \
            --out /tmp/P1_NECESSITY_EXECUTION_FREEZE.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/P1_NECESSITY_EXECUTION_FREEZE.json').read_text())
          assert p['n']==2882
          assert p['intervention_budget_units']==4
          assert p['h1_parents']==['active_voi_repair_parent','darc_r2act_dependency_parent']
          assert p['control_parent']=='active_voi_repair_parent'
          assert p['arms_executed'] is False
          assert p['outcome_accessed'] is False
          PY
      - name: Commit execution receipt only
        run: |
          mkdir -p research/revival/p1/confirmatory/v2.2
          cp /tmp/P1_NECESSITY_EXECUTION_FREEZE.json \
            research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/revival/p1/confirmatory/v2.2/PRIMARY_EXECUTION_FREEZE.json
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'research(P1): bind necessity execution identity only'
          git push origin HEAD:shadow/p1-necessity-execution-freeze-20260817
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-necessity-primary-execution-freeze
          path: |
            /tmp/p1-necessity-worlds/WORLD_FREEZE.json
            /tmp/P1_NECESSITY_EXECUTION_FREEZE.json
          if-no-files-found: error
