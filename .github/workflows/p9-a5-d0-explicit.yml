name: p9-a5-d0-explicit

on:
  pull_request:
    paths:
      - 'src/orion/study/p9/a5_explicit.py'
      - 'research/extensions/p9-structured-neural/A5_D0_EXPLICIT_PROTOCOL_V1.json'
      - 'research/extensions/p9-structured-neural/run_a5_d0_explicit.py'
      - 'development/p9-a5-explicit-inference/**'
      - 'tests/test_p9_a5_explicit.py'
      - '.github/workflows/p9-a5-d0-explicit.yml'
  workflow_dispatch:

concurrency:
  group: p9-a5-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  a5:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,candidates]'
      - run: pytest -q tests/test_p9_a5_explicit.py
      - run: >-
          python research/extensions/p9-structured-neural/run_a5_d0_explicit.py
          --output "$RUNNER_TEMP/a5-results.json"
          > "$RUNNER_TEMP/a5-full-output.log"
      - name: Compact result
        env:
          RESULT: ${{ runner.temp }}/a5-results.json
        run: |
          python - <<'PY'
          import json, os
          result=json.load(open(os.environ['RESULT'], encoding='utf-8'))
          print('P9_A5_TERMINAL='+result['terminal'])
          print('P9_A5_RESULT_DIGEST='+result['result_digest'])
          for view, row in result['views'].items():
              print(f"P9_A5_VIEW view={view} accuracy={row['accuracy']:.6f} unknown={row['unknown_rate']:.6f}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p9-a5-d0-explicit-${{ github.sha }}
          path: ${{ runner.temp }}/a5-results.json
          if-no-files-found: error
