name: Ensure ORION-01 Paper 1 pull request

on:
  push:
    paths:
      - ".github/workflows/ensure-orion01-paper1-pr.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ensure-orion01-paper1-pr
  cancel-in-progress: false

jobs:
  ensure-pr:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR only when absent
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: codex/issue-1701-orion01-paper1-v3-20260829
        run: |
          existing="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$HEAD_BRANCH" \
            --json number \
            --jq '.[0].number // empty')"
          if test -n "$existing"; then
            echo "PR #$existing already exists."
            exit 0
          fi
          cat > /tmp/pr-body.md <<'EOF'
          ## Scope

          Closes most of the ORION-01 / Paper 1 lane in issue #1701, in ascending paper order. This PR does not start Paper 2.

          ## Bounded V3 package

          - opens a new V3 candidate identity without rewriting frozen V2;
          - repairs the hostile Paper A and Paper B proof findings;
          - binds PR #1602's cap-eight adverse terminal without promoting it;
          - adds implementation-independent theorem checks and primary-source novelty subtraction;
          - adds deterministic PDF, manifest, checksum, availability, license, cover-letter, and CI tooling.

          ## Production-completeness successor

          - freezes a distinct V1 identity before source-instance execution;
          - defines unique source resolution, source/call-graph/mutation-root closure, finite partitions, canonical effects, and extensional classes;
          - proves the conditional O1–O6 registry theorem and fail-closed counterexample corollary;
          - gates any fresh exact-compute protocol on `REGISTRY_COMPLETE` and a material consequence.

          ## Explicitly open

          - full raw path-by-path transplant of the stale PR #1602 Round-2/Round-3 directories;
          - successful generated-artifact CI receipts and human PDF visual inspection;
          - source-instance resolution and discharge of O1–O6;
          - external proof, novelty, replication, submission, or acceptance authority.

          See `development/orion-01-production-completeness-v1-2026-08-29/ISSUE_1701_CLOSEOUT_STATUS.md`.
          EOF
          sed -i 's/^          //' /tmp/pr-body.md
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$HEAD_BRANCH" \
            --title 'papers(orion-01): close bounded Paper 1 and freeze production successor' \
            --body-file /tmp/pr-body.md

      - name: Remove one-shot workflow when possible
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort; exit 0; }
          git rm .github/workflows/ensure-orion01-paper1-pr.yml
          git commit -m 'chore: remove PR one-shot [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
