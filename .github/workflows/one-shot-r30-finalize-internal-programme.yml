          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops,ImageDraw
          import json,os,statistics
          temp=Path(os.environ['RUNNER_TEMP']);pages=sorted((temp/'pages').glob('page-*.png'))
          if not pages:raise SystemExit('no rendered pages')
          rows=[];thumbs=[]
          for index,path in enumerate(pages,1):
            image=Image.open(path).convert('L');diff=ImageChops.difference(image,Image.new('L',image.size,255));bbox=diff.point(lambda value:255 if value>8 else 0).getbbox()
            if bbox is None:raise SystemExit(f'blank page {index}')
            left,top,right,bottom=bbox;sample=list(image.resize((max(1,image.width//8),max(1,image.height//8))).getdata());std=statistics.pstdev(sample)
            if std<3.0:raise SystemExit(f'near blank page {index}')
            if left<8 or top<8 or right>image.width-8 or bottom>image.height-8:raise SystemExit(f'clipping risk page {index}: {bbox}')
            rows.append({'page':index,'content_bbox':[left,top,right,bottom],'grayscale_stddev':std});thumb=Image.open(path).convert('RGB');thumb.thumbnail((320,420));thumbs.append(thumb)
          columns=4;cell_w=340;cell_h=450;sheet=Image.new('RGB',(columns*cell_w,((len(thumbs)+columns-1)//columns)*cell_h),'white');draw=ImageDraw.Draw(sheet)
          for offset,thumb in enumerate(thumbs):
            x=(offset%columns)*cell_w+(cell_w-thumb.width)//2;y=(offset//columns)*cell_h+24;sheet.paste(thumb,(x,y));draw.text(((offset%columns)*cell_w+10,(offset//columns)*cell_h+5),f'Page {offset+1}',fill='black')
          sheet.save(temp/'CONTACT_SHEET.png')
          receipt={'schema':'ORION.ORION02.R30VisualPdfAudit.v1','page_count':len(pages),'pages':rows,'byte_identical_double_build':True,'all_pages_nonblank':True,'no_page_edge_clipping_detected':True,'authority':{'visual_internal_review':True,'external_independence':False,'journal_authority':False}}
          (temp/'visual-audit.json').write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          print('ORION_02_R30_VISUAL_PDF_AUDIT_PASS',len(pages))
          PY

      - name: Generate non-self-referential final receipts
