name: one-shot-r30-finalize-internal-programme

on:
  push:
    branches: [chatgpt/orion-02-r18-null-current-main-20260827]
    paths: ['.github/workflows/one-shot-r30-finalize-internal-programme.yml']
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  finalise-all-internally-executable-work:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOURCE_BRANCH: chatgpt/orion-02-r18-null-current-main-20260827
      CLEAN_BRANCH: chatgpt/five-paper-r30-current-main-20260827
      R18_RESULT_SHA256: 8136ac6e614406a51270342d73786dfec43a9ecdac81f62e815cd14d1a739c45
      CNBR_SOURCE_GIT_SHA: 62e46900cf2f0e7dd412735384e090a04f8c8de6
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TZ: UTC
      LC_ALL: C.UTF-8

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/orion-02-r18-null-current-main-20260827
          fetch-depth: 0

      - name: Cancel competing branch automation and reset to latest branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for status in queued in_progress waiting; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=$SOURCE_BRANCH&status=$status" \
              --jq '.workflow_runs[].id' | while read -r run; do
                [ -z "$run" ] && continue
                if [ "$run" != "$GITHUB_RUN_ID" ]; then
                  gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel" >/dev/null 2>&1 || true
                fi
              done
          done
          sleep 45
          git fetch --no-tags origin "$SOURCE_BRANCH"
          git reset --hard FETCH_HEAD

      - name: Freeze one reconciled source subject
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re

          root=Path('papers/orion-02-fiberguard-finite-fibre')

          rust=root/'verify_r20_cross_language.rs'
          text=rust.read_text()
          text=text.replace("match self.bytes.get(self.pos) {\n            Some(b'0')", "match self.bytes.get(self.pos).copied() {\n            Some(b'0')")
          text=text.replace("matches!(self.bytes.get(self.pos), Some(b'0'..=b'9'))", "matches!(self.bytes.get(self.pos).copied(), Some(b'0'..=b'9'))")
          text=text.replace("matches!(self.bytes.get(self.pos), Some(b'e') | Some(b'E'))", "matches!(self.bytes.get(self.pos).copied(), Some(b'e') | Some(b'E'))")
          text=text.replace("matches!(self.bytes.get(self.pos), Some(b'+') | Some(b'-'))", "matches!(self.bytes.get(self.pos).copied(), Some(b'+') | Some(b'-'))")
          rust.write_text(text)

          tex=root/'MANUSCRIPT_R20.tex'
          manuscript=tex.read_text()
          replacement=r'''\begin{theorem}[No-free extension]\label{thm:nofree}
          Let $S$ be any finite observed fibre with $|\A|\ge2$, and suppose no constraint is imposed on costs at unseen states sharing the same representation value.  For every $M>0$, there is a finite extension that agrees with every observed cost on $S$ but whose extended fibre has deterministic regret at least $M$.
          \end{theorem}
          \begin{proof}
          Keep every observed cost unchanged.  For each action $a\in\A$, add one unseen state $x_a$ with $C(a,x_a)=0$ and $C(b,x_a)=M$ for every $b\ne a$.  At every new state the oracle cost is zero.  Fix any common action $b$.  Because $|\A|\ge2$, choose $a\ne b$; then $R(b,x_a)=M$.  Hence every common action has worst-state regret at least $M$, so the extended fibre has deterministic regret at least $M$ while all observed bytes remain unchanged.
          \end{proof}'''.replace('          ','')
          pattern=r'\\begin\{theorem\}\[No-free extension\]\\label\{thm:nofree\}.*?\\end\{proof\}'
          manuscript,count=re.subn(pattern,lambda _:replacement,manuscript,count=1,flags=re.DOTALL)
          if count!=1: raise SystemExit(f'no-free theorem count {count}')
          if '\\usepackage{tikz}' not in manuscript:
            manuscript=manuscript.replace('\\usepackage{booktabs,tabularx,microtype,hyperref}\n','\\usepackage{booktabs,tabularx,microtype,hyperref}\n\\usepackage{tikz}\n\\usetikzlibrary{arrows.meta,positioning}\n')
          if '\\input{FIGURE_AUTHORITY_R20.tex}' not in manuscript:
            manuscript=manuscript.replace('\\section{Finite-fibre decision model}','\\input{FIGURE_AUTHORITY_R20.tex}\n\n\\section{Finite-fibre decision model}',1)
          if '\\input{FIGURE_JOINT_ROUTE_R20.tex}' not in manuscript:
            manuscript=manuscript.replace('\\subsection{Legal joint profiles}','\\input{FIGURE_JOINT_ROUTE_R20.tex}\n\n\\subsection{Legal joint profiles}',1)
          old='The repository binds protocols, source revisions, exact result digests, negative terminals, and authority ceilings.  The complete R18 recovery result is durably retained; the R19 replacement theorem has a byte-stable verifier; the neighbourhood refutation was executed prospectively on LUNARC and is undergoing cross-host replay.  Same-owner CI and finite re-execution are implementation corroboration, not external peer review.'
          new='The repository binds protocols, source revisions, exact result digests, negative terminals, and authority ceilings.  The complete R18 recovery result is durably retained; the R19 replacement theorem has a byte-stable verifier; and a standard-library-only Rust implementation independently parses the R18 and R19 receipts and recomputes theorem-critical finite controls without importing the ORION Python machinery.  The neighbourhood refutation was executed prospectively on LUNARC and is undergoing cross-host replay.  Same-owner CI, cross-language reconstruction, and finite re-execution are implementation corroboration, not external peer review.'
          if old in manuscript: manuscript=manuscript.replace(old,new)
          tex.write_text(manuscript)

          story=root/'CURRENT_STORY_R20.md'
          content=story.read_text()
          insertion='## 4.1 Cross-language implementation control\n\nA standard-library-only Rust checker parses the durable R18 and R19 JSON subjects directly and recomputes the no-free-extension, fallback-alignment, witness-compression, lower-image, joint-marginal, route-coarsening, and acquisition-timing controls. It shares repository ownership but not language, parser, or ORION Python implementation. Its authority is same-owner structural corroboration, not external independence.\n\n'
          if insertion not in content:
            anchor='## 5. What the paper claims'
            if anchor not in content: raise SystemExit('story anchor absent')
            content=content.replace(anchor,insertion+anchor)
          story.write_text(content)

          route=root/'FIGURE_JOINT_ROUTE_R20.tex'
          route.write_text(route.read_text().replace('node distance=7mm and 9mm','node distance=7mm and 6mm').replace('text width=0.22\\linewidth','text width=0.20\\linewidth').replace('text width=0.17\\linewidth','text width=0.15\\linewidth'))

          files=[
            'MANUSCRIPT_R20.tex','REFERENCES_R20.bib','FIGURE_AUTHORITY_R20.tex','FIGURE_JOINT_ROUTE_R20.tex',
            'CURRENT_STORY_R20.md','CLAIM_LEDGER_R20.json','EVIDENCE_MANIFEST_R20.json','EVIDENCE_SUPPLEMENT_R28.json',
            'PRIOR_ART_MATRIX_R20.md','JOURNAL_GATE_R20.json','CROSS_LANGUAGE_CORROBORATION_R28.md',
            'EXTERNAL_REVIEW_PROTOCOL_R20.md','AUTHOR_METADATA_TEMPLATE_R20.json','ARCHIVE_AND_SUBMISSION_PROTOCOL_R20.md',
            'verify_r20_story.py','verify_r20_cross_language.rs','audit_aslib_rights_r20.py','audit_retractions_r20.py',
            'extensions/r18/R18_RECOVERY_NULL.md','extensions/r18/R18_RECOVERY_CUSTODY.json',
            'extensions/r19/FIBERGUARD_JOINT_ROUTE_R19_REPLACEMENT.md','extensions/r19/fiberguard_joint_route_r19_core.py',
            'extensions/r19/verify_fiberguard_joint_route_r19.py','extensions/r19/JOINT_ROUTE_R19_RESULTS.json',
            'extensions/r19/CURRENT_MAIN_CUSTODY_R19.json'
          ]
          for name in files:
            if not (root/name).is_file(): raise SystemExit(f'missing release source {name}')
          spec={'schema':'ORION.ORION02.ReleaseFileset.R30.v1','namespace':root.as_posix(),'files':files,'terminal':'ORION02_R30_RELEASE_FILESET_FROZEN__RESULT_RECEIPT_REQUIRED'}
          (root/'RELEASE_FILESET_R20.json').write_text(json.dumps(spec,sort_keys=True,separators=(',',':'))+'\n')
          PY

          rm -f papers/orion-02-fiberguard-finite-fibre/INTERNAL_RELEASE_RECEIPT_R20.json
          rm -f papers/orion-02-fiberguard-finite-fibre/INTERNAL_WORKFLOW_META_R20.json
          rm -f papers/orion-02-fiberguard-finite-fibre/RELEASE_FILESET_R20_RECEIPT.json
          rm -f papers/orion-02-fiberguard-finite-fibre/CROSS_LANGUAGE_RUST_R20_RESULT.json
          rm -f papers/orion-02-fiberguard-finite-fibre/CROSS_LANGUAGE_RUST_R20_TERMINAL.txt
          rm -f papers/orion-02-fiberguard-finite-fibre/INTERNAL_RELEASE_RECEIPT_R30.json
          rm -f papers/orion-02-fiberguard-finite-fibre/RELEASE_FILESET_R30_RECEIPT.json
          rm -f papers/orion-02-fiberguard-finite-fibre/CNBR_REPLAY_RECEIPT_R30.json
          rm -f papers/orion-02-fiberguard-finite-fibre/ASLIB_RIGHTS_AUDIT_R30.json
          rm -f papers/orion-02-fiberguard-finite-fibre/RETRACTION_AUDIT_R30.json
          rm -f research/five-paper-top-tier-r30/PROGRAMME_INTERNAL_TERMINAL_R30.json
          rm -f research/five-paper-top-tier-r30/PROGRAMME_INTERNAL_TERMINAL_R30.md
          rm -rf research/five-paper-top-tier-r30/results
          rm -f papers/orion-02-fiberguard-finite-fibre/R20_RELEASE_REQUEST_V1.txt

          for path in .github/workflows/one-shot-*.yml; do [ -e "$path" ] && rm -f "$path"; done
          rm -f .github/workflows/orion-02-r20-*.yml
          rm -f .github/workflows/nq-pr1472-exact-subject-audit-r20*.yml
          rm -f .github/workflows/ab-pr1469-production-registry-audit-r20.yml
          rm -f .github/workflows/d-pr1466-first-mixing-audit-r20.yml
          rm -f .github/workflows/q1-pr1449-resource-audit-r20.yml
          rm -f .github/workflows/five-paper-blocker-audit-r20.yml
          rm -f .github/workflows/five-paper-programme-finalizer-r20.yml
          rm -f .github/workflows/rematerialize-orion-02-r20-current-main*.yml
          rm -f research/five-paper-top-tier-r20/audit_nq_pr1472.py

          rustc --edition=2021 -C opt-level=0 papers/orion-02-fiberguard-finite-fibre/verify_r20_cross_language.rs -o "$RUNNER_TEMP/rust-smoke"
          grep -q 'For each action.*add one unseen state' papers/orion-02-fiberguard-finite-fibre/MANUSCRIPT_R20.tex
          grep -q '\\input{FIGURE_AUTHORITY_R20.tex}' papers/orion-02-fiberguard-finite-fibre/MANUSCRIPT_R20.tex
          grep -q '\\input{FIGURE_JOINT_ROUTE_R20.tex}' papers/orion-02-fiberguard-finite-fibre/MANUSCRIPT_R20.tex

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'research(R30): freeze reconciled five-paper internal subject'
          git push origin HEAD:refs/heads/$SOURCE_BRANCH
          git rev-parse HEAD > "$RUNNER_TEMP/source-subject.txt"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scientific, Rust, manuscript, and rendering dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'numpy==1.26.4' 'scikit-learn==1.5.2' 'PyYAML==6.0.2' 'Pillow==10.4.0'
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            rustc latexmk poppler-utils texlive-bibtex-extra texlive-fonts-recommended \
            texlive-latex-base texlive-latex-extra texlive-latex-recommended
          python --version
          rustc --version
          latexmk -v | head -n2

      - name: Materialize exact R18 result and R19 current subject
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/chatgpt/r18-c-paired-route-20260826
          git show FETCH_HEAD:papers/five-paper-top-tier-r8/C/FIBERGUARD_PAIRED_ROUTE_R18_RECOVERY_RESULTS.json > "$RUNNER_TEMP/r18.json"
          test "$(sha256sum "$RUNNER_TEMP/r18.json" | cut -d' ' -f1)" = "$R18_RESULT_SHA256"
          cp papers/orion-02-fiberguard-finite-fibre/extensions/r19/JOINT_ROUTE_R19_RESULTS.json "$RUNNER_TEMP/r19.json"

      - name: Run finite Python and independent Rust theorem audits twice
        shell: bash
        run: |
          set -euo pipefail
          root='papers/orion-02-fiberguard-finite-fibre'
          python -m py_compile "$root/verify_r20_story.py" research/five-paper-top-tier-r30/finalize_r30.py
          for suffix in a b; do
            python "$root/verify_r20_story.py" --output "$RUNNER_TEMP/finite-$suffix.json" | tee "$RUNNER_TEMP/finite-$suffix.txt"
          done
          cmp "$RUNNER_TEMP/finite-a.json" "$RUNNER_TEMP/finite-b.json"
          cmp "$RUNNER_TEMP/finite-a.txt" "$RUNNER_TEMP/finite-b.txt"
          grep -q '^ORION02_R20_STORY_FINITE_CORROBORATION_PASS ' "$RUNNER_TEMP/finite-a.txt"

          source="$(cat "$RUNNER_TEMP/source-subject.txt")"
          blob="$(git rev-parse "$source:$root/verify_r20_cross_language.rs")"
          rustc --edition=2021 -C opt-level=2 -C debuginfo=0 "$root/verify_r20_cross_language.rs" -o "$RUNNER_TEMP/rust-checker"
          for suffix in a b; do
            "$RUNNER_TEMP/rust-checker" --r18 "$RUNNER_TEMP/r18.json" --r19 "$RUNNER_TEMP/r19.json" --source-subject "$source" --source-blob "$blob" --output "$RUNNER_TEMP/rust-$suffix.json" | tee "$RUNNER_TEMP/rust-$suffix.txt"
          done
          cmp "$RUNNER_TEMP/rust-a.json" "$RUNNER_TEMP/rust-b.json"
          cmp "$RUNNER_TEMP/rust-a.txt" "$RUNNER_TEMP/rust-b.txt"
          grep -q '^ORION02_R20_RUST_CROSS_LANGUAGE_CHECKER_PASS$' "$RUNNER_TEMP/rust-a.txt"

      - name: Replay certified-neighborhood adverse terminal twice on exact PR subject
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/1486" > "$RUNNER_TEMP/pr-1486.json"
          cnbr_head="$(jq -r .head.sha "$RUNNER_TEMP/pr-1486.json")"
          git fetch --no-tags origin "$cnbr_head"
          git worktree add --detach "$RUNNER_TEMP/cnbr" "$cnbr_head"
          root="$RUNNER_TEMP/cnbr/papers/orion-02-fiberguard-finite-fibre/experiments"
          cp "$root/results/CERTIFIED_NEIGHBORHOOD_RESULT_V1.json" "$RUNNER_TEMP/cnbr-registered.json"
          cp "$root/results/CERTIFIED_NEIGHBORHOOD_RESULT_V1.md" "$RUNNER_TEMP/cnbr-registered.md"
          python -m py_compile "$root/certified_neighborhood.py" "$RUNNER_TEMP/cnbr/papers/paper-xx-executable-research-core/benchmark/run_aslib_v1.py"
          for suffix in a b; do
            rm -f "$root/results/CERTIFIED_NEIGHBORHOOD_RESULT_V1.json" "$root/results/CERTIFIED_NEIGHBORHOOD_RESULT_V1.md"
            (cd "$RUNNER_TEMP/cnbr" && python papers/orion-02-fiberguard-finite-fibre/experiments/certified_neighborhood.py) | tee "$RUNNER_TEMP/cnbr-$suffix.txt"
            cp "$root/results/CERTIFIED_NEIGHBORHOOD_RESULT_V1.json" "$RUNNER_TEMP/cnbr-$suffix.json"
            cp "$root/results/CERTIFIED_NEIGHBORHOOD_RESULT_V1.md" "$RUNNER_TEMP/cnbr-$suffix.md"
          done
          cmp "$RUNNER_TEMP/cnbr-a.json" "$RUNNER_TEMP/cnbr-b.json"
          cmp "$RUNNER_TEMP/cnbr-a.md" "$RUNNER_TEMP/cnbr-b.md"
          cmp "$RUNNER_TEMP/cnbr-a.txt" "$RUNNER_TEMP/cnbr-b.txt"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          observed=json.loads((temp/'cnbr-a.json').read_text())
          registered=json.loads((temp/'cnbr-registered.json').read_text())
          exact=(('schema',),('disposition',),('overall_verdict',),('source','commit'),('source','scenario'),('source','git_sha'),('population','algorithms'),('population','features'),('population','instances'),('population','outer_folds'),('self_test','status'))
          def get(value,path):
            for key in path:value=value[key]
            return value
          for path in exact:assert get(observed,path)==get(registered,path),(path,get(observed,path),get(registered,path))
          assert observed['overall_verdict']=='CERTIFICATE_INVALID'
          assert observed['source']['git_sha']==os.environ['CNBR_SOURCE_GIT_SHA']
          assert [row['verdict'] for row in observed['splits']]==['CERTIFICATE_INVALID','CERTIFICATE_INVALID']
          official,family=observed['splits']
          for representation in ('NBR_FULL','NBR_PCA10'):
            assert official['representations'][representation]['certificate_heldout_violation_rate']>0.10
            assert family['representations'][representation]['heldout_coverage']['epsilon_5000']==0.0
          receipt={'schema':'ORION02.CNBR.R30ReplayReceipt.v1','source_pr':1486,'source_head':json.loads((temp/'pr-1486.json').read_text())['head']['sha'],'terminal':'ORION02_CNBR_R30_CROSS_HOST_ADVERSE_REPLAY_PASS','registered_result_sha256':hashlib.sha256((temp/'cnbr-registered.json').read_bytes()).hexdigest(),'observed_result_sha256':hashlib.sha256((temp/'cnbr-a.json').read_bytes()).hexdigest(),'exact_load_bearing_projection_equal':True,'overall_verdict':'CERTIFICATE_INVALID','authority':{'same_program_cross_host_corroboration':True,'external_independence':False,'novelty':False,'journal_authority':False}}
          (temp/'cnbr-replay-receipt.json').write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          print(receipt['terminal'])
          PY

      - name: Execute ASlib rights and live retraction audits twice
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root='papers/orion-02-fiberguard-finite-fibre'
          python -m py_compile "$root/audit_aslib_rights_r20.py" "$root/audit_retractions_r20.py"
          for suffix in a b; do
            python "$root/audit_aslib_rights_r20.py" --output "$RUNNER_TEMP/rights-$suffix.json" | tee "$RUNNER_TEMP/rights-$suffix.txt"
            python "$root/audit_retractions_r20.py" --root "$root" --output "$RUNNER_TEMP/retraction-$suffix.json" | tee "$RUNNER_TEMP/retraction-$suffix.txt"
          done
          cmp "$RUNNER_TEMP/rights-a.json" "$RUNNER_TEMP/rights-b.json"
          cmp "$RUNNER_TEMP/rights-a.txt" "$RUNNER_TEMP/rights-b.txt"
          cmp "$RUNNER_TEMP/retraction-a.json" "$RUNNER_TEMP/retraction-b.json"
          cmp "$RUNNER_TEMP/retraction-a.txt" "$RUNNER_TEMP/retraction-b.txt"

      - name: Audit exact NQ, AB, D, and Q1 PR subjects twice
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pr in 1472 1469 1466 1449; do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" > "$RUNNER_TEMP/pr-$pr.json"
            base="$(jq -r .base.sha "$RUNNER_TEMP/pr-$pr.json")"
            head="$(jq -r .head.sha "$RUNNER_TEMP/pr-$pr.json")"
            git fetch --no-tags origin "$base" "$head"
            git worktree add --detach "$RUNNER_TEMP/pr-$pr" "$head"
            printf '%s\n' "$base" > "$RUNNER_TEMP/base-$pr.txt"
            printf '%s\n' "$head" > "$RUNNER_TEMP/head-$pr.txt"
          done
          python -m py_compile research/five-paper-top-tier-r20/audit_nq_pr1472_v2.py research/five-paper-top-tier-r20/audit_ab_pr1469.py research/five-paper-top-tier-r20/audit_d_pr1466.py research/five-paper-top-tier-r20/audit_q1_pr1449.py
          for suffix in a b; do
            python research/five-paper-top-tier-r20/audit_nq_pr1472_v2.py --repo "$RUNNER_TEMP/pr-1472" --base "$(cat "$RUNNER_TEMP/base-1472.txt")" --head "$(cat "$RUNNER_TEMP/head-1472.txt")" --output "$RUNNER_TEMP/nq-$suffix.json" | tee "$RUNNER_TEMP/nq-$suffix.txt"
            python research/five-paper-top-tier-r20/audit_ab_pr1469.py --repo "$RUNNER_TEMP/pr-1469" --base "$(cat "$RUNNER_TEMP/base-1469.txt")" --head "$(cat "$RUNNER_TEMP/head-1469.txt")" --output "$RUNNER_TEMP/ab-$suffix.json" | tee "$RUNNER_TEMP/ab-$suffix.txt"
            python research/five-paper-top-tier-r20/audit_d_pr1466.py --repo "$RUNNER_TEMP/pr-1466" --base "$(cat "$RUNNER_TEMP/base-1466.txt")" --head "$(cat "$RUNNER_TEMP/head-1466.txt")" --output "$RUNNER_TEMP/d-$suffix.json" | tee "$RUNNER_TEMP/d-$suffix.txt"
            python research/five-paper-top-tier-r20/audit_q1_pr1449.py --repo "$RUNNER_TEMP/pr-1449" --base "$(cat "$RUNNER_TEMP/base-1449.txt")" --head "$(cat "$RUNNER_TEMP/head-1449.txt")" --output "$RUNNER_TEMP/q1-$suffix.json" | tee "$RUNNER_TEMP/q1-$suffix.txt"
          done
          for lane in nq ab d q1; do cmp "$RUNNER_TEMP/$lane-a.json" "$RUNNER_TEMP/$lane-b.json";cmp "$RUNNER_TEMP/$lane-a.txt" "$RUNNER_TEMP/$lane-b.txt";done

      - name: Audit theorem labels and bibliography, then compile manuscript twice
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('papers/orion-02-fiberguard-finite-fibre')
          tex=(root/'MANUSCRIPT_R20.tex').read_text();bib=(root/'REFERENCES_R20.bib').read_text()
          labels=re.findall(r'\\label\{([^}]+)\}',tex);refs=re.findall(r'\\ref\{([^}]+)\}',tex)
          assert len(labels)==len(set(labels));assert set(refs)<=set(labels),sorted(set(refs)-set(labels))
          groups=re.findall(r'\\cite[pt]?\{([^}]+)\}',tex);cited={key.strip() for group in groups for key in group.split(',')};defined=set(re.findall(r'@[A-Za-z]+\{([^,]+),',bib));assert cited==defined,(sorted(cited-defined),sorted(defined-cited))
          for token in ('FIBERGUARD\\_R18\\_NO\\_PAIRED\\_ROUTE\\_VALUE','CERTIFICATE\\_INVALID','No-free extension','Marginal nonidentifiability','Lower-image criterion','standard-library-only Rust implementation'):
            assert token in tex,token
          print('R30_MANUSCRIPT_STATIC_AUDIT_PASS')
          PY
          root='papers/orion-02-fiberguard-finite-fibre';cd "$root"
          latexmk -C MANUSCRIPT_R20.tex
          SOURCE_DATE_EPOCH=0 FORCE_SOURCE_DATE=1 latexmk -pdf -interaction=nonstopmode -halt-on-error MANUSCRIPT_R20.tex
          cp MANUSCRIPT_R20.pdf "$RUNNER_TEMP/manuscript-a.pdf"
          latexmk -C MANUSCRIPT_R20.tex
          SOURCE_DATE_EPOCH=0 FORCE_SOURCE_DATE=1 latexmk -pdf -interaction=nonstopmode -halt-on-error MANUSCRIPT_R20.tex
          cp MANUSCRIPT_R20.pdf "$RUNNER_TEMP/manuscript-b.pdf"
          cmp "$RUNNER_TEMP/manuscript-a.pdf" "$RUNNER_TEMP/manuscript-b.pdf"
          ! grep -Eq 'LaTeX Warning: (Reference|Citation).*undefined|There were undefined references' MANUSCRIPT_R20.log
