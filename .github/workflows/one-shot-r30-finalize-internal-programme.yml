          cp "$RUNNER_TEMP/d-a.json" "$programme/results/D_PR1466_FIRST_MIXING_AUDIT.json"
          cp "$RUNNER_TEMP/q1-a.json" "$programme/results/Q1_PR1449_RESOURCE_AUDIT.json"
          cp "$RUNNER_TEMP/visual-audit.json" "$programme/results/R30_VISUAL_PDF_AUDIT.json"
          cp "$RUNNER_TEMP/cnbr-a.json" "$programme/results/CERTIFIED_NEIGHBORHOOD_REPLAY_RESULT.json"
          sha256sum "$programme/results"/* > "$programme/results/SHA256SUMS"
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$orion" "$programme"
