                    git diff --check
                - name: Stage clean reviewer packet
                  shell: bash
                  run: |
                    set -euo pipefail
                    out="$RUNNER_TEMP/five-paper-r30-current-main";mkdir -p "$out";root='papers/orion-02-fiberguard-finite-fibre'
                    cp "$root/MANUSCRIPT_R20.pdf" "$root/MANUSCRIPT_R20.tex" "$root/REFERENCES_R20.bib" "$out/"
                    cp "$root/INTERNAL_RELEASE_RECEIPT_R30.json" "$root/CURRENT_MAIN_CUSTODY_R30.json" "$root/JOURNAL_GATE_R20.json" "$out/"
                    cp research/five-paper-top-tier-r30/PROGRAMME_INTERNAL_TERMINAL_R30.json "$out/"
                    cp "$RUNNER_TEMP/finite.json" "$out/R20_FINITE_RESULT.json";cp "$RUNNER_TEMP/rust.json" "$out/R20_RUST_RESULT.json";cp "$RUNNER_TEMP/pdfinfo.txt" "$out/";sha256sum "$out"/* > "$out/SHA256SUMS"
                - uses: actions/upload-artifact@v4
                  with: {name: five-paper-r30-current-main, path: '${{ runner.temp }}/five-paper-r30-current-main/', if-no-files-found: error, retention-days: 30}
          YAML
          python - <<PY
          import json
          from pathlib import Path
          root=Path('$RUNNER_TEMP/clean/papers/orion-02-fiberguard-finite-fibre')
          internal=json.loads((root/'INTERNAL_RELEASE_RECEIPT_R30.json').read_text())
          result={'schema':'ORION.FivePaper.CurrentMainCustody.R30.v1','live_main_base':'$(git rev-parse origin/main)','source_branch':'$SOURCE_BRANCH','source_result_commit':'$result','source_subject_commit':internal['executed_subject_commit'],'internal_release_terminal':internal['terminal'],'terminal':'FIVE_PAPER_R30_REMATERIALIZED_ON_LIVE_MAIN__EXTERNAL_GATES_OPEN','authority':{'scientific_claims_unchanged':True,'external_independence':False,'novelty':False,'rights_complete':False,'production_authority_for_all_lanes':False,'journal_authority':False,'submission_authorized':False}}
          (root/'CURRENT_MAIN_CUSTODY_R30.json').write_text(json.dumps(result,sort_keys=True,separators=(',',':'))+'\n')
          PY
          git -C "$RUNNER_TEMP/clean" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/clean" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RUNNER_TEMP/clean" add papers/orion-02-fiberguard-finite-fibre research/five-paper-top-tier-r20 research/five-paper-top-tier-r30 .github/workflows/five-paper-r30-current-main-custody.yml
          git -C "$RUNNER_TEMP/clean" commit -m 'research(R30): rematerialize five-paper internal release on live main'
          clean_sha="$(git -C "$RUNNER_TEMP/clean" rev-parse HEAD)"
          if [ -n "$old" ]; then git -C "$RUNNER_TEMP/clean" push --force-with-lease="refs/heads/$CLEAN_BRANCH:$old" origin HEAD:refs/heads/$CLEAN_BRANCH; else git -C "$RUNNER_TEMP/clean" push origin HEAD:refs/heads/$CLEAN_BRANCH; fi
          printf '%s\n' "$clean_sha" > "$RUNNER_TEMP/clean-sha.txt"

      - name: Open clean draft PR, close superseded stack, and publish final internal terminal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number="$(gh pr list --head "$CLEAN_BRANCH" --state all --json number --jq '.[0].number // empty')"
          body='Clean child of live main produced only after one monolithic fail-closed R30 execution. The package binds exact ORION-02 finite theory, R18 null recovery, R19 joint-route repair, certified-neighborhood adverse replay, independent Rust corroboration, deterministic all-page-audited manuscript, ASlib rights preflight, retraction audit, and exact NQ/AB/D/Q1 blocker classifications. External independence, novelty, source-data legal interpretation, production inputs, author metadata, DOI/archive, journal authority, and submission authorization remain false/open.'
          if [ -z "$number" ]; then
            gh pr create --draft --base main --head "$CLEAN_BRANCH" --title '[R30] Five-paper internal release and ORION-02 exact-fibre manuscript' --body "$body" >/dev/null
            number="$(gh pr view "$CLEAN_BRANCH" --json number --jq .number)"
          else
            gh pr edit "$number" --title '[R30] Five-paper internal release and ORION-02 exact-fibre manuscript' --body "$body"
          fi
          marker="FIVE_PAPER_R30_INTERNAL_EXECUTABLE_WORK_COMPLETE__EXTERNAL_PRODUCTION_RIGHTS_AND_SUBMISSION_GATES_OPEN"
          for issue in 1377 1386 1421; do
            existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/comments" --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1)"
            if [ -z "$existing" ]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$issue/comments" -F "body=@research/five-paper-top-tier-r30/PROGRAMME_INTERNAL_TERMINAL_R30.md" >/dev/null
            fi
          done
          for old_pr in 1471 1485 1488; do
            state="$(gh pr view "$old_pr" --json state --jq .state)"
            note="Superseded by clean live-main R30 PR #$number after exact R18/R19 custody and the monolithic internal release gate. Historical commits remain immutable; no terminal is changed."
            existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$old_pr/comments" --jq ".[] | select(.body | contains(\"clean live-main R30 PR #$number\")) | .id" | head -n1)"
            if [ -z "$existing" ]; then gh pr comment "$old_pr" --body "$note"; fi
            if [ "$state" = 'OPEN' ]; then gh pr close "$old_pr"; fi
          done
          echo "R30 clean PR #$number at $(cat "$RUNNER_TEMP/clean-sha.txt")"

      - name: Stage final execution artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/five-paper-r30-final";mkdir -p "$out"
          cp "$RUNNER_TEMP/final/INTERNAL_RELEASE_RECEIPT_R30.json" "$out/" 2>/dev/null || true
          cp "$RUNNER_TEMP/final/PROGRAMME_INTERNAL_TERMINAL_R30.json" "$out/" 2>/dev/null || true
          cp "$RUNNER_TEMP/final/PROGRAMME_INTERNAL_TERMINAL_R30.md" "$out/" 2>/dev/null || true
