              env:
                R18_RESULT_SHA256: 8136ac6e614406a51270342d73786dfec43a9ecdac81f62e815cd14d1a739c45
              steps:
                - uses: actions/checkout@v4
                  with: {fetch-depth: 0}
                - uses: actions/setup-python@v5
                  with: {python-version: '3.11'}
                - name: Verify all source bindings and authority ceilings
                  shell: bash
                  run: |
                    set -euo pipefail
                    python - <<'PY'
                    import hashlib,json
                    from pathlib import Path
                    orion=Path('papers/orion-02-fiberguard-finite-fibre')
                    internal=json.loads((orion/'INTERNAL_RELEASE_RECEIPT_R30.json').read_text())
                    custody=json.loads((orion/'CURRENT_MAIN_CUSTODY_R30.json').read_text())
                    assert internal['schema']=='ORION.ORION02.InternalReleaseReceipt.R30.v1'
                    assert internal['terminal']=='ORION02_R30_STRICT_INTERNAL_RELEASE_PASS__EXTERNAL_REVIEW_NOVELTY_RIGHTS_AND_SUBMISSION_OPEN'
                    for name,row in internal['bindings'].items():
                      assert hashlib.sha256((orion/name).read_bytes()).hexdigest()==row['sha256'],name
                    for name,row in internal['programme_bindings'].items():
                      assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==row['sha256'],name
                    assert internal['authority']['external_independence'] is False
                    assert internal['authority']['novelty'] is False
                    assert internal['authority']['data_rights_complete'] is False
                    assert internal['authority']['journal_authority'] is False
                    assert internal['authority']['submission_authorized'] is False
                    assert custody['terminal']=='FIVE_PAPER_R30_REMATERIALIZED_ON_LIVE_MAIN__EXTERNAL_GATES_OPEN'
                    assert custody['authority']=={'scientific_claims_unchanged':True,'external_independence':False,'novelty':False,'rights_complete':False,'production_authority_for_all_lanes':False,'journal_authority':False,'submission_authorized':False}
                    programme=json.loads(Path('research/five-paper-top-tier-r30/PROGRAMME_INTERNAL_TERMINAL_R30.json').read_text())
                    assert programme['terminal']=='FIVE_PAPER_R30_INTERNAL_EXECUTABLE_WORK_COMPLETE__EXTERNAL_PRODUCTION_RIGHTS_AND_SUBMISSION_GATES_OPEN'
                    print('FIVE_PAPER_R30_CURRENT_MAIN_BINDINGS_PASS')
                    PY
                - name: Re-run Python and Rust exact controls
                  shell: bash
                  run: |
                    set -euo pipefail
                    root='papers/orion-02-fiberguard-finite-fibre'
                    python "$root/verify_r20_story.py" --output "$RUNNER_TEMP/finite.json" | tee "$RUNNER_TEMP/finite.txt"
                    grep -q '^ORION02_R20_STORY_FINITE_CORROBORATION_PASS ' "$RUNNER_TEMP/finite.txt"
                    git fetch --no-tags origin refs/heads/chatgpt/r18-c-paired-route-20260826
                    git show FETCH_HEAD:papers/five-paper-top-tier-r8/C/FIBERGUARD_PAIRED_ROUTE_R18_RECOVERY_RESULTS.json > "$RUNNER_TEMP/r18.json"
                    test "$(sha256sum "$RUNNER_TEMP/r18.json" | cut -d' ' -f1)" = "$R18_RESULT_SHA256"
                    rustc --edition=2021 -C opt-level=2 "$root/verify_r20_cross_language.rs" -o "$RUNNER_TEMP/rust-checker"
                    subject="$(python -c 'import json;print(json.load(open("papers/orion-02-fiberguard-finite-fibre/INTERNAL_RELEASE_RECEIPT_R30.json"))["executed_subject_commit"])')"
                    blob="$(git rev-parse HEAD:$root/verify_r20_cross_language.rs)"
                    "$RUNNER_TEMP/rust-checker" --r18 "$RUNNER_TEMP/r18.json" --r19 "$root/extensions/r19/JOINT_ROUTE_R19_RESULTS.json" --source-subject "$subject" --source-blob "$blob" --output "$RUNNER_TEMP/rust.json" | tee "$RUNNER_TEMP/rust.txt"
                    grep -q '^ORION02_R20_RUST_CROSS_LANGUAGE_CHECKER_PASS$' "$RUNNER_TEMP/rust.txt"
                - name: Compile manuscript and inspect pages
