          grep -q '^FIVE_PAPER_R30_INTERNAL_EXECUTABLE_WORK_COMPLETE__EXTERNAL_PRODUCTION_RIGHTS_AND_SUBMISSION_GATES_OPEN$' "$RUNNER_TEMP/final-terminal.txt"

      - name: Commit durable R30 result receipts
        shell: bash
