          cp "$RUNNER_TEMP/cnbr-replay-receipt.json" "$out/" 2>/dev/null || true
          cp "$RUNNER_TEMP/visual-audit.json" "$out/" 2>/dev/null || true
          cp "$RUNNER_TEMP/pdfinfo.txt" "$out/" 2>/dev/null || true
          sha256sum "$out"/* > "$out/SHA256SUMS" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-paper-r30-final
          path: ${{ runner.temp }}/five-paper-r30-final/
          if-no-files-found: warn
          retention-days: 30
