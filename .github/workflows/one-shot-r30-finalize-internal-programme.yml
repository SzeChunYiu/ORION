          git -C "$RUNNER_TEMP/clean" checkout "$result" -- papers/orion-02-fiberguard-finite-fibre research/five-paper-top-tier-r20 research/five-paper-top-tier-r30
          mkdir -p "$RUNNER_TEMP/clean/.github/workflows"
          cat > "$RUNNER_TEMP/clean/.github/workflows/five-paper-r30-current-main-custody.yml" <<'YAML'
          name: five-paper-r30-current-main-custody
