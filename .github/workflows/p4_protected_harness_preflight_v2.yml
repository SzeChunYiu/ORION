name: p4-protected-harness-preflight-v2

on:
  pull_request:
    branches: [main]
    paths:
      - 'papers/orion-14-verified-scientific-discovery/host/run_baselines_v2.py'
      - 'papers/orion-14-verified-scientific-discovery/host/evaluate_campaign_v2.py'
      - 'papers/orion-14-verified-scientific-discovery/host/independent_reproduce_v2.py'
      - 'papers/orion-14-verified-scientific-discovery/host/BASELINE_CONFIGS_V2.json'
      - '.github/workflows/p4_protected_harness_preflight_v2.yml'
      - '.github/workflows/p4_host_prepare_v2.yml'

permissions:
  contents: read

env:
  SUBJECT_COMMIT: f6e51b5c8f905382b8e2f5568d9035fc14241aa1

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact repaired subject and prove repair tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/subject"
          git archive "$SUBJECT_COMMIT" | tar -x -C "$RUNNER_TEMP/subject"
          python -m pip install -e "$RUNNER_TEMP/subject[dev]"
          (cd "$RUNNER_TEMP/subject" && pytest -q tests/unit/benchmarks/test_authority_attacks.py)
          python - <<'PY'
          from orion.benchmarks.authority_external import FROZEN_AUTHORITY_BASELINE_IDS
          assert len(FROZEN_AUTHORITY_BASELINE_IDS) == 7
          assert FROZEN_AUTHORITY_BASELINE_IDS[-1] == 'deepsciverify-abstract-to-full-escalation'
          PY

      - name: Generate public-seed post-repair battery
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar "$SUBJECT_COMMIT" > "$RUNNER_TEMP/subject.tar"
          SUBJECT_HASH=$(sha256sum "$RUNNER_TEMP/subject.tar" | awk '{print $1}')
          HARNESS_HASH=$(python - <<'PY'
          import hashlib
          from pathlib import Path
          files = [
              'papers/orion-14-verified-scientific-discovery/host/generate_protected_cases.py',
              'papers/orion-14-verified-scientific-discovery/host/run_candidate.py',
              'papers/orion-14-verified-scientific-discovery/host/run_baselines.py',
              'papers/orion-14-verified-scientific-discovery/host/run_baselines_v2.py',
              'papers/orion-14-verified-scientific-discovery/host/run_ablations.py',
              'papers/orion-14-verified-scientific-discovery/host/evaluate_campaign.py',
              'papers/orion-14-verified-scientific-discovery/host/evaluate_campaign_v2.py',
              'papers/orion-14-verified-scientific-discovery/host/evaluate_ablations.py',
              'papers/orion-14-verified-scientific-discovery/host/independent_reproduce.py',
              'papers/orion-14-verified-scientific-discovery/host/independent_reproduce_v2.py',
              'papers/orion-14-verified-scientific-discovery/host/BASELINE_CONFIGS_V2.json',
          ]
          digest = hashlib.sha256()
          for name in files:
              data = Path(name).read_bytes()
              digest.update(name.encode())
              digest.update(b'\0')
              digest.update(hashlib.sha256(data).digest())
          print(digest.hexdigest())
          PY
          )
          BASELINE_HASH=$(sha256sum papers/orion-14-verified-scientific-discovery/host/BASELINE_CONFIGS_V2.json | awk '{print $1}')
          python papers/orion-14-verified-scientific-discovery/host/generate_protected_cases.py \
            --seed 'PUBLIC-P4-V2-PREFLIGHT-NOT-PUBLICATION-EVIDENCE' \
            --output-dir "$RUNNER_TEMP/prep" \
            --subject-commit "$SUBJECT_COMMIT" \
            --subject-archive-sha256 "$SUBJECT_HASH" \
            --evaluator-artifact-sha256 "$HARNESS_HASH" \
            --baseline-config-sha256 "$BASELINE_HASH" \
            --host-run-id "v2-preflight-${GITHUB_RUN_ID}" \
            --evaluation-epoch '2026-08-16T00:00:00Z'

      - name: Verify gold-blind handoff and V2 config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'prep'
          rows = [json.loads(line) for line in (root/'candidate_manifest.jsonl').read_text().splitlines() if line.strip()]
          assert len(rows) == 420
          assert all(set(row) == {'case_id', 'candidate_visible'} for row in rows)
          blob = (root/'candidate_manifest.jsonl').read_text()
          assert not any(token in blob for token in ('protected_gold','attack_family','custody_class','expected_authority_terminal'))
          cfg = json.loads(Path('papers/orion-14-verified-scientific-discovery/host/BASELINE_CONFIGS_V2.json').read_text())
          assert len(cfg['panel_baseline_ids']) == 7
          assert len(cfg['baselines']) == 10
          assert len(cfg['ablations']) == 8
          PY

      - name: Execute five deterministic gold-blind repeats
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/outputs"
          for i in 1 2 3 4 5; do
            python papers/orion-14-verified-scientific-discovery/host/run_candidate.py \
              "$RUNNER_TEMP/prep/candidate_manifest.jsonl" "$RUNNER_TEMP/outputs/orion-${i}.jsonl"
            python papers/orion-14-verified-scientific-discovery/host/run_baselines_v2.py \
              "$RUNNER_TEMP/prep/candidate_manifest.jsonl" "$RUNNER_TEMP/outputs/baselines-${i}.jsonl"
            python papers/orion-14-verified-scientific-discovery/host/run_ablations.py \
              "$RUNNER_TEMP/prep/candidate_manifest.jsonl" "$RUNNER_TEMP/outputs/ablations-${i}.jsonl"
          done

      - name: Protected V2 scoring and ablations
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(); ABLATION_ARGS=()
          for i in 1 2 3 4 5; do
            ARGS+=(--orion-output "$RUNNER_TEMP/outputs/orion-${i}.jsonl")
            ARGS+=(--baseline-output "$RUNNER_TEMP/outputs/baselines-${i}.jsonl")
            ABLATION_ARGS+=(--ablation-output "$RUNNER_TEMP/outputs/ablations-${i}.jsonl")
          done
          python papers/orion-14-verified-scientific-discovery/host/evaluate_campaign_v2.py \
            --protected-manifest "$RUNNER_TEMP/prep/protected_manifest.jsonl" \
            --run-manifest "$RUNNER_TEMP/prep/RUN_MANIFEST_V1.json" \
            --output-dir "$RUNNER_TEMP/evaluation" \
            --campaign-run-id "v2-preflight-${GITHUB_RUN_ID}" "${ARGS[@]}"
          python papers/orion-14-verified-scientific-discovery/host/evaluate_ablations.py \
            --protected-manifest "$RUNNER_TEMP/prep/protected_manifest.jsonl" \
            --run-manifest "$RUNNER_TEMP/prep/RUN_MANIFEST_V1.json" \
            --output-dir "$RUNNER_TEMP/ablation-evaluation" "${ABLATION_ARGS[@]}"

      - name: Independent V2 reproduction and acceptance
        shell: bash
        run: |
          set -euo pipefail
          python papers/orion-14-verified-scientific-discovery/host/independent_reproduce_v2.py \
            --protected-manifest "$RUNNER_TEMP/prep/protected_manifest.jsonl" \
            --orion-output "$RUNNER_TEMP/outputs/orion-1.jsonl" \
            --baseline-output "$RUNNER_TEMP/outputs/baselines-1.jsonl" \
            --panel "$RUNNER_TEMP/evaluation/authority_benchmark_panel.json" \
            --summary "$RUNNER_TEMP/evaluation/campaign_summary.json" \
            --output "$RUNNER_TEMP/reproduction_receipt.json" \
            --campaign-run-id "v2-preflight-${GITHUB_RUN_ID}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          summary = json.loads((root/'evaluation'/'campaign_summary.json').read_text())
          receipt = json.loads((root/'reproduction_receipt.json').read_text())
          ablations = json.loads((root/'ablation-evaluation'/'ablation_summary.json').read_text())
          assert summary['panel_pass'] is True
          assert summary['H1']['status'] == 'PASS'
          assert summary['H2']['status'] == 'PASS'
          assert summary['systems']['ORION']['clean_false_negative_count'] == 0
          assert len(summary['systems']) == 11
          assert len(ablations['ablations']) == 8
          assert receipt['headline_reproduced'] is True
          assert receipt['clean_total'] == 60
          assert receipt['promotion_opportunities'] == 360
          print('P4_V2_PREFLIGHT_SAFE_SUMMARY_BEGIN')
          print(json.dumps({
            'H1': summary['H1'], 'H2': summary['H2'], 'H3': summary['H3'],
            'panel': summary['typed_panel_status'],
            'comparator': summary['strongest_frozen_comparator'],
            'orion_false_promotions': receipt['orion_false_promotions'],
            'orion_clean_promotions': receipt['orion_clean_promotions'],
            'baseline_count': 10, 'ablation_count': 8,
          }, indent=2, sort_keys=True))
          print('P4_V2_PREFLIGHT_SAFE_SUMMARY_END')
          PY
