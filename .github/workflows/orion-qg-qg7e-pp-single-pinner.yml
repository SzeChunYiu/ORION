name: orion-qg-qg7e-pp-single-pinner

on:
  pull_request:
    paths:
      - 'development/orion-qg-regime-geometry/QG7E_*'
      - 'development/orion-qg-regime-geometry/qg7e_*'
      - 'development/orion-qg-regime-geometry/run_qg7e_dual_harness.py'
      - 'research/extensions/orion-qg/qg7e_*'
      - '.github/workflows/orion-qg-qg7e-pp-single-pinner.yml'
  workflow_dispatch:

concurrency:
  group: orion-qg-qg7e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qg7e-pp-single-pinner:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact QG-7e head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert frozen information-parent lineage
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git cat-file -e "b6384048cbddbbf0dc84c6a310a686cfa0a43131^{commit}"
          test "$(git merge-base HEAD b6384048cbddbbf0dc84c6a310a686cfa0a43131)" = "b6384048cbddbbf0dc84c6a310a686cfa0a43131"
          test -f development/orion-qg-regime-geometry/QG7E_PP_SINGLE_PINNER_PROTOCOL_V1.md
          test -f research/extensions/orion-qg/QG7C_CLASSIFICATION_RESULTS.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ORION and research harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,candidates]'
          python -m pip install -e 'packages/orion-research-harness[dev]'
      - name: Syntax gate
        run: |
          python -m py_compile \
            research/extensions/orion-qg/qg7e_pp_single_pinner.py \
            development/orion-qg-regime-geometry/qg7e_generic_verify.py \
            development/orion-qg-regime-geometry/qg7e_native_verify.py \
            development/orion-qg-regime-geometry/run_qg7e_dual_harness.py
      - name: Execute QG-7e through generic and native ORION
        run: |
          set -o pipefail
          mkdir -p artifacts
          python development/orion-qg-regime-geometry/run_qg7e_dual_harness.py \
            | tee artifacts/orion-qg-qg7e-dual-summary.json
      - name: Deterministic analyzer replay
        run: |
          set -euo pipefail
          python research/extensions/orion-qg/qg7e_pp_single_pinner.py \
            --output artifacts/orion-qg-qg7e-pp-single-pinner-replay.json \
            > artifacts/orion-qg-qg7e-replay.log
          cmp \
            artifacts/orion-qg-qg7e-pp-single-pinner.json \
            artifacts/orion-qg-qg7e-pp-single-pinner-replay.json
      - name: Enforce PP-only theorem terminal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('artifacts/orion-qg-qg7e-pp-single-pinner.json').read_text())
          g=json.loads(Path('artifacts/orion-qg-qg7e-generic-verification.json').read_text())
          n=json.loads(Path('artifacts/orion-qg-qg7e-native-verification.json').read_text())
          d=json.loads(Path('artifacts/orion-qg-qg7e-dual-harness.json').read_text())
          pos='QG7E_PP_SINGLE_PINNER_CLOSED_ALL_HIDDEN_ENVIRONMENTS__CHAIN_OPEN'
          assert a['terminal']==pos and a['all_gates'] is True
          assert a['visible']['failures']==32556
          assert a['visible']['delta_histogram']=={'1':32116,'2':440}
          assert a['hidden']['domain']==4096
          assert a['product_domain']==133349376
          assert a['relocation']['library_size']==576
          assert a['relocation']['residual_count']==6488
          assert a['relocation']['residual_delta_histogram']=={'1':6488}
          assert a['dplus']['template_count']==61056
          assert a['dplus']['delta_histogram']=={'-2':136,'-1':3676,'0':2652,'1':24}
          assert a['dplus']['residual_count']==24
          assert a['dplus']['control_failures']==[]
          assert a['bprime']['delta_histogram']=={'-1':24}
          assert a['bprime']['witness_failures']==[]
          assert a['bprime']['reference_failures']==[]
          assert a['bprime']['final_residual']==0
          assert g['decision']=='ACCEPT_PP_SINGLE_PINNER_ALL_N' and g['all_checks'] is True
          assert n['decision']=='ACCEPT_PP_SINGLE_PINNER_ALL_N' and n['all_checks'] is True
          assert n['responsibility']=='PP_SINGLE_PINNER_NORMALIZATION'
          assert d['terminal']==pos and d['both_accept'] is True
          for obj in (a,g,n,d):
              assert obj['PP_SINGLE_PINNER_ALL_N'] is True
              assert obj['CHAIN_ALL_N'] is False
              assert obj['GLOBAL_BDOUBLEPRIME_COMPLETENESS'] is False
              assert obj['novelty_authority'] is False
              assert obj['r6_authority'] is False
              assert obj['physical_quantum_advantage_claim'] is False
          PY
      - name: Upload QG-7e dual-harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-qg-qg7e-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/orion-qg-qg7e-pp-single-pinner.json
            artifacts/orion-qg-qg7e-pp-single-pinner-replay.json
            artifacts/orion-qg-qg7e-generic-verification.json
            artifacts/orion-qg-qg7e-native-verification.json
            artifacts/orion-qg-qg7e-dual-harness.json
            artifacts/orion-qg-qg7e-dual-summary.json
            artifacts/orion-qg-qg7e-replay.log
            .orion-qg-qg7e-generic/.orion-harness/**
            .orion-qg-qg7e-native/.orion-harness/**
          include-hidden-files: true
          if-no-files-found: warn
